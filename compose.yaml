# The services a laptop needs to run the product. The web process and the
# Temporal worker run on the host, against these.
#
# Temporal is the CLI's own dev server (`temporal server start-dev`), not the
# `auto-setup` image: one container instead of three, gRPC on 7233 and the web
# UI on 8233, and its state in a file on a named volume so a restart keeps the
# workflow history. The auto-setup image with its own Postgres is what a
# production-shaped deployment uses; a laptop does not need it.
#
# The project name is pinned rather than derived from the directory, because a
# git worktree is a different directory with the same compose file: without
# this, `docker compose up` in a worktree would start a *second* stack fighting
# for 5432, 6379 and 7233. One name, one stack, every worktree.
#
# NOT derived from PRODUCT_NAME, and deliberately: this is infrastructure
# identity — every container, network and volume on your machine keys on it, so
# changing it orphans the running stack and its data (ADR platform-1 in
# docs/product/architecture.md — the one recorded exception).
#
# EVERY `image:` IS PINNED BY THE DIGEST OF A MULTI-ARCH INDEX, from a registry
# on house rule 61's allow-list (`quality/rules.yaml`), or carries a
# `# pin-exception: <reason>` on the line or directly above it. A tag is a
# promise the publisher can withdraw — MinIO's was, and every clone failed at
# its first `compose up` — and an index digest is the one reference a Mac, a
# Graviton box and an amd64 runner all resolve to their own layers. The tag
# stays in front of the digest for the reader; the digest is what is pulled.
# To move a pin: `docker buildx imagetools inspect <image>:<tag>`, check the
# index lists linux/amd64 and linux/arm64, and replace tag and digest together.
# A Docker Hub image is `${DJB_STACK_REGISTRY:-docker.io}/<repo>`: CI sets it from the repository variable of that name (else docker.io), ci.yml step "the stack's registry, the product's choice"; the template's own variable names its image mirror (`mirror-images.yml`, never shipped to a product); a laptop leaves it unset.
name: djangobootstrap

services:
  db:
    # ADR deploy-1 · THE TEMPLATE TARGETS POSTGRES 18.
    # Context: RDS staging runs 18.3, every pinned client in this tree was 16.10,
    # `pg_dump` refuses cross-major outright ("aborting because of server version
    # mismatch"), and `provision.sh infra` passed no --engine-version, so AWS's
    # default decided which major a product got. Decision: pin 18 everywhere in one
    # breath — the live instance is the fact on the ground, client moves are cheap,
    # a pg_dump 18 reads 16 worlds, and 18 has the longer EOL runway. Rejected: pin
    # 16.10 and rebuild RDS (an owner-approval infra act, to buy a shorter-lived
    # major); no pin at all (that is the finding). Revisit trigger: a stack
    # component refusing 18 — a stop-and-report for whichever rung finds it.
    image: ${DJB_STACK_REGISTRY:-docker.io}/library/postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    # /dev/shm IS 1g, NOT DOCKER'S 64 MB DEFAULT (an ADR in this file's own form).
    # Context: Postgres keeps its dynamic shared memory in /dev/shm, and on this
    # stack the thing that fills it is the cumulative-statistics area — one entry
    # per relation in every database the server has touched, in segments that
    # double (1M, 2M, 4M, 8M, 16M, 32M…) and are not given back while the server
    # runs (dropping databases does not shrink it). Measured on a throwaway
    # postgres:18 with parallel query OFF: 1.1M empty, 14M/22M/30M at 100/200/300
    # databases of 60 tables, then new connections and queries start failing with
    #   could not resize shared memory segment "/PostgreSQL.<n>" to 33554432 bytes: No space left on device
    # near 680 databases; flat at 1.1M through 700 with track_counts=off. It is
    # the same error the postgres image's README documents, under Caveats, at
    # https://hub.docker.com/_/postgres#caveats (the README Docker Hub renders).
    # Decision: shm_size 1g. tmpfs is charged only when used, so the cost is the
    # pages actually written. Rejected: a `tmpfs: /dev/shm` overlay (HostConfig.
    # ShmSize would still read 64M, so the one instrument that reads the setting
    # would lie); 256m (one more doubling pair, tops out near 251M with nothing to
    # spare for a transient parallel-query segment beside it); turning parallel
    # query off (the probe reproduces the error with it off — it is not the
    # cause); fewer databases alone (reaping is the other half, not a remedy: a
    # drop does not shrink a running server's area). An existing stack keeps the
    # old size until `docker compose up -d db` recreates the container — data
    # survives, connections drop for seconds, so only with no lane running.
    # Revisit trigger: a DiskFull on /dev/shm at 1g, or a stats population (live
    # databases × relations) more than 8× the one this was measured against.
    shm_size: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djb}
      POSTGRES_DB: ${POSTGRES_DB:-djb_main}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PG 18 MOVED THE MOUNT POINT, and the image refuses rather than guessing.
      # 18+ stores data in MAJOR-VERSION-SPECIFIC subdirectories under
      # /var/lib/postgresql (…/18/docker), matching how `pg_ctlcluster` and a
      # real Postgres installation work, so `pg_upgrade --link` can run without
      # crossing a mount boundary. A volume mounted at the old
      # /var/lib/postgresql/data makes the container exit 1 with "in 18+, these
      # Docker images are configured to store database data in a format which is
      # compatible with pg_ctlcluster" — which is what it did here on the first
      # 18 boot. The mount moves up one level; the volume is otherwise unchanged.
      # Consequence, stated: a 16-era db_data volume cannot be reused across this
      # pin. There is no in-place upgrade path in this template — a laptop stack
      # is recreated (`deploy/teardown.sh --all-mine`), and a real environment's
      # database is RDS, where the major is AWS's to move.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djb} -d ${POSTGRES_DB:-djb_main}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: ${DJB_STACK_REGISTRY:-docker.io}/library/redis:7.4.5@sha256:90e7a336d044f1abc9e9dbc05d65566850896d11453bbd1dd0fb7e5059f0e8fb  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal:
    # Pinned: `latest` is the CLI's rolling tag, and a laptop that silently
    # moves a server version between two worktrees is a debugging session
    # nobody asked for. 1.8.2 ships Temporal server 1.31.2 / UI 2.50.1.
    image: ${DJB_STACK_REGISTRY:-docker.io}/temporalio/temporal:1.8.2@sha256:cf86707827fac99e4d1c4a47dc11b105382d796199c7bd41fb3213fb0471628e  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --namespace
      - ${TEMPORAL_NAMESPACE:-default}
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  mailpit:
    # Every email the product sends on a laptop, caught and readable at
    # http://127.0.0.1:8025 instead of delivered. It is here rather than the
    # console backend because an email is a rendered document — a subject line
    # that is too long, an HTML alternative that does not match the text one, a
    # link that points at the wrong host — and none of that is visible in a
    # terminal dump of the MIME source.
    #
    # Nothing leaves this container: Mailpit accepts SMTP and stores. A laptop
    # that could accidentally send a real invitation to a real customer while
    # somebody was testing is the failure this removes.
    #
    # Pinned to the patch, like Temporal and the collector are, so two worktrees
    # never see two versions.
    image: ${DJB_STACK_REGISTRY:-docker.io}/axllent/mailpit:v1.30.7@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    environment:
      # Accept whatever credentials a client offers, over plain SMTP: this
      # listens on loopback only and stores what it receives, so an auth
      # mechanism here would be configuration to get wrong rather than
      # protection. Production sends through a real provider.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  zitadel:
    # The identity system (ADR ident-1). It is not a convenience: every
    # interactive login, the MCP door's OAuth 2.1 authorization server and every
    # customer's IdP hang off this container, so a laptop that cannot start it
    # cannot run the product.
    #
    # Pinned to the patch, like Temporal and Mailpit are: v4.17.1 is the current
    # stable release of the v4 line (2026-08-14). `latest` would move a
    # first-instance bootstrap and a token format between two worktrees, and an
    # identity provider that changes underneath a half-finished OIDC flow is the
    # debugging session the Temporal pin's comment already refuses.
    image: ghcr.io/zitadel/zitadel:v4.17.1@sha256:3ac6910685d48f32481f01f45e3e6215efe5a9df2c069591b481e9a101712db5
    restart: unless-stopped
    # The box's three-service split, `deploy/compose.yaml` at `zitadel`, read
    # there for the why; the one difference is `--tlsMode disabled` here, where
    # no proxy terminates TLS. `start` serves only, after the two one-shots
    # below exit 0, and NO `user:` — the image's own non-root user.
    command: start --masterkeyFromEnv --tlsMode disabled
    depends_on:
      zitadel-setup:
        condition: service_completed_successfully
    # What `start` reads on every boot; the database's admin credentials and
    # the first-instance bootstrap set are on the one-shots only.
    environment: &zitadel-service-env
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-djb-local-development-masterkey!}
      # Where Zitadel thinks it is. This is not cosmetic: the issuer in the
      # discovery document, every redirect and every token audience are built
      # from these three, so they must name the address a browser on this
      # laptop actually types — http://localhost:8081.
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_EXTERNALDOMAIN:-localhost}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8081}
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_PORT: 8080
      ZITADEL_TLS_ENABLED: false
      # Off. Zitadel's service ping reports instance ids, domains and resource
      # counts to zitadel.com daily, and it is on by default; a laptop running
      # somebody's product is not a telemetry source. Nothing leaves this
      # container, the way nothing leaves Mailpit.
      ZITADEL_SERVICEPING_ENABLED: false
      # A dedicated `zitadel` database on the one Postgres this repository
      # already runs (ADR ident-1: isolation by database, not by instance — a
      # second stateful container earns nothing on a laptop).
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${ZITADEL_DATABASE_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DATABASE_PASSWORD:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      # --- CLASSIC LOGIN, PINNED (classic-login-pin) -----------------------
      # v4 routes OIDC `authorize` to Login V2, which is a SEPARATE CONTAINER
      # this stack does not ship — so without this line the browser sign-in
      # button redirects to `/ui/v2/login/login?authRequest=…` and gets a 404,
      # and NO sign-in can complete on any laptop: the quickstart's step 1,
      # invitation acceptance and the /mcp OAuth flow all die behind it.
      # The reasoning, the spelling read out of the image's own defaults.yaml,
      # and the re-worded adoption trigger live in ONE place —
      # `deploy/compose.yaml`, at this same key. Read it there before changing
      # this. The half that matters here: `DefaultInstance` applies WHEN THE
      # INSTANCE IS CREATED, so this line fixes a fresh volume and does
      # nothing to an instance that already exists; `scripts/setup.sh` repairs
      # those through the feature API.
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: ${ZITADEL_LOGIN_V2_REQUIRED:-false}
      # --- SIGN-IN POSTURE, AT INSTANCE CREATION (ADR ident-8) -------------
      # THE SPELLING WAS READ OUT OF THE IMAGE, not recalled — the embedded
      # `defaults.yaml` in ghcr.io/zitadel/zitadel:v4.17.1 carries, verbatim:
      #
      #     AllowRegister: true # ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER
      #     MaxPasswordAttempts: 0 # ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS
      #     DisallowPublicOrgRegistration: # ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION
      #
      # A key this image does not know is IGNORED SILENTLY, which is why the
      # spelling is quoted here rather than merely typed.
      #
      # THE SHARP EDGE, in the file's own words: `DefaultInstance` applies WHEN
      # THE INSTANCE IS CREATED. On a fresh volume these three lines are the
      # whole fix; on a Zitadel whose instance already exists they do NOTHING,
      # and `manage.py zitadel_seed` is what closes the doors there
      # (`apps/accounts/zitadel.py`, "the deployment's sign-in posture").
      # These are the belt; the seed is the mechanism.
      #
      # The `:-` defaults are the SAME posture `config/settings/base.py` reads
      # from the same variable names — the one-declared-value law, pinned by
      # `apps/accounts/tests/test_zitadel_posture.py`, which reads both files.
      #
      # THE THIRD KEY IS INVERTED, and that is the image's spelling, not a
      # choice: it is `DISALLOW`PublicOrgRegistration, while the seed's knob is
      # ZITADEL_ALLOW_PUBLIC_ORG_REGISTRATION. Compose has no `!` in `${…:-…}`,
      # so this key takes its own polarity and gets its OWN documented variable,
      # `ZITADEL_DISALLOW_PUBLIC_ORG_REGISTRATION`, which `.env.example` and
      # `deploy/env.staging.example` ship beside the other three with the
      # polarity spelled out. Two variables rather than one inverted meaning,
      # because a `false` that means "closed" three lines below a `false` that
      # means "open" is a line somebody sets wrong once.
      #
      # It defaults CLOSED, deliberately: a fresh instance is created closed
      # even for a deployment that wants org registration open, and
      # `zitadel_seed` — which runs seconds later in ./scripts/setup.sh and IS
      # the mechanism — opens it. The belt can be tighter than the mechanism;
      # it must never be looser, and the test pins that direction as well as
      # pinning that every key here interpolates a variable the examples carry.
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: ${ZITADEL_ALLOW_SELF_REGISTRATION:-false}
      ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS: ${ZITADEL_MAX_PASSWORD_ATTEMPTS:-10}
      ZITADEL_DEFAULTINSTANCE_RESTRICTIONS_DISALLOWPUBLICORGREGISTRATION: ${ZITADEL_DISALLOW_PUBLIC_ORG_REGISTRATION:-true}
    ports:
      # Loopback only, like every other service here. 8081 rather than
      # Zitadel's own 8080, which the ClickStack UI already publishes: two
      # services fighting for a port is not a debugging session either.
      - "127.0.0.1:${ZITADEL_EXTERNALPORT:-8081}:8080"
    volumes:
      # Mounted here though `zitadel-setup` writes it: `scripts/setup.sh`'s
      # `docker compose cp zitadel:` needs a container that stays up.
      - zitadel_bootstrap:/zitadel/bootstrap
    healthcheck:
      # The binary's own readiness command — the image is distroless, so there
      # is no shell and no curl to ask with.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 5s
      # Generous: the first start on an empty database runs every migration and
      # the first-instance bootstrap before it answers.
      retries: 60
      start_period: 10s

  # The privileged half, in containers that exit (`restart: "no"`): root,
  # because the bootstrap writes the PAT into `zitadel_bootstrap` and the
  # image's own user cannot. `init` creates the database and its role.
  zitadel-init:
    image: ghcr.io/zitadel/zitadel:v4.17.1@sha256:3ac6910685d48f32481f01f45e3e6215efe5a9df2c069591b481e9a101712db5
    restart: "no"
    command: init
    user: "0"
    environment: &zitadel-bootstrap-env
      <<: *zitadel-service-env
      # The compose Postgres superuser's, because the database and its owner
      # do not exist on a fresh volume and `init` creates both.
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${POSTGRES_USER:-djb}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-djb}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # The admin connection has to land somewhere that already exists to be
      # able to create the one that does not.
      ZITADEL_DATABASE_POSTGRES_ADMIN_EXISTINGDATABASE: postgres
      # The first instance, created once, on an empty database. The human is a
      # way in to the console; the machine user is what OUR services
      # authenticate the management API with (ident-2: the console is not a
      # door — this PAT is).
      # Display names, so they derive from PRODUCT_NAME (ADR platform-1 in
      # docs/product/architecture.md): set PRODUCT_NAME in .env and the
      # first instance is named after the product. ZITADEL_ORG_NAME still wins
      # when a deployment needs the org to differ from the product's name.
      # The USERNAMES below do not derive: they are login identifiers, and a
      # first instance is created once — renaming one is an account migration,
      # not a setting.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME:-${PRODUCT_NAME:-Pilecap}}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME:-zitadel-admin@djangobootstrap.localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ${ZITADEL_MACHINE_USERNAME:-djb-platform}
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ${PRODUCT_NAME:-Pilecap} platform service account
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ZITADEL_MACHINE_PAT_EXPIRES_AT:-2099-01-01T00:00:00Z}
      # The PAT is written here, on a named volume — never into the tree, and
      # never into an image. scripts/setup.sh copies it out into .env (which is
      # gitignored) as ZITADEL_PAT, which is how settings and the management
      # client read it.
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/machine.pat
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap
    depends_on:
      db:
        condition: service_healthy

  # `setup` runs the migrations and the first-instance bootstrap that writes
  # ZITADEL_FIRSTINSTANCE_PATPATH; the same environment as `zitadel-init`.
  zitadel-setup:
    image: ghcr.io/zitadel/zitadel:v4.17.1@sha256:3ac6910685d48f32481f01f45e3e6215efe5a9df2c069591b481e9a101712db5
    restart: "no"
    command: setup --masterkeyFromEnv --tlsMode disabled
    user: "0"
    depends_on:
      zitadel-init:
        condition: service_completed_successfully
    environment: *zitadel-bootstrap-env
    volumes:
      - zitadel_bootstrap:/zitadel/bootstrap

  minio:
    # The S3-compatible object store a laptop, a worktree and CI upload to
    # (ADR files-2, STACK RULING ING-1 in docs/product/adrs-ingredients.md).
    # Production is real S3 — one seam speaks boto3 to both — and this
    # container is what makes the two-phase presigned upload contract
    # exercisable without AWS credentials and without a network, which is the
    # hermetic property worktree-per-rung exists for. The rejected alternative
    # is not "MinIO or nothing": it is "S3 even in dev" (every worktree needs
    # real credentials) or "local disk in dev" (local disk cannot presign at
    # all, so the whole upload contract would have no local implementation).
    #
    # LICENCE, NAMED HERE RATHER THAN INHERITED: MinIO is AGPL-3.0. It is a
    # container we run, never code we link or ship — no product artifact
    # contains it and every deployment past a laptop points the same seam at
    # S3 — so the copyleft does not reach the product. House rule 23's licence
    # leg reads Python distributions and cannot see a compose image; this
    # paragraph is the disposition, recorded where the choice is made rather
    # than left for a reviewer to re-derive.
    #
    # NO BUCKET IS BOOTSTRAPPED HERE, and deliberately. The bucket name is
    # derived per checkout the way `DATABASE_NAME` is, so two worktrees and
    # every xdist worker never meet in one bucket — which means a sidecar here
    # could only create a bucket with a name nobody uses, while reading as
    # setup that had happened. The storage seam finds-or-creates its own
    # bucket (ING-1's F1 rung); `AWS_STORAGE_BUCKET_NAME` ships empty in
    # `.env.example` until it does, and an empty bucket name is what keeps
    # uploads on the local filesystem in the meantime.
    #
    # Pinned to the release, like Temporal, Mailpit and Zitadel are: a store
    # whose S3 dialect moved between two worktrees would be a debugging
    # session nobody asked for.
    #
    # SERVED FROM THE OWNER'S ECR PUBLIC MIRROR, pinned by digest. The release
    # is the one this tree has always run; only the source moved, twice. Docker
    # Hub dropped the tag on 2026-09-12; quay.io served the byte-identical
    # digest until MinIO archived the project and withdrew every public image
    # and binary on 2026-09-24 (dl.min.io answers 410, the GitHub project is
    # archived). The mirror is the last public release, re-pushed from a cache
    # into the owner's ECR Public repository — a vendor behind a boundary we own
    # (principle 5). LINUX/ARM64 ONLY, because no box of ours had cached the
    # amd64 layers and no registry serves them now; `platform:` says so, a Mac
    # or a Graviton box runs it natively, and an amd64 host needs the arm64
    # QEMU handler (CI registers it before `compose up`). BY DIGEST, so a
    # re-push under the same tag cannot move it silently. Anonymous pulls work
    # for a laptop, a fresh clone and a verifier box; CI logs in, because ECR
    # Public rations anonymous data and a full matrix exhausts it. The tripwire
    # for the next time a registry loses it is still `scripts/setup.sh`'s pull
    # step, which refuses with COULD NOT LOOK and names the image. To re-pin:
    # push to the same repository and replace tag and digest together.
    # The ONE path a product still pulls from the platform owner's registry; the
    # decision on its home (a product-owned mirror, or a listed vendor) is the owner's — N2155.
    # pin-exception: pinned by digest, but to a single linux/arm64 manifest on the
    # owner's ECR Public mirror rather than a multi-arch index on a listed registry —
    # no registry serves the amd64 layers of this release any more (see above).
    image: public.ecr.aws/w9i8o4b2/minio:RELEASE.2025-09-07T16-13-09Z@sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
    platform: linux/arm64
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Published development credentials, worth exactly nothing and meant to
      # be — `.env.example` carries them and the boundary comment in
      # `config/settings/guards.py` records that nothing refuses them, because
      # no settings module reads MINIO_ROOT_*: they configure this container
      # and nothing else. The app-side pair is AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY, which a real deployment leaves empty so boto3
      # finds an instance role instead.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # Off, like Zitadel's service ping: a laptop running somebody's product
      # is not a place that phones home for update notices.
      MINIO_UPDATE: "off"
    ports:
      # 9000 is the S3 API — the address `AWS_S3_ENDPOINT_URL` names. 9001 is
      # the operator console. Loopback only, like every other service here.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # `mc` is the only client in this image — there is no curl and no wget —
      # and `mc ready local` is MinIO's own readiness command against the
      # server in this container. It is what the vendor's own compose example
      # uses, for the same reason Zitadel's healthcheck is `/app/zitadel ready`.
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 20

  meilisearch:
    # The search engine (ADR search-2, the owner's ruling of 2026-08-22). One
    # small container beside ClickStack, Zitadel and MinIO; the app reaches it
    # through the one fenced client in `apps/search`, and Postgres full-text is
    # the designed degradation engine behind it.
    #
    # DELIBERATELY NOT A `/readyz` DEPENDENCY, and the reason is in
    # `apps/core/health.py`'s `checks()`: Meilisearch down means search is
    # slower and plainer, never dead, so a readiness member here would convert
    # a designed degradation into a self-inflicted outage — every replica in
    # the fleet reporting unhealthy because search got worse. It is the one
    # service in this file that is intentionally invisible to readiness.
    #
    # Pinned to the patch rather than to the minor the ADR asked for. That is
    # the stronger of the two and it is the house precedent (Temporal, Mailpit,
    # Zitadel): `v1.53` moves under a running worktree when a patch ships,
    # `v1.53.1` does not.
    image: ${DJB_STACK_REGISTRY:-docker.io}/getmeili/meilisearch:v1.53.1@sha256:8d6643d86d71fad6ad3cba92cde7ccfce9e4d6c384bda67598eb553571c32431  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    environment:
      # Published development value, worth exactly nothing — see
      # `.env.example` and the boundary comment in `config/settings/guards.py`.
      # Production injects a real one from Secrets Manager, per the standing
      # AWS posture. With a key set, Meilisearch requires it on every request
      # even in development mode, which is what keeps dev and prod the same
      # shape rather than "no auth locally, auth in production".
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-djb-local-development-meili-master-key}
      # `development` enables the bundled search preview on 7700 and relaxes
      # nothing about the key above. Production runs `production`.
      MEILI_ENV: ${MEILI_ENV:-development}
      # Off, like Zitadel's service ping and MinIO's update check. Nothing
      # leaves this container.
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # `/health` is Meilisearch's own unauthenticated readiness endpoint — it
      # takes no master key, which is exactly what a compose healthcheck needs.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7700/health"]
      interval: 3s
      timeout: 5s
      retries: 20

  # --- The one sink, behind a profile ---------------------------------------
  #
  #   docker compose --profile observability up -d
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318 ./scripts/serve.sh
  #
  # Off by default because it is two more containers and a ClickHouse, and the
  # everyday loop does not need them: with no endpoint set the app still traces
  # (so `trace_id` is on every log line) and simply does not ship. Turn the
  # profile on when you are actually reading traces — and in CI never.
  #
  # ClickStack (HyperDX) is the sink `architecture.md` ruled: logs, traces and
  # metrics in one place, over one protocol, queried together. The UI is on
  # http://127.0.0.1:8080.

  otel-collector:
    profiles: ["observability"]
    image: ${DJB_STACK_REGISTRY:-docker.io}/otel/opentelemetry-collector-contrib:0.140.0@sha256:ffc818ee108d0b934fd14207fd87ff247c9b64f344ed349d0b66c166c18a2312  # pin-exception: the prefix picks Docker Hub or its ECR Public mirror; the digest here is the pin in both
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      CLICKSTACK_API_KEY: ${CLICKSTACK_API_KEY:-local-development-ingestion-key}
    volumes:
      - ./compose/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - clickstack

  clickstack:
    profiles: ["observability"]
    # ClickStack all-in-one: ClickHouse, the HyperDX UI and its own OTLP
    # ingestion in one container. Pinned rather than `latest`, for the same
    # reason the Temporal image is: a sink that changes its schema between two
    # worktrees is a debugging session nobody asked for.
    image: docker.hyperdx.io/hyperdx/hyperdx-all-in-one:2.10.0@sha256:a747cd94827b5a75913953d00dea1546430460fc36145b4197df5c6b067ccf2a
    restart: unless-stopped
    environment:
      HYPERDX_API_KEY: ${CLICKSTACK_API_KEY:-local-development-ingestion-key}
    ports:
      # The UI only. OTLP stays on the internal network: the app talks to the
      # collector, and the collector is the only thing that talks to the sink.
      - "127.0.0.1:8080:8080"
    # THREE PATHS, BECAUSE THE ALL-IN-ONE HOLDS THREE DIFFERENT THINGS —
    # HyperDX's own metadata at /data/db, the ClickHouse column store every
    # span and log line actually lands in, and the ClickHouse server's logs.
    # Only the first was named here, so a `docker compose down -v`, a prune, or
    # any recreate that renews anonymous volumes kept the dashboards and
    # dropped everything they query. deploy/compose.yaml carries the same three
    # under the same names and the whole argument: the loss class does not care
    # which machine it is on, and a laptop is where somebody first learns that
    # their traces from this morning are gone.
    volumes:
      - clickstack_data:/data/db
      - clickstack_data_clickhouse:/var/lib/clickhouse
      - clickstack_data_clickhouse_logs:/var/log/clickhouse-server

volumes:
  db_data:
  redis_data:
  temporal_data:
  mailpit_data:
  # Zitadel's own state is in the `zitadel` database on `db`; this volume holds
  # only the machine user's PAT, written once by the first-instance bootstrap.
  zitadel_bootstrap:
  # The sink's three (the reason is beside the service): HyperDX's metadata,
  # the column store, and the ClickHouse server's own logs. Rebuildable is not
  # the word for any of them — telemetry is the one thing that cannot be
  # regenerated from the rows, because the rows are not where it lives.
  clickstack_data:
  clickstack_data_clickhouse:
  clickstack_data_clickhouse_logs:
  # Uploaded objects on a laptop. The only copy — a laptop's uploads are not
  # backed up, the way a laptop's database is not.
  minio_data:
  # The search indexes. NOT BACKED UP, ON PURPOSE (ADR search-2): every
  # document in here is a projection of rows that live in Postgres, so the
  # recovery path for a lost volume is a reindex, not a restore. A backup would
  # be a second copy of derived data that can silently go stale.
  meili_data:
