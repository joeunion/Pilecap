# The leak proof, every night, on main — and never silent.
#
# WHAT IT RUNS. `./scripts/pm_push.sh --proof`: the whole suite twice under ONE
# seed — pass 1 with per-test coverage contexts, the test-impact map inverted
# out of it, pass 2 plain — and one record, `leak_proof.txt`, in the grammar
# `scripts/gate_ledger.sh` owns (`gate_nightly_line` writes it,
# `gate_nightly_read` reads it):
#
#   schema=leak-proof/1 at= commit= tree= seed= pass1= pass2= map= rc= run=
#     attempt= where=nightly
#
# It is the SAME function a bank's acceptance box calls, so the runner and the
# box write one field set. This file owns no step of the proof: it brings up
# the stack the suite assumes (the `legs` job's own steps in `ci.yml`, for the
# same reasons, which that file argues and this one does not repeat) and hands
# the proof the run's id and attempt.
#
# WHY IT IS NIGHTLY. ADR gate-1 as re-ruled: the pull-request path runs the
# suite at ONE pass, sharded, and the second whole pass — the idempotency belt,
# a test that passes alone and fails behind its own leftovers — moved off the
# path to here. Nothing is dropped: every night measures it, the record says
# what it found, and three readers act on it:
#
#   * `pm_push.sh --bank --on-boxes N --leak-proof nightly` prints ONE source
#     line naming the latest night (green, or a WARNING naming red, older than
#     24 h, or none) and writes the form into the row (report-only);
#   * the deploy to prod refuses without a green nightly no older than 24 h —
#     that is where the teeth are;
#   * `scripts/pm_fold.sh`'s map step harvests the latest green night's
#     `test_impact.json` into `scripts/test_impact.json` (red, stale or none:
#     unchanged, and said).
#
# THE ARTIFACT IS PUBLISHED WHATEVER HAPPENED (`if: always()`): a red night's
# record is the thing a reader most needs. The JOB goes red on a red proof, so
# GitHub's own notification is the first thing that says so.
#
# PERMISSIONS: `contents: read`, and on the job `id-token: write` for ONE
# reason — the MinIO mirror's pull goes through the same AWS login the `legs`
# job in `ci.yml` uses. ANONYMOUS IS NOT SAFE EVEN FOR ONE PULL A NIGHT: ECR
# Public rations anonymous pulls per SOURCE IP, and hosted runners share their
# IPs with everybody else's jobs, so a single pull can meet `toomanyrequests`
# that another tenant spent (the consumer paid for exactly this hole). The login
# exports STS credentials into the job env, so every `run:` step after it pins
# the three `AWS_*` names empty (house rule 62) — the proof needs no cloud
# credential; `config/settings/test.py` is the one authority for the store.
# No role variable (a fork, a clone with no AWS account yet) → anonymous, as a
# laptop pulls.
#
# DOES NOT COVER: a leak that needs more than two passes to show; a pull
# request's own second pass (it has none — that is the ruling); the proof's
# environment beyond what `compose.yaml` declares.

name: nightly-proof

on:
  schedule:
    # 07:17 UTC — after midnight on the owner's coast, and off the hour, when
    # GitHub's scheduler is least crowded.
    - cron: "17 7 * * *"
  workflow_dispatch:

# One proof at a time; a second dispatch waits rather than cancelling the
# night already running.
concurrency:
  group: nightly-proof
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # The compose stack's address and credentials — `ci.yml`'s own block, for
  # its reasons; DATABASE_NAME is derived by the step below, never typed.
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  DATABASE_USER: djb
  DATABASE_PASSWORD: djb  # pragma: allowlist secret — the published compose password, refused in production by config.settings.guards
  REDIS_URL: redis://127.0.0.1:6379/0
  CACHE_URL: redis://127.0.0.1:6379/1

jobs:
  proof:
    name: leak proof (two passes, one seed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The suite reads git (the drives' and the gate's diff readers), and
          # `gate_measured_tree` names the tree the record carries.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: this runner's own database name (derived, not typed)
        # `ci.yml`'s step, and it refuses rather than falling back for the
        # reason written there.
        run: |
          . ./scripts/db.sh
          . ./scripts/lifecycle.sh
          if [ -z "${DATABASE_NAME:-}" ] || ! lc_derived_shape "$DATABASE_NAME"; then
              echo "!! this job has no checkout-derived database name (exit 2)." >&2
              exit 2
          fi
          echo "DATABASE_NAME=${DATABASE_NAME}" >>"$GITHUB_ENV"
          echo "this runner's database: ${DATABASE_NAME} (derived by scripts/db.sh)"

      - name: the arm64 handler the MinIO mirror needs
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: assume an AWS identity for the MinIO pull
        # `ci.yml`'s `legs` step, for its reasons; us-east-1 because ECR
        # Public's API lives there alone.
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: log in to the registry the MinIO pin names
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: the stack the suite assumes (docker compose up)
        env:
          # Pinned empty (house rule 62): compose pulls with the registry
          # login's docker config, never with the exported keys.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          POSTGRES_USER="$DATABASE_USER" \
          POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
          POSTGRES_DB="$DATABASE_NAME" \
            docker compose up -d --wait db redis temporal minio meilisearch

      - name: the frontend toolchain — node
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc

      - name: the frontend toolchain — pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: the leak proof (./scripts/pm_push.sh --proof)
        # THE step, unpiped: its exit status is the job's — 0 green, 1 a pass
        # red, 2 could not look. Four workers: the runner's cores.
        env:
          # THE EXPORTED CREDENTIAL, PINNED EMPTY (house rule 62): the suite
          # dials the compose MinIO, and `config/settings/test.py` is the one
          # authority for that address and pair.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PROOF_OUT: ${{ runner.temp }}/leak-proof
        run: |
          ./scripts/pm_push.sh --proof --where nightly --run "$RUN_ID" \
            --attempt "$RUN_ATTEMPT" --workers 4 --out "$PROOF_OUT"

      - name: publish nightly-leak-proof (always — a red night is the one to read)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-leak-proof
          path: |
            ${{ runner.temp }}/leak-proof/leak_proof.txt
            ${{ runner.temp }}/leak-proof/test_impact.json
            ${{ runner.temp }}/leak-proof/pass1.log
            ${{ runner.temp }}/leak-proof/pass2.log
          if-no-files-found: error
          retention-days: 14

      - name: the stack, when something failed
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 db redis temporal
