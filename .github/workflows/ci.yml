# The gate, run by GitHub Actions on every pull request and every push to main.
#
# **CI does not have its own list of legs. CI ASKS THE GATE FOR THE LIST**
# (`./scripts/check.sh --list-legs --ci`) **and runs each unit with `--leg`. The only
# number CI owns is how many runners split the suite.** That is the same
# doctrine this file has always carried, one turn further out: it used to spell
# the legs by hand and quietly omitted the house-rules engine entirely, so
# twenty-four rules and every canary self-test never ran on a pull request and
# CI-green did not mean gate-green. Then it ran the whole gate in one step,
# which could not drift but also could not be split. Now the gate publishes its
# own units and this file expands them — so there is still nothing here to keep
# in sync, and a leg that joins the gate joins CI on the same commit.
#
# The one hand-typed number is `PYTEST_SHARDS` in the `env:` block below, and it
# names what re-derives it in its own comment.
#
# What the units cover is not written here either, for the same reason: run
# `./scripts/check.sh --list-legs` and read the `composed-of` column.
# `scripts/check.sh` is the authority on that list; `docs/product/architecture.md`
# — "The gate" — is what it answers to; `docs/product/build-contract.md` carries
# a copy of the table that a drive compares against the command, line for line.
#
# Exit codes carry through: 0 clean · 1 violations · **2 enforcement broken**,
# which outranks any pass. Nothing is piped, here or in the script — a pipe
# replaces the exit status of the thing you meant to trust with the exit status
# of the last command in the pipe.
#
# **AND CI DOES NOT HAVE ITS OWN ENVIRONMENT EITHER. CI BRINGS UP THE STACK THE
# GATE ASSUMES** — `scripts/ci_stack.sh up`, compose's own `--wait` over this
# repository's own `compose.yaml`, the same file a laptop runs. That is the same sentence as the
# one above, one layer down: a hand-built CI environment that *resembles* the
# gate's is a second description of the stack, and a second description drifts.
#
# It drifted. This job used to publish GitHub SERVICE CONTAINERS for
# Postgres and Redis — a port on localhost, which is everything a Django
# process needs and is exactly why it read as correct. But half the gate does
# not reach Postgres over a port. `scripts/db.sh` runs `docker compose exec -T
# db psql` and `scripts/lifecycle.sh` runs `docker compose exec -T temporal
# temporal`, deliberately: there is no `psql` and no `temporal` CLI on the host,
# and a Homebrew one would be whatever major somebody installed. A service
# container is not a compose service, so `docker compose exec db` finds no such
# service — and the instruments that ask it say COULD NOT LOOK, exit 2, which
# outranks a pass and is the correct answer. There was no Temporal here at all.
#
# TWO LEGS NEED THE STACK AND NOT THE PORT, and they are the two the gate runs
# last before `full-house-rules` — with a third, `pytest-x2`, needing only the
# database:
#
#   pytest-x2         the port. Already met; now met by the compose db, which
#                     is Postgres 18 as the laptop and RDS are (ADR deploy-1),
#                     rather than the 16 this file used to publish on its own.
#   own-tree-census   `scripts/sweep.sh` — compose `db` AND compose `temporal`.
#   selftest          BOTH shell refusal drives live in this leg:
#                     `quality/tests/test_backup.py` needs compose `db`
#                     (`backup.sh` dumps with the pg_dump INSIDE the container),
#                     `quality/tests/test_reap.py` needs `db` AND `temporal`.
#
# `own-tree-census` runs BEFORE `selftest`, so it is the first leg that would
# have gone red, not the drives themselves — both answer to the same
# `docker compose exec`.
#
# WHAT IS DELIBERATELY NOT STARTED, and why, because "start the stack" must not
# quietly mean "start everything":
#
#   * zitadel and mailpit — EXCEPT on a row whose unit's `needs` name them.
#     `config/settings/test.py` pins ZITADEL_ISSUER at 127.0.0.1:1 and the PAT
#     empty (the suite must not dial) and uses the locmem email backend, so no
#     SUITE leg touches either, and Zitadel's first-instance bootstrap costs
#     more than every other service here put together. But the `selftest`
#     unit carries the identity-home drive (`quality/tests/test_identity_home.py`),
#     which drives a real worker against a real Zitadel and reads a real
#     Mailpit — so that unit's `needs` say `zitadel,mailpit`, and the stack step
#     below starts both for the rows that carry it and for no other. A drive
#     that was never run here would be a drive the trains road never measured.
#   * the `observability` profile (otel-collector, clickstack) — `compose.yaml`
#     says "in CI never" in as many words, and a profile is not started by a
#     bare `up` in any case.
#   * `deploy/compose.yaml` — the deployment stack. The backup/restore drive
#     drives `--stack`'s REFUSALS and declares the real `--stack` dump out of
#     its own scope; bringing that stack up would be this file inventing a leg.
#
# `redis` IS started even though the suite runs LocMemCache and the in-memory
# channel layer today: the `env:` block below advertises REDIS_URL and CACHE_URL
# to every step, and an advertised address that answers nothing is a lie waiting
# for the first test that reads a real cache. One small container keeps the
# environment the one the settings describe.
#
# `minio` AND `meilisearch` ARE STARTED, and by the same argument one step
# further out. Nothing in the gate dials either one *today* — the ingredients
# that will are `apps/files` and `apps/search`, which land in the rungs
# immediately after this one. They are started here
# rather than by those rungs because `compose.yaml` and this file are the two
# shared files the whole cycle was shaped to have exactly one writer for: the
# alternative is two more rungs editing this list, which is the collision the
# batching exists to prevent. The cost is two small containers on an ephemeral
# runner; the thing bought is that the first rung whose tests need a bucket or
# an index finds one already there.
#
# `minio` is AGPL-3.0 and is a container CI runs, never code the product links
# or ships — the disposition is recorded on the service in `compose.yaml`,
# where the choice is made. House rule 23's licence leg reads Python
# distributions and cannot see a compose image.
#
# EVERYTHING THE GATE DOES, THE GATE DOES. There used to be one exception — a
# step that built the production static manifest, kept here and named as "the
# one candidate to fold into `check.sh` later". It is folded: it is a leg now,
# in the `static` unit. Once CI runs UNITS, a step conditioned on which unit is
# running would be CI typing a leg name, which is the one thing the paragraph at
# the top of this file refuses.

name: gate

on:
  pull_request:
  push:
    branches: [main]
  # PROD, BY HAND, AND NOTHING ELSE. A dispatch runs `deploy-prod` alone: the
  # gate's jobs stand down on it (their `if:`s say so), because a promotion is
  # not a measurement — the tree it promotes was measured on its way to
  # staging, and a second run over it would be a second measurement of one
  # tree. The inputs reach the job as env, never as shell text.
  workflow_dispatch:
    inputs:
      tree:
        description: "The tree staging holds — line 1 of its TREE marker, tree-<12 hex> (the bare hex is accepted)"
        required: true
        type: string
      sanction:
        description: "<who>: <why> — who is promoting this tree to prod, and why"
        required: true
        type: string

# A pull request that gets three pushes in five minutes should measure the last
# tree, not all three. `main` is never cancelled: a push to main is a tree
# somebody will cherry-pick from.
#
# A DISPATCH HAS ITS OWN GROUP. It runs on main's ref, and in one group a newly
# queued run CANCELS the pending one even with cancel-in-progress off — so a
# prod promotion queued behind a merge's gate would cancel the next merge's
# pending gate, or be cancelled by it. AND A DISPATCH NEVER CANCELS ONE IN
# FLIGHT: every dispatch shares that group, so a cancel keyed on the ref alone
# would let a dispatch from any branch cancel a prod promotion from main
# mid-act — deploy-prod's own job-level `cancel-in-progress: false` does not
# reach this one.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Matches `.python-version` and the `requires-python` floor in pyproject.
  PYTHON_VERSION: "3.12"
  # THE ONE NUMBER THIS FILE OWNS, AND IT NAMES WHAT RE-DERIVES IT. How many
  # runners the suite's unit is split across — the unit `--list-legs --ci`
  # calls `N-capable`; the selftest unit's count is the listing's own, derived
  # from the committed CI walls table, and is not this number. Derived from the
  # measurement for ONE PASS, which is what a CI row now runs (the second whole
  # pass is the nightly's): pass 1 on run 36282702383 was 248 / 262 / 180 s on
  # three shards, so one pytest row's wall is about
  # `T(N) ≈ Σpass1 × 1.1 / N + ~100 s` — the pass, a tenth for the split's
  # imbalance, and the row's own checkout, uv, stack and collection (38 + 64 s
  # measured). At N=3 that is ~6 min, UNDER the selftest pole (~8.4 min at
  # its derived six shards), so a fourth pytest runner buys the push no wall at
  # all — it only bills. RE-DERIVE IT when the heaviest pytest row's wall
  # passes the heaviest selftest row's (then this is the pole), or when pass
  # 1's sum moves more than 20% from those 690 s — the triggers, and the only
  # ones.
  PYTEST_SHARDS: "3"
  # THE COMPOSE STACK'S ADDRESS AND CREDENTIALS, AND THEY ARE THE SOURCE, NOT A
  # COPY: the "start the stack" step below passes the two credentials straight
  # into compose as POSTGRES_USER / POSTGRES_PASSWORD, so the value Django dials
  # and the value the container is created with cannot drift apart the way two
  # hand-kept lists do. `compose.yaml`'s own `${...:-djb}` defaults are then
  # never relied on here. POSTGRES_DB is the third and it is NOT here — it is
  # derived by `scripts/ci_stack.sh up`, for the reason written where
  # DATABASE_NAME used to be pinned.
  #
  # (The sentence this replaces claimed the checked-in defaults in
  # `config/settings/base.py` made an override unnecessary. Half true and now
  # false: DATABASE_NAME's default there is the empty string — it MUST be set,
  # and it is set by `scripts/db.sh` in both places now, on a laptop and here.
  # Booked as stale in `docs/product/queue.md`; closed in passing.)
  #
  # Postgres always — never SQLite, in CI as on a laptop, because the
  # Postgres-specific fields, constraints and query behaviour are part of the
  # contract.
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  # DATABASE_NAME IS DELIBERATELY ABSENT FROM THIS BLOCK. It is DERIVED, by the
  # stack step below (`scripts/ci_stack.sh up`), through `scripts/db.sh` — the
  # same function a laptop runs.
  #
  # (The sentence this replaces read "A NAME, NOT A DERIVATION", pinned
  # `djb_main`, and argued that an ephemeral runner with one checkout makes the
  # pin honest. The pin is honest about isolation and DISHONEST about the
  # census. `scripts/check.sh`'s own-tree-census leg narrows every verdict with
  # `--only "$DATABASE_NAME"`, and `scripts/sweep.sh` only reasons about names
  # of the derived shape `djb_<branch>_<8 hex>` — `lc_derived_shape`
  # (`scripts/lifecycle.sh`) refuses anything else, and a refused name is
  # printed but never classified, so it can never be UNRECOGNIZED and can never
  # redden the leg. `djb_main` fails that test. Which means the census leg on
  # every CI run so far asserted its two properties over an EMPTY SCOPE and
  # reported clean: a green that vouched for nothing, in the one environment
  # where nobody is watching the machine afterwards.)
  DATABASE_USER: djb
  DATABASE_PASSWORD: djb  # pragma: allowlist secret — the published compose password, refused in production by config.settings.guards
  REDIS_URL: redis://127.0.0.1:6379/0
  CACHE_URL: redis://127.0.0.1:6379/1
  # The development values `.env.example` gives that the code's defaults are not (the `ci-env` census).
  BRAND_ACCENT: "#3f4a5a"
  EMAIL_HOST: 127.0.0.1
  EMAIL_PORT: "1025"
  SERVER_EMAIL: no-reply@localhost
  # NO `AWS_*` KEY IS HERE, AND THAT IS THE DESIGN. The store the suite talks to
  # has ONE authority: `config/settings/test.py` writes the compose MinIO's
  # address, region and published pair as literals and pins the session token
  # absent, so neither this block nor anything a later step exports can
  # redirect the gate's S3 calls. This block used to carry the four as a copy,
  # and the copy was the side an exporter could overwrite: the registry login
  # below writes assumed STS keys into the job env over this block, and on the
  # first CI attempt that credential reached the suite and every MinIO test
  # answered `InvalidAccessKeyId`. The `ci-env` census (`scripts/docs_legs.sh`)
  # refuses a second authority here, naming both, and house rule 62 holds every
  # `run:` step after an exporter to pin the exported names or say why.
  # AWS_STORAGE_BUCKET_NAME is absent for its own older reason: the test
  # settings pin it empty and a test that wants a bucket names one itself.

jobs:
  derive:
    name: derive
    # A DISPATCH IS A PROMOTION, NOT A MEASUREMENT (the `on:` block says why);
    # with derive down, `legs`, `images` and `local` stand down behind it.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    # WHAT TO RUN, ASKED RATHER THAN TYPED. This job's whole output is the
    # matrix the next one expands, and it comes out of the gate itself. It
    # needs no database, no docker and no network beyond the checkout, because
    # the listing reads one file and prints; on a pull request it installs the
    # venv the lane's closure imports, and nothing else.
    #
    # AN EXIT 2 FROM THE LISTING FAILS THIS JOB, AND THERE IS NO FALLBACK. The
    # listing refuses rather than print a table it cannot vouch for (a leg in no
    # unit, a leg in two, a unit with no `needs`); a CI that fell back to some
    # remembered list at that moment would be running the hand list this whole
    # design exists to delete, at exactly the moment the gate said the list was
    # wrong. `set -euo pipefail` and a bare invocation is the whole mechanism.
    #
    # ON A PUSH TO MAIN, AND ON A PULL REQUEST'S HEAD (CI-THIRD-1), IT ASKS ONE
    # QUESTION FIRST: did a pull request's run already measure this tree green?
    # (`ledger.ci_consult`, the consult step below.) Yes → an empty matrix, `legs` skipped by its `if:`, and `verdict`
    # names the run that measured it: one measurement per tree. Anything else
    # → the full matrix, exactly as if nothing had been asked.
    #
    # ON A PULL REQUEST IT ASKS THE LANE FIRST (`python -m quality.djb.scope
    # lane`, the lane step below): one word — `docs`, `loop` or `full` — read
    # through the loop's own scope derivation. `docs` is an empty matrix and
    # this run is derive, verdict and gate-verdict alone; `loop` is the listing's
    # rows narrowed by `--pr --base`; `full` is the listing's rows whole.
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
      lane: ${{ steps.lane.outputs.lane }}
      closure: ${{ steps.lane.outputs.closure }}
      plan: ${{ steps.lane.outputs.plan }}
      units: ${{ steps.lane.outputs.units }}
      pytest: ${{ steps.lane.outputs.pytest }}
      seed: ${{ steps.units.outputs.seed }}
      honoured: ${{ steps.consult.outputs.honoured }}
      honoured_attempt: ${{ steps.consult.outputs.attempt }}
      honoured_tree: ${{ steps.consult.outputs.tree }}
    # THE WORKFLOW'S `contents: read` PLUS THE TWO READS THE CONSULT SPENDS,
    # and this is the only job that holds them: `pull-requests: read` to ask
    # which pull requests carry the pushed commit, `actions: read` to list
    # their runs and download a run's record. Neither can write anything.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The listing itself needs no history, but the base of a proposed
          # change must resolve on every row below, and the rows check out the
          # same way. Kept here so the two jobs' checkouts do not differ.
          #
          # AND THE CONSULT NEEDS IT: the record it judges names the pull
          # request's head commit, which must be in THIS checkout for its
          # measured tree and its ancestry to be read — a shallow clone answers
          # "commit unknown" and every push to main would re-measure.
          fetch-depth: 0
          # AND THE TAGS, for the same "do not differ" reason. `fetch-depth: 0`
          # fetches every commit and NO tag object; the drives and the image
          # side both reason about tags, and a runner that has none answers
          # "this tree carries no tag" identically to a tree that really does
          # not. See the legs job's checkout for the measurement.
          fetch-tags: true

      - name: the consult — did a pull request's run already measure this tree
        id: consult
        # A PUSH AND A PULL REQUEST (CI-THIRD-1): a pull request asks of its
        # HEAD with `--pr <number>`, and only a run of THAT pull request is a
        # candidate — directly, or over a docs-only delta (the fold's re-push,
        # `ledger.ci_consult`'s PR road); a head whose bytes main moved under
        # is measured.
        #
        # `ledger.ci_consult` (quality/djb/ledger.py) prints exactly one line and
        # ALWAYS exits 0: `consult: honoured run=<id> attempt=<n> tree=<t>` when
        # a completed pull_request run of this workflow, for the pushed commit
        # or a pull request GitHub associates with it, published a green, whole,
        # fresh record whose tree is THIS checkout's measured tree — judged by
        # the same fetch and judge `pm_push.sh --ci-verdict` uses; otherwise
        # `consult: measure — <why>`. It never refuses, because measuring is
        # the safe answer: a tree the fallback bank pushed has no record and is
        # simply measured here.
        #
        # THE STDLIB FLOOR: this job runs no `uv sync`, so the runner's own
        # `python3 -E -S` runs the ledger — the module imports nothing else.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          answer="${RUNNER_TEMP:-/tmp}/consult.txt"
          python3 -E -S -m quality.djb.ledger ci-consult "$PUSH_SHA" ${PR_NUMBER:+--pr "$PR_NUMBER"} >"$answer"
          line="$(sed -n 1p "$answer")"
          echo "$line"
          case "$line" in
            "consult: honoured "*)
              run="$(printf '%s\n' "$line" | sed -n 's/.* run=\([0-9][0-9]*\) .*/\1/p')"
              attempt="$(printf '%s\n' "$line" | sed -n 's/.* attempt=\([0-9][0-9]*\) .*/\1/p')"
              tree="$(printf '%s\n' "$line" | sed -n 's/.* tree=\([0-9a-f]\{40\}\)$/\1/p')"
              if [ -z "$run" ] || [ -z "$attempt" ] || [ -z "$tree" ]; then
                echo "::warning::the consult's honour line did not parse — measuring in full"
                exit 0
              fi
              {
                echo "honoured=${run}"
                echo "attempt=${attempt}"
                echo "tree=${tree}"
              } >>"$GITHUB_OUTPUT"
              ;;
            *) echo "  the full matrix runs" ;;
          esac

      - name: Install uv
        # THE LANE'S CLOSURE IS NOT STDLIB: a loop-lane diff under `apps/` is
        # walked through `config.settings.discovery`, which imports Django. A
        # pull request installs what `uv.lock` says before it asks; a push to
        # main asks no lane and installs nothing.
        if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: uv sync --frozen

      - name: the lane — what this change can reach
        id: lane
        # ONE WORD, ASKED, NEVER TYPED HERE: `quality.djb.scope lane` prints
        # `docs`, `loop` or `full` on its first line and why below it — the
        # forced-full paths it saw, what the rows run, and the loop's own scope
        # block. Its exit 2 fails this job, with no fallback, exactly as the
        # listing's does.
        #
        # A PUSH TO MAIN IS `full` and asks nothing: it is graded whole. A pull
        # request is the picker's word whatever its branch is called; only a
        # `full` record vouches for a tree (`ledger.ci_judge`).
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          said="${RUNNER_TEMP:-/tmp}/lane.txt"
          : >"$said"
          if [ "$EVENT" != "pull_request" ] || [ -z "${PR_BASE:-}" ]; then
            echo "full" >"$said"
            echo "  lane:       full — a push to main is graded whole" >>"$said"
          else
            .venv/bin/python -m quality.djb.scope lane --plan --base "$PR_BASE" --head "$(git rev-parse HEAD)" >"$said"
          fi
          cat "$said"
          lane="$(sed -n 1p "$said")"
          case "$lane" in
            docs | loop | full) ;;
            *) echo "::error::the lane picker printed '${lane}' — none of docs, loop, full"; exit 2 ;;
          esac
          echo "lane=$lane" >>"$GITHUB_OUTPUT"
          units="$(sed -n 's/^  units:      //p' "$said")"
          if [ "$lane" = "loop" ] && [ -z "$units" ]; then
            echo "::error::the loop lane printed no units: line — refusing to guess its rows"
            exit 2
          fi
          # THE SELFTEST UNIT'S CLOSURE (`scope.SELFTEST_CLOSURE`): `withheld` on a `full` lane
          # comes with a `units:` line that omits it, honoured below exactly as the loop's is;
          # `narrowed` (CI-THIRD-2) with one naming `selftest:<shards>` and a `plan:` line.
          closure="$(sed -n -E 's/^  [a-z]+:  (ran|narrowed|withheld) — .*/\1/p' "$said")"
          if [ "$closure" != "" ] && [ "$closure" != "ran" ] && [ -z "$units" ]; then
            echo "::error::the closure's unit is ${closure} and no units: line names the rows — refusing to guess"
            exit 2
          fi
          plan="$(sed -n 's/^  plan:       //p' "$said")"
          if [ "$closure" = "narrowed" ] && [ -z "$plan" ]; then
            echo "::error::the closure's unit is narrowed and the lane printed no plan: line — refusing to guess"
            exit 2
          fi
          echo "units=$units" >>"$GITHUB_OUTPUT"
          echo "closure=$closure" >>"$GITHUB_OUTPUT"
          echo "plan=$plan" >>"$GITHUB_OUTPUT"
          # THE APP SUITE'S WORD (CI-THIRD-3): `<unit>: whole|narrowed — why`, one space after
          # the colon; a narrowed unit is marked `<unit>:pr` on the `units:` line.
          pytest="$(sed -n -E 's/^  [a-z0-9-]+: (whole|narrowed) — .*/\1/p' "$said")"
          echo "pytest=$pytest" >>"$GITHUB_OUTPUT"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            { echo "### lane: ${lane}"; echo; echo '```'; cat "$said"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: ask the gate what its units are
        id: units
        # `--list-legs --ci`, THE LISTING'S ONE MODIFIER, AND NOTHING ELSE. It
        # prints the same units in the same order as the bare listing with two
        # answers CI needs and the bare table does not carry: a `shards` column
        # that is a COUNT where the gate can derive one — the selftest count,
        # `ceil(Σ walls / max(heaviest member, 300 s))` over the committed CI
        # walls table the fold harvests — and a FIFTH column, `passes`, which is
        # `1` on the unit that runs the whole suite: CI rows ride one pass and
        # the second whole pass is the nightly's (ADR gate-1, as re-ruled).
        #
        # THE ROWS ARE THE LISTING'S COLUMNS, READ, and nothing in this block
        # names a unit: an INTEGER in `shards` is that many rows `k/<integer>`;
        # `N-capable` is PYTEST_SHARDS rows (the one number this file owns, for
        # the unit whose split has its own table — and for the selftest unit on
        # a tree with no walls table at all, where the listing honestly says
        # "CI must supply the count" rather than inventing one); `0` is one row.
        # Every row carries `passes`. `--passes 1` is legal only beside a
        # `--shard`, so a one-pass mark on an indivisible unit is exit 2 here,
        # never a row the gate would refuse at the leg.
        #
        # STILL A DECLARED GAP: the listing cannot be handed the proposed
        # change's base, so a row carries no `selected=<n>`. The NARROWING is
        # not missing: a `loop`-lane pull request's rows carry `--pr --base`.
        #
        # AND ON A PUSH THE CONSULT'S ANSWER COMES FIRST: a tree a pull
        # request's run already measured green is honoured with an EMPTY
        # matrix, and `legs` is skipped by its own `if:`.
        #
        # AND THE `docs` LANE IS AN EMPTY MATRIX, never asked of the listing:
        # nothing the change touches is read by a row. An unset lane is exit 2.
        env:
          HONOURED: ${{ steps.consult.outputs.honoured }}
          HONOURED_ATTEMPT: ${{ steps.consult.outputs.attempt }}
          HONOURED_TREE: ${{ steps.consult.outputs.tree }}
          LANE: ${{ steps.lane.outputs.lane }}
          UNITS: ${{ steps.lane.outputs.units }}
        run: |
          set -euo pipefail
          echo "critical path: derive → the longest legs row ∥ images → gate-verdict; images-push waits on verdict, off the record's path"
          if [ -n "${HONOURED:-}" ]; then
            echo "matrix=[]" >>"$GITHUB_OUTPUT"
            echo "honoured: tree ${HONOURED_TREE} was measured green by run ${HONOURED} (attempt ${HONOURED_ATTEMPT}) — no row runs, and legs is skipped by its if:"
            exit 0
          fi
          case "${LANE:-}" in
            docs)
              echo "matrix=[]" >>"$GITHUB_OUTPUT"
              echo "lane: docs — no row runs; derive, verdict and gate-verdict are this run"
              exit 0
              ;;
            loop) echo "lane: loop — the lane's units alone, each narrowed by --pr --base: ${UNITS:-}" ;;
            full) echo "lane: full — every row below runs whole${UNITS:+; the units line alone: ${UNITS}}" ;;
            *) echo "::error::no lane reached this step ('${LANE:-}') — refusing to guess one"; exit 2 ;;
          esac
          # The workflow-level `env:` block is exported into every step, so the
          # one hand-typed number is read here rather than copied into a second
          # place that could disagree with it — and refused if it is not one.
          SHARDS="$PYTEST_SHARDS"
          case "$SHARDS" in
            "" | *[!0-9]* | 0*) echo "::error::PYTEST_SHARDS is '${SHARDS}', not a positive count"; exit 2 ;;
          esac
          # REDIRECTED, NEVER PIPED, and OUTSIDE THE CHECKOUT. The gate refuses
          # a piped stdout (it would replace its exit status with the reader's)
          # and the exit status here is the job's.
          listing="${RUNNER_TEMP:-/tmp}/units.tsv"
          ./scripts/check.sh --list-legs --ci >"$listing"
          cat "$listing"
          matrix='[]'
          while IFS=$'\t' read -r unit needs shards _legs passes || [ -n "${unit:-}" ]; do
            [ -n "$unit" ] || continue
            # THE LOOP LANE RUNS ITS OWN UNITS: `quality.djb.scope lane`'s `units:` line names
            # each, and `<unit>:1` is one unsharded row — the selftest unit's harness selection;
            # `<unit>:<n>` is n rows, the narrowed selftest plan's own count (CI-THIRD-2).
            if [ "${LANE:-}" = "loop" ] || [ -n "${UNITS:-}" ]; then
              said_n=""
              for word in ${UNITS:-}; do
                case "$word" in "${unit}:"[1-9]*) said_n="${word#"${unit}:"}" ;; esac
              done
              case " ${UNITS:-} " in
                *" ${unit}:1 "*) shards=0 ;;
                *" ${unit}:"[1-9]*" "*) shards="$said_n" ;;
                *" ${unit}:pr "*) ;;
                *" ${unit} "*) ;;
                *) echo "  skipped: ${unit} — not a unit the ${LANE:-} lane's diff reaches"; continue ;;
              esac
            fi
            case "$shards" in
              0) n=0 ;;
              N-capable) n="$SHARDS" ;;
              "" | *[!0-9]* | 0*) echo "::error::unit '${unit}' has shards '${shards}' — neither 0, N-capable nor a count"; exit 2 ;;
              *) n="$shards" ;;
            esac
            case "$passes" in
              "" | 1) ;;
              *) echo "::error::unit '${unit}' has passes '${passes}' — the listing marks one pass with 1 or nothing"; exit 2 ;;
            esac
            if [ -n "$passes" ] && [ "$n" = "0" ]; then
              echo "::error::unit '${unit}' is marked one pass and the listing says it cannot shard — --passes 1 needs a --shard"
              exit 2
            fi
            if [ "$n" = "0" ]; then
              matrix="$(printf '%s' "$matrix" | jq -c --arg u "$unit" --arg n "$needs" --arg p "$passes" \
                '. + [{unit: $u, needs: $n, shard: "", passes: $p}]')"
            else
              k=1
              while [ "$k" -le "$n" ]; do
                matrix="$(printf '%s' "$matrix" | jq -c --arg u "$unit" --arg n "$needs" --arg s "${k}/${n}" --arg p "$passes" \
                  '. + [{unit: $u, needs: $n, shard: $s, passes: $p}]')"
                k=$((k + 1))
              done
            fi
          done <"$listing"
          if [ "$(printf '%s' "$matrix" | jq -r 'length')" -lt 1 ]; then
            echo "::error::the listing produced no units — refusing to run a gate of nothing"
            exit 2
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          printf '%s' "$matrix" | jq -r '.[] | "  row: \(.unit) \(.shard)\(if .passes != "" then " passes=" + .passes else "" end)"'
          # ONE SEED FOR THE WHOLE RUN, MINTED ONCE HERE. Every shard of one run
          # has to split the SAME collection order — the split is over a
          # collection and the collection order is the seed's — so a seed minted
          # per row would have the N shards splitting N different suites, and
          # their union would be neither the suite nor a partition of it. The
          # gate refuses an unparsable one rather than minting its own.
          seed=$(((RANDOM << 15) | RANDOM))
          echo "seed=$seed" >>"$GITHUB_OUTPUT"
          echo "  seed: $seed (one for every row of this run)"

  legs:
    name: legs (${{ matrix.unit }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    needs: derive
    # SKIPPED ON AN EMPTY MATRIX, which derive emits for exactly one reason —
    # the consult honoured this tree — since a listing of no units is exit 2
    # there. `verdict` tells the two kinds of skipped apart.
    if: needs.derive.outputs.matrix != '[]'
    timeout-minutes: 90
    runs-on: ubuntu-latest

    # ONE ROW PER UNIT, AND THE ROW NEVER DECIDES ANYTHING. Every row runs the
    # SAME setup steps — uv, the derived database name, the stack, the frontend
    # toolchain — whatever its unit needs, and then hands the gate a unit name.
    # A row that skipped the stack because its unit's `needs` said `none` would
    # be YAML acting on a declaration, which is the drift one layer down: the
    # listing's `needs` column is a DECLARATION and the GATE is what refuses a
    # unit whose organ is missing, at the leg. The cost of honouring that is
    # about a minute on the rows that do not need it, paid in parallel. ONE
    # declared exception: Zitadel and Mailpit start only on a row whose `needs`
    # name them — the identity platform's first-instance bootstrap costs more
    # than the rest of the stack together, and the row reads the need from the
    # listing's own column, never from a unit name typed here.
    #
    # `fail-fast: false` IS A CRITERION. The point of splitting is to learn the
    # whole red list in one run; cancelling the siblings of the first red would
    # put a reader back to one failure per run, which is the thing the composed
    # selftest exit was built to end one layer down.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.derive.outputs.matrix) }}

    # THE WORKFLOW'S `contents: read` PLUS `id-token: write` — the one widening,
    # for the stack's ECR Public login (the login steps say why). OIDC mints a
    # per-job AWS identity; nothing durable holds a key.
    permissions:
      contents: read
      id-token: write

    # NO `services:` BLOCK. There was one — postgres:16 and redis:7 as GitHub
    # service containers — and it is gone rather than kept alongside: a service
    # container publishes 5432 on the runner, which is the same port compose
    # publishes, so the two cannot both exist. The header says why the port was
    # never enough. The stack comes up in a step now, from `compose.yaml`.
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate's diff layer asks what a change added, and its self-test
          # refuses to run against a tree it cannot read the git status of.
          # A depth-1 clone answers both questions wrongly — and the base of a
          # proposed change would not resolve at all.
          fetch-depth: 0
          # TAGS ARE NOT COMMITS, and `fetch-depth: 0` does not bring them. The
          # difference is invisible in exactly the direction that matters: a
          # reader asking "what tag does this tree carry" gets the same silence
          # from a runner with no tag objects as from a tree nobody has tagged,
          # so a version claim measured here would be a claim about the
          # CHECKOUT's completeness. The step below prints the count so the
          # answer is falsifiable rather than assumed.
          fetch-tags: true

      - name: this runner's shape, printed
        # WHAT A DRIVE MEETS HERE, SAID OUT LOUD, and it is one line because it
        # is read by a human looking at a red run rather than by a case.
        #
        # THE THREE FACTS, and each of them has cost a cycle. HEAD STATE: on a
        # `pull_request` event `actions/checkout` checks out the merge commit
        # DETACHED and creates no local branch, so a drive that asked git for
        # `main` got exit 1 (loud) or, with `|| true` around it, git's own
        # error-path stdout — THE ARGUMENT — compared as a sha (silent). That
        # is the silent one, and `drive_base_ref` in
        # `scripts/tests/drive_preamble.sh` is
        # the reader it now goes through. THE REFS PRESENT: whether
        # `refs/heads/main` and `refs/remotes/origin/main` are here at all is
        # what that reader falls through, so the log says which one answered.
        # THE TAG COUNT: the tags fetch above is unfalsifiable on a
        # repository with no tags — this template has none — so the count is
        # printed rather than asserted, and a consumer whose origin carries
        # tags reads a non-zero number here the day they adopt it.
        run: |
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
              head_state="attached to $(git symbolic-ref --short HEAD)"
          else
              head_state="DETACHED at $(git rev-parse --short HEAD)"
          fi
          # `if`, not `cmd && var=yes`: this step's shell is `bash -e`, and an
          # AND-list whose left side fails is a failing last command — the step
          # would exit on the very answer it exists to print.
          local_main=no
          if git rev-parse --verify -q refs/heads/main >/dev/null 2>&1; then local_main=yes; fi
          origin_main=no
          if git rev-parse --verify -q refs/remotes/origin/main >/dev/null 2>&1; then origin_main=yes; fi
          echo "runner shape: HEAD ${head_state}; local main: ${local_main}; origin/main: ${origin_main}; tags: $(git tag -l | grep -c . || true)"

      - name: this row's name, for its artifacts
        id: row
        # AN ARTIFACT NAME CANNOT CARRY A `/`, and a shard is `k/N`. So the
        # name is derived here, once, from the two matrix values, and the walls
        # upload below reads it: `member-walls-<unit>` on an indivisible row,
        # `member-walls-<unit>-<k>-of-<N>` on a shard. `scripts/pm_fold.sh`'s
        # walls step downloads every `member-walls*` artifact of a run, so the
        # prefix is the contract and the rest only has to be unique per row.
        env:
          UNIT: ${{ matrix.unit }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          name="member-walls-${UNIT}"
          if [ -n "${SHARD:-}" ]; then
            name="${name}-${SHARD%%/*}-of-${SHARD#*/}"
          fi
          echo "walls_artifact=${name}" >>"$GITHUB_OUTPUT"
          echo "this row's walls artifact: ${name}"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # `--frozen`: CI installs what `uv.lock` says and never re-resolves. A
        # gate that quietly upgraded a dependency would be measuring a tree
        # nobody has.
        run: uv sync --frozen

      - name: the arm64 handler the MinIO mirror needs
        # `compose.yaml` pins MinIO's last public release from the owner's ECR
        # Public mirror, linux/arm64 only; this runner is amd64, so the one
        # arm64 service runs under QEMU — the action the `images` job uses.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: assume an AWS identity for the MinIO pull
        # ECR Public rations ANONYMOUS pulls by data, and a full matrix (about
        # sixteen shards × ~170 MB) exhausts it: `toomanyrequests: Data limit
        # exceeded`. Authenticated pulls are not rationed. The role is the
        # `images` job's, and it must carry the `ecr-public-login` policy
        # (docs/runbooks/deploy.md, step 5b). us-east-1 is not a guess: ECR
        # Public's API lives in that region only. No role variable (a fork, a
        # clone with no AWS account yet) → anonymous, as a laptop pulls — and
        # rationed: a fork's full matrix can still meet `toomanyrequests`.
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: log in to the registry the MinIO pin names
        # `registry-type: public` is `docker login public.ecr.aws` with an ECR
        # Public token, through the action the `images` job already uses. It
        # covers MinIO's pin, and a DJB_STACK_REGISTRY variable naming an ECR
        # Public alias (the template's own repository points it at the mirror
        # `mirror-images.yml` fills). With no role variable this step is
        # skipped and every ECR Public pull is anonymous, rationed by data.
        # `quality/tests/test_bootstrap.py` refuses a compose-up job without it.
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: the stack's registry, the product's choice
        # Every later compose call in this job reads DJB_STACK_REGISTRY from `$GITHUB_ENV`.
        # Order: the repository variable DJB_STACK_REGISTRY (a mirror the repository owns) ·
        # else docker.io logged in with the repository's DOCKERHUB_USERNAME/DOCKERHUB_TOKEN ·
        # else anonymous docker.io, which Docker Hub rate-limits per runner IP.
        env:
          # Pinned empty (house rule 62): choosing a registry needs no cloud credential.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          STACK_REGISTRY: ${{ vars.DJB_STACK_REGISTRY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${STACK_REGISTRY:-}" ]; then
              registry="${STACK_REGISTRY}"
              echo "the stack pulls Docker Hub images from ${registry} (the repository variable DJB_STACK_REGISTRY)"
          elif [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              registry="docker.io"
              printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
              echo "the stack pulls Docker Hub images from docker.io, logged in as ${DOCKERHUB_USERNAME}"
          else
              registry="docker.io"
              echo "::warning::the stack pulls Docker Hub images from docker.io anonymously — Docker Hub rate-limits anonymous pulls per runner IP and a full matrix can meet toomanyrequests; set the repository variable DJB_STACK_REGISTRY or the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets"
          fi
          echo "DJB_STACK_REGISTRY=${registry}" >>"$GITHUB_ENV"

      - name: the stack the gate assumes (docker compose up)
        # THE ENVIRONMENT, from the repository's OWN `compose.yaml` — the same
        # file, the same pinned images and the same published ports a laptop
        # runs, which is the point (see the header). ubuntu-latest ships docker
        # and the compose v2 plugin; the ECR Public login above serves the whole stack.
        #
        # `--wait` is what makes it a precondition rather than a race: every
        # service named here declares a healthcheck in `compose.yaml`, and
        # `--wait` blocks until each reports healthy — so "up" is never mistaken
        # for "ready" and the gate never opens a socket that is still starting.
        # It is also what a fresh Postgres volume needs: the first boot runs
        # initdb and creates POSTGRES_DB before it answers.
        #
        # FIVE, NOT THREE. `zitadel`, `mailpit` and the
        # `observability` profile are still excluded on purpose and the header
        # says why for each; `minio` and `meilisearch` joined here in the same
        # rung that put them in `compose.yaml`, and the header says why for
        # those two as well.
        #
        # ONE CALL, `scripts/ci_stack.sh up` — the recipe this job and the
        # nightly share: it DERIVES this runner's database name through
        # `scripts/db.sh` (refusing, exit 2, on any name of another shape —
        # the own-tree census would otherwise assert over an empty scope and
        # pass), hands it to every later step through `$GITHUB_ENV`, and
        # creates the database under it with the workflow `env:` block's
        # credentials, so the value Django dials and the value the container is
        # created with are one value. That is also what puts the derived
        # database on disk BEFORE the gate runs: `initdb` creates POSTGRES_DB
        # on first boot, which the backup drive and the own-tree census need.
        # An organ that never goes healthy is exit 1 with the diagnostics tail.
        #
        # No teardown step: the runner is ephemeral and is destroyed with the
        # job. A laptop tears down with `deploy/teardown.sh`; here there is
        # nothing to tear down that outlives the next minute.
        env:
          # Pinned empty (house rule 62): `docker compose` pulls with the
          # registry login's docker config, never with the exported keys.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          # A FAILED STEP HERE IS THE ROW'S EXIT: written where the gate step writes its own.
          trap 'rc=$?; [ "$rc" = 0 ] || { mkdir -p "$RUNNER_TEMP/member-walls"; echo "$rc" >"$RUNNER_TEMP/member-walls/rc"; }' EXIT
          ./scripts/ci_stack.sh up db redis temporal minio meilisearch

      - name: the mail catcher, on a row whose unit needs it
        # THE UNIT'S DECLARED NEEDS, read from the row the listing made — never
        # a unit name typed here (the header says why these two are the only
        # conditional services).
        if: contains(format(',{0},', matrix.needs), ',mailpit,')
        env:
          # Pinned empty (house rule 62), as the stack step pins them.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          # A FAILED STEP HERE IS THE ROW'S EXIT: written where the gate step writes its own.
          trap 'rc=$?; [ "$rc" = 0 ] || { mkdir -p "$RUNNER_TEMP/member-walls"; echo "$rc" >"$RUNNER_TEMP/member-walls/rc"; }' EXIT
          ./scripts/ci_stack.sh up mailpit

      - name: the identity platform, its machine credential and the second host
        # ONLY ON A ROW WHOSE UNIT NEEDS ZITADEL. The compose Zitadel writes its
        # machine user's PAT into its bootstrap volume at first-instance
        # creation; `scripts/setup.sh` reads it from there on a laptop, and this
        # step does the same for the drives of this row, masked. The customer
        # host resolves to this runner as it does on a verifier box's image.
        if: contains(format(',{0},', matrix.needs), ',zitadel,')
        env:
          # Pinned empty (house rule 62): reading a volume needs no cloud credential.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -euo pipefail
          # A FAILED STEP HERE IS THE ROW'S EXIT: written where the gate step writes its own.
          trap 'rc=$?; [ "$rc" = 0 ] || { mkdir -p "$RUNNER_TEMP/member-walls"; echo "$rc" >"$RUNNER_TEMP/member-walls/rc"; }' EXIT
          ./scripts/ci_stack.sh up zitadel
          pat_file="$(mktemp "${RUNNER_TEMP}/zitadel-pat.XXXXXX")"
          docker compose cp zitadel:/zitadel/bootstrap/machine.pat "$pat_file"
          pat="$(tr -d '\r\n' <"$pat_file")"
          rm -f "$pat_file"
          [ -n "$pat" ] || { echo "::error::the compose Zitadel's bootstrap volume holds no machine PAT"; exit 2; }
          echo "::add-mask::${pat}"
          # One name per line, so the drive preamble's census of what this job
          # hands the gate step reads both.
          echo "ZITADEL_ISSUER=http://localhost:8081" >>"$GITHUB_ENV"
          echo "ZITADEL_PAT=${pat}" >>"$GITHUB_ENV"
          getent ahosts customer.localhost >/dev/null 2>&1 ||
            echo "127.0.0.1 customer.localhost" | sudo tee -a /etc/hosts >/dev/null
          echo "customer.localhost resolves to: $(getent ahosts customer.localhost | awk 'NR == 1 { print $1 }')"

      - name: the frontend toolchain — pnpm
        # THE VERSION IS READ OUT OF `packageManager`, never typed. That field
        # is the frontend's own declaration and this action honours it, so the
        # pnpm CI runs is the pnpm a laptop runs.
        #
        # BEFORE NODE, AND ON PURPOSE: the node step below caches the pnpm
        # store, and `setup-node` can only find the store of a pnpm that is
        # already on the PATH when it runs.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: the frontend toolchain — node
        # THE TOOLCHAIN SHIPS IN THE SAME COMMIT AS THE TREE IT SERVES, and
        # that is a criterion rather than a convenience. The gate's frontend
        # leg reads a tri-state: **tree absent + toolchain absent** is a printed
        # skip (a Python-only product pays nothing and is never told it is
        # broken); **tree present + toolchain absent** is exit 2 naming it —
        # could-not-look, which outranks a pass everywhere here. So a `frontend/`
        # that merged without these steps would redden CI by construction,
        # and it would redden it in the one way that is hardest to read: an
        # instrument saying it could not look, on a runner nobody is watching.
        #
        # `node-version-file` and NOT a version typed here. `frontend/.nvmrc`
        # names the one interpreter the checkout is proven green on, and a
        # second copy of that number in this file is a second answer to "which
        # Node is this". `engines.node` in `frontend/package.json` is the
        # supported FLOOR, which is a different question and is enforced by
        # pnpm (`engine-strict=true` in `frontend/.npmrc` — without it,
        # `engines` is a comment and a broken pin ships unnoticed for days).
        #
        # THE PNPM STORE IS CACHED, keyed on the lockfile: every row installs
        # (the next step), so every row would otherwise download the same
        # packages. The cache is a download shortcut and nothing else — the
        # install below still resolves every entry against the lockfile, and a
        # cold or evicted cache costs minutes, never a different tree.
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: the frontend toolchain — install (the fe leg's own function)
        # EVERY ROW INSTALLS, WHATEVER ITS UNIT — the same one-setup-for-every-
        # row rule the stack step keeps. A drive under the self-test unit
        # (the golden face copy) type-checks and censuses with this checkout's
        # own `frontend/node_modules`; a runner — like any box — has that
        # directory only where the fe leg's own install has run, and the row
        # that used to make it was the one whose unit carries the fe leg. So
        # the drive passed on every box and could not look on every self-test
        # shard, and no loop could see the difference.
        #
        # NOT A SECOND COPY OF THE LEG. The command is the fe leg's own
        # function, `fe_leg_frozen_lockfile` out of `scripts/fe_gate.sh`,
        # sourced — one source, the frozen-lockfile form — which is also what
        # `scripts/rung_start.sh` runs on a worktree. The VERDICT stays the
        # leg's: this step never fails the row. A lockfile that no longer
        # satisfies the manifest is printed here as a warning and reported by
        # the fe leg as its finding, and a drive that then meets no toolchain
        # says it could not look — both loud, neither decided in YAML.
        #
        # A PRODUCT WITH NO `frontend/` PAYS NOTHING: a printed skip, exit 0.
        env:
          # Pinned empty (house rule 62): an install runs third-party package
          # scripts, and nothing it does needs the MinIO pull's identity.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -uo pipefail
          . ./scripts/fe_gate.sh
          if [ ! -d "$FE_FRONTEND_DIR" ]; then
            echo "no ${FE_FRONTEND_DIR}/ in this tree — nothing to install"
            exit 0
          fi
          rc=0
          fe_leg_frozen_lockfile "$FE_FRONTEND_DIR" || rc=$?
          if [ "$rc" = "0" ]; then
            echo "${FE_FRONTEND_DIR}/node_modules: pnpm install --frozen-lockfile (the fe leg's own form)"
          else
            echo "::warning::pnpm install --frozen-lockfile exited ${rc} in ${FE_FRONTEND_DIR}/ — the fe leg reports it as its finding; a drive that needs the toolchain will say it could not look"
          fi
          exit 0

      - name: the shell the gate's own tests drive — zsh
        # test_db.py drives scripts/db.sh under a real zsh; on a runner with no
        # zsh its cases could not look, and a gate-tests leg would measure exit 2.
        env:
          # Pinned empty (house rule 62): a package install needs no AWS identity.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          command -v zsh >/dev/null 2>&1 || { sudo apt-get update -q && sudo apt-get install -y -q zsh; }
          zsh --version

      - name: the gate, one unit (./scripts/check.sh --leg)
        # THE step. Not piped, not wrapped, not summarised: its exit status is
        # the job's. Which leg failed is printed by the script, with its wall
        # time beside it.
        #
        # THE UNIT NAME IS DATA, NOT A LITERAL. It arrives from the matrix,
        # which came from the listing, which came from the gate. Nothing in this
        # file names a leg or a unit outside a comment, and that is checkable
        # with one grep.
        #
        # `--shard` ONLY WHERE THE LISTING SAID SO — the row carries an empty
        # shard for an indivisible unit, and the gate refuses a shard on one
        # anyway (exit 2, never a smaller run), so the two agree by construction
        # rather than by this file remembering which is which.
        #
        # `--pr --base <sha>` ON A PULL REQUEST AND NEVER ON `main`. A proposed
        # change is graded at the scope of what it can reach; a push to `main`
        # is graded whole, because that is the belt every narrowed run rests on.
        # The variable is empty on a push, which is what makes the branch a
        # property of the event rather than of an `if:` somebody has to keep
        # right.
        #
        # `--passes 1` ONLY WHERE THE ROW CARRIES IT — the listing's `passes`
        # column, on the unit that runs the whole suite.
        #
        # AND ONLY THE `loop` LANE NARROWS: a `full` lane's rows run whole on a
        # pull request too (derive's lane step says why it is full).
        #
        # THE WALLS, WRITTEN BY THE GATE ITSELF: `DJB_MEMBER_WALLS_OUT` names a
        # file OUTSIDE the checkout (the checkout is the measured tree), the
        # selftest leg appends one `member-walls/1` row per member it runs, and
        # the upload step below publishes it. Every row gets the variable; only
        # a unit with members writes to it.
        env:
          UNIT: ${{ matrix.unit }}
          SHARD: ${{ matrix.shard }}
          PASSES: ${{ matrix.passes }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          LANE: ${{ needs.derive.outputs.lane }}
          DJB_GATE_PYTEST_SEED: ${{ needs.derive.outputs.seed }}
          DJB_MEMBER_WALLS_OUT: ${{ runner.temp }}/member-walls/walls.tsv
          # THE SELFTEST PLAN (CI-THIRD-2): the lane's `plan:` line, handed to every row; only
          # the selftest unit's legs read it, and an absent one is the whole unit.
          SELFTEST_PLAN: ${{ needs.derive.outputs.plan }}
          # THE UNITS LINE (CI-THIRD-3): a row whose unit it marks `:pr` is narrowed on a full lane.
          UNITS: ${{ needs.derive.outputs.units }}
          # THE EXPORTED CREDENTIAL, PINNED EMPTY (house rule 62). The AWS login
          # above writes its assumed STS credentials into the job env for every
          # later step; the gate needs no cloud credential at all — the store
          # it dials is the compose MinIO, and `config/settings/test.py` is the
          # one authority for that address and pair. Empty is a pin.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -euo pipefail
          args=()
          [ -z "${SHARD:-}" ] || args+=(--shard "$SHARD")
          [ -z "${PASSES:-}" ] || args+=(--passes "$PASSES")
          narrow=""
          [ "${LANE:-}" != "loop" ] || narrow=1
          case " ${UNITS:-} " in *" ${UNIT}:pr "*) narrow=1 ;; esac
          [ -n "$narrow" ] || PR_BASE=""
          [ -z "${PR_BASE:-}" ] || args+=(--pr --base "$PR_BASE")
          if [ -n "${SELFTEST_PLAN:-}" ]; then
            printf '%s\n' "$SELFTEST_PLAN" >"${RUNNER_TEMP:-/tmp}/selftest_plan.txt"
            export DJB_SELFTEST_PLAN="${RUNNER_TEMP:-/tmp}/selftest_plan.txt"
          fi
          mkdir -p "${DJB_MEMBER_WALLS_OUT%/*}"
          echo "-- ./scripts/check.sh --leg $UNIT ${args[*]-}"
          rc=0
          ./scripts/check.sh --leg "$UNIT" ${args[@]+"${args[@]}"} || rc=$?
          # THE ROW'S OWN EXIT, PUBLISHED: a matrix result says `failure` for a 1
          # and a 2 alike; the verdict jobs read this file to tell them apart.
          echo "$rc" >"${DJB_MEMBER_WALLS_OUT%/*}/rc"
          exit "$rc"

      - name: publish this row's member walls
        # `if: always()`: a red shard's walls are still walls, and the harvest
        # reads only a green, complete run's anyway. Every row publishes its
        # `rc`; a unit with members adds its walls.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.row.outputs.walls_artifact }}
          path: ${{ runner.temp }}/member-walls/
          if-no-files-found: ignore
          retention-days: 14

      - name: the stack, when something failed
        # DIAGNOSTICS, NOT A LEG. It asserts nothing, it can fail nothing, and
        # `if: failure()` means it only ever runs after a step that already
        # decided the job. It exists because the failures this job's new
        # environment can produce — a container that never went healthy, a port
        # already taken on the runner, a Temporal that answered late — are
        # invisible in the gate's own transcript, which reports only that an
        # instrument could not look. `--no-color` because these logs are read
        # in a browser, not a terminal.
        if: failure()
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: ./scripts/ci_stack.sh diagnose db redis temporal

  verdict:
    name: verdict
    needs: [derive, legs]
    # `always()` IS WHAT MAKES THIS A VERDICT RATHER THAN A SUMMARY. Without it
    # a cancelled or failed row would SKIP this job, and a skipped required
    # check is not a red one — it is a check that never reported, which branch
    # protection and a reader both mistake for "nothing to see". A DISPATCH is
    # the one exception: it measured nothing, and a verdict over nothing is red.
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest

    # THE ONE CHECK ANYTHING ELSE MAY DEPEND ON. The rows are a matrix, and a
    # matrix's row names change whenever the listing changes — so a branch
    # protection rule or a downstream `needs:` naming rows would go stale on the
    # day a unit is added, silently, by requiring a check that no longer exists.
    # This job's name is stable, it needs every row, and it is what the
    # repository's required-status-check setting names.
    #
    # THAT SETTING IS NOT IN THIS TREE AND CANNOT BE PROVEN FROM IT. Branch
    # protection lives in the repository's settings; a workflow file cannot
    # assert what is required. The rung that landed this said so in its report
    # and named who must set it.
    #
    # `contents: read` AND NOTHING ELSE. This job used to hold `actions: read`
    # to list the run's jobs for a reader of a red verdict; the two read grants
    # now sit on the consult's job alone, and the run's own page lists its red
    # rows by name.
    permissions:
      contents: read
    # THE LANE, HANDED ON: `images-push` and `local` stand down on the `docs`
    # lane behind this output, so a documentation pull request is derive, verdict
    # and gate-verdict alone.
    outputs:
      lane: ${{ steps.verdict.outputs.lane }}

    steps:
      - name: the rows' own exits
        id: rows
        # EVERY ROW'S `rc`, FROM ITS `member-walls-*` ARTIFACT: a row that exited
        # 2 could not look, and its matrix result reads `failure` all the same.
        # A download that fails is read by the step below as could-not-look.
        if: always() && needs.legs.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: member-walls-*
          path: ${{ runner.temp }}/rows

      - name: the verdict
        id: verdict
        # PASSES IFF DERIVE SUCCEEDED AND THE ROWS EITHER ALL SUCCEEDED OR WERE
        # SKIPPED BECAUSE THE CONSULT HONOURED THIS TREE. A matrix result is
        # `success` only when every row succeeded; `skipped` is two different
        # facts — an honour, which names its run, or nothing having run at all,
        # which is red: a gate of nothing is not a verdict. It is a comparison
        # rather than an implicit `needs:` because `always()` above means this
        # job runs whatever happened.
        env:
          DERIVE_RESULT: ${{ needs.derive.result }}
          LEGS_RESULT: ${{ needs.legs.result }}
          HONOURED: ${{ needs.derive.outputs.honoured }}
          HONOURED_ATTEMPT: ${{ needs.derive.outputs.honoured_attempt }}
          HONOURED_TREE: ${{ needs.derive.outputs.honoured_tree }}
          LANE: ${{ needs.derive.outputs.lane }}
          MATRIX: ${{ needs.derive.outputs.matrix }}
          ROWS_READ: ${{ steps.rows.outcome }}
        # A JOB THE RUNNER NEVER RAN IS THE ROAD'S FAILURE, NOT THE TREE'S: a
        # cancelled job, or rows derive planned and the runner skipped (billing,
        # an outage), is `could not look` and exit 2 — never a red verdict. So
        # is a row whose own exit was 2.
        run: |
          set -euo pipefail
          echo "lane=${LANE:-}" >>"$GITHUB_OUTPUT"
          echo "derive: ${DERIVE_RESULT}"
          echo "lane:   ${LANE:-none}"
          echo "rows:   ${LEGS_RESULT}"
          case "$DERIVE_RESULT" in
          cancelled | skipped)
            echo "::error::could not look: derive did not run (${DERIVE_RESULT} by the runner) — nothing was judged"
            exit 2
            ;;
          esac
          if [ "$LEGS_RESULT" = "cancelled" ]; then
            echo "::error::could not look: legs did not run (cancelled by the runner) — nothing was judged"
            exit 2
          fi
          if [ "$LEGS_RESULT" = "skipped" ] && [ -z "${HONOURED:-}" ] && [ "${LANE:-}" != "docs" ] &&
            [ -n "${MATRIX:-}" ] && [ "${MATRIX}" != "[]" ]; then
            echo "::error::could not look: legs did not run (skipped by the runner with rows planned) — nothing was judged"
            exit 2
          fi
          if [ "${ROWS_READ:-}" = "failure" ]; then
            echo "::error::could not look: the rows' exits would not download — a row's 2 and its 1 cannot be told apart"
            exit 2
          fi
          for rc_file in "${RUNNER_TEMP:-/tmp}"/rows/member-walls-*/rc; do
            [ -f "$rc_file" ] || continue
            if [ "$(tr -d '[:space:]' <"$rc_file")" = "2" ]; then
              row="${rc_file%/rc}"
              row="${row##*/member-walls-}"
              echo "::error::could not look: ${row} could not look (rc=2) — nothing it holds was judged"
              exit 2
            fi
          done
          if [ "$DERIVE_RESULT" != "success" ]; then
            echo "::error::derive did not succeed — the gate did not pass"
            exit 1
          fi
          if [ "$LEGS_RESULT" = "success" ]; then
            echo "ok: every unit of the gate ran and passed"
            exit 0
          fi
          if [ "$LEGS_RESULT" = "skipped" ] && [ -n "${HONOURED:-}" ]; then
            echo "honoured: pull_request run ${HONOURED} for tree ${HONOURED_TREE} — nothing re-measured (attempt ${HONOURED_ATTEMPT})"
            exit 0
          fi
          if [ "$LEGS_RESULT" = "skipped" ] && [ "${LANE:-}" = "docs" ]; then
            echo "ok: the docs lane — no path this change touches is read by a row, and no row ran"
            exit 0
          fi
          if [ "$LEGS_RESULT" = "skipped" ]; then
            echo "::error::no row ran and nothing honoured this tree — a gate of nothing is not a verdict"
            exit 1
          fi
          echo "::error::the gate did not pass — see the red rows on this run's page"
          exit 1

  gate-verdict:
    name: gate-verdict
    # THE RUN'S ONE MEASUREMENT, AS ONE RECORD. `./scripts/pm_push.sh
    # --ci-verdict <run id>` downloads this job's artifact and banks the `ci:`
    # row the pre-push honours, and a push to main's `derive` consults the same
    # record (`ci-consult`) before it measures anything. The grammar, its
    # writer, its reader and every refusal the reader applies live once, in
    # `quality/djb/ledger.py` (`ci_record`, `ci_parse`, `ci_judge`) — this job
    # CALLS the writer (`ci-record`, under the stdlib floor: no `uv sync` here),
    # so a record this job can publish is a record the reader can parse, and a
    # field out of grammar is a red step, not a line.
    #
    # `needs:` EVERY JOB THE RECORD SPEAKS FOR, and `if: always()` for the
    # reason `verdict` carries it: a red or cancelled run must publish the
    # record that SAYS so (`rc=1`), never skip and leave a reader to reach back
    # to an older green. `images` is in it because an image that does not build
    # is a tree that does not ship.
    #
    # WHAT IT NEVER DOES: push, or write anything but the artifact.
    # `contents: read`; the row is written on the PM's machine.
    needs: [derive, legs, images]
    # NOT on a dispatch: it measured nothing, and a record of it would be a red
    # line for a tree nobody measured in this run.
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # THE HEAD COMMIT MUST RESOLVE HERE: on a pull request the checkout
          # is GitHub's merge, and the record names the PR's head beside it —
          # the step warns when the head's measured tree is not the checkout's.
          fetch-depth: 0

      - name: the rows' own exits
        id: rows
        # EVERY ROW'S `rc`, FROM ITS `member-walls-*` ARTIFACT: a row that exited
        # 2 could not look, and its matrix result reads `failure` all the same.
        # A download that fails is read by the step below as could-not-look.
        if: always() && needs.legs.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: member-walls-*
          path: ${{ runner.temp }}/rows

      - name: the record (schema=gate-verdict/1)
        id: record
        # THE TREE IS THE MEASURED TREE — `ledger.measured_tree`, the reduction
        # every ledger row keys on — never `HEAD^{tree}`. On a pull request it
        # is the tree of GitHub's MERGE and `commit=` is the PR's head: when
        # main moved under the PR the two differ and the reader refuses, which
        # is the right answer. `attempt=` is this attempt's, and the artifact's
        # name carries it (`ledger.ci_artifact_name`), so a re-run never leaves a
        # reader holding an older attempt's green.
        #
        # `scope=whole` on the `full` lane — a push or a forced-full pull
        # request — whose rows ran unnarrowed; `pr` on the
        # `loop` and `docs` lanes, whose rows were narrowed or never ran. The
        # lane itself is the record's last field, `lane=<word>`, and the reader
        # honours only `full` (`ledger.ci_judge`). A `docs` run is green when
        # derive was, and no row and no image ran.
        #
        # AN HONOURED PUSH WRITES NO RECORD. Its rows never ran, so it measured
        # nothing; the tree's record is the pull request run's, which the
        # consult already judged. A line here claiming `run=<this run>` would be
        # a record of a measurement that did not happen.
        env:
          DERIVE_RESULT: ${{ needs.derive.result }}
          LEGS_RESULT: ${{ needs.legs.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          MATRIX: ${{ needs.derive.outputs.matrix }}
          HONOURED: ${{ needs.derive.outputs.honoured }}
          HONOURED_ATTEMPT: ${{ needs.derive.outputs.honoured_attempt }}
          HONOURED_TREE: ${{ needs.derive.outputs.honoured_tree }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          LANE: ${{ needs.derive.outputs.lane }}
          CLOSURE: ${{ needs.derive.outputs.closure }}
          PYTEST: ${{ needs.derive.outputs.pytest }}
          ROWS_READ: ${{ steps.rows.outcome }}
        run: |
          set -euo pipefail
          ledger() { python3 -E -S -m quality.djb.ledger "$@"; }
          if [ "${ROWS_READ:-}" = "failure" ]; then
            echo "record: none — the rows' exits would not download; a tree nobody could judge gets no record"
            exit 2
          fi
          for rc_file in "${RUNNER_TEMP:-/tmp}"/rows/member-walls-*/rc; do
            [ -f "$rc_file" ] || continue
            if [ "$(tr -d '[:space:]' <"$rc_file")" = "2" ]; then
              row="${rc_file%/rc}"
              row="${row##*/member-walls-}"
              echo "record: none — ${row} could not look (rc=2); a tree nobody judged gets no record"
              exit 2
            fi
          done
          if [ -n "${HONOURED:-}" ]; then
            echo "record: none — this run measured nothing; tree ${HONOURED_TREE} was honoured from run ${HONOURED} (attempt ${HONOURED_ATTEMPT}), whose record is the verdict"
            exit 0
          fi
          out="${RUNNER_TEMP:-/tmp}/gate-verdict"
          mkdir -p "$out"
          tree="$(ledger measured-tree)"
          rc=1
          if [ "${LANE:-}" = "docs" ]; then
            if [ "$DERIVE_RESULT" = "success" ] && [ "$LEGS_RESULT" = "skipped" ] && [ "$IMAGES_RESULT" = "skipped" ]; then
              rc=0
            fi
          elif [ "$DERIVE_RESULT" = "success" ] && [ "$LEGS_RESULT" = "success" ] && [ "$IMAGES_RESULT" = "success" ]; then
            rc=0
          fi
          # THE SAME TEST THE `legs` ROWS MADE: only the loop lane narrowed.
          lane=(--lane "${LANE:-}")
          [ -z "${CLOSURE:-}" ] || lane+=(--closure "$CLOSURE")
          [ -z "${PYTEST:-}" ] || [ -z "${CLOSURE:-}" ] || lane+=(--pytest "$PYTEST")
          case "${LANE:-}" in
            full) scope=whole ;;
            docs | loop) scope=pr ;;
            *) scope=pr; rc=1; lane=(); echo "::warning::no lane reached the record (derive failed) — recorded red, with no lane field" ;;
          esac
          # THE UNITS THE MATRIX RAN, `/1` where the row was handed one pass —
          # read out of derive's own output, so nothing here names a unit. No
          # matrix (derive failed) is `none` and rc=1: the record still says so.
          legs="$(printf '%s' "${MATRIX:-[]}" | jq -r '[.[] | .unit + (if .passes == "1" then "/1" else "" end)] | unique | join(",")' 2>/dev/null || true)"
          if [ -z "$legs" ]; then
            legs=none
            [ "${LANE:-}" = "docs" ] || rc=1
          fi
          headtree="$(ledger measured-tree-of "$HEAD_SHA" 2>/dev/null || true)"
          if [ "$headtree" != "$tree" ]; then
            echo "::warning::the measured tree ${tree} is not ${HEAD_SHA}'s (${headtree:-unreadable}) — main moved under this pull request; the reader will refuse this record"
          fi
          line="$(ledger ci-record --out "$out" ${lane[@]+"${lane[@]}"} "$HEAD_SHA" "$tree" "$legs" "$PYTEST_SHARDS" "$scope" "$rc" "$RUN_ID" "$RUN_ATTEMPT")"
          echo "artifact=$(ledger ci-artifact-name "$RUN_ATTEMPT")" >>"$GITHUB_OUTPUT"
          echo "$line"
          echo "  lane=${LANE:-none} derive=${DERIVE_RESULT} legs=${LEGS_RESULT} images=${IMAGES_RESULT}"

      - name: publish the record
        # `always()` so a red record is published as surely as a green one;
        # the name is the record step's own (`ci-artifact-name`), handed
        # over only once the record is on disk — so an honoured push, which
        # wrote none, publishes nothing rather than an empty artifact.
        if: always() && steps.record.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: ${{ runner.temp }}/gate-verdict/
          if-no-files-found: error
          retention-days: 14

  local:
    name: local
    # THE PRODUCT'S OWN CI STEPS, AND THERE IS NO SECOND WORKFLOW FILE.
    #
    # WHY IT IS HERE AT ALL. A product that clones this template grows CI work
    # of its own — the first consumer's deploy jobs are the measured case — and
    # the only place to put it was inside THIS file, which is template-owned:
    # every release then re-pays the conflict, and the v2.1.0 fold priced that
    # at 21 conflicts across `scripts/ quality/ .github/`. A `ci.local.yml` was
    # rejected as the fix (team F § 3): GitHub composes nothing, so a second
    # workflow is a second copy of the whole setup — the checkout, the uv
    # install, the database name, the stack — that nothing keeps in step with
    # this one. One optional JOB, reading one optional DIRECTORY, is the
    # smallest thing that is still one workflow.
    #
    # `needs: verdict` IS THE SAME CRITERION `images-push` STANDS ON. Whatever a
    # product does here — a deploy, a publish, a notification — is downstream of
    # the gate's own verdict, so it runs behind it rather than beside it. A
    # product that wants something IN the gate writes a leg
    # (`scripts/local/legs/`), which reaches the matrix through the listing with
    # no edit to this file either.
    #
    # ABSENT, IT COSTS ONE SKIPPED LINE. The template ships no
    # `scripts/local/` path (`publish.sh` § R0), so on this repository's own
    # tree the step prints why it did nothing and exits 0 — printed and never
    # silent, because a job that says nothing is indistinguishable from a job
    # that ran something.
    needs: verdict
    if: needs.verdict.outputs.lane != 'docs'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: the product's own CI steps
        # >>> local-ci >>>
        # EXTRACTED AND RUN BY `scripts/tests/test_drive_preamble.sh` between
        # these sentinels — the `run_registration` idiom one layer over: the
        # block CI ships is the block the case drives, because a copy of this
        # logic in a drive would be a case that passes while the workflow
        # drifts.
        run: |
          set -uo pipefail
          dir=scripts/local/ci
          if [ ! -d "$dir" ]; then
            echo "no ${dir}/ in this tree — this product declares no CI steps of its own (the template never ships one)"
            exit 0
          fi
          # NAME ORDER, AND IT IS THE GLOB'S. A product that wants an order
          # numbers its files, exactly as `fold.d/` and every run-parts
          # directory in this system does. `LC_ALL=C` so the order is the same
          # on every runner rather than the locale's idea of one.
          found=0
          rc=0
          for f in $(LC_ALL=C ls "$dir"/*.sh 2>/dev/null); do
            found=$((found + 1))
            if [ ! -x "$f" ]; then
              echo "::error::${f} is not executable — a CI step this job cannot run is one it would silently skip (chmod +x)"
              exit 2
            fi
            echo "--- ${f}"
            "$f"
            step_rc=$?
            echo "--- ${f}: exit ${step_rc}"
            # THE FIRST NON-ZERO IS THE JOB'S, AND EVERY STEP STILL RUNS. The
            # gate's own selftest leg composes its exit from the whole
            # population for the same reason: one failure per run is the cost
            # this system refuses to keep paying.
            [ "$step_rc" = "0" ] || rc="$step_rc"
          done
          if [ "$found" = "0" ]; then
            echo "${dir}/ exists and holds no *.sh — nothing to run"
            exit 0
          fi
          echo "${found} product CI step(s) ran; exit ${rc}"
          exit "$rc"
        # <<< local-ci <<<

  images:
    name: images
    runs-on: ubuntu-latest

    # THIS JOB IS THE ONLY PLACE THE DEPLOYED IMAGE IS EVER BUILT (ADR deploy-4):
    # one build, `linux/amd64,linux/arm64`, and every environment pulls it.
    #
    # `needs: derive` — the build runs BESIDE the legs, off the record's path.
    # It CANNOT PUSH: its session is the push role narrowed to reads by an
    # inline session policy, and its output is an OCI archive handed to
    # `images-push`, which alone stands behind `verdict` (ADR deploy-4 (b):
    # everything in the registry is green).
    needs: derive
    # THE `docs` LANE BUILDS NO IMAGE: nothing it may touch is in one. The lane
    # is derive's output — a job reads only the jobs it needs. AN HONOURED PUSH
    # BUILDS NOTHING: `legs` skips, so `images-push` skips, so a build is unusable.
    if: needs.derive.outputs.lane != 'docs' && needs.derive.outputs.honoured == ''

    permissions:
      contents: read
      # OIDC, for the read-only session below; no stored registry key exists.
      id-token: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      have: ${{ steps.have.outputs.have }}
      push: ${{ steps.push.outputs.push }}

    steps:
      - uses: actions/checkout@v5

      - name: the tag this tree carries
        # Derived by `deploy/provision.sh image-tag`, the one owner; `-dirty` is refused.
        id: tag
        run: |
          tag="$(./deploy/provision.sh image-tag)"
          echo "tag=$tag"
          case "$tag" in
            untracked|*-dirty|"") echo "::error::image-tag says '$tag' — refusing to build an image whose name is a lie" ; exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # A fork's pull request has no role: it builds (the Dockerfile is proved) and never pushes.
      - name: can this run push
        id: push
        run: |
          if [ -n "${{ vars.AWS_ECR_ROLE_ARN }}" ] && [ -n "${{ vars.DJB_IMAGE_REGISTRY }}" ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::no AWS_ECR_ROLE_ARN / DJB_IMAGE_REGISTRY variable — building without pushing"
            echo "push=false" >>"$GITHUB_OUTPUT"
          fi

      - name: assume the push role, narrowed to reads
        # The session policy intersects the role: ECR reads only, so no step here can push.
        if: steps.push.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          inline-session-policy: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["ecr:GetAuthorizationToken","ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability","ecr:DescribeImages"],"Resource":"*"}]}'

      - name: log in to the registry
        if: steps.push.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: is this tag already in the registry
        # creds: asks ECR, with the read-only session, whether every image is already under this tag
        # A present tag (the bank's build, or an honoured push's pull request) is never rebuilt:
        # two images under one tag is two answers to "what is tree-abc123?". Unreachable reads as
        # absent — the safe direction, and a refusal is printed and warned. EVERY SERVICE OR NONE: `provision.sh image-services` names one artefact.
        id: have
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          set -uo pipefail
          have=false
          if [ "${PUSH:-false}" = "true" ]; then
            have=true
            err="$(mktemp)"
            services="$(./deploy/provision.sh image-services)" || exit 1
            for target in $services; do
              if digest="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG" 2>"$err")"; then
                echo "$target -> $digest"
              else
                have=false
                echo "$target is NOT in the registry under $TAG"
                sed 's/^/  /' "$err"
                if grep -qiE 'denied|not authorized|unauthorized|forbidden|403' "$err"; then
                  echo "::warning::the registry REFUSED the read of $target — building, as for an absent tag; the narrowed session may lack a read"
                fi
              fi
            done
          fi
          if [ "$have" = "true" ]; then
            echo "::notice::$TAG already in the registry — skipped"
          fi
          echo "have=$have" >>"$GITHUB_OUTPUT"

      - name: buildx, with a builder that can do two architectures
        # The `docker-container` driver is what makes two `--platform`s one manifest list.
        uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: build every image service — ONE build, two architectures
        # creds: builds into a local OCI archive; the read-only session it inherits cannot push
        if: steps.have.outputs.have != 'true'
        # The archive is the artefact `images-push` copies byte for byte (`--preserve-digests`).
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/images"
          mkdir -p "$out"
          services="$(./deploy/provision.sh image-services)" || exit 1
          for target in $services; do
            echo "-- $target -> ${out}/${target}.tar"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "$target" \
              --tag "local/djb-${target}:${TAG}" \
              --provenance=false \
              --output "type=oci,dest=${out}/${target}.tar" \
              .
            echo "$target index $(tar -xOf "${out}/${target}.tar" index.json | jq -r '.manifests[0].digest')"
          done
          ls -l "$out"

      - name: the images run as a non-root user
        # creds: reads the local OCI archives only; the read-only session it inherits cannot push
        # Read off the archive `images-push` copies, both architectures: the USER line a refactor loses.
        if: steps.have.outputs.have != 'true'
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { echo "::error::no skopeo on this runner — the archive's USER cannot be read"; exit 1; }
          services="$(./deploy/provision.sh image-services)" || exit 1
          for target in $services; do
            archive="${RUNNER_TEMP}/images/${target}.tar"
            for arch in amd64 arm64; do
              user="$(skopeo inspect --config --override-os linux --override-arch "$arch" "oci-archive:${archive}" | jq -r '.config.User // ""')"
              echo "$target linux/$arch USER '${user}'"
              case "${user%%:*}" in
                "" | root | 0) echo "::error::$target linux/$arch runs as '${user:-root}' — the image lost its USER line"; exit 1 ;;
              esac
            done
          done

      - name: scan every built image before anything can push it
        # A CRITICAL with a fix fails this job, so `images-push` never runs (ADR deploy-4 (b)).
        if: steps.have.outputs.have != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -uo pipefail
          ./deploy/image_scan.sh --install "${RUNNER_TEMP}/trivy" || exit 2
          export PATH="${RUNNER_TEMP}/trivy:${PATH}"
          mkdir -p "${RUNNER_TEMP}/sbom"
          services="$(./deploy/provision.sh image-services)" || exit 1
          worst=0
          for target in $services; do
            archive="${RUNNER_TEMP}/images/${target}.tar"
            rc=0
            ./deploy/image_scan.sh "$archive" --sbom "${RUNNER_TEMP}/sbom/sbom-${target}-${TAG}.cdx.json" || rc=$?
            echo "$target scan exit $rc"
            [ "$rc" -le "$worst" ] || worst=$rc
          done
          exit "$worst"

      - name: the SBOM of every built image
        if: always() && steps.have.outputs.have != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: warn
          overwrite: true

      - name: hand the archive to the push
        if: steps.push.outputs.push == 'true' && steps.have.outputs.have != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}/images/
          if-no-files-found: error
          # One name for every attempt: a `--failed` rerun keeps attempt 1's build, and a rebuild replaces it.
          overwrite: true
          compression-level: 0
          retention-days: 1

  images-push:
    name: images-push
    # NOTHING IS PUSHED OFF A RED TREE: `needs: [images, verdict]` under the
    # default `success()`, so a red row, a red build or a failed derive skips
    # it. It builds nothing — it copies the archive `images` built, digests
    # preserved, so the registry holds the bytes the build proved.
    needs: [images, verdict]
    # THE `docs` LANE PUSHES NOTHING; the lane is verdict's output.
    if: needs.verdict.outputs.lane != 'docs'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      # The provenance attestation of every pushed digest.
      attestations: write

    steps:
      - name: is there anything to push
        id: todo
        env:
          PUSH: ${{ needs.images.outputs.push }}
          HAVE: ${{ needs.images.outputs.have }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          if [ "$PUSH" != "true" ]; then
            echo "::notice::no registry coordinates — nothing to push"
            echo "push=false" >>"$GITHUB_OUTPUT"
          elif [ "$HAVE" = "true" ]; then
            echo "::notice::$TAG already in the registry — nothing to push"
            echo "push=false" >>"$GITHUB_OUTPUT"
          else
            echo "push=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.todo.outputs.push == 'true'

      - name: the archive the build made
        if: steps.todo.outputs.push == 'true'
        uses: actions/download-artifact@v4
        with:
          name: images
          path: ${{ runner.temp }}/images

      - name: assume the push role
        if: steps.todo.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: log in to the registry
        if: steps.todo.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: push the built archive under the tree tag
        # creds: copies the built OCI archives into ECR with the push role
        # `--preserve-digests` refuses rather than re-encode: the pushed index IS the built one.
        # The tags are immutable and name a TREE, the image's identity: a tag already present is skipped,
        # whatever digest it holds — the first push wins and a rerun's rebuild (not byte-reproducible) is
        # not re-pushed. Another tree's build under this tag cannot happen: the tag is derived from the tree.
        if: steps.todo.outputs.push == 'true'
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { echo "::error::no skopeo on this runner — the archive cannot be copied"; exit 1; }
          services="$(./deploy/provision.sh image-services)" || exit 1
          for target in $services; do
            archive="${RUNNER_TEMP}/images/${target}.tar"
            ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
            built="$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest')"
            if present="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG" 2>/dev/null)"; then
              if [ "$present" = "$built" ]; then
                echo "$ref already holds the built ${built} — nothing to push"
                continue
              fi
              echo "${TAG} already pushed (${present}) — this rerun's build is not re-pushed (built ${built})"
              continue
            fi
            echo "-- $target ${built} -> $ref"
            skopeo copy --all --preserve-digests --retry-times 3 \
              --dest-authfile "${HOME}/.docker/config.json" \
              "oci-archive:${archive}" "docker://${ref}"
            pushed="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG")"
            echo "$ref -> $pushed"
            [ "$pushed" = "$built" ] || { echo "::error::$ref is $pushed, not the built $built"; exit 1; }
          done

      - name: the manifest carries BOTH architectures
        # creds: reads the pushed index and its digest back from ECR with the push role
        # Read back OUT OF THE REGISTRY, because the registry is what the box will pull.
        if: steps.todo.outputs.push == 'true'
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          services="$(./deploy/provision.sh image-services)" || exit 1
          for target in $services; do
            ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
            platforms="$(docker buildx imagetools inspect --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' "$ref")"
            echo "$ref -> $platforms"
            case "$platforms" in *linux/amd64*) ;; *) echo "::error::$ref has no linux/amd64" ; exit 1 ;; esac
            case "$platforms" in *linux/arm64*) ;; *) echo "::error::$ref has no linux/arm64" ; exit 1 ;; esac
            digest="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG")"
            echo "$ref -> $digest"
          done

      - name: the digests this push attests
        # creds: reads each pushed digest back from ECR with the push role
        if: steps.todo.outputs.push == 'true'
        env:
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          services="$(./deploy/provision.sh image-services)" || exit 1
          : >"${RUNNER_TEMP}/subjects.txt"
          for target in $services; do
            ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
            digest="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG")"
            printf '%s  %s\n' "${digest#sha256:}" "${ref%:*}" >>"${RUNNER_TEMP}/subjects.txt"
          done
          cat "${RUNNER_TEMP}/subjects.txt"

      - name: attest the build's provenance for every pushed digest
        id: attest
        if: steps.todo.outputs.push == 'true'
        # The next step judges the outcome: a private repository off GitHub Enterprise Cloud cannot hold an attestation.
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      - name: the attestation landed, or the repository says why it cannot
        if: steps.todo.outputs.push == 'true'
        env:
          OUTCOME: ${{ steps.attest.outcome }}
          PRIVATE: ${{ github.event.repository.private }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          case "$OUTCOME/$PRIVATE" in
            success/*) echo "provenance attested for every pushed digest" ;;
            */true) echo "::warning::the provenance attestation failed on a private repository — attestations need a public repository or GitHub Enterprise Cloud; the push stands unattested" ;;
            *) echo "::error::the provenance attestation failed ($OUTCOME) on a public repository"; exit 1 ;;
          esac

  deploy-staging:
    name: deploy-staging
    # A MERGE TO MAIN GOES TO STAGING, BY THE ONE DEPLOY SCRIPT. `deploy/
    # stage.sh` is what a laptop runs; this job adds a trigger and a credential
    # and nothing else (ADR deploy-4 (f): promotion is neither a re-tag nor a
    # rebuild). `needs: [verdict, images-push]` — a tree the gate has not passed
    # has no image, and an image that was not pushed is nothing to pull. On an
    # honoured push the rows never ran, `verdict` says so green, and `images`
    # finds the tag already pushed: this job then deploys the tree that pull
    # request measured.
    #
    # IT SKIPS WITH A NOTICE, NEVER A RED, when the product's variables name no
    # stage box (`DJB_STAGE_TARGET`) or no deploy role (`AWS_DEPLOY_ROLE_ARN`):
    # a clone of the template with no box stays green, and the notice says
    # which variable is missing. The variables and the role's trust are
    # `docs/runbooks/deploy.md` § "Deploying from CI". A job-level `if:` on the
    # variables would skip silently, so the first STEP decides and every later
    # step asks its answer.
    #
    # NO GITHUB ENVIRONMENT IS DECLARED. A job with `environment: <name>` is
    # issued an OIDC token whose `sub` is `repo:<owner>/<repo>:environment:
    # <name>`, and the deploy role's trust admits `…:ref:refs/heads/main`; a
    # product that adds an environment (for its protection rules) adds that
    # `…:environment:<name>` subject to the trust in the same change.
    needs: [verdict, images-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One staging deploy at a time; a newer merge's deploy waits, never
    # cancels a deploy mid-act.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: is there a stage to deploy to
        id: target
        env:
          TARGET: ${{ vars.DJB_STAGE_TARGET }}
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "${TARGET:-}" ] || missing="${missing} DJB_STAGE_TARGET"
          [ -n "${ROLE:-}" ] || missing="${missing} AWS_DEPLOY_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::notice::deploy-staging skipped — this repository sets no${missing} variable, so there is no stage box to deploy to (docs/runbooks/deploy.md § Deploying from CI names them)"
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stage target: ${TARGET}"
          echo "deploy=true" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.target.outputs.deploy == 'true'
        with:
          # THE WHOLE HISTORY: stage.sh diffs the tree the box holds against
          # this one to key its acts, and that older tree must be here.
          fetch-depth: 0

      - name: assume the deploy role
        if: steps.target.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: stage this tree (deploy/stage.sh --env staging)
        id: stage
        if: steps.target.outputs.deploy == 'true'
        # creds: stage.sh asks the registry for this tree's digests with the deploy role before any act
        #
        # WHAT THIS STEP ASSUMES, SAID BECAUSE IT IS NOT BUILT: `stage.sh`
        # reaches the box over PLAIN SSH, as `DJB_STAGE_TARGET` names it, and a
        # hosted runner holds no key for it — the runner-to-box transport
        # (Session Manager with an ephemeral key, scoped by the box's
        # `Project=<namespace>` tag) is a proposal in the runbook, not a road.
        # Until a product builds that road, a product that sets the variables
        # gets a red step naming the ssh refusal, which is the honest answer.
        #
        # THE EXIT STATUS IS stage.sh's (0 live or nothing to deploy · 1 an
        # act ran and failed · 2 refused, nothing touched). Its output goes to
        # a file and is printed whole — redirected, never piped — so the
        # closing line `stage: <tag> live in <n>s (migrate <m>s)` can be
        # carried onto the one `stage-verdict:` line this job ends on.
        env:
          TARGET: ${{ vars.DJB_STAGE_TARGET }}
          DJB_DEPLOY_NAMESPACE: ${{ vars.DJB_DEPLOY_NAMESPACE }}
          DJB_IMAGE_REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/stage-staging.log"
          rc=0
          ./deploy/stage.sh "$TARGET" --env staging >"$log" 2>&1 || rc=$?
          cat "$log"
          closing="$(awk '/^stage: tree-[0-9a-f]+ live in [0-9]+s / { l = $0 } END { print l }' "$log")"
          verdict="stage-verdict: rc=${rc} ${closing:-no closing line — nothing went live (a refusal, a failed act, or a docs-only delta)}"
          echo "$verdict"
          [ -z "${GITHUB_STEP_SUMMARY:-}" ] || echo "$verdict" >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  deploy-prod:
    name: deploy-prod
    # STAGING'S TREE TO PROD, BY DISPATCH, BY THE SAME SCRIPT. `deploy/stage.sh
    # --env prod` holds the four teeth — the sanction's `<who>: <why>` shape,
    # staging's `LIVE` marker naming this tree (written only after staging's
    # own readyz answered, never at the ship), staging's readyz answering 200,
    # and the nightly leak proof green and no older than 24 h — and refuses
    # (exit 2, nothing touched) naming every red one. This job only hands it
    # the inputs: the tree staging HOLDS checked out (a docs-only merge leaves
    # staging on an older tree than main's head, so the dispatch ref's head is
    # the wrong tree), and the latest `nightly-leak-proof` artifact downloaded.
    #
    # NO `needs:`: the gate's jobs stand down on a dispatch (see `on:`), and
    # the tree was measured on its way to staging. THE REGISTRY TAG IS THE
    # RECORD: CI tags no tree its verdict did not pass (ADR deploy-4 (b)), and
    # stage.sh refuses a tree whose image the registry lacks. And the teeth
    # that run are the PROMOTED TREE'S OWN stage.sh — the checkout below is
    # that tree — so a tree older than the prod gate fails safe, refusing the
    # unknown `--sanction` flag.
    #
    # ITS GRANTS: `contents: read`, `id-token: write` for the deploy role, and
    # `actions: read` for ONE reason — downloading the nightly-proof run's
    # artifact with the job's own token. No secret is read.
    #
    # NO GITHUB ENVIRONMENT IS DECLARED, and deploy-staging's paragraph is the
    # whole argument: a product that wants an environment's reviewers on prod
    # adds `environment: <name>` HERE and the `…:environment:<name>` subject to
    # the deploy role's trust in the same change, or the role refuses the job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: is there a prod to promote to
        id: target
        # A DISPATCH IS A REQUEST, SO AN UNSET VARIABLE IS A REFUSAL, NOT A
        # SKIP: somebody asked for prod, and a green run that promoted nothing
        # would read as done. And prod is promoted from main's own workflow —
        # the deploy role's trust names that ref, and a branch's copy of this
        # file is not the one that was reviewed.
        env:
          PROD: ${{ vars.DJB_PROD_TARGET }}
          STAGE: ${{ vars.DJB_STAGE_TARGET }}
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          missing=""
          [ -n "${PROD:-}" ] || missing="${missing} DJB_PROD_TARGET"
          [ -n "${STAGE:-}" ] || missing="${missing} DJB_STAGE_TARGET"
          [ -n "${ROLE:-}" ] || missing="${missing} AWS_DEPLOY_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::deploy-prod refused — this repository sets no${missing} variable (docs/runbooks/deploy.md § Deploying from CI); nothing was promoted"
            exit 2
          fi
          if [ "${REF:-}" != "refs/heads/main" ]; then
            echo "::error::deploy-prod refused — dispatched from ${REF:-<no ref>}; prod is promoted from main's workflow only; nothing was promoted"
            exit 2
          fi
          echo "prod target: ${PROD}   (staging read from ${STAGE})"

      - uses: actions/checkout@v5
        with:
          # THE WHOLE HISTORY: the tree staging holds is usually not the head,
          # and stage.sh diffs the prod box's tree against it.
          fetch-depth: 0

      - name: the tree staging holds, checked out
        id: tree
        # THE INPUT IS OPERATOR TEXT, so it is read from env and judged before
        # it touches git: `tree-<12..40 hex>` or the bare hex, nothing else.
        # The newest commit on origin/main whose tree begins with it is checked
        # out — any commit carrying that tree carries the same bytes — and the
        # tag `deploy/provision.sh image-tag` derives from the checkout must be
        # the tag asked for. A tree main never held is a refusal: prod takes
        # only what reached main.
        env:
          TREE: ${{ inputs.tree }}
        run: |
          set -euo pipefail
          want="${TREE#tree-}"
          case "$want" in
            "" | *[!0-9a-f]*)
              # The refusal does not echo the input: operator text on a
              # `::error::` line could carry a newline and a second command.
              echo "::error::the tree input is not tree-<hex> (${#TREE} characters) — line 1 of staging's TREE marker; nothing was promoted"
              exit 2
              ;;
          esac
          if [ "${#want}" -lt 12 ] || [ "${#want}" -gt 40 ]; then
            echo "::error::the tree input tree-${want} carries ${#want} hex digits; a tree tag carries 12 (up to 40 accepted); nothing was promoted"
            exit 2
          fi
          trees="${RUNNER_TEMP:-/tmp}/main-trees.txt"
          git log --format='%H %T' refs/remotes/origin/main >"$trees"
          commit="$(awk -v w="$want" 'index($2, w) == 1 { print $1; exit }' "$trees")"
          if [ -z "$commit" ]; then
            echo "::error::no commit on origin/main carries tree ${want} — prod promotes only a tree main held; nothing was promoted"
            exit 2
          fi
          git checkout -q --detach "$commit"
          tag="$(./deploy/provision.sh image-tag)"
          if [ "$tag" != "tree-${want:0:12}" ]; then
            echo "::error::checked out ${commit}, whose tag reads '${tag}', not tree-${want:0:12}; nothing was promoted"
            exit 2
          fi
          echo "promoting ${tag} — commit ${commit}"
          echo "tag=${tag}" >>"$GITHUB_OUTPUT"
          echo "commit=${commit}" >>"$GITHUB_OUTPUT"

      - name: the latest nightly leak proof (nightly-leak-proof)
        id: nightly
        # THE NEWEST COMPLETED `nightly-proof.yml` RUN ON MAIN, whatever its
        # conclusion — a red or stale night is for stage.sh's tooth to refuse
        # BY NAME, never for this step to hide by picking an older green one.
        # No completed run → an empty directory argument, which the tooth
        # reads as `nightly:none`; an artifact that will not download (it
        # expires after 14 days) → an empty directory, which it reads as
        # unreadable. GitHub not answering is exit 2 here: could not look.
        # A product tree (stage.sh's one grep of its drawer) has no nightly to ask for.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          dir="${RUNNER_TEMP:-/tmp}/nightly-leak-proof"
          rm -rf "$dir"
          if grep -Eq "^[[:space:]{]*rule_id_namespace:[[:space:]]*([\"']?[^[:space:]\"'#]|$)" quality/local/rules.yaml 2>/dev/null; then
            echo "nightly: a product tree — the platform's nightly leak proof is the template's; stage.sh reads the product's own gate"
            echo "dir=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! run="$(gh run list --workflow nightly-proof.yml --branch main --status completed --limit 1 --json databaseId --jq '.[0].databaseId // ""')"; then
            echo "::error::could not ask GitHub for the latest nightly-proof run — the nightly tooth cannot be read; nothing was promoted"
            exit 2
          fi
          if [ -z "$run" ]; then
            echo "nightly: no completed nightly-proof run on main — handed on as none"
            echo "dir=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$dir"
          if ! gh run download "$run" --name nightly-leak-proof --dir "$dir"; then
            echo "::warning::run ${run}'s nightly-leak-proof artifact would not download — handed on empty, which the tooth refuses as unreadable"
          fi
          echo "nightly: run ${run} -> ${dir}"
          echo "dir=${dir}" >>"$GITHUB_OUTPUT"

      - name: assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: promote the tree staging holds (deploy/stage.sh --env prod)
        id: promote
        # creds: stage.sh asks the registry for the promoted tree's digests with the deploy role before any act
        #
        # THE SAME TRANSPORT ASSUMPTION AS deploy-staging's stage step: plain
        # ssh to both boxes, which a hosted runner cannot make until a product
        # builds the road. The staging box is only READ (its TREE and its
        # readyz); every red tooth is named in one exit-2 refusal before the
        # prod box is contacted.
        env:
          PROD: ${{ vars.DJB_PROD_TARGET }}
          STAGE: ${{ vars.DJB_STAGE_TARGET }}
          SANCTION: ${{ inputs.sanction }}
          NIGHTLY_DIR: ${{ steps.nightly.outputs.dir }}
          DJB_DEPLOY_NAMESPACE: ${{ vars.DJB_DEPLOY_NAMESPACE }}
          DJB_IMAGE_REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/stage-prod.log"
          rc=0
          ./deploy/stage.sh "$PROD" --env prod --sanction "$SANCTION" --staging "$STAGE" --nightly "$NIGHTLY_DIR" >"$log" 2>&1 || rc=$?
          cat "$log"
          closing="$(awk '/^stage: tree-[0-9a-f]+ live in [0-9]+s / { l = $0 } END { print l }' "$log")"
          verdict="stage-verdict: rc=${rc} ${closing:-no closing line — nothing went live (a refusal, a failed act, or a docs-only delta)}"
          echo "$verdict"
          [ -z "${GITHUB_STEP_SUMMARY:-}" ] || echo "$verdict" >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"
