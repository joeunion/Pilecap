# The gate, run by GitHub Actions on every pull request and every push to main.
#
# **CI does not have its own list of legs. CI ASKS THE GATE FOR THE LIST**
# (`./scripts/check.sh --list-legs`) **and runs each unit with `--leg`. The only
# number CI owns is how many runners split the suite.** That is the same
# doctrine this file has always carried, one turn further out: it used to spell
# the legs by hand and quietly omitted the house-rules engine entirely, so
# twenty-four rules and every canary self-test never ran on a pull request and
# CI-green did not mean gate-green. Then it ran the whole gate in one step,
# which could not drift but also could not be split. Now the gate publishes its
# own units and this file expands them — so there is still nothing here to keep
# in sync, and a leg that joins the gate joins CI on the same commit.
#
# The one hand-typed number is `PYTEST_SHARDS` in the `env:` block below, and it
# names what re-derives it in its own comment.
#
# What the units cover is not written here either, for the same reason: run
# `./scripts/check.sh --list-legs` and read the `composed-of` column.
# `scripts/check.sh` is the authority on that list; `docs/product/architecture.md`
# — "The gate" — is what it answers to; `docs/product/build-contract.md` carries
# a copy of the table that a drive compares against the command, line for line.
#
# Exit codes carry through: 0 clean · 1 violations · **2 enforcement broken**,
# which outranks any pass. Nothing is piped, here or in the script — a pipe
# replaces the exit status of the thing you meant to trust with the exit status
# of the last command in the pipe.
#
# **AND CI DOES NOT HAVE ITS OWN ENVIRONMENT EITHER. CI BRINGS UP THE STACK THE
# GATE ASSUMES** — `docker compose up -d --wait`, this repository's own
# `compose.yaml`, the same file a laptop runs. That is the same sentence as the
# one above, one layer down: a hand-built CI environment that *resembles* the
# gate's is a second description of the stack, and a second description drifts.
#
# It drifted. This job used to publish GitHub SERVICE CONTAINERS for
# Postgres and Redis — a port on localhost, which is everything a Django
# process needs and is exactly why it read as correct. But half the gate does
# not reach Postgres over a port. `scripts/db.sh` runs `docker compose exec -T
# db psql` and `scripts/lifecycle.sh` runs `docker compose exec -T temporal
# temporal`, deliberately: there is no `psql` and no `temporal` CLI on the host,
# and a Homebrew one would be whatever major somebody installed. A service
# container is not a compose service, so `docker compose exec db` finds no such
# service — and the instruments that ask it say COULD NOT LOOK, exit 2, which
# outranks a pass and is the correct answer. There was no Temporal here at all.
#
# TWO LEGS NEED THE STACK AND NOT THE PORT, and they are the two the gate runs
# last before `full-house-rules` — with a third, `pytest-x2`, needing only the
# database:
#
#   pytest-x2         the port. Already met; now met by the compose db, which
#                     is Postgres 18 as the laptop and RDS are (ADR deploy-1),
#                     rather than the 16 this file used to publish on its own.
#   own-tree-census   `scripts/sweep.sh` — compose `db` AND compose `temporal`.
#   selftest          BOTH shell refusal drives live in this leg:
#                     `scripts/tests/test_backup_restore.sh` needs compose `db`
#                     (`backup.sh` dumps with the pg_dump INSIDE the container),
#                     `scripts/tests/test_sweep.sh` needs `db` AND `temporal`.
#
# `own-tree-census` runs BEFORE `selftest`, so it is the first leg that would
# have gone red, not the drives themselves — both answer to the same
# `docker compose exec`.
#
# WHAT IS DELIBERATELY NOT STARTED, and why, because "start the stack" must not
# quietly mean "start everything":
#
#   * zitadel — `config/settings/test.py` pins ZITADEL_ISSUER at 127.0.0.1:1 and
#     the PAT empty (the suite must not dial), and no gate leg touches identity;
#     `manage.py zitadel_audit` is an operator's drift tripwire, not a leg. Its
#     first-instance bootstrap on an empty database also costs more than every
#     other service here put together.
#   * mailpit — `config/settings/test.py` uses the locmem email backend, so
#     nothing in the gate opens an SMTP socket. (On a laptop it IS the contract;
#     `scripts/setup.sh` starts it there for that reason. Here it would be a
#     container nothing connects to.)
#   * the `observability` profile (otel-collector, clickstack) — `compose.yaml`
#     says "in CI never" in as many words, and a profile is not started by a
#     bare `up` in any case.
#   * `deploy/compose.yaml` — the deployment stack. The backup/restore drive
#     drives `--stack`'s REFUSALS and declares the real `--stack` dump out of
#     its own scope; bringing that stack up would be this file inventing a leg.
#
# `redis` IS started even though the suite runs LocMemCache and the in-memory
# channel layer today: the `env:` block below advertises REDIS_URL and CACHE_URL
# to every step, and an advertised address that answers nothing is a lie waiting
# for the first test that reads a real cache. One small container keeps the
# environment the one the settings describe.
#
# `minio` AND `meilisearch` ARE STARTED, and by the same argument one step
# further out. Nothing in the gate dials either one *today* — the ingredients
# that will are `apps/files` and `apps/search`, which land in the rungs
# immediately after this one. They are started here
# rather than by those rungs because `compose.yaml` and this file are the two
# shared files the whole cycle was shaped to have exactly one writer for: the
# alternative is two more rungs editing this list, which is the collision the
# batching exists to prevent. The cost is two small containers on an ephemeral
# runner; the thing bought is that the first rung whose tests need a bucket or
# an index finds one already there.
#
# `minio` is AGPL-3.0 and is a container CI runs, never code the product links
# or ships — the disposition is recorded on the service in `compose.yaml`,
# where the choice is made. House rule 23's licence leg reads Python
# distributions and cannot see a compose image.
#
# EVERYTHING THE GATE DOES, THE GATE DOES. There used to be one exception — a
# step that built the production static manifest, kept here and named as "the
# one candidate to fold into `check.sh` later". It is folded: it is a leg now,
# in the `static` unit. Once CI runs UNITS, a step conditioned on which unit is
# running would be CI typing a leg name, which is the one thing the paragraph at
# the top of this file refuses.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A pull request that gets three pushes in five minutes should measure the last
# tree, not all three. `main` is never cancelled: a push to main is a tree
# somebody will cherry-pick from.
concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Matches `.python-version` and the `requires-python` floor in pyproject.
  PYTHON_VERSION: "3.12"
  # THE ONE NUMBER THIS FILE OWNS, AND IT NAMES WHAT RE-DERIVES IT. How many
  # runners a shardable unit is split across. Derived from the measurement, not
  # chosen: pass 1 of the two-pass suite was 405 s on run 34748528964 at `-n 2`,
  # so one runner's wall for a sharded unit is about
  # `T(N) ≈ 2 × 405 × 1.1 / N + 150 s` — the two passes, a tenth for the split's
  # imbalance, plus the runner's own ~150 s of checkout, uv and stack. Three is
  # where that curve stops paying: N=3 is ~450 s, N=4 is ~370 s for a third more
  # billed minutes. RE-DERIVE IT when the full gate's sharded unit's wall moves
  # more than 20% from that 405 s, which is the trigger and the only one.
  PYTEST_SHARDS: "3"
  # THE COMPOSE STACK'S ADDRESS AND CREDENTIALS, AND THEY ARE THE SOURCE, NOT A
  # COPY: the "start the stack" step below passes the two credentials straight
  # into compose as POSTGRES_USER / POSTGRES_PASSWORD, so the value Django dials
  # and the value the container is created with cannot drift apart the way two
  # hand-kept lists do. `compose.yaml`'s own `${...:-djb}` defaults are then
  # never relied on here. POSTGRES_DB is the third and it is NOT here — it comes
  # from the derivation step, for the reason written where DATABASE_NAME used to
  # be pinned.
  #
  # (The sentence this replaces claimed the checked-in defaults in
  # `config/settings/base.py` made an override unnecessary. Half true and now
  # false: DATABASE_NAME's default there is the empty string — it MUST be set,
  # and it is set by `scripts/db.sh` in both places now, on a laptop and here.
  # Booked as stale in `docs/product/queue.md`; closed in passing.)
  #
  # Postgres always — never SQLite, in CI as on a laptop, because the
  # Postgres-specific fields, constraints and query behaviour are part of the
  # contract.
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"
  # DATABASE_NAME IS DELIBERATELY ABSENT FROM THIS BLOCK. It is DERIVED, by the
  # step below, by invoking `scripts/db.sh` — the same function a laptop runs.
  #
  # (The sentence this replaces read "A NAME, NOT A DERIVATION", pinned
  # `djb_main`, and argued that an ephemeral runner with one checkout makes the
  # pin honest. The pin is honest about isolation and DISHONEST about the
  # census. `scripts/check.sh`'s own-tree-census leg narrows every verdict with
  # `--only "$DATABASE_NAME"`, and `scripts/sweep.sh` only reasons about names
  # of the derived shape `djb_<branch>_<8 hex>` — `lc_derived_shape`
  # (`scripts/lifecycle.sh`) refuses anything else, and a refused name is
  # printed but never classified, so it can never be UNRECOGNIZED and can never
  # redden the leg. `djb_main` fails that test. Which means the census leg on
  # every CI run so far asserted its two properties over an EMPTY SCOPE and
  # reported clean: a green that vouched for nothing, in the one environment
  # where nobody is watching the machine afterwards.)
  DATABASE_USER: djb
  DATABASE_PASSWORD: djb  # pragma: allowlist secret — the published compose password, refused in production by config.settings.guards
  REDIS_URL: redis://127.0.0.1:6379/0
  CACHE_URL: redis://127.0.0.1:6379/1
  # THE COMPOSE MinIO'S ADDRESS AND CREDENTIALS — the app side of the pair, and
  # here for exactly the reason REDIS_URL is: the step below starts `minio`, and
  # an object store the gate's own environment never names is a store the
  # storage tests cannot dial. They could not dial it. Run 34748528964 ended
  # `27 failed, 3283 passed, 9 skipped, 110 errors in 404.97s`, and all 110
  # errors were `botocore.exceptions.NoCredentialsError` — out of
  # `apps/files/tests/{test_api,test_workflows,test_doors_over_the_wire,
  # test_presign_matrix,test_integrations}.py` and
  # `apps/exports/tests/test_workflows.py` — boto3 finding no credentials
  # anywhere, in the one environment that had a healthy MinIO on 9000.
  #
  # THESE FOUR ARE A COPY, AND COPY IS THE HONEST WORD — unlike the Postgres
  # pair above, which the "start the stack" step passes straight into compose as
  # POSTGRES_USER / POSTGRES_PASSWORD and which is therefore the SOURCE. Nothing
  # passes these into compose: `compose.yaml`'s `minio` takes its root
  # credentials from its own `${MINIO_ROOT_USER:-minioadmin}` defaults, so the
  # value Django dials and the value the container is created with agree by
  # being the same published constant, not by derivation. The drift that permits
  # is small and real — change `compose.yaml`'s default and this block goes
  # stale in silence. Making it a source is one line in the step below
  # (`MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID"`, the Postgres shape exactly), and
  # that step belongs to the rung that owns the rest of this file; recorded here
  # rather than reached for.
  #
  # The values are `.env.example`'s, unchanged, because that is the file a
  # laptop copies: 9000 is the compose `minio`'s S3 API port (9001 is its
  # console), and `us-east-1` is MinIO's own default, which MinIO ignores and
  # boto3 insists on having named. `AWS_S3_REGION_NAME` is here because
  # `config/settings/base.py` reads it from the environment —
  # `env.str("AWS_S3_REGION_NAME", default="")` — and hands it to the boto3
  # client as `region_name`; `config/settings/test.py` pins none of these three,
  # so what is written here is what the suite dials with.
  #
  # AWS_STORAGE_BUCKET_NAME IS DELIBERATELY ABSENT, and for once not for
  # DATABASE_NAME's reason. `config/settings/test.py` pins it to the empty
  # string whatever the environment says — the ambient test world has no object
  # storage on purpose — and a test that wants a bucket names one itself through
  # the `settings` fixture (`apps/files/tests/conftest.py::bucket`, which
  # derives it per checkout). A name here would be overridden and misleading.
  AWS_S3_ENDPOINT_URL: http://127.0.0.1:9000
  AWS_S3_REGION_NAME: us-east-1
  AWS_ACCESS_KEY_ID: minioadmin  # pragma: allowlist secret — the published compose credential, worth nothing; the production refusal that would reject it is recorded in config/settings/guards.py as a named candidate, and recorded there as not landed
  AWS_SECRET_ACCESS_KEY: minioadmin  # pragma: allowlist secret — the published compose credential, worth nothing; the production refusal that would reject it is recorded in config/settings/guards.py as a named candidate, and recorded there as not landed

jobs:
  derive:
    name: derive
    runs-on: ubuntu-latest

    # WHAT TO RUN, ASKED RATHER THAN TYPED. This job's whole output is the
    # matrix the next one expands, and it comes out of the gate itself. It
    # needs no venv, no database, no docker and no network beyond the checkout,
    # because the listing reads one file and prints — so the job is a checkout
    # and one shell step, and it is the cheapest job in this workflow.
    #
    # AN EXIT 2 FROM THE LISTING FAILS THIS JOB, AND THERE IS NO FALLBACK. The
    # listing refuses rather than print a table it cannot vouch for (a leg in no
    # unit, a leg in two, a unit with no `needs`); a CI that fell back to some
    # remembered list at that moment would be running the hand list this whole
    # design exists to delete, at exactly the moment the gate said the list was
    # wrong. `set -euo pipefail` and a bare invocation is the whole mechanism.
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
      seed: ${{ steps.units.outputs.seed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The listing itself needs no history, but the base of a proposed
          # change must resolve on every row below, and the rows check out the
          # same way. Kept here so the two jobs' checkouts do not differ.
          fetch-depth: 0
          # AND THE TAGS, for the same "do not differ" reason. `fetch-depth: 0`
          # fetches every commit and NO tag object; the drives and the image
          # side both reason about tags, and a runner that has none answers
          # "this tree carries no tag" identically to a tree that really does
          # not. See the legs job's checkout for the measurement.
          fetch-tags: true

      - name: ask the gate what its units are
        id: units
        # THE LISTING IS ASKED BARE, ON A PULL REQUEST TOO, AND THAT IS A
        # DECLARED GAP rather than an oversight. The listing takes no arguments
        # at all — `--list-legs <anything>` is exit 2 by design, so that a
        # mistyped modifier is never answered with a smaller listing — which
        # means it cannot yet be handed the proposed change's base and cannot
        # print how many items the scope selected. The units and their shards do
        # not depend on the scope, so the matrix is right either way; what is
        # missing is the `selected=<n>` a reader would like on the row. The
        # NARROWING itself is not missing: every row below carries
        # `--pr --base <sha>` on a pull request.
        run: |
          set -euo pipefail
          # The workflow-level `env:` block is exported into every step, so the
          # one hand-typed number is read here rather than copied into a second
          # place that could disagree with it.
          SHARDS="$PYTEST_SHARDS"
          # REDIRECTED, NEVER PIPED. The gate refuses a piped stdout (it would
          # replace its exit status with the reader's) and the exit status here
          # is the job's.
          ./scripts/check.sh --list-legs > units.tsv
          cat units.tsv
          # ONE ROW PER RUNNER. A unit the listing calls `N-capable` expands to
          # SHARDS rows carrying `k/N`; every other unit is one row carrying no
          # shard at all. Nothing in this block names a unit: it reads the
          # `shards` column, which is the listing's own answer to "does this
          # unit's body take a k/N".
          matrix='[]'
          while IFS=$'\t' read -r unit needs shards _legs; do
            [ -n "$unit" ] || continue
            if [ "$shards" = "N-capable" ]; then
              k=1
              while [ "$k" -le "$SHARDS" ]; do
                matrix="$(printf '%s' "$matrix" | jq -c --arg u "$unit" --arg n "$needs" --arg s "${k}/${SHARDS}" \
                  '. + [{unit: $u, needs: $n, shard: $s}]')"
                k=$((k + 1))
              done
            else
              matrix="$(printf '%s' "$matrix" | jq -c --arg u "$unit" --arg n "$needs" \
                '. + [{unit: $u, needs: $n, shard: ""}]')"
            fi
          done <units.tsv
          if [ "$(printf '%s' "$matrix" | jq -r 'length')" -lt 1 ]; then
            echo "::error::the listing produced no units — refusing to run a gate of nothing"
            exit 2
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          printf '%s' "$matrix" | jq -r '.[] | "  row: \(.unit) \(.shard)"'
          # ONE SEED FOR THE WHOLE RUN, MINTED ONCE HERE. Every shard of one run
          # has to split the SAME collection order — the split is over a
          # collection and the collection order is the seed's — so a seed minted
          # per row would have the N shards splitting N different suites, and
          # their union would be neither the suite nor a partition of it. The
          # gate refuses an unparsable one rather than minting its own.
          seed=$(((RANDOM << 15) | RANDOM))
          echo "seed=$seed" >>"$GITHUB_OUTPUT"
          echo "  seed: $seed (one for every row of this run)"

  legs:
    name: legs (${{ matrix.unit }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    needs: derive
    runs-on: ubuntu-latest

    # ONE ROW PER UNIT, AND THE ROW NEVER DECIDES ANYTHING. Every row runs the
    # SAME setup steps — uv, the derived database name, the stack, the frontend
    # toolchain — whatever its unit needs, and then hands the gate a unit name.
    # A row that skipped the stack because its unit's `needs` said `none` would
    # be YAML acting on a declaration, which is the drift one layer down: the
    # listing's `needs` column is a DECLARATION and the GATE is what refuses a
    # unit whose organ is missing, at the leg. The cost of honouring that is
    # about a minute on the rows that do not need it, paid in parallel.
    #
    # `fail-fast: false` IS A CRITERION. The point of splitting is to learn the
    # whole red list in one run; cancelling the siblings of the first red would
    # put a reader back to one failure per run, which is the thing the composed
    # selftest exit was built to end one layer down.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.derive.outputs.matrix) }}

    # THE WORKFLOW'S `contents: read` PLUS `id-token: write` — the one widening,
    # for the MinIO pull's login (the login steps say why). OIDC mints a per-job
    # AWS identity; nothing durable holds a key.
    permissions:
      contents: read
      id-token: write

    # NO `services:` BLOCK. There was one — postgres:16 and redis:7 as GitHub
    # service containers — and it is gone rather than kept alongside: a service
    # container publishes 5432 on the runner, which is the same port compose
    # publishes, so the two cannot both exist. The header says why the port was
    # never enough. The stack comes up in a step now, from `compose.yaml`.
    steps:
      - uses: actions/checkout@v5
        with:
          # The gate's diff layer asks what a change added, and its self-test
          # refuses to run against a tree it cannot read the git status of.
          # A depth-1 clone answers both questions wrongly — and the base of a
          # proposed change would not resolve at all.
          fetch-depth: 0
          # TAGS ARE NOT COMMITS, and `fetch-depth: 0` does not bring them. The
          # difference is invisible in exactly the direction that matters: a
          # reader asking "what tag does this tree carry" gets the same silence
          # from a runner with no tag objects as from a tree nobody has tagged,
          # so a version claim measured here would be a claim about the
          # CHECKOUT's completeness. The step below prints the count so the
          # answer is falsifiable rather than assumed.
          fetch-tags: true

      - name: this runner's shape, printed
        # WHAT A DRIVE MEETS HERE, SAID OUT LOUD, and it is one line because it
        # is read by a human looking at a red run rather than by a case.
        #
        # THE THREE FACTS, and each of them has cost a cycle. HEAD STATE: on a
        # `pull_request` event `actions/checkout` checks out the merge commit
        # DETACHED and creates no local branch, so a drive that asked git for
        # `main` got exit 1 (loud) or, with `|| true` around it, git's own
        # error-path stdout — THE ARGUMENT — compared as a sha (silent). That
        # is the silent one, and `drive_base_ref` in
        # `scripts/tests/drive_preamble.sh` is
        # the reader it now goes through. THE REFS PRESENT: whether
        # `refs/heads/main` and `refs/remotes/origin/main` are here at all is
        # what that reader falls through, so the log says which one answered.
        # THE TAG COUNT: the tags fetch above is unfalsifiable on a
        # repository with no tags — this template has none — so the count is
        # printed rather than asserted, and a consumer whose origin carries
        # tags reads a non-zero number here the day they adopt it.
        run: |
          if git symbolic-ref -q HEAD >/dev/null 2>&1; then
              head_state="attached to $(git symbolic-ref --short HEAD)"
          else
              head_state="DETACHED at $(git rev-parse --short HEAD)"
          fi
          # `if`, not `cmd && var=yes`: this step's shell is `bash -e`, and an
          # AND-list whose left side fails is a failing last command — the step
          # would exit on the very answer it exists to print.
          local_main=no
          if git rev-parse --verify -q refs/heads/main >/dev/null 2>&1; then local_main=yes; fi
          origin_main=no
          if git rev-parse --verify -q refs/remotes/origin/main >/dev/null 2>&1; then origin_main=yes; fi
          echo "runner shape: HEAD ${head_state}; local main: ${local_main}; origin/main: ${origin_main}; tags: $(git tag -l | grep -c . || true)"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        # `--frozen`: CI installs what `uv.lock` says and never re-resolves. A
        # gate that quietly upgraded a dependency would be measuring a tree
        # nobody has.
        run: uv sync --frozen

      - name: this runner's own database name (derived, not typed)
        # THE ONE THING THAT MAKES THE CENSUS LEG MEAN ANYTHING HERE. The name
        # is not written down in this file; it is INVOKED out of
        # `scripts/db.sh`, the same `db_name()` a laptop and a worktree run, so
        # there is one derivation in this repository and not a copy of it in a
        # YAML string. On a runner it resolves to `djb_<branch>_<8 hex of
        # /home/runner/work/...>` — a derived shape, which is what
        # `scripts/sweep.sh` requires before it will reason about an instance at
        # all.
        #
        # AND IT REFUSES RATHER THAN FALLING BACK. If the derivation comes back
        # empty, or something upstream has pinned a name of another shape, this
        # step exits 2 and the job stops. A fallback to a typed name would
        # restore exactly the vacuous green this step exists to end: the leg
        # would run, find nothing in scope, and say clean. Could-not-look
        # outranks a pass here as everywhere else.
        #
        # `$GITHUB_ENV` and not an output, because every later step wants it:
        # compose creates POSTGRES_DB with it, and `scripts/db.sh`'s rule 1 — a
        # name already in the environment wins — means the gate, the backup
        # drive and the restore drill all read this same value rather than
        # re-deriving one each.
        run: |
          . ./scripts/db.sh
          . ./scripts/lifecycle.sh
          if [ -z "${DATABASE_NAME:-}" ] || ! lc_derived_shape "$DATABASE_NAME"; then
              echo "!! this job has no checkout-derived database name (exit 2)." >&2
              echo "   DATABASE_NAME is '${DATABASE_NAME:-<empty>}'. The own-tree census" >&2
              echo "   narrows every verdict to a derived identity, so a name of any other" >&2
              echo "   shape leaves it asserting over an empty scope and passing." >&2
              exit 2
          fi
          echo "DATABASE_NAME=${DATABASE_NAME}" >>"$GITHUB_ENV"
          echo "this runner's database: ${DATABASE_NAME} (derived by scripts/db.sh)"

      - name: the arm64 handler the MinIO mirror needs
        # `compose.yaml` pins MinIO's last public release from the owner's ECR
        # Public mirror, linux/arm64 only; this runner is amd64, so the one
        # arm64 service runs under QEMU — the action the `images` job uses.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: assume an AWS identity for the MinIO pull
        # ECR Public rations ANONYMOUS pulls by data, and a full matrix (about
        # sixteen shards × ~170 MB) exhausts it: `toomanyrequests: Data limit
        # exceeded`. Authenticated pulls are not rationed. The role is the
        # `images` job's, and it must carry the `ecr-public-login` policy
        # (docs/runbooks/deploy.md, step 5b). us-east-1 is not a guess: ECR
        # Public's API lives in that region only. No role variable (a fork, a
        # clone with no AWS account yet) → anonymous, as a laptop pulls.
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: us-east-1

      - name: log in to the registry the MinIO pin names
        # `registry-type: public` is `docker login public.ecr.aws` with an ECR
        # Public token, through the action the `images` job already uses.
        # `scripts/tests/test_setup_env.sh` refuses a compose-up job without it.
        if: vars.AWS_ECR_ROLE_ARN != ''
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: the stack the gate assumes (docker compose up)
        # THE ENVIRONMENT, from the repository's OWN `compose.yaml` — the same
        # file, the same pinned images and the same published ports a laptop
        # runs, which is the point (see the header). ubuntu-latest ships docker
        # and the compose v2 plugin; the two steps above are MinIO's alone.
        #
        # `--wait` is what makes it a precondition rather than a race: every
        # service named here declares a healthcheck in `compose.yaml`, and
        # `--wait` blocks until each reports healthy — so "up" is never mistaken
        # for "ready" and the gate never opens a socket that is still starting.
        # It is also what a fresh Postgres volume needs: the first boot runs
        # initdb and creates POSTGRES_DB before it answers.
        #
        # FIVE, NOT THREE. `zitadel`, `mailpit` and the
        # `observability` profile are still excluded on purpose and the header
        # says why for each; `minio` and `meilisearch` joined here in the same
        # rung that put them in `compose.yaml`, and the header says why for
        # those two as well.
        #
        # The credentials come from the workflow `env:` block above and the
        # database NAME from the derivation step above, rather than from
        # `compose.yaml`'s `${...:-djb}` defaults — so the value Django dials
        # and the value the container is created with are one value. That is
        # also what puts the derived database on disk BEFORE the gate runs:
        # `initdb` creates POSTGRES_DB on first boot, which is what the backup
        # drive needs to exist before it can dump it, and what the own-tree
        # census needs to exist before it can have anything in scope.
        #
        # No teardown step: the runner is ephemeral and is destroyed with the
        # job. A laptop tears down with `deploy/teardown.sh`; here there is
        # nothing to tear down that outlives the next minute.
        run: |
          POSTGRES_USER="$DATABASE_USER" \
          POSTGRES_PASSWORD="$DATABASE_PASSWORD" \
          POSTGRES_DB="$DATABASE_NAME" \
            docker compose up -d --wait db redis temporal minio meilisearch

      - name: the frontend toolchain — node
        # THE TOOLCHAIN SHIPS IN THE SAME COMMIT AS THE TREE IT SERVES, and
        # that is a criterion rather than a convenience. The gate's frontend
        # leg reads a tri-state: **tree absent + toolchain absent** is a printed
        # skip (a Python-only product pays nothing and is never told it is
        # broken); **tree present + toolchain absent** is exit 2 naming it —
        # could-not-look, which outranks a pass everywhere here. So a `frontend/`
        # that merged without these two steps would redden CI by construction,
        # and it would redden it in the one way that is hardest to read: an
        # instrument saying it could not look, on a runner nobody is watching.
        #
        # `node-version-file` and NOT a version typed here. `frontend/.nvmrc`
        # names the one interpreter the checkout is proven green on, and a
        # second copy of that number in this file is a second answer to "which
        # Node is this". `engines.node` in `frontend/package.json` is the
        # supported FLOOR, which is a different question and is enforced by
        # pnpm (`engine-strict=true` in `frontend/.npmrc` — without it,
        # `engines` is a comment and a broken pin ships unnoticed for days).
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc

      - name: the frontend toolchain — pnpm
        # THE VERSION IS READ OUT OF `packageManager`, never typed. That field
        # is the frontend's own declaration and this action honours it, so the
        # pnpm CI runs is the pnpm a laptop runs.
        #
        # WHAT THIS STEP DELIBERATELY DOES NOT DO: install. `pnpm install
        # --frozen-lockfile` is a gate LEG, and the leg — with its own
        # tri-state and its own frozen-lockfile assertion — belongs to the rung
        # that owns `scripts/check.sh`. Installing here would put a second,
        # unmeasured copy of that leg in this file, which is the exact drift
        # this workflow's header exists to refuse: CI does not have its own list
        # of legs. CI runs the gate.
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: the gate, one unit (./scripts/check.sh --leg)
        # THE step. Not piped, not wrapped, not summarised: its exit status is
        # the job's. Which leg failed is printed by the script, with its wall
        # time beside it.
        #
        # THE UNIT NAME IS DATA, NOT A LITERAL. It arrives from the matrix,
        # which came from the listing, which came from the gate. Nothing in this
        # file names a leg or a unit outside a comment, and that is checkable
        # with one grep.
        #
        # `--shard` ONLY WHERE THE LISTING SAID SO — the row carries an empty
        # shard for an indivisible unit, and the gate refuses a shard on one
        # anyway (exit 2, never a smaller run), so the two agree by construction
        # rather than by this file remembering which is which.
        #
        # `--pr --base <sha>` ON A PULL REQUEST AND NEVER ON `main`. A proposed
        # change is graded at the scope of what it can reach; a push to `main`
        # is graded whole, because that is the belt every narrowed run rests on.
        # The variable is empty on a push, which is what makes the branch a
        # property of the event rather than of an `if:` somebody has to keep
        # right.
        env:
          UNIT: ${{ matrix.unit }}
          SHARD: ${{ matrix.shard }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DJB_GATE_PYTEST_SEED: ${{ needs.derive.outputs.seed }}
          # THE COMPOSE STORE'S CREDENTIAL, RE-PINNED. The AWS login above exports
          # its assumed STS credentials into the job env for every later step,
          # over the workflow `env:`; the gate dials the compose MinIO, not AWS.
          # MinIO was created from compose.yaml's `${MINIO_ROOT_USER:-minioadmin}`
          # default (nothing here sets it), which is the literal below. Literal,
          # not `${{ env.… }}`: that context already holds the exported STS key.
          AWS_ACCESS_KEY_ID: minioadmin  # pragma: allowlist secret — the published compose credential, as in the workflow env above
          AWS_SECRET_ACCESS_KEY: minioadmin  # pragma: allowlist secret — the published compose credential, as in the workflow env above
          AWS_SESSION_TOKEN: ""
        run: |
          set -euo pipefail
          args=()
          [ -z "${SHARD:-}" ] || args+=(--shard "$SHARD")
          [ -z "${PR_BASE:-}" ] || args+=(--pr --base "$PR_BASE")
          echo "-- ./scripts/check.sh --leg $UNIT ${args[*]-}"
          ./scripts/check.sh --leg "$UNIT" ${args[@]+"${args[@]}"}

      - name: the stack, when something failed
        # DIAGNOSTICS, NOT A LEG. It asserts nothing, it can fail nothing, and
        # `if: failure()` means it only ever runs after a step that already
        # decided the job. It exists because the failures this job's new
        # environment can produce — a container that never went healthy, a port
        # already taken on the runner, a Temporal that answered late — are
        # invisible in the gate's own transcript, which reports only that an
        # instrument could not look. `--no-color` because these logs are read
        # in a browser, not a terminal.
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 db redis temporal

  verdict:
    name: verdict
    needs: [derive, legs]
    # `always()` IS WHAT MAKES THIS A VERDICT RATHER THAN A SUMMARY. Without it
    # a cancelled or failed row would SKIP this job, and a skipped required
    # check is not a red one — it is a check that never reported, which branch
    # protection and a reader both mistake for "nothing to see".
    if: always()
    runs-on: ubuntu-latest

    # THE ONE CHECK ANYTHING ELSE MAY DEPEND ON. The rows are a matrix, and a
    # matrix's row names change whenever the listing changes — so a branch
    # protection rule or a downstream `needs:` naming rows would go stale on the
    # day a unit is added, silently, by requiring a check that no longer exists.
    # This job's name is stable, it needs every row, and it is what the
    # repository's required-status-check setting names.
    #
    # THAT SETTING IS NOT IN THIS TREE AND CANNOT BE PROVEN FROM IT. Branch
    # protection lives in the repository's settings; a workflow file cannot
    # assert what is required. The rung that landed this said so in its report
    # and named who must set it.
    permissions:
      contents: read
      actions: read

    steps:
      - name: which rows were not success
        # READ OUT OF THE RUN, not out of `needs`. `needs.legs.result` collapses
        # every row into one word, which is the right input for the decision
        # below and the wrong output for a person: a reader of a red verdict
        # needs the ROW. This step asserts nothing — the next one decides.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion != null and .conclusion != "success") | "  not success: \(.name) — \(.conclusion)"' \
            || echo "  (the run's jobs could not be listed — the decision below is unaffected)"

      - name: the verdict
        # PASSES IFF BOTH NEEDS SUCCEEDED. A matrix result is `success` only
        # when every row succeeded, so this is the whole gate's verdict in two
        # comparisons — and it is a comparison rather than an implicit `needs:`
        # because `always()` above means this job runs whatever happened.
        run: |
          set -euo pipefail
          echo "derive: ${{ needs.derive.result }}"
          echo "rows:   ${{ needs.legs.result }}"
          if [ "${{ needs.derive.result }}" = "success" ] && [ "${{ needs.legs.result }}" = "success" ]; then
            echo "ok: every unit of the gate ran and passed"
          else
            echo "::error::the gate did not pass — see the rows named above"
            exit 1
          fi

  local:
    name: local
    # THE PRODUCT'S OWN CI STEPS, AND THERE IS NO SECOND WORKFLOW FILE.
    #
    # WHY IT IS HERE AT ALL. A product that clones this template grows CI work
    # of its own — the first consumer's deploy jobs are the measured case — and
    # the only place to put it was inside THIS file, which is template-owned:
    # every release then re-pays the conflict, and the v2.1.0 fold priced that
    # at 21 conflicts across `scripts/ quality/ .github/`. A `ci.local.yml` was
    # rejected as the fix (team F § 3): GitHub composes nothing, so a second
    # workflow is a second copy of the whole setup — the checkout, the uv
    # install, the database name, the stack — that nothing keeps in step with
    # this one. One optional JOB, reading one optional DIRECTORY, is the
    # smallest thing that is still one workflow.
    #
    # `needs: verdict` IS THE SAME CRITERION `images` STANDS ON. Whatever a
    # product does here — a deploy, a publish, a notification — is downstream of
    # the gate's own verdict, so it runs behind it rather than beside it. A
    # product that wants something IN the gate writes a leg
    # (`scripts/local/legs/`), which reaches the matrix through the listing with
    # no edit to this file either.
    #
    # ABSENT, IT COSTS ONE SKIPPED LINE. The template ships no
    # `scripts/local/` path (`publish.sh` § R0), so on this repository's own
    # tree the step prints why it did nothing and exits 0 — printed and never
    # silent, because a job that says nothing is indistinguishable from a job
    # that ran something.
    needs: verdict
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: the product's own CI steps
        # >>> local-ci >>>
        # EXTRACTED AND RUN BY `scripts/tests/test_drive_preamble.sh` between
        # these sentinels — the `run_registration` idiom one layer over: the
        # block CI ships is the block the case drives, because a copy of this
        # logic in a drive would be a case that passes while the workflow
        # drifts.
        run: |
          set -uo pipefail
          dir=scripts/local/ci
          if [ ! -d "$dir" ]; then
            echo "no ${dir}/ in this tree — this product declares no CI steps of its own (the template never ships one)"
            exit 0
          fi
          # NAME ORDER, AND IT IS THE GLOB'S. A product that wants an order
          # numbers its files, exactly as `fold.d/` and every run-parts
          # directory in this system does. `LC_ALL=C` so the order is the same
          # on every runner rather than the locale's idea of one.
          found=0
          rc=0
          for f in $(LC_ALL=C ls "$dir"/*.sh 2>/dev/null); do
            found=$((found + 1))
            if [ ! -x "$f" ]; then
              echo "::error::${f} is not executable — a CI step this job cannot run is one it would silently skip (chmod +x)"
              exit 2
            fi
            echo "--- ${f}"
            "$f"
            step_rc=$?
            echo "--- ${f}: exit ${step_rc}"
            # THE FIRST NON-ZERO IS THE JOB'S, AND EVERY STEP STILL RUNS. The
            # gate's own selftest leg composes its exit from the whole
            # population for the same reason: one failure per run is the cost
            # this system refuses to keep paying.
            [ "$step_rc" = "0" ] || rc="$step_rc"
          done
          if [ "$found" = "0" ]; then
            echo "${dir}/ exists and holds no *.sh — nothing to run"
            exit 0
          fi
          echo "${found} product CI step(s) ran; exit ${rc}"
          exit "$rc"
        # <<< local-ci <<<

  images:
    name: images
    runs-on: ubuntu-latest

    # THIS JOB IS THE ONLY PLACE THE DEPLOYED IMAGE IS EVER BUILT (ADR deploy-4).
    #
    # It used to build two single-arch images, tag them locally, check the USER
    # line, and let them die with the runner. Meanwhile `deploy/compose.yaml`
    # carried a `build:` and runbook step 33 built the SAME tree a third time,
    # arm64, on the box — the slowest and least debuggable machine in the
    # system. Three builds of one tree is three chances to differ (a base image
    # that moved, a transient mirror, a wheel rebuilt) and NOTHING anywhere
    # could say whether the thing CI proved and the thing the box ran were the
    # same software.
    #
    # Now: one build, `linux/amd64,linux/arm64`, pushed under the tree tag, and
    # every environment pulls it. The box builds nothing.
    #
    # `needs: verdict` IS A CRITERION, NOT A COURTESY. A registry tag is a
    # promotable artefact and `deploy/release.sh` will deploy anything the
    # registry has — so a tag for a tree the gate has not passed is a red tree
    # one command away from production. The build no longer runs beside the
    # suite; it runs behind its verdict. The cost is the gate's wall clock added
    # to the image's, paid once per tree, and it buys the invariant that
    # EVERYTHING IN THE REGISTRY IS GREEN.
    #
    # IT NAMES `verdict` AND NOT THE ROWS, and that is the whole reason the
    # verdict job exists: the rows are a matrix whose names change with the
    # listing, so a `needs:` over them would have to be edited every time a unit
    # is added — which is CI keeping a list of legs again, wearing a dependency.
    # ADR deploy-4 (b)'s invariant is unchanged; it moved one job name over.
    needs: verdict

    permissions:
      contents: read
      # OIDC. The push credential is a short-lived role assumption, never a
      # stored access key — there is no long-lived registry secret in this
      # repository and that is deliberate (ADR deploy-3's doctrine, one level
      # out: no human types a secret, and nothing durable holds one).
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: the tag this tree carries
        # DERIVED, NEVER TYPED, and derived by the function that already owns it
        # — `deploy/provision.sh image-tag`, the same one `deploy/ship.sh` writes
        # into the box's TREE marker and `deploy/release.sh` resolves. A second
        # copy of the derivation here is a second answer to "which tree is this".
        #
        # A `-dirty` tag cannot occur on a runner (the checkout is committed
        # bytes) and is refused anyway, because a tag that says the tree was
        # uncommitted names an image nobody can reproduce.
        id: tag
        run: |
          tag="$(./deploy/provision.sh image-tag)"
          echo "tag=$tag"
          case "$tag" in
            untracked|*-dirty|"") echo "::error::image-tag says '$tag' — refusing to build an image whose name is a lie" ; exit 1 ;;
          esac
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      # WHETHER THIS RUN CAN PUSH AT ALL, decided once and read by the two steps
      # that care. A fork's pull request has no OIDC role to assume, and the
      # honest behaviour there is to BUILD (so the Dockerfile is still proved)
      # and not to push — rather than to fail a contributor's PR on a credential
      # they were never going to have. `vars.` and not `secrets.`: the role ARN
      # and the registry are coordinates, not secrets, and putting them in
      # `vars` is what lets this condition be evaluated at all.
      - name: can this run push
        id: push
        run: |
          if [ -n "${{ vars.AWS_ECR_ROLE_ARN }}" ] && [ -n "${{ vars.DJB_IMAGE_REGISTRY }}" ]; then
            echo "push=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::no AWS_ECR_ROLE_ARN / DJB_IMAGE_REGISTRY variable — building without pushing"
            echo "push=false" >>"$GITHUB_OUTPUT"
          fi

      - name: assume the push role
        if: steps.push.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: log in to the registry
        if: steps.push.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: is this tag already in the registry
        # THE BANK BUILDS THIS IMAGE NOW (ADR deploy-4a), on a verifier box,
        # from the tree its own composed verdict has just passed. So by the
        # time this job runs, the tag it is about to build usually EXISTS — and
        # rebuilding it would push a second image under a name that already
        # names one, which is two answers to "what is tree-abc123?" and the one
        # thing the registry is supposed to settle.
        #
        # THE REGISTRY IS ASKED THROUGH `provision.sh image-digest` and not
        # through a second `aws ecr describe-images` here: that function is the
        # one place this tree composes a repository name and resolves a tag,
        # and a describe-images beside it would be a second derivation of both.
        # It exits non-zero both when the tag is absent AND when the registry
        # could not be reached — and both answers are treated as ABSENT here,
        # which is the safe direction: the cost of being wrong is one rebuild,
        # and the cost of the other direction is a tag nobody ever built.
        #
        # BOTH SERVICES OR NEITHER. A half-present tag is not a tag: `web` and
        # `worker` are one artefact of one tree, and a job that built only the
        # missing half would leave two images of one tag from two builds.
        id: have
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          set -uo pipefail
          have=false
          if [ "${PUSH:-false}" = "true" ]; then
            have=true
            for target in web worker; do
              if digest="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG" 2>/dev/null)"; then
                echo "$target -> $digest"
              else
                have=false
                echo "$target is NOT in the registry under $TAG"
              fi
            done
          fi
          if [ "$have" = "true" ]; then
            echo "::notice::$TAG already in the registry — skipped"
          fi
          echo "have=$have" >>"$GITHUB_OUTPUT"

      - name: buildx, with a builder that can do two architectures
        # `docker build` on the runner's default builder produces ONE
        # architecture — the runner's, amd64 — and this deployment's box is
        # Graviton. A single-arch image would be pulled by an arm64 box as a
        # manifest it cannot run, or (worse, on some daemons) silently emulated.
        # The `docker-container` driver is what makes `--platform` with two
        # values produce a manifest LIST rather than a refusal.
        uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - name: build web and worker — ONE build, two architectures
        if: steps.have.outputs.have != 'true'
        # `--push` when there is a registry, `--load` is not available for a
        # multi-arch build (the local image store holds one architecture), so a
        # no-push run builds both architectures and keeps neither: what it
        # proves is that the Dockerfile builds for both, which is the half a
        # fork's PR can prove.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          set -euo pipefail
          if [ "$PUSH" = "true" ]; then output="--push"; else output=""; fi
          for target in web worker; do
            if [ "$PUSH" = "true" ]; then
              ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
            else
              ref="local/djb-${target}:${TAG}"
            fi
            echo "-- $target -> $ref"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --target "$target" \
              --tag "$ref" \
              --provenance=false \
              $output \
              .
          done

      - name: the manifest carries BOTH architectures
        # THE ASSERTION THAT MAKES "MULTI-ARCH" A FACT RATHER THAN A FLAG. A
        # `--platform` typo, a builder that quietly fell back to the default
        # driver, or a base image with no arm64 variant all produce a perfectly
        # green build and a single-arch manifest — which fails, for the first
        # time, on the Graviton box at 3am. Read back OUT OF THE REGISTRY, not
        # out of the build log, because the registry is what the box will pull.
        if: steps.push.outputs.push == 'true' && steps.have.outputs.have != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
        run: |
          set -euo pipefail
          for target in web worker; do
            ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
            platforms="$(docker buildx imagetools inspect --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}' "$ref")"
            echo "$ref -> $platforms"
            case "$platforms" in *linux/amd64*) ;; *) echo "::error::$ref has no linux/amd64" ; exit 1 ;; esac
            case "$platforms" in *linux/arm64*) ;; *) echo "::error::$ref has no linux/arm64" ; exit 1 ;; esac
            digest="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-digest "$target" "$TAG")"
            echo "$ref -> $digest"
          done

      - name: the images run as a non-root user
        # SKIPPED WHEN THE TAG WAS ALREADY THERE, with the build. This step
        # RUNS the image on the runner, and a runner cannot run an image it has
        # no architecture for; more to the point, an image this job did not
        # build is an image whose USER line this job did not change. The check
        # belongs to the build, and it is skipped with it.
        if: steps.have.outputs.have != 'true'
        # Cheap, and it catches the one mistake a Dockerfile refactor makes
        # most often: losing the USER line. Run against the runner's own
        # architecture, pulled back from the registry where there is one — so
        # what is checked is the artefact that will be deployed, not a
        # by-product of the build.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.DJB_IMAGE_REGISTRY }}
          PUSH: ${{ steps.push.outputs.push }}
        run: |
          set -euo pipefail
          for target in web worker; do
            if [ "$PUSH" = "true" ]; then
              ref="$(DJB_IMAGE_REGISTRY="$REGISTRY" ./deploy/provision.sh image-ref "$target" "$TAG")"
              docker pull -q "$ref"
            else
              # No registry: build this one architecture into the local store,
              # which is the only way a non-push run can run the image at all.
              ref="local/djb-${target}:${TAG}"
              docker buildx build --load --target "$target" --tag "$ref" .
            fi
            test "$(docker run --rm --entrypoint id "$ref" -u)" = "10001"
          done
