# THE PORTS OVERRIDE — the one file that lets two (or N) deployment stacks
# co-reside on one machine.
#
# `deploy/compose.yaml` is a DEPLOYMENT: Caddy is the only container that
# publishes anything (80, 443, 443/udp). That is correct on
# a box and it is a collision on a laptop, where a builder proving a restore
# needs a SECOND stack up beside the first, and two builders on one machine need
# a third and a fourth. This file changes nothing but where those three ports
# land on the host.
#
#   docker compose -p djb-b1b \
#     -f deploy/compose.yaml -f deploy/compose.second.yaml \
#     --profile laptop up -d
#
# TWO THINGS MAKE A STACK ITS OWN, and both are on the command line, not in a
# file — so no file has to be edited per stack and nobody edits the shared
# compose:
#
#   1. `-p <project>` — the project name. It namespaces the containers, the
#      network AND the volumes (`djb-b1b_db_data`), which is what keeps a
#      destructive drill on one stack away from another's data. Which project a
#      command lands on WITHOUT `-p` is `deploy/provision.sh::resolved_project_name`'s
#      answer (never the old shared `djb-deploy`); this file declares no `name:`,
#      so nothing here can win an argument the operator meant to settle with `-p`.
#   2. `DJB_HTTP_PORT` / `DJB_HTTPS_PORT` — the host ports. Parametric, not a
#      fixed alternate: a fixed second set would make a THIRD stack impossible,
#      and there is no reason for this file to know how many stacks a machine
#      is running. Set them per stack, in the environment or in `deploy/.env`.
#
# The defaults are 80/443, so `-f compose.yaml -f compose.second.yaml` with no
# variables set is byte-for-byte the base deployment. That is on purpose: the
# override is safe to leave in a command line, and the FIRST stack on a machine
# may keep the real ports.
#
# WHY `!override` AND NOT A SECOND ports ENTRY. Compose merges sequences by
# appending, so a plain `ports:` here would ask the daemon to bind 80 *and*
# `$DJB_HTTP_PORT` — the collision this file exists to remove, arriving through
# the file that removes it. `!override` replaces the base list outright. Verify
# with `docker compose -f deploy/compose.yaml -f deploy/compose.second.yaml
# config | grep -A6 ports:` before believing any of this; three entries, not six.
#
# WHAT THIS FILE DOES NOT DO. It does not give a second stack its own DOMAIN.
# `SITE_ADDRESS`/`AUTH_ADDRESS`/`O11Y_ADDRESS` still come from `deploy/.env`,
# and on a laptop they are `localhost`-shaped with Caddy's internal CA, so two
# stacks answer to the same names on different ports — `curl -sk
# https://localhost:8443/readyz` is stack B, `https://localhost/readyz` is
# stack A. That is enough for a laptop proof and it is NOT enough for two real
# environments on one box, which is not a thing this repository does (ADR
# deploy-1: one environment per box).
#
# TEARING DOWN A NAMED STACK. `deploy/teardown.sh` resolves the project the
# way `provision.sh` does, so a second stack is named to it through the
# environment, which outranks every other answer:
#
#   COMPOSE_PROJECT_NAME=djb-b1b ./deploy/teardown.sh local --purge
#
# and confirm with `docker compose ls` that the project is gone. Never `down` a
# project you did not bring up.

services:
  caddy:
    ports: !override
      - "${DJB_HTTP_PORT:-80}:80"
      - "${DJB_HTTPS_PORT:-443}:443"
      - "${DJB_HTTPS_PORT:-443}:443/udp"
