# Rising floors — the only "warn" shape the gate has, and it never warns: it
# BLOCKS on growth and stays silent on existence. Each budget records a value
# measured from the real tree on the date beside it. The check fails when the
# measured value GROWS past the recorded ceiling; shrinking tightens nothing by
# itself — a human commits the lower number when the shrink is real (that
# asymmetry is the point: the ceiling only ever moves by a person's hand, in a
# diff a reviewer sees).

# A NEW subject — a services.py that holds a top-level function, a new *Out
# schema — has no ceiling and FAILS until somebody measures it and records it
# here; green-because-unrecorded is not a pass. A services.py with no top-level
# function is not a subject: there is no longest function to have measured.

# Seeded 2026-08-19 from main. The numbers are the measured values, verbatim:
# a ceiling above reality would be headroom nobody granted.

service_function_length:
  # Longest top-level function in each services.py, in lines, measured as the
  # span from `def` to the last line MINUS whatever the docstring spends
  # (quality/gate.py::_measure_budgets_detailed). A service crossing its ceiling
  # is a service growing a second job.

  # THE INSTRUMENT CHANGED HERE — 2026-08-29. Until that change the
  # span included the docstring, so a function that shed ten lines of code while
  # its author wrote ten lines explaining why measured flat: the ceiling could
  # not see the only thing it exists to see. Every entry below was re-measured
  # on this tree under the new measure and EVERY ONE FELL — the shrink-only
  # ratchet holds, nothing was granted headroom, and no value here is above what
  # was measured. What the re-measure also showed is why the change was worth
  # making: in FIVE of the eleven modules the "longest function" changed hands
  # (accounts revoke_token -> provision_sso_identity, events enqueue_dispatch ->
  # record_event, search announce_degraded -> _empty_one_kind, usage
  # record_usage -> record_correction, workflows record_run -> start_replay).
  # In each of those five the module's most-argued function was outranking its
  # longest one, which is the failure mode in miniature.
  #
  # The per-entry notes this block replaces are NOT carried forward, and their
  # absence is deliberate rather than tidy: every one of them argued a number
  # under an instrument that no longer exists — most of them in the words "the
  # length is the SIGNATURE and the PROSE", which is precisely what this measure
  # stopped charging for. An argument kept past the thing it was about is worse
  # than no argument. They are in this file's git history, at 1bffb2a, whole.
  #
  # What the measure still charges for, deliberately: the signature, and the
  # rule-mandated comment lines inside a body (rule 13's `# authz:`, rule 26's
  # `# reach:` — both must be comments IN the body to be counted at all).
  # Excluding "rule-mandated blocks" was rejected at the ruling: it is an open
  # set, and an unfalsifiable population is the one thing an instrument here may
  # not carry. So a service that buys length with a valve still pays for it, and
  # that is the visible diff the ceiling is for.
  apps/accounts/services.py: 65 # provision_sso_identity — the longest CODE in
  # this module, and it took the ceiling from `revoke_token` the moment the docstring stopped
  # counting: `revoke_token` was the module's most-argued function, not its longest one. 63 is
  # the identity round-trip a reader would expect to be the biggest thing here.
  apps/comms/services.py: 129 # send — was 152 under the old span; it keeps the
  # ceiling under the new one, which is the module's own claim confirmed rather than a reprieve.
  # `send_step` and `record_delivery_status` sit behind it as before.
  apps/connections/services.py: 46 # record_inbound_webhook — was 83, and the
  # 37-line gap IS the paragraph about why the identity is the provider's delivery id and never a
  # hash of the body. The argument is still in the source; it no longer buys ceiling.
  apps/core/services.py: 69 # invite_member — was 95. Still the module's longest
  # code, and still two questions in one function (may you invite at all, may you grant this role).
  apps/events/services.py: 35 # record_event — took the ceiling from
  # `enqueue_dispatch`, whose 54 was largely the ADR events-3 resume argument. 35 lines of code
  # writing an event and its outbox row is what this module's biggest job actually costs.
  apps/example/services.py: 50 # create_widget — was 66. The worked example, and
  # the one whose old note said outright that its growth was "signature and prose"; the new number
  # is what that sentence was describing.
  apps/exports/services.py: 73 # create_export — was 102. Keeps the ceiling: two
  # refusals, the idempotency read, the row, the authorization, validate-and-save, the event and
  # the workflow start, which is the list its old note gave.
  apps/files/services.py: 84 # record_stored — was 123. Note that this one does
  # NOT fall to the "BODY is 40 lines" its old note claimed: rule 26's `# reach:` valve (8 lines)
  # and rule 13's `# authz:` valve (6) are comments inside the body and are still counted, by the
  # ruling that refused to exclude rule-mandated blocks. Recorded at the measured number.
  apps/search/services.py: 16 # _empty_one_kind — the ceiling changed hands to a
  # PRIVATE helper, which is honest and worth not smoothing over: `announce_degraded` (29) was
  # four lines of code and the rest an argument, and the biggest block of code in this module is
  # the per-kind round-trip loop. The measure names what is there, not what is public.
  apps/usage/services.py: 79 # record_correction — took the ceiling from
  # `record_usage`, whose 108 was, by its own note, "the SIGNATURE and the PROSE" plus seven lines
  # of rule 13 valve. A correction is genuinely the larger piece of code: it supersedes a row and
  # has to say what it supersedes and why.
  apps/workflows/services.py: 55 # start_replay — took the ceiling from
  # `record_run` (94 recorded, 93 measured on this tree before the change — a stale ceiling this
  # re-measure also closes). ADR workflows-6's 2x2 is an argument; the replay door is code.

out_schema_fields:
  # Declared fields per published *Out schema. An Out crossing its ceiling is a
  # contract quietly becoming a dump of the row.
  apps/accounts/schemas.py::RealmOut: 3 # A9
  apps/accounts/schemas.py::SsoConnectionOut: 14 # A9, +1 for `verified_domains`
  # — which of the claimed domains an operator has confirmed, and therefore
  # which of them route a sign-in at all. It is a second list beside
  # `email_domains` rather than a flag on the first because the two are
  # different questions a client has to be able to ask apart — "what did I
  # claim" and "what answers today" — and the whole point of the rung is that
  # they are not the same set. Not the row becoming a dump: it is derived from
  # the same prefetched `domains` rows the sibling list is.
  apps/accounts/schemas.py::TokenOut: 7 # (ADR ident-7): + scopes, the ceiling the token
  # carries. A read-shape field and not a dump of the row: it is the one thing about a token
  # somebody needs to know afterwards that they cannot recover from the secret.
  apps/accounts/schemas.py::TokenIssuedOut: 2 # + TokenOut's 7, inherited.: token, plus
  # scopes as stored (null when the mint said "*") and effective_scopes, which is the part of
  # what was asked for that the minting person's role can back — the mint is the only moment
  # that answer is cheap, and an agent that asked for dead power learns here rather than from a
  # refusal hours later.
  apps/accounts/schemas.py::UserOut: 7 # P5 B-ACCT — id, email, is_active, is_staff,
  # date_joined, created_at, updated_at. NOT is_superuser (the deployment's, not a tenant's) and
  # NOT zitadel_sub (the identity platform's subject; naming it on the wire hands a caller the key
  # to somebody's account on it). Measured, not chosen: the gate refused the new subject until a
  # number was recorded, which is what this line is.
  apps/comms/schemas.py::MessageOut: 22 # P9 (COM-1) — + send_at, and it is the one field
  # on this shape that exists BECAUSE the shape was read by a person rather than by a client. T4
  # shipped the scheduling timer with no column; the cost landed immediately and was booked the
  # same day: a support agent could not tell a message waiting six hours from one waiting
  # six seconds, because both read `queued` and the schedule lived only on the Temporal run. A
  # 22nd field on a read shape is exactly the growth this ceiling exists to make somebody argue
  # for, and the argument is that the alternative was answering a product question in a second
  # system. Set for a quiet-hours deferral too, for the same reason.
  # Was 21 — P3 C1 (ADR comms-9) — + bounce_kind, which is the
  # question the hard/soft split creates: "it bounced and nothing was suppressed, why". Without
  # it on the wire that answer is only reachable from a shell, which is its shape one app over.
  # Was 20 (C2-comms-a — + delivered_at/bounced_at; was 18 at C1-1a)
  apps/comms/schemas.py::DeviceOut: 8 # (T3, ADR comms-9's push half) — id, recipient_id,
  # organization_id, platform, label, retired_at, created_at, updated_at. Measured at birth,
  # not ratcheted. What is NOT on it is the point of the number: no `push_token`, no prefix of
  # one, and no `push_token_hash` either. The token is the capability to put a notification on
  # somebody's lock screen and it is encrypted at rest for that reason; this schema is also the
  # payload of `comms.device.registered`, so it travels to every webhook endpoint the tenant has
  # configured, and a fragment on that wire would undo the column. `organization_id` is house
  # rule 38's, and here it is the CONTACT's branch rather than the hat that registered.
  apps/comms/schemas.py::MessageEngagementOut: 8 # (T1, ADR comms-9's engagement half) —
  # id, message_id, organization_id, kind, url, occurred_at, provider_event_id, created_at.
  # Measured at birth, not ratcheted. `organization_id` is house rule 38's (the socket fan-out
  # narrows on that key and nothing else) and here it is also the load-bearing one: the row's
  # branch is the MESSAGE's, not the tenant root the webhook acted at. What is NOT on it is
  # the point of the number: no `status`, no `delivered_at`, nothing about the message row —
  # an engagement says nothing about whether the message arrived, and a client wanting
  # delivery truth reads `MessageOut`. Two shapes, because they are two facts.
  apps/comms/schemas.py::PolicyOut: 6 # C2-comms-b — a policy IS its steps, so they are on it
  apps/comms/schemas.py::PolicyStepOut: 4 # C2-comms-b — channel, template, wait, escalate_when
  apps/comms/schemas.py::PreferenceOut: 12 # P3 SEC-R2 — + organization_id, which house rule 38
  # now requires of every Out schema of an OrgScopedModel: the socket fan-out narrows on that key
  # and nothing else, so a read shape that omits it emits an event no branch owns and the bridge
  # delivers it to the whole tenant. One field, and it is the one that decides who hears the row.
  # Was 11 (C1-1b — consent's two dates, the window, the suppression)
  apps/comms/schemas.py::RecipientOut: 9 # C2-comms-b — + phone/chat_handle, the addresses the
  # other channel kinds reach; was 7 (C1-1b)
  apps/comms/schemas.py::TemplateOut: 10 # C1-1b — the words included; a template IS its body
  apps/connections/schemas.py::ConnectionOut: 11
  apps/connections/schemas.py::OAuthStartOut: 4
  apps/connections/schemas.py::InboundWebhookOut: 8
  apps/connections/schemas.py::WebhookAcceptedOut: 2
  apps/core/schemas.py::MeasuredBasisOut: 2 # P0 W1-R1 (ADR core-7) — formula + inputs, and
  # a third field would mean the basis had stopped being one thing
  apps/core/schemas.py::MeasuredOut: 2 # P0 W1-R1 (ADR core-7) — the value and the basis it
  # came from; the pair IS the contract
  apps/core/schemas.py::PingOut: 3 # + org, the acting hat (A10)
  # The tenancy and hierarchy doors (P5 B-CORE). Six new Out shapes, measured here at
  # birth rather than ratcheted: rule 41's ceiling is zero and these were written to it.
  apps/core/schemas.py::OrganizationOut: 8 # a node: who it is (id/name/slug), where it sits
  # (parent_id/path/depth) and when. `path` and `depth` are the two that earn their place —
  # they are what let a client sort a flat list back into tree order without a second request.
  apps/core/schemas.py::MembershipOut: 8 # person x branch x role: the three that ARE a
  # membership, plus `user_email` (resolved off the related row, which is why every list
  # select_relateds the user), `is_default`, and the timestamps.
  apps/core/schemas.py::InvitationOut: 9 # who was invited, INTO WHICH ORGANIZATION, as what,
  # how it stands, when it expires and whether it was taken up. **The token is not on it and
  # must never be**: a pending invitation's plaintext is a bearer credential, and a list that
  # carried it would turn "who have we invited" into "hand me every outstanding credential".
  # Raised 8 -> 9 by ADR core-20 (INV-1), and the ninth field is not a nicety: an invitation
  # is org-scoped now, so `organization_id` is the NARROWING KEY house rule 38 requires an
  # org-scoped Out to declare — and "a place in which branch" is the substance of the offer,
  # which a reader would otherwise have to infer from the sender's hat, a thing the response
  # does not carry.
  apps/core/schemas.py::InvitationIssuedOut: 2 # the row and the token, at the one moment the
  # token exists. Two fields is the whole point: it is the exception to the line above, and it
  # is shaped so that nothing can return it by accident.
  apps/core/schemas.py::TenantSettingsOut: 6 # the tenant's own configuration: name/slug/status
  # for identity, timezone/locale because the product renders dates with them, and the
  # free-form `settings` map. Flags are deliberately NOT folded in — they resolve against
  # deployment defaults too, so they answer a different question and have their own shape.
  apps/core/schemas.py::FlagsOut: 1 # one map, deliberately. A flag read is a resolved
  # name->bool and nothing else; a second field here would be somebody starting to explain
  # WHY a flag resolved the way it did, which is a different endpoint.
  apps/core/schemas.py::RoleOut: 12 # P5 (ADR core-25) — a role is THREE layers in one row
  # and the count is that: who it is (key/name/description/kind), what it holds here
  # (permissions), what the product declared it holds (default_permissions) and the two
  # halves of the difference (added/removed), the new-member flag, and the two instants a
  # custom role has. Not a dump of the row: `Role` has four columns, and the other eight
  # are computed from the code layer so that a client does not have to merge three
  # fetches to answer "what does this role actually do in this tenant".
  apps/core/schemas.py::GrantOut: 7 # P5 — one exception: which row (id), on whom
  # (membership_id), WHERE (organization_id — rule 38, a grant in one branch says nothing
  # about the next), what (permission + its sentence, because the key is a word for this
  # codebase and the sentence is the one a person reads), which way it points (effect),
  # and when.
  apps/core/schemas.py::PermissionOut: 11 # P5 — one key of the vocabulary, and every
  # field is something a role editor chooses BY: the key and its three parts
  # (kind/verb/sentence), which app owns it, who decided it exists, whether it is a read,
  # which roles get it out of the box, whether a predicate also asks about the row, and
  # what it used to be called. A derived vocabulary's whole value is that these are
  # answerable without reading our source.
  apps/core/schemas.py::HeldPermissionOut: 4 # P5 — one key somebody holds and WHERE it
  # came from: the key, its sentence, `via` (role/grant/inherited) and the membership that
  # carries it. "Why can this person do that" is the question the screen opens with.
  apps/core/schemas.py::MembershipPermissionsOut: 4 # P5 — the membership, its node, what
  # it holds and what was taken away. `withheld` is a field rather than a subtraction
  # because a withhold is a decision somebody made, and hiding it is how "why has this
  # stopped working" becomes unanswerable.
  apps/events/schemas.py::EventOut: 8 # + organization_id (P3 RT1, ADR realtime-2a) — which
  # part of the tenant the row belongs to. It is the field the realtime fan-out narrows on, and
  # it is on the ENVELOPE rather than on a second socket-only body because the two doors read
  # one serialisation; a socket cannot narrow on something that never left apps/events. Was 7.

  # The four below are NEW SUBJECTS, born with the spine's door (P5 B-EVT). Nothing
  # here loosens a ceiling or moves a backlog: each is the measured field count of a schema
  # that did not exist, recorded because the ledger refuses a subject it has never measured.
  apps/events/schemas.py::WebhookEndpointOut: 7 # P5 B-EVT — the endpoint as every READ
  # answers it: id, url, is_active, event_names, description and the two timestamps. The
  # eighth field is the one that will never be here: `secret`. This ceiling is what makes
  # adding it a visible diff rather than a quiet one, which is the whole "shown once"
  # guarantee expressed as a number.
  apps/events/schemas.py::WebhookEndpointSecretOut: 2 # pragma: allowlist secret — a FIELD COUNT (detect-secrets keys on the schema's own name); P5 B-EVT — the endpoint and the key,
  # and nothing else, because a third field would mean this shape had stopped being the one
  # narrow moment a signing key exists on the wire. Answered by exactly two acts.
  apps/events/schemas.py::EventTypeOut: 2 # P5 B-EVT — a catalogue line is a name and the app
  # that declares it. Deliberately not a payload schema: what an event's body looks like is
  # `EventOut`'s `v` and the emitting app's own Out shape, and a subscriber wanting per-event
  # payload schemas in the catalogue is a recorded future ask, not a field to add here.
  apps/events/schemas.py::DeliveryOut: 13 # P5 B-EVT — one attempt at one subscriber, and every
  # column an operator asks about when it did not land: which endpoint, which event (id and
  # name), the status, the attempt lineage, what the far end last said (last_code/last_error),
  # when it landed, when it gave up, the correlation id to join on, and the two timestamps.
  # Recorded at the measured number rather than trimmed to look better: this ceiling catches an
  # Out becoming a dump of the row, and every one of these is answering a question somebody asks
  # while a webhook is broken.
  apps/example/schemas.py::WidgetOut: 12 # + policy_id (P0 W1-R3) — the id and not the row:
  # a widget's governing policy may live one or more levels UP, and embedding it would put
  # exactly the upward visibility governing() was built not to grant onto the wire. Was 11 (A10)
  apps/example/schemas.py::WidgetEntryOut: 8 # P0 W1-R3 — a ledger line: what it is about
  # (widget_id), what it says (kind, note), where it landed (tenant/organization/_slug) and
  # when. No `updated_at`, deliberately: the model is append_only, so there is never a second
  # time to report and a field that always equalled created_at would be a lie in waiting.
  apps/example/schemas.py::WidgetPolicyOut: 8 # P0 W1-R3 — id, name, body, the tenant, the
  # organization and its slug, and the two timestamps. `organization_slug` is load-bearing
  # rather than convenience here: it is how a caller can tell that the policy governing them
  # was set further up the tree than they can see.
  apps/workflows/schemas.py::WorkflowRunOut: 12 # P5 (ADR workflows-6) — a NEW subject,
  # measured on the tree that introduced it. The run ledger's public face: what it is
  # (workflow_id, run_id, type), where it got to (status, started_at, finished_at, error), what
  # work it was (input_digest), who asked for it (started_by_id, started_by_email) and the row's
  # own id and created_at. What is deliberately NOT on it is the run's INPUT: Temporal's history
  # already witnesses it, a second copy here would be two truths about one fact, and a list
  # endpoint carrying every caller's payload is how a ledger becomes a data leak. That absence is
  # the whole reason `input_digest` exists, and this ceiling is what makes adding the payload a
  # visible diff rather than a convenience.
  apps/files/schemas.py::FileStoredOut: 1 # (F2, ADR files-2) — a NEW subject, measured on
  # the tree that introduced it. ONE declared field, plus `StoredFileOut`'s nine by inheritance.
  # The field is `version`, and the inheritance is the point: ADR files-2 says the
  # `files.file.stored` payload IS a `StoredFileOut` and that it also carries the finalized
  # version, its digest and the resulting `current_version` — a document shape cannot say the
  # first two, because a digest belongs to a version. Inheriting rather than restating keeps the
  # narrowing key (`organization_id`, house rule 38) at the TOP level where
  # `events.services._subject_organization` reads it: a payload that buried it one level down
  # would emit an event no branch owns, and the socket bridge reads no-branch as tenant-wide.
  apps/files/schemas.py::StoredFileOut: 9 # (F1, ADR files-2) — a NEW subject, measured on
  # the tree that introduced it. A document as everything that reads one needs it: which document
  # (id), WHICH PART OF THE TENANT (organization_id — house rule 38's narrowing key, and the field
  # the socket fan-out would otherwise deliver to the whole tenant on), what it is called and what
  # it is for (filename, purpose), which version a reader gets by default (current_version), who
  # filed it (uploaded_by_id), whether it is still in the working set (archived_at) and the two
  # timestamps. **What is deliberately NOT on it is the object key.** The only legitimate way to
  # reach bytes is a presigned URL this platform minted and audited; a key on the wire is the one
  # string a misconfigured bucket policy turns into a URL, and it would tempt a client into
  # constructing one. This ceiling is what makes adding it a visible diff.
  apps/files/schemas.py::FileVersionOut: 9 # (F1) — a NEW subject. One version: the ordinal,
  # what the platform MEASURED by streaming the object (size_bytes, sha256 — never what an
  # uploader declared), whether it landed (status), who uploaded it, when, its declared
  # content_type, its id and organization_id. Nine and not ten for the same reason as above: no
  # key. A tenth field would be somebody starting to publish where the bytes live.
  apps/files/schemas.py::UploadTicketOut: 4 # (F3, ADR files-2) — a NEW subject, measured on
  # the tree that introduced it. What a caller needs to put one version's bytes somewhere and
  # nothing else: the document, the version inside it, WHERE to PUT the bytes, and how long that
  # place stays valid. Two of the four are nested shapes and are counted in their own ceilings
  # above; the two scalars are `upload_url` and `expires_in`. **`upload_url` is in this answer and
  # is not a column anywhere** — a signature at rest is a credential at rest — and `expires_in`
  # rides beside it rather than being looked up by a door, so the number a caller is told comes
  # from the same call that signed the URL. A fifth field would be the two required headers made
  # into data, and they are contract rather than data: the schema's docstring names them, and the
  # signature refuses a PUT without them, which is stronger than a client reading a list.
  apps/files/schemas.py::FileDownloadOut: 8 # (F3, ADR files-2) — a NEW subject, measured on
  # the tree that introduced it. Eight, and the count is the audit posture made a shape: WHICH
  # document (file_id), WHICH VERSION was signed for (version, version_id — the ordinal a person
  # quotes and the row an audit entry names), the link and its life (download_url, expires_in),
  # and what the bytes ARE (content_type, size_bytes, sha256) so that a caller can check what
  # arrived against what we measured. Naming the version twice is deliberate rather than
  # redundant: an issued link is pinned to a version forever, so a client recording "I fetched
  # v2" and a support engineer reading the audit row have to be talking about the same row.
  # **The object key is not here**, for the same reason it is on no other shape in this app.
  apps/usage/schemas.py::UsageEntryOut: 11 # (U1) — a NEW subject, measured on the tree
  # that introduced it. One line of a billing ledger, and every field is something a customer
  # disputing an invoice has to be able to see: what was consumed (meter, quantity), when it
  # happened (occurred_at) as against when it was written (created_at), what caused it
  # (ref_type, ref_id), which part of the tenant it belongs to (organization_id), the machine's
  # own label for the unit of work (idempotency_key), the row's id, and THE CORRECTION PAIR —
  # supersedes_id and superseded_because — which travel even when empty, because an audience
  # that cannot tell "this is the truth" from "this was corrected" cannot use the ledger at all.
  # What is deliberately NOT here is a PRICE: ADR usage-1 rules that this app meters and never
  # rates, and a money column on this shape would be a second truth able to disagree with the
  # rate card. Adding one should be a diff a reviewer reads, which is what this number is for.
  # 7 -> 8 (P20 R4-F2): `organization_id` at the TOP level. Not an eighth FACT — the
  # branch was already on the shape, one level down on `crossed_by` — but a security
  # field rather than a data one: `events.services._subject_organization` reads the
  # payload's top level and nothing deeper, an absent key is stamped NULL, and the
  # fan-out reads NULL as tenant-wide. Before it, a rival administrator at a sibling
  # branch received a ledger row `GET /usage/` under their own hat never lists (R4 F4).
  apps/usage/schemas.py::ThresholdCrossingOut: 8 # (U1) — a NEW subject. What the one event
  # this app publishes says: which line (meter, threshold), over which window (period,
  # period_starts_on, period_ends_on), what the total now is (total, a MeasuredOut with its
  # day-by-day basis rather than a naked number — ADR core-7), and which entry moved it across
  # (crossed_by, so a subscriber can go and look). Seven and not more on purpose: a crossing is
  # a notification, and an event that carried the period's entries would be a second read door
  # nobody authorized.
  apps/usage/schemas.py::UsageReportOut: 4 # (U2) — a NEW subject, measured on the tree
  # that introduced it. The read door's whole answer: which window (period, starts_on, ends_on)
  # and what it holds (meters, a mapping of meter name to its MeasuredOut). Four, and the
  # interesting thing is the three that are NOT here. There is no `entries` list — the ledger's
  # rows are what the totals are computed FROM, and putting them on this shape would make one
  # response an unpaginated dump of a billing table. There is no `cost` and no `currency`, for
  # the same reason `UsageEntryOut` has no price: this app meters and never rates (ADR usage-1),
  # and a money field here would be a second truth able to disagree with a rate card nobody
  # here can see. And there is no `generated_at` — a report is a statement about a window, not
  # about the moment somebody asked. Any of the three arriving is a diff a reviewer reads,
  # which is what this number is for.
  apps/usage/schemas.py::MeterOut: 2 # P7 U3 — a NEW subject, measured on the tree that
  # introduced it, and the smallest published Out in the template. A catalogue line is a NAME
  # and the app that declares it, which is the whole of what `apps/events/schemas.py::
  # EventTypeOut` carries one vocabulary over — the same shape because it is the same kind of
  # thing. What is deliberately NOT here is a `description`: a meter's meaning is the declaring
  # module's docstring (`apps/files/meters.py` argues `files.storage.bytes` in full), and a
  # description field would be a second place to say it — one that a reviewer of the meters
  # module would never see go stale. A `unit` is not here either, and for a sharper reason: the
  # unit is the meter name's third segment, so a column for it would be the same fact spelled
  # twice and free to disagree with itself. And there is no price, no rate and no included
  # allowance, exactly as on the other three shapes in this file's usage block: this app meters
  # and never rates (ADR usage-1). A third field arriving is a diff a reviewer reads, which is
  # what this number is for.
  apps/exports/schemas.py::ExportOut: 16 # (XP-1) — a NEW subject, measured on the tree
  # that introduced it, and the largest published Out outside comms. What it carries is one
  # request's whole life, because a client polls this row and nothing else: where it got to
  # (status, error, completed_at), how wide it went (scope, organization_id + slug), who asked
  # (requested_by_id), the row's own identity and clocks (id, tenant_id, created_at, updated_at,
  # expires_at), how big the archive is (artifact_bytes), and the PAIR that says how to fetch it
  # (download_url + download_path — a presigned link where the backend signs, and this API's own
  # authenticated path always). The sixteenth is `manifest`, and it is the one worth defending:
  # it says which tables are in the archive, how many rows each has, which columns were left out
  # and why, and which tables a single-organization export could not carry. Behind a second
  # request it would be a thing clients skip; on the read shape it is what lets somebody check
  # what they are about to download before they download a multi-gigabyte file. What is
  # deliberately NOT here is `artifact_key` — the storage key is the deployment's business and a
  # client that had it would be a client that had guessed a bucket path.
  apps/exports/schemas.py::ExportDownloadOut: 5 # (XP-1) — a NEW subject. The machine
  # door's answer to a capability whose HTTP twin answers with BYTES: a tool result cannot carry
  # a gigabyte, so it says where (download_url, download_path), how much (artifact_bytes), until
  # when (expires_at) and which export (id). Five and not sixteen on purpose — this is a
  # location, not a second rendering of the row, and `get_export` is one call away.
  apps/search/schemas.py::SearchKindOut: 2 # P7 R-c — a NEW subject, measured on the
  # tree that built it. Two, and the ceiling is the design: an entry in the vocabulary says
  # WHAT can be searched (`kind`) and WHO owns it (`app`), which is everything a caller needs
  # to send a narrowing and then go and fetch the row it points at. A third field would be a
  # description somebody has to translate, or the searchable field list — which is the model's
  # internals wearing a contract, and would freeze a declaration's shape the day a client read
  # it. The kinds a deployment declares are already public; how they are indexed is not.
  apps/search/schemas.py::SearchHitOut: 4 # (R-a) — a NEW subject, measured on the tree
  # that built it. Four, and the ceiling is the design rather than a budget: a search hit is a
  # POINTER (kind, id, label, rank), never a rendering of the row. A fatter hit would be a
  # second, stale copy of a record with a different set of rules on it — the client fetches the
  # real thing through that kind's own door, which is where the scoping, the field-level rules
  # and the freshness already live (ADR search-2, "the document model is deliberately lean").
  apps/example/schemas.py::WidgetStatsOut: 1 # P0 W1-R3 — one field, and it is a MeasuredOut
  # rather than an int (ADR core-7). A second aggregate would be a second MeasuredOut beside
  # it, never a naked number added to it; this ceiling is what makes that a visible diff.

hot_path_lookup_columns:
  # Cycle P3 F2 ( P-1). Rule 35's `index_served` clause asks that
  # the subject table's scan carry an `Index Cond`; on a tenant-scoped read the
  # `for_tenant` leg always supplies one, so an entry that has not declared
  # WHICH column its narrowing lives on is served by tenancy alone and cannot
  # see a predicate falling out of the index into a filter. Entries that have
  # declared one (`lookup_columns:` in the registry) get the strong form; the
  # rest are this number.

  # It is a RATCHET, not a budget: it may fall and never rise. A new
  # `index_served` table arriving with no declared column is the growth this
  # blocks — the blind spot is allowed to exist and not allowed to spread.
  # Measured 2026-08-22, F2: all five index_served tables are declared.
  index_served_untyped: 0

  # THE SECOND HALF, and the one F2 could not see (b), from ).
  # Declaring the column is not the same as PROVING it. Under
  # `enable_seqscan = off` a table of nought or two rows has exactly one plan,
  # so "the column is in the Index Cond" restates the setting rather than
  # asserting anything about the predicate — and four of the five declarations
  # were in exactly that state: core_membership 2 rows, core_auditentry 0,
  # events_outbox 0. Only core_organization (403 rows, predicate reaching ~1 of
  # them) sat in a world where the planner had a choice to get wrong, which is
  # the world quality/hotpaths.py's own sizing argument builds — for one table
  # out of five.

  # The probe now emits every declaration's subject-table row count and the
  # predicate's share, and counts the ones under the floor. A RATCHET, like its
  # neighbour: it may fall and never rise. Growing the probe world (or moving a
  # declaration to a table that has one) is how it falls; the harness holds the
  # evidence for the four that sit here meanwhile.
  # Measured 2026-08-23, .
  lookup_columns_unproven: 4

hot_path_query_counts:
  # Cycle P3 E1 (ADR gate-2). Gate-scale STATEMENT counts for the declared
  # hot-path registry (quality/rules.yaml, rule 35 — the entry's citation is
  # there; rule 5 holds the seam between the two files). The counts are
  # legitimate at gate scale BECAUSE the harness proved each one flat under
  # doubling of its axis (ADR perf-1: the harness proves flatness once, the
  # gate pins the count forever) — a flat count is scale-free. `pin: probe`
  # entries are re-measured by quality/hotpath_probe.py on every gate run and
  # follow the rising-floor grammar (growth blocks; a shrink is a note until a
  # human commits the lower number); `pin: harness`/`pin: tests` entries are
  # the measured numbers recorded verbatim from the cited docs, re-proven at
  # the harness's re-triggers.

  # THIS SECTION STAYS LAST IN THE FILE: rule 5's registry canary appends an
  # uncited entry here and expects it to land inside this mapping.
  apps.example.selectors.list_widgets: 2 # the paginator's pair — the page (1) + the COUNT
  # (1), pinned separately since F1d/F1a; M1 verdict rows 3–8.
  # RE-MEASURED 2026-08-22 (P3 F2) through the RENDERING probe and unchanged at 2, which
  # is the whole point rather than a null result: `probe_list_widgets` now passes every
  # row of the page through `WidgetOut.from_orm` — the same call the door makes — and that
  # costs nothing extra only BECAUSE `list_widgets` selects `owner` and `organization`.
  # Until the probe fetched the page and never touched a row, so stripping the
  # `select_related` cost it zero statements and this pin stayed green over the canonical
  # N+1 it exists to catch (done-line item 2(c)). The same strip now measures
  # 8 — 1 page + 3 rows x 2 relations + 1 COUNT — against this 2, in `--fast`.
  apps.core.middleware.resolve_org: 4 # the granted named hat (2: memberships + the slug
  # lookup) PLUS the refused hat the probe runs beside it (2 — held equal: a cheaper refusal
  # is a timing oracle). Per-shape the number is 2, M1 rows 11–13 / M3 measures 7–9; the
  # probe's total is what is recorded because the probe is what re-measures it.
  apps.core.middleware.resolve_tenant: 1 # M3 measure 5
  apps.core.models.ScopedQuerySet.governing: 1 # at the depth ceiling (12 segments), over a
  # populated policy chain since F1d; M1 rows 9–10
  apps.core.audit.AuditEntry.objects.for_tenant: 1 # page of 50; M2 measure 10, F1b re-measure
  apps.core.audit.AuditEntry.objects.for_platform: 1 # page of 50; M2 measure 12, F1b re-measure
  apps.events.selectors.list_stranded_outbox: 1 # with or without limit/already_seen (F1c);
  # the ceiling rides the registry entry's constants (RECONCILE_BATCH = 500, MAX_BATCHES = 20)
  apps.events.selectors.endpoints_for: 1 # M2 measure 4; the wants() filter is Python
  apps.accounts.services.authenticate_token: 2 # cold: the key_hash read + the throttled
  # touch. Warm is 1 (N6) and is the harness's to hold — the probe rolls back, so it is
  # always cold.
  apps.realtime.selectors.list_subtree_org_ids: 1 # all six hats, all three worlds; M4 §2.
  # HOLD closed by SEC-R2: F1e's re-measure holds this count at 1 in all three worlds with
  # migration 0015 applied, and its evidence forbids naming an index in the registry entry's
  # plan clause — three indexes narrow this read and the planner mixes them within one plan.
  apps.realtime.bridge.push_event: 0 # a push reads NOTHING (M4 §2/§8) — the zero that keeps
  # every emit from becoming an N+1 across every connected socket
  # -- harness-certified (recorded, cited, re-proven at perf/'s re-triggers):
  apps.events.services.enqueue_dispatch: 9 # incl. the nested record_run and both audit rows
  apps.events.services.record_delivery_attempt: 5 # the retry path; first attempt is 6
  apps.events.services.close_outbox: 4 # exactly one of which is the audit row (rule 13)
  apps.workflows.activities.stranded_runs: 1 # PER TENANT; the total is linear in tenants by
  # design (rule 8's honest price)
  apps.realtime.consumers.TenantEventsConsumer.connect: 1 # subtree reads per connection,
