# Rising floors — the only "warn" shape the gate has, and it never warns: it
# BLOCKS on growth and stays silent on existence. Each budget records a value
# measured from the real tree on the date beside it. The check fails when the
# measured value GROWS past the recorded ceiling; shrinking tightens nothing by
# itself — a human commits the lower number when the shrink is real (that
# asymmetry is the point: the ceiling only ever moves by a person's hand, in a
# diff a reviewer sees).

# A NEW subject (a new services.py, a new *Out schema) has no ceiling and FAILS
# until somebody measures it and records it here — green-because-unrecorded is
# not a pass.

# Seeded 2026-08-19 from main. The numbers are the measured values, verbatim:
# a ceiling above reality would be headroom nobody granted.

