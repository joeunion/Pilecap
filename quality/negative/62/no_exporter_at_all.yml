# zzz_canary: rule 62's self-test negative — a bare run step, and nothing exported before it.
name: zzz-canary
on: [workflow_dispatch]
jobs:
  zzz_canary_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: a run with no env and no exporter
        run: echo "nothing wrote a credential into this job"
