# zzz_canary: rule 62's self-test negative — every exported name pinned empty.
name: zzz-canary
on: [workflow_dispatch]
jobs:
  zzz_canary_job:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::000000000000:role/zzz-canary
          aws-region: us-east-1
      - name: all three pinned
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: echo "this step holds no cloud credential"
