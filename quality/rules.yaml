# The house rules — single source of truth.

# Each rule: `id` (the number architecture.md gives it) · `statement` (the
# standard) · `check` (the AST/file check in quality/checks.py, when one runs) ·
# `django_check_ids` (the system-check ids in apps/core/checks.py, when the
# registries are the stronger witness) · `diff` (the change-shaped checks the
# --diff layer runs for this rule) · `doc` (where the human-readable one-liner
# lives — consistency-checked) · `scope` (DERIVED by the check, never typed;
# what appears under scope here is allow-lists and exemptions, each with a
# reason — judgements people wrote down, not lists of what to scan) · `floors`
# (minimum matched scope; below floor the check is UNBOUND and
# green-because-empty is not a pass) · `canaries` (planted violations, injected
# through the real scope at self-test time; a canary that does not fire is exit
# 2) · `negatives` (false-positive shapes kept forever as regressions) ·
# `selftest_floor` (below) · `does_not_cover` (declared blind spots — the
# surveyor's rotation map).

# `selftest_floor: { canaries: N, negatives: M }` — the self-test population
# this rule's plan holds, RECORDED rather than counted off the lists above
# `--selftest` prints one line per rule — fired/recorded
# and silent/recorded — and a rule below its floor is exit 2 NAMING THE RULE.
# Recorded and not derived on purpose: a total counted from the same file it is
# checking cannot notice that file shrinking, so a canary deleted from a plan
# would take its own expectation with it and the run would stay green. Same
# grammar as `floors` and the budget ceilings — growth is a printed note a
# human may commit, a shortfall is broken enforcement.

# Overrides: a line carrying `# rule-<id>: <reason>` (on the line, or in the
# contiguous comment block directly above it) suppresses that rule there. Every
# override is COUNTED and printed in the gate's standing overrides section. An
# override with no reason is itself a violation.

# Exit semantics: 0 clean · 1 violations · 2 ENFORCEMENT BROKEN (dead canary,
# unbound scope/floor, consistency failure, negative-corpus hit, unknown flag).
# 2 outranks a pass.

# `needs_app: <label>` on a canary or negative entry — the app whose world that
# FORM needs. Derived from the plant path by default (`apps/<label>/…`) and
# declared only where the derivation cannot see it: rule 41's
# `undeclared_example_route` plants into the probe app and asserts about the
# EXAMPLE census, so its world is the example's and no path says so. A form
# whose app this deployment disabled is not planted, the rule's expectation
# falls by exactly that many, and the self-test line names the app that paid.
# The whole argument is in quality/worlds.py.

# `registry_floors: {<floor>: <basis>}` on a rule that carries a `registry:` —
# what each floor's number COUNTS, so the expectation can be derived from the
# apps a deployment actually holds rather than pinned to the tree that measured
# it. Required only of a registry an OPTIONAL app feeds; without it the
# self-test refuses, naming the registry. Bases: `members`, `probed_members`,
# `lookup_column_members`, and `opaque` for a number the registry cannot count
# (which carries its reason on the rule and is printed, never silent).

# THE SELF-TEST'S OWN BACKLOG. A rule whose EVERY canary form plants into
# an app declaring `optional = True` keeps running and stops being able to
# demonstrate a failure the moment a product ships without that app — a rule an
# environment variable deleted. Eighteen of this tree's rules are in that state
# today, measured 2026-08-29 at tree 7a2da23: the worked example is where almost
# every fixture has always been planted, because it is the app with one of
# everything. The number is a RATCHET in the same grammar as `ratchets:` — the
# members are printed by name on every self-test run, it may shrink and never
# grow, one over it turns the whole census into exit 2, and a human commits the
# lower number in a diff somebody reads. The repair per member is one canary
# form re-homed into an app the product cannot remove; it is deliberately left
# to a rung of its own, because re-homing eighteen plans is eighteen judgements
# about what each rule's subject really is, and doing them in a batch is how a
# canary comes to prove the fixture rather than the rule.
selftest_residence_backlog: 18

# THE SCOPE KINDS — which language a rule is written about.
#
# Everything above answers *which apps this run holds*. A rule about a language
# that is not Python needs the sibling fact, and it is three declarations and no
# more: the ROOTS its rules are about, the SUFFIXES that belong to it, and the
# COMMENT token a valve is written with. The engine's override walk and its
# runner invocations both read this, which is what keeps "where this rule
# scans" and "where this rule's exemptions count" from being two lists that can
# disagree. `quality/worlds.py` carries the argument; `quality/gate.py` refuses
# a kind that is missing any of the three.
#
# A valve is the SAME mechanism in every kind — the id, the reason, the reason
# floor, the standing census — spelled in the comment syntax that language
# has. `// rule-<id>: <reason>` is not a second grammar; it is the one grammar
# with a different token, which is why the pattern is built from this table
# rather than written out twice.
scope_kinds:
  py:
    roots: [apps, config]
    suffixes: [".py"]
    comment: "#"
    skip_dirs: [__pycache__]
  js:
    # The browser tree. `needs_tree` is declared here rather than on each rule
    # because every rule of this kind is about the same tree, and a template
    # that never grew one is the steady state rather than a defect: the live
    # scan skips and SAYS SO, per rule, and every floor derives to 0.
    roots: [frontend]
    needs_tree: frontend
    suffixes: [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"]
    comment: "//"
    # THE ONE DECLARATION F1 CLOSED. Before this line the `js_secrets` runner
    # carried its own SKIP_DIRS literal while the engine's override walk knew
    # only `__pycache__` — two lists that could disagree, and did: a 12k-file
    # `node_modules` took `all_overrides()` from 0.1s to 1.55s and let a
    # vendored valve enter the standing override census. Both halves —
    # `quality/gate.py`'s walk (`quality.worlds.kind_skip_dirs`) and every
    # runner under `quality/runners/` (`quality/runners/_kindscope.py`) — read
    # THIS list and no other.
    skip_dirs: [node_modules, .next, .turbo, dist, build, coverage, .git]

# THE SEAM'S OWN RECORDED POPULATION.
#
# The runner seam is a PROCESS BOUNDARY, and its failure modes are the ones no
# planted file can produce: a runner that is missing, unrunnable, dead, slow,
# mute or lying. So its canary forms are rules rather than fixtures, driven
# through the engine's own pipeline by `quality/gate.py`'s seam leg — and held
# to exactly the grammar every other plan is held to, because a population
# counted off the length of a list cannot notice that list shrinking.
#
# THE PREFLIGHT RIDES HERE TOO, and it is the same sentence pointed at the
# tree instead of at the instrument: a self-test killed between plant and
# restore leaves its fixtures standing, and the next run reads them as the
# product's own. The dangerous half is the quiet one — a planted NEGATIVE
# reports nothing, so the run goes GREEN over a tree that is partly fixture.
# `stale_plants()` refuses that before any leg measures anything, on the
# narrowest total question there is: a plant target whose bytes ARE the
# fixture's bytes. It is the PAIR of the older refusal rather than a
# replacement: one asks whether a plant path is dirty (so a run cannot plant
# over somebody's uncommitted work), the other asks whether a plant path IS a
# fixture (so a run cannot measure the residue of the run that died). Both are
# canaried in both directions.
seam:
  # 21/10 -> 22/11 (P16 merge window), and BOTH halves have a reason, which is
  # why neither branch alone could write this pair. The extra canary is
  # SEAMFIX's: `seam_sentinel_census` drives the absent-tree sentinel in both
  # directions, so a future collision with a real tree fails LOUD instead of
  # turning the seam's own refusal into a pass. The extra negative is R-d's:
  # the JS kinds gave the seam a runner whose tree is genuinely absent on a
  # checkout without a frontend, which is the shape the sentinel exists for.
  # SEAMFIX measured 22/10 on its tree and R-d 21/10 on its own; the union is
  # 22/11 and the census said so itself rather than being told:
  #   seam selftest: canaries at 22 against a recorded 21
  #   seam selftest: negatives at 11 against a recorded 10
  selftest_floor: { canaries: 22, negatives: 11 }
  does_not_cover: >
    THE PROTOCOL, NEVER A RULE'S CORRECTNESS. This population proves that a
    reply is read, refused or believed for the right reason; whether any
    particular runner looks at the right thing, or is right about what it saw,
    is that rule's own canaries' question and is answered nowhere here. THE
    DIFF LAYER IS UNCOVERED FOR EVERY NON-PYTHON KIND: the change-shaped checks
    read Python ASTs across a ref, a runner reports about a working tree, and
    nothing yet bridges the two — so a rule of a non-default kind has a live
    scan and no diff half, declared here rather than discovered by a reviewer
    wondering why a renamed file went unnoticed. COST AND DETERMINISM ARE NOT
    MEASURED: a runner that is correct but slow, or correct but flaky across
    runs, passes everything here. BATCHING IS NOT ASSERTED — every runner rule
    invokes its own subprocess, and whether N rules can share one build-and-
    render pass is a different mechanism with different evidence behind it.
    THE PREFLIGHT READS BYTES, NEVER HISTORY: a stale plant somebody has since
    EDITED is no longer identical to its fixture and is invisible to it, and a
    form whose plant text cannot be resolved against today's migration graph is
    skipped rather than guessed at. Neither is a silent green — the first is a
    tree somebody is already working in, and the second is the self-test's own
    refusal, one leg later. THE TRI-STATE'S FOURTH CELL (tree absent, toolchain installed) is a skip
    like the third and is asserted only through the third: the tree is what
    decides whether there is a subject, so a box that happens to hold the
    interpreter has not acquired one. A RUNNER THAT ANSWERS CORRECTLY ABOUT
    NOTHING — pointed at a root that exists and is empty — is a legal reply
    here and is the FLOORS' subject, not the protocol's.

rules:
  - id: "1"
    name: no-auth-user-import
    enabled: true
    statement: >
      The custom user model is set before the first migration; auth.User is
      never imported or referenced by label. get_user_model() /
      settings.AUTH_USER_MODEL only.
    check: auth_user_import
    doc: { file: docs/product/architecture.md, contains: "`auth.User` is never imported" }
    valve:
      marker: "<comment> rule-1: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { files_scanned: 90 }
    does_not_cover: >
      apps.get_model("auth", "User") called with variables; a string "auth.User"
      built at runtime. Both are shapes nobody writes by accident.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: import_user.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: fk_label.py, plant_at: apps/example/models.py, mode: append }
    negatives:
      # MOVE-TRIGGER 2026-08-24: a negative kept in a real product app,
      # because the legal form is worth proving where it is actually written. Move
      # it to the probe app's `services.py` the day `apps/accounts/services.py` is
      # split or renamed — a fixture appended to a module nobody has is silence that
      # proves nothing.
      - { fixture: get_user_model.py, plant_at: apps/accounts/services.py, mode: append }

  - id: "2"
    name: models-inherit-basemodel
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    statement: >
      Every concrete model in a local app inherits core.models.BaseModel
      (UUIDv7 pk, created_at, updated_at). Read off the live model registry.
    check: null
    django_check_ids: [djb.E002]
    floor_proxy: count_model_classes
    doc: { file: docs/product/architecture.md, contains: "every concrete model inherits" }
    valve:
      none: "this rule reports only through the django system-check leg (manage.py check --tag djb), and those findings never pass through apply_overrides, so no comment anywhere suppresses one. The shape is corrected, or the rule's declared scope moves in a diff a reviewer reads"
    scope: {}
    floors: { model_classes: 12 }
    does_not_cover: >
      a model in a third-party app the product mounts; an unmanaged model
      mapping an external table (none exist yet — the first one earns an
      exemption here with its reason).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: rogue_model.py, plant_at: apps/zzz_canary/models.py, mode: create,
          via: django, expect: { id: djb.E002, contains: RogueThing } }
      - { fixture: rogue_via_base.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E002, contains: RogueSecond } }
    negatives:
      - { fixture: good_model.py, plant_at: apps/zzz_canary/models.py, mode: create,
          via: django, expect: { id: djb.E002 } }

  - id: "3"
    name: routes-declare-auth-and-paginate
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    statement: >
      Every API route carries an explicit auth= — on its router or the route —
      and never auth=None outside the allow-list below; every list route is
      @paginate'd. Read off the live ninja registry. A new route ships with a
      test naming its url_name (diff layer). And the third clause, off the live
      URL configuration: the first-party PLAIN Django views this deployment
      mounts — the ones in neither registry the two clauses above can read —
      are SET-EQUAL to `allow_unauthenticated_views` below, each carrying the
      reason it answers without a credential.
    check: null
    django_check_ids: [djb.E003, djb.E030, djb.E031]
    floor_proxy: count_routes
    diff: [route_without_test]
    doc: { file: docs/product/architecture.md, contains: "never `auth=None` outside the allow-list" }
    valve:
      marker: "<comment> rule-3: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding. The django system-check half of this rule honours no comment valve: those findings never pass through apply_overrides"
    scope:
      # THE allow-list: the only legitimate auth=None is a
      # signature-verifying inbound webhook receiver — it proves who it is with
      # an HMAC over the raw body, which OpenAPI has no vocabulary for. Named by
      # url_name (the registry's handle) and operation_id (OpenAPI's), so the
      # exemption survives a remount and does not survive being copied to a
      # different route. The two tests that used to carry private copies of
      # this set (apps/core/tests/test_introspect.py,
      # apps/example/tests/test_api.py) defer to it via apps.core.checks.
      allow_unauthenticated:
        - url_name: "api:connection-webhook"
          operation_id: "apps_connections_api_receive_webhook"
          reason: >
            an inbound webhook arrives from somebody else's server with no
            session and no token; the HMAC signature over the raw body is its
            credential, verified in apps/events/receivers.verify_and_store.
        - url_name: "api:realm-discover"
          operation_id: "apps_accounts_api_discover_realm"
          reason: >
            home-realm discovery (A9): a login form asks "where does this
            address sign in?" BEFORE anybody is signed in — there is no
            credential it could require. What stands in for one is that the
            answer is a single bit plus an opaque connection id
            (apps/accounts/selectors.py), behind its own throttle on top of
            the API's.
      # THE SECOND POPULATION, and it is a SEPARATE key on purpose. The list
      # above is the ninja registry's — `apps.core.checks`
      # reads it, and two tests assert set EQUALITY against the live routes
      # (apps/core/tests/test_introspect.py's
      # `test_the_allow_listed_routes_are_the_only_unauthenticated_ones`,
      # apps/example/tests/test_api.py's
      # `test_the_document_declares_no_other_open_route`). A plain Django view
      # is in neither registry: put it in the list above and both equalities
      # fail, because the check is looking for it somewhere it can never be.
      # So the judgement is recorded here, in its own key, under the same rule
      # — a Django view that answers without a credential, with the reason
      # somebody can disagree with. Read by
      # apps/core/tests/test_index.py::test_the_root_index_is_recorded_with_its_reason.

      # This key is now a SET EQUALITY, not
      # a list. `apps/core/checks.py::check_plain_view_auth` enumerates every
      # first-party plain view off `get_resolver()` — a URL pattern whose
      # callback was DEFINED under `apps.` or `config.`, `functools.partial`
      # unwrapped — and demands the two sets match, in both directions
      # (djb.E031). Before it, four of the six entries below existed only as
      # prose in a docstring and nothing refused the next unrecorded one; a
      # recorded name with no live view is the other rot and now fails too.
      # THE REASONS BELOW FOR `healthz`, `readyz` AND
      # `oauth-protected-resource` were moved here from those views' own
      # docstrings, which is where they lived alone.
      allow_unauthenticated_views:
        - url_name: "llms-txt"
          view: "apps.core.api.docs.llms_txt"
          reason: >
            the agent-readable rendering of the contract, derived at request
            time from the same document openapi.json already answers
            unauthenticated at this deployment — it exposes strictly less than
            a page that is already open, and an agent must be able to read the
            map before it holds a key.
        - url_name: "index"
          view: "apps.core.views.index"
          reason: >
            a door index names doors; it opens none. The page reads no request
            state at all — no session, no tenant, no user — and every href on
            it is either already public (the probes, the login page) or a route
            that demands its own credential when it is followed.
        - url_name: "healthz"
          view: "apps.core.health.healthz"
          reason: >
            liveness, and it touches nothing — no database, no cache, no
            Temporal. A probe has no credential to present: kubelet, an ALB
            target group and a compose healthcheck all speak unauthenticated
            HTTP, and gating liveness behind a token makes a rotation outage
            look exactly like a dead fleet. What it gives away is bounded at
            zero: the honest answer to "is this process alive" is that it
            answered.
        - url_name: "readyz"
          view: "apps.core.health.readyz"
          reason: >
            readiness, for the same caller as `healthz` and with the same
            absence of a credential to offer. What it discloses is three
            booleans and nothing else — which of database, cache and Temporal
            this replica can currently reach — with no versions, no hostnames
            and no error strings; an unreachable database is `false`, never a
            connection string in a stack trace (apps/core/health.py holds the
            liveness/readiness distinction itself).
        - url_name: "oauth-protected-resource"
          view: "apps.accounts.oauth.protected_resource_metadata_view"
          reason: >
            RFC 9728 discovery (ADR ident-3), and being readable without a
            credential is the whole job: a third-party MCP client fetches this
            to learn which authorization server to go and get a token FROM. A
            metadata document behind authentication is a chicken-and-egg no
            client can break, and everything in it is already public — the
            issuer is in every redirect and the resource URL is the endpoint
            being called.
        - url_name: "sign-in"
          view: "apps.accounts.views.sign_in"
          reason: >
            THE sign-in page. It is the one URL in this deployment that is
            reached BEFORE anybody holds a credential, so there is none it
            could demand — demanding one is the door locked from the inside.
            It shadows `/accounts/login/` one line ahead of `allauth.urls`
            (design C-13) and under `SIGN_IN_DOOR=hosted`, the default, it
            calls allauth's own `LoginView` and is byte-identical to the page
            that was already open at this URL and already unauthenticated.
            Under `ours` it draws the entrance frames and POSTs a password to
            the sign-in CHECK (`apps/accounts/signin.py`), which holds the
            four fail-closed rules, our own per-address and per-client
            throttle in front of the identity platform's lockout, and one
            sentence for a wrong password, an unknown address and a locked
            account alike. It writes no row of ours: the only writer on the
            road is allauth's `complete_social_login`, through the adapter
            whose three refusals decide whether a check becomes a session.
        - url_name: "api-not-found"
          view: "config.api.api_not_found"
          reason: >
            The JSON 404 for an unmatched route. Mounted after the API, so it is reached only once
            Django's resolver has already failed INSIDE it and it can shadow no
            route. It authenticates nobody because it answers nobody: the body
            is `{detail, code}` from the one composer, telling a caller their
            path matched nothing. Demanding a credential to be told that would
            answer a typo with a 401 and teach a first-time client the wrong
            thing about the contract.
      # THE THIRD KEY, and the amendment `does_not_cover` below named in
      # advance. The clause cannot read authentication off a plain Django view,
      # so it demands that every first-party one be recorded — and until the
      # auth-chain rung of 2026-08-31
      # every one of them was genuinely open, which is why there was one key.
      # `welcome` is the first that demands a credential. It goes here rather
      # than above because putting it above would record a false reason, and the
      # check refuses a name that appears in both keys.
      authenticated_views:
        - url_name: "welcome"
          view: "apps.core.views.welcome"
          demands: >
            a session. `@login_required`: an anonymous GET is a 302 to the
            sign-in page and nothing is rendered. It is the shipped placeholder
            landing — where `LOGIN_REDIRECT_URL` derives to when a clone has no
            front end of its own — and everything on it is a fact about the
            request that reached it: who the session is, which tenant and which
            acting organization it resolved to, and what role that hat carries.
            It reads no row it was not already handed except the role lookup,
            writes nothing, and is SHADOWED by any product route mounted at the
            same path. It also carries `ensure_csrf_cookie`, which is what
            retires the reader-less-declaration finding: it is the bootstrap
            page the CSRF comment in
            config/settings/base.py used to name in the abstract.
        - url_name: "admin-login"
          view: "apps.accounts.admin.admin_login"
          demands: >
            a session, and then staff. It shadows `/admin/login/` one line ahead
            of `admin.site.urls` (ADR ident-4): Django's own page there was
            an Email and a Password field POSTing against `User.password`, which
            is the second credential store the ADR closed. Anonymous is a 302 to
            the one sign-in door and nothing is rendered — `welcome`'s shape,
            which is why it is in this key and not the one above; signed in and
            staff is a 302 into the admin; signed in and not staff is a 403 page
            in the entrance shell saying why, with no form, no field and no
            retry. A POST is 405 and reaches no authentication backend at all.
            It reads nothing but the session it was handed and writes nothing.
            It carries `ensure_csrf_cookie` because the page it replaced issued
            that cookie by rendering a form, and four over-the-wire modules take
            their server-issued token from a GET of this URL; a CSRF token
            authenticates nobody and is useless without the session it is bound
            to.
        # THE SAME SHADOW, THE TWO URLS BEHIND IT. These two entries are
        # also the canary that reds when the mount is severed: this clause's
        # last branch fires `djb.E031` for a name recorded here that no
        # first-party plain view is mounted under, so deleting either
        # `config/urls.py` line turns the reason below into a stale judgement
        # and says so by name.
        - url_name: "admin-password-change"
          view: "apps.accounts.admin.admin_password_change"
          demands: >
            a session, and nothing more — and unlike its sibling above, being
            staff buys nothing here, because the page is gone for everybody.
            It shadows `/admin/password_change/`, which answered 200 with three
            `type="password"` inputs and whose POST changed `User.password` on
            the row: the second credential store ADR ident-4 closed, still
            writable one URL behind the login page I8 shut. Anonymous is a 302
            to the one sign-in door and nothing is rendered (`welcome`'s shape,
            which is why it is in this key); any session is a 403 page in the
            entrance shell saying why, with no form, no field and no retry. A
            POST is 405 and reaches no form at all. It reads nothing but the
            session it was handed and writes nothing.
        - url_name: "admin-password-change-done"
          view: "apps.accounts.admin.admin_password_change"
          demands: >
            a session, and the same nothing more: it is the SAME callable as
            the entry above, mounted at `/admin/password_change/done/`. The
            page it replaces said "Password change successful" — true of
            nothing, in a deployment whose credentials live at the identity
            platform — and it is reachable by typing a URL that was in
            somebody's history long after the form in front of it is gone. Two
            mounts and one view rather than two views: one refusal page is the
            whole behaviour, and a second callable would be a second place for
            it to drift.
        # THE THIRD PASSWORD SURFACE, and it is in this key BECAUSE the rung
        # refused it. `DjangoUserAdmin.user_change_password` mounts inside
        # `get_urls()`, so it is not shadowable from `config/urls.py`; the
        # fix overrides the method, and overriding it moved its `__module__`
        # from `django.contrib.auth.admin` to `apps.accounts.admin` — which is
        # what put it in this census for the first time. That is the canary
        # working in both directions: delete the override and the name falls
        # out of the live population, leaving this entry stale, which is
        # `djb.E031` by name.
        - url_name: "admin:auth_user_password_change"
          view: "apps.accounts.admin.UserAdmin.user_change_password"
          demands: >
            a session, staff, and `auth.change_user` — `AdminSite.admin_view`
            wraps it, so an anonymous browser never reaches the callable at
            all and a staff member without the permission is Django's own 403.
            It is in this key rather than the open one for that reason and not
            for its body, which refuses everybody: on the baseline of the rung
            that closed it a SUPERUSER GET answered 200 with two
            `type="password"` inputs and the POST wrote ANOTHER PERSON'S
            `User.password` with no current password asked for — the widest of
            the three doors onto the store ADR ident-4 closed, and reachable
            for exactly the population `createsuperuser` creates. It now
            renders the same 403 refusal page the two shadowed `AdminSite`
            URLs do. It reads nothing but the session it was handed and writes
            nothing.
    # Re-pinned at the measurement in the commit that fixed
    # `count_routes`' package blindness — it read 69 where the live registry has
    # 86, because it walked `api.py` by basename and `apps/core/api/routes.py`
    # holds seventeen routes. AT the measurement rather than conservatively, the
    # same judgement rule 41's floors record: a floor below the truth is silent
    # while the surface disappears. Growth is free; a removal is a number a
    # human re-commits.
    floors: { routes: 86 }
    does_not_cover: >
      whether the auth a route declares is the RIGHT auth for what it serves;
      a route that authenticates but authorizes nothing (rule 13's side); the
      quality of the test that names a new route's url_name — its existence is
      checked, its assertions are review's. ON THE THIRD CLAUSE: it
      cannot tell an AUTHENTICATED plain view from an unauthenticated one.
      There is no `auth=` on a Django view to read and no registry that knows,
      so the clause demands that EVERY first-party plain view be recorded with
      a reason — in `allow_unauthenticated_views` if it is open, in
      `authenticated_views` if it demands a credential, and never in both. THE
      SECOND KEY ARRIVED WITH THE VIEW THAT TRIGGERED IT (the auth-chain rung
      of 2026-08-31, `welcome`),
      exactly as this clause said it would; before that every first-party plain
      view was genuinely open and one key was enough. What it still cannot do
      is VERIFY the claim: a view recorded in `authenticated_views` is taken at
      its word, so a decorator somebody deletes reads as green here and is
      caught only by that view's own test. The FIRST-PARTY TEST IS A MODULE PREFIX —
      `apps.` or `config.` on the module the callback was defined in — which is
      what keeps ninja's operations, ninja's own document views, admin, allauth
      and every `TemplateView` out of the population without a hand list; it
      follows that a first-party view mounted THROUGH a third-party wrapper
      that rebinds `__module__` would fall out of the census, and that a
      third-party package importing a view from `apps.` would fall into it.
      `functools.partial` is unwrapped (five links); no other wrapper is, and a
      decorator that does not carry `__module__` through would read as its own
      module. It sees what THIS PROCESS mounts: a view behind a settings flag
      that is off here is absent from the census and from the key at once,
      which is right for equality and means a deployment-specific mount is a
      deployment-specific number. And it says nothing about what an open view
      DISCLOSES — that `/readyz` answers three booleans and not a stack trace
      is held by that view's own tests, not here.
      ON THE LIST CLAUSE, WIDENED IN P15 R7: the population is now `list[X]` OR
      the cursor envelope (`apps.core.api.pagination.answers_cursor_envelope`,
      ADR core-24) and the demand is that a caller can WALK — `@paginate`, or
      `cursor` and `limit` in the signature. What it does NOT see: whether the
      controls a route declares are WIRED to anything, so a route that takes
      `cursor` and ignores it passes here and is caught only by the derived
      drives in `apps/core/tests/test_pagination.py`; whether an envelope a
      route builds by hand is HONEST, since `has_more` and `next_cursor` are
      fields it fills itself; and any list surface that is not a REST route —
      the socket and MCP doors answer collections too and neither is in this
      population, which is REST-only, declared rather than assumed. Nor does it
      see a list with no response model at all: both halves read the 2xx model,
      so a route that declared none is invisible to the clause entirely.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 5, negatives: 3 }
    canaries:
      - { fixture: open_route.py, plant_at: apps/zzz_canary/api.py, mode: create,
          via: django, expect: { id: djb.E003, contains: canary-open } }
      - { fixture: flat_list_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E030, contains: canary-flat-list } }
      # THE SECOND SHAPE OF THE SAME CLAUSE. The one above is a
      # BARE list; this one ANSWERS THE CURSOR ENVELOPE and offers no `?cursor=`
      # to spend the `next_cursor` it publishes. It is planted because the bare
      # form was proving nothing about this tree: the `list[` string-match
      # `_is_list_response` used to be saw ZERO of the twenty-five mounted lists,
      # every one of which answers the envelope — so E030 fired only ever
      # against its own canary. `answers_cursor_envelope` (ADR core-24) is what
      # widened the population, and this is the plant that holds it widened.
      - { fixture: envelope_route_without_controls.py, plant_at: apps/zzz_canary/api.py,
          mode: append, via: django,
          expect: { id: djb.E030, contains: canary-envelope-list } }
      - { fixture: diff_unproven_route.py, plant_at: apps/example/api.py, mode: append,
          via: diff, expect: { contains: canary-unproven } }
      # This clause, planted where the check applies: `config/urls.py` is the
      # module that mounts plain views, so a canary anywhere else would be
      # proving the check against a tree Django never resolves. The plant is an
      # APPEND — one `urlpatterns.append(...)` after the list is built — which
      # is both the smallest possible edit and the shape a rung actually lands.
      - { fixture: unrecorded_plain_view.py, plant_at: config/urls.py, mode: append,
          via: django, expect: { id: djb.E031, contains: canary-open-view } }
    negatives:
      - { fixture: good_routes.py, plant_at: apps/zzz_canary/api.py, mode: create,
          via: django, expect: { id: djb.E003 } }
      # The OTHER legal road to a paged list, and the one the widened population
      # made it possible to get wrong: `cursor` and `limit` in the signature, no
      # decorator. Three mounted routes are this shape. A clause that fired here
      # would have decided the decorator is the only way to page, which would
      # make the seam a tax instead of a contract.
      - { fixture: direct_cursor_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E030 } }
      # The recorded set, unmoved: a second mount of a view the key already
      # holds, under the name it already holds. `urlpatterns` grew and the
      # census did not, so silence is the whole assertion — a clause that fired
      # on any new pattern would tax mounting anything at all.

      # `expect.contains` is what makes this negative real. The django negative
      # probe reads a fired negative off lines naming the PROBE APP, and a
      # plant into `config/urls.py` names no app at all — so without a declared
      # signature this fixture could fire and be recorded as silent. The string
      # is E031's own first branch, which nothing else in the tree emits.
      #
      # IT MOVED WITH THE MESSAGE (the auth-chain rung of 2026-08-31). The
      # branch used to say "is not
      # recorded in rule 3's `allow_unauthenticated_views`" and now names both
      # plain-view keys, because there are two. A `contains` left pointing at
      # the old wording is the worst outcome available here: the negative would
      # read as silent WHATEVER it did, forever, and nothing would say so.
      - { fixture: recorded_plain_view.py, plant_at: config/urls.py, mode: append,
          via: django,
          expect: { id: djb.E031, contains: "is recorded in neither of rule 3's plain-view keys" } }

  - id: "4"
    name: no-signal-logic
    enabled: true
    statement: >
      No business logic in signals: no @receiver, no signal .connect(), no
      signals.py with function bodies. Services own writes.
    check: signal_logic
    doc: { file: docs/product/architecture.md, contains: "no business logic in signals" }
    valve:
      marker: "<comment> rule-4: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { files_scanned: 90 }
    does_not_cover: >
      logic hidden in a model's save()/clean() (rule 15 bans business logic in
      save() but AST cannot judge "business"); allauth's own signal use inside
      the third-party package; a receiver connected via a string path in
      settings.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: receiver_module.py, plant_at: apps/example/signals.py, mode: create }
      # MOVE-TRIGGER 2026-08-24: planted in a real service module because
      # that is where a `.connect()` would actually be smuggled. Rule 4 has no
      # healthy shape that could absorb it, so the trigger is structural: move it to
      # the probe app the day `apps/events/services.py` is split or renamed.
      - { fixture: connect_call.py, plant_at: apps/events/services.py, mode: append }
    negatives:
      # MOVE-TRIGGER 2026-08-24: the one legal `.connect()` — Temporal's
      # client — proved beside the module that really makes it. Move it the day
      # `apps/workflows/services.py` stops building a client: a negative whose real
      # form has left the tree defends nothing.
      - { fixture: temporal_connect.py, plant_at: apps/workflows/services.py, mode: append }

  - id: "5"
    name: list-query-budgets
    enabled: true
    memo:
      "no": "this rule reads perf/measure_hierarchy.py and reloads the perf.seed module, both outside
        every scope kind's roots, so the walk this key is built from cannot see either of them move"
    # WIDENED by cycle P3 E1 (ADR gate-2): the scope grows from "list
    # endpoints" to the DECLARED hot-path registry — rule 35's `registry:`
    # list below, the plan's ratified location for the dotted selector paths.
    # The counts live in quality/budgets.yaml `hot_path_query_counts` under
    # the rising-floor grammar; they are gate-scale counts BECAUSE the harness
    # proved them flat under doubling (ADR perf-1's division of labor: the
    # harness proves flatness once, the gate pins the count forever).
    # THE STAMP. A citation
    # says WHICH LINE of a doc earned an entry; it says nothing about which
    # WORLD that line was measured in. Four measurement docs carried spec hash
    # `9959d8a1c073`, `perf/seed.py::ScaleSpec` hashed to `df07df482a95` (F1d
    # added `many_hats` and `workflow_runs_platform`), the fifth carried no
    # hash at all — and nothing compared any of it. The seeder checks its stamp
    # against the DATABASE on every run and re-seeds on a miss; the stamp in
    # the PROSE was checked by nobody, so every number in every doc could go on
    # citing a world that had stopped existing, silently. The check now
    # computes `spec_hash(ScaleSpec())` from the seeder itself and demands each
    # cited doc — and `docs/product/scale-envelope.md`, which cites nothing and
    # states the spec for the whole product — carry it.
    statement: >
      Every paginated list endpoint's app carries a query-count pin
      (assert_num_queries) at seeded scale, so an N+1 is a failure rather than
      a slow page. A NEW paginated route in a change requires the pin in the
      same tree (diff layer). And every DECLARED hot path (the registry on
      rule 35) has a recorded gate-scale statement count in
      quality/budgets.yaml — a count nobody measured is vibes with teeth. The
      scale envelope carries the spec hash perf/seed.py::ScaleSpec computes
      today: a doc that names one the fixture contract no longer declares is a
      set of numbers about nothing.
    check: query_budget_tests
    diff: [list_route_without_budget]
    doc: { file: docs/product/architecture.md, contains: "floors on list endpoints at seeded scale" }
    valve:
      marker: "<comment> rule-5: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # `stamp_candidates` is the floor and `stamped_docs` is the verdict: a stale
    # stamp must be a VIOLATION (exit 1) and an empty doc set broken enforcement
    # (exit 2), and flooring the verdict would report a `ScaleSpec` move as the
    # gate being broken.
    floors:
      paginated_routes: 2
      hot_paths: 18
      stamp_candidates: 1
    does_not_cover: >
      whether the pinned number is measured or copied; whether the pin covers
      THIS route or a sibling in the same app — the mapping is app-level, route
      accuracy is review's; MCP list tools' budgets (test_mcp pins the example;
      nothing forces the next app to). On the stamp half, the blind spot is
      exactly one clause wide and it is the important one: the stamp proves a
      doc NAMES the spec its numbers were measured under, never that they WERE.
      A `ScaleSpec` edit obliges a re-measure and this check can only demand
      one, not perform it — the re-stamping commit is where a human runs the
      census and says the counts held, and a builder who re-stamps without
      re-running has produced a doc that is precisely as wrong as before with a
      newer number on it. Nor does it see a doc that carries the right hash
      beside numbers from a doubled-axis world (`--double`): the doubling runs
      are recorded in the same files under their own headings and no stamp
      distinguishes them. On the registry half: write-path counts
      (enqueue_dispatch, record_delivery_attempt, close_outbox) and the
      call-count seams (consumers connect, the JWKS cache) are certified by the
      harness and RECORDED here with their citations, not re-executed by the
      gate — perf/ re-proves them at its re-triggers; and the door-tier
      X-Org/token counts (9 / 7 / 6) have no apps-tests pin yet — M3
      recommends one, and booking it is the PM's, not this rule's. On the
      lookup-citation half: the check asserts that the cited passage
      NAMES the column, never that the passage SAYS what the declaration
      claims — a doc line that mentions the column while measuring the opposite
      verdict passes, which is exactly the state
      `core_auditentry.tenant_id` is in today (its citation points at FINDING A,
      where the column is a `Filter:`, because F1b's post-fix re-measure was
      never appended to that doc). Rule 35's `lookup_columns_unproven` ratchet
      is the other half of that admission, and the reviewer reads the two
      together. Nor does the window know about document structure: fifteen lines
      is a heuristic for "in this passage", and a doc that grows a paragraph
      between an anchor and its plan block will need the anchor moved.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 7, negatives: 2 }
    canaries:
      # THE PLANT SITE IS THE PROBE APP, and that is a repair with a date on it.
      # These two planted into `apps/events` until B-EVT gave that app a REST
      # door with proper query pins, at which point they went SILENT and
      # the full gate went exit 2 — a dead canary, correctly refusing the push.
      # Nothing about the rule or the tree was wrong: the pin check is APP-level
      # by design (`does_not_cover` books route accuracy as review's), so a
      # pinned app absorbs any route planted into it. A canary whose liveness
      # depends on a product app never growing a feature dies exactly when the
      # tree is healthy, and it takes the push queue with it. The probe app is
      # created by the plant, has no `tests/`, and is removed by `restore()`, so
      # it cannot be pinned by anybody; its `apps.py` rides along as an
      # extra_file because `_app_dirs()` is "a directory with an apps.py" and a
      # plant outside that population would be a canary that cannot fire for a
      # reason unrelated to the rule.
      - { fixture: unpinned_list_api.py, plant_at: apps/zzz_canary/api.py, mode: create,
          extra_files: [ { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create } ] }
      # MOVED — the trigger fired. This plant was in `apps/realtime/api.py`
      # and was KEPT there deliberately — the argument being that only a real
      # product app proves the check walks the population it really walks —
      # carrying a dated MOVE-TRIGGER saying to move it the day
      # `apps/realtime` grew a pinned REST door. That day arrived: an
      # evening's push window went to TWO rule-5 canaries dead of TREE HEALTH,
      # no defect anywhere in the rule or the tree, the plant site the only
      # thing wrong. The trigger's condition was "the day this app gets
      # healthier", which is not a condition an instrument may depend on, so
      # it is ruled FIRED rather than left waiting.

      # WHAT THE MOVE KEPT is the distinction, which is why this is not a copy of
      # the sibling above. `_app_is_pinned` is False TWO ways — an app with no
      # `tests/` at all (the sibling's shape) and an app whose tests exist and
      # pin nothing (this one's, planted as an extra file). The second is the
      # shape a real app takes and the one whose reviewer has already been told
      # there are tests, and it is now proved in an app that cannot recover.
      - { fixture: unpinned_list_api2.py, plant_at: apps/zzz_canary/api.py, mode: create,
          extra_files: [
            { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create },
            { fixture: probe_tests_without_a_pin.py, plant_at: apps/zzz_canary/tests/test_probe.py,
              mode: create },
          ] }
      - { fixture: diff_unpinned_route.py, plant_at: apps/zzz_canary/api.py, mode: create,
          via: diff, expect: { contains: "paginated list route" },
          extra_files: [ { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create } ] }
      #, closed and canaried in the same change: an app whose routes live in
      # an `api/` PACKAGE. Both halves used to ask for `app / "api.py"` and
      # `continue` when it was absent, so `apps/core`'s three paginated lists
      # (B-CORE's organizations, memberships, invitations) were outside a rule
      # whose statement already claimed them. The population moved 15 -> 18
      # paginated routes with ZERO new violations — core is pinned — which is
      # why closing it here was affordable; these two forms are what stop that
      # from being scope nobody can demonstrate. Both halves get one, because a
      # change is judged by the rule the tree is judged by or the two layers
      # disagree about what a route is.
      - { fixture: unpinned_list_api_package.py, plant_at: apps/zzz_canary/api/routes.py, mode: create,
          extra_files: [
            { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create },
            { fixture: probe_api_package_init.py, plant_at: apps/zzz_canary/api/__init__.py, mode: create },
          ] }
      - { fixture: unpinned_list_api_package.py, plant_at: apps/zzz_canary/api/routes.py, mode: create,
          via: diff, expect: { contains: "paginated list route" },
          extra_files: [
            { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create },
            { fixture: probe_api_package_init.py, plant_at: apps/zzz_canary/api/__init__.py, mode: create },
          ] }
      # The registry seam: a count recorded for a path no registry entry
      # declares (so nothing cites a measurement) must fire. budgets.yaml keeps
      # hot_path_query_counts as its LAST section precisely so this append
      # lands inside it.
      - { fixture: uncited_hot_path.yaml, plant_at: quality/budgets.yaml, mode: append,
          expect: { contains: "no registry entry" } }
      # The stamp seam: one new axis on the fixture contract moves the hash,
      # and every doc that named the old world must say so. This is F1d's own
      # move replayed — that edit is what made four docs stale and nothing
      # noticed for a cycle.
      - { fixture: spec_moved.py, plant_at: perf/seed.py, mode: append,
          expect: { contains: "stamp" } }
    negatives:
      - { fixture: pinned_app_route.py, plant_at: apps/example/api.py, mode: append }
      # A comment appended to the budgets file is not a count and must stay
      # silent — the registry half fires on unregistered NUMBERS, not on edits.
      - { fixture: budgets_comment.yaml, plant_at: quality/budgets.yaml, mode: append }

  - id: "6"
    name: one-migration-leaf
    enabled: true
    statement: >
      One migration leaf per app; no merge migrations in the tree, ever — a
      merge migration means two agents touched one app, which is a PM ordering
      failure to surface; max_migration.txt agrees with the leaf.
    check: migration_leaves
    doc: { file: docs/product/architecture.md, contains: "migration leaf per app" }
    valve:
      marker: "<comment> rule-6: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { apps_with_migrations: 5 }
    does_not_cover: >
      a collision that has not been committed yet (two worktrees each still
      hold one leaf — the git conflict on max_migration.txt is the tripwire
      there); squashed migrations (none exist; the first squash gets read
      before this rule trusts itself on it).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 1 }
    canaries:
      - { fixture: second_leaf.py, plant_at: apps/example/migrations/0009_canary_second_leaf.py, mode: create }
      - { fixture: merge_migration.py, plant_at: apps/example/migrations/0009_canary_merge.py, mode: create }
      - { fixture: stale_max_migration.txt, plant_at: apps/example/migrations/max_migration.txt, mode: create }
    negatives:
      # DERIVED FROM example's CURRENT LEAF, and it has to be: the negative's
      # whole claim is "one honest new leaf on top of the real one", which is a
      # statement about TODAY'S graph.

      # This was PINNED until P7 Q-32b, and the comment here used to ask every
      # rung that touched `apps/example` to re-chain the fixture, the plant_at
      # number and the marker by hand. CORE-11 (0010) was the third rung to pay
      # it; R-e's `0011_widget_search_vector` was the fourth and nobody did, so
      # the plant stopped being a successor, became a SECOND LEAF, fired the rule
      # it exists to keep quiet, and blocked a push with exit 2. A fixture that
      # asks every future rung for an edit in `quality/` is the shared-file
      # collision this whole template is shaped around avoiding, aimed at the
      # gate — and `apps/example` is the designated adoption app, so it will
      # keep growing migrations.

      # All three moving parts now derive at plant time (`quality/gate.py`,
      # "plant placeholders"): `{{leaf:example}}` is the parent, and
      # `{{after:example:neg_leaf}}` is the number after it, used for the
      # filename AND for the marker so the two cannot disagree.
      - fixture: proper_leaf.py
        plant_at: "apps/example/migrations/{{after:example:neg_leaf}}.py"
        mode: create
        extra_files:
          - { fixture: proper_leaf_max.txt, plant_at: apps/example/migrations/max_migration.txt, mode: create }

  - id: "7"
    name: depends-on-honest
    enabled: true
    statement: >
      An app imports only the apps its AppConfig.depends_on declares; core
      declares nothing and imports nothing above it. The declaration lives with
      the app; this check diffs it against the app's real import graph.
    check: depends_on_imports
    doc: { file: docs/product/architecture.md, contains: "app import contracts hold" }
    valve:
      marker: "<comment> rule-7: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { apps_scanned: 5, files_scanned: 80 }
    does_not_cover: >
      a dependency taken at runtime through the bridge or importlib with a
      variable module path — that is the bridge working as designed, and
      depends_on declaring it is convention this cannot verify; imports inside
      tests (exempt by design — tests prove isolation by crossing it).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      # MOVE-TRIGGER 2026-08-24: this fires only while `apps/realtime` does
      # NOT declare the app the fixture imports. The day `apps/realtime/apps.py`
      # grows that `depends_on` entry the canary goes silent — move it to an app
      # that still does not declare it, or to the probe app with its own `apps.py`
      # as an extra_file.
      - { fixture: undeclared_import.py, plant_at: apps/realtime/consumers.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: the same dependency on the other side —
      # silent the day `apps/events/apps.py` declares what the fixture imports. Move
      # it then, the same way.
      - { fixture: undeclared_import2.py, plant_at: apps/events/selectors.py, mode: append }
    negatives:
      - { fixture: declared_import.py, plant_at: apps/example/selectors.py, mode: append }

  - id: "8"
    name: scoped-reads-through-for-tenant
    enabled: true
    # Tenancy is ON in this template. A product that opts out (single-tenant,
    # recorded in its architecture.md) sets `enabled: false` HERE with the
    # reason, and the gate prints the disabled rule on every run.
    statement: >
      Every scoped model is read through its scoped manager: a bare .objects on
      a TenantScopedModel subclass in api, services, selectors, activities,
      tools, consumers, admin, receivers or config is a violation unless the
      line carries # rule-8 with a reason.
    check: scoped_reads
    doc: { file: docs/product/architecture.md, contains: "read through its scoped manager" }
    valve:
      marker: "<comment> rule-8: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      exemptions:
        - path: apps/core/services.py
          function: pending_invitations_for
          reason: >
            the one legitimate cross-tenant read: the person signing up has no
            tenant yet — having one is what the invitation is for. Narrowed by
            the email being established, called only from the signup adapter.
        - path: apps/accounts/selectors.py
          function: realm_for_email
          reason: >
            home-realm discovery (A9): email -> domain -> tenant IS the tenant
            resolution — by definition there is no tenant to scope by until
            this read answers. One indexed read via SsoDomain.for_domain,
            answering a single bit plus an opaque id.
        - path: apps/accounts/selectors.py
          function: sso_enforced_for
          reason: >
            the same pre-auth mechanism (A9), asked by the account adapter on
            every password login — "may this address still use a password?"
            has to be answered before any tenant exists.
        - path: apps/accounts/services.py
          function: _apply_domains
          reason: >
            the cross-tenant uniqueness read (A9): an email domain routes to
            exactly one identity provider product-wide, so refusing a second
            tenant's claim requires reading across tenants. The refusal names
            the domain, never the tenant that holds it.
        - path: apps/accounts/services.py
          function: provision_sso_identity
          reason: >
            JIT provisioning (A9): SsoIdentity is looked up by (connection,
            subject) — the connection is tenant-owned and pins the tenant; the
            IdP's signed assertion is the credential that authorises the read.
    floors: { scoped_models: 6, files_scanned: 30 }
    does_not_cover: >
      a queryset passed across a function boundary and widened there; reads
      through a custom manager method that forgets to scope internally (the
      check sees for_tenant textually, not semantically — Connection.for_webhook
      carries its own # rule-8); raw SQL and .raw(); tests and migrations, by
      design.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 3 }
    canaries:
      - { fixture: bare_objects_selector.py, plant_at: apps/example/selectors.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: rule 8 scans `admin.py`, and `events` is an
      # app that has one to plant into. Move it the day `apps/events/admin.py` goes
      # away, or the day the probe app grows an admin of its own.
      - { fixture: bare_objects_admin.py, plant_at: apps/events/admin.py, mode: append }
      - { fixture: bare_override_no_reason.py, plant_at: apps/example/services.py, mode: append }
    negatives:
      - { fixture: for_tenant_chain.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: unscoped_model.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: override_with_reason.py, plant_at: apps/example/selectors.py, mode: append }

  - id: "9"
    name: workflow-determinism
    enabled: true
    statement: >
      Workflow code is deterministic: a workflows.py imports stdlib
      dataclasses/timedelta, temporalio and the app's types.py — nothing else —
      and never calls a clock, randomness, uuid or I/O. Activities do the
      world's work.
    check: workflow_determinism
    doc: { file: docs/product/architecture.md, contains: "workflow code is deterministic" }
    valve:
      marker: "<comment> rule-9: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { workflow_modules: 2 }
    does_not_cover: >
      nondeterminism reached through an allowed import (a dataclass default of
      datetime.now would need datetime and is caught; dict-ordering or
      set-iteration nondeterminism is not); workflow.now() misuse — the
      sanctioned APIs are recognised by the ROOT of their call chain, so
      `workflow.now()` and `workflow.random().randint(...)` both pass and what
      they are USED for is review's; a local variable named `workflow`
      shadowing temporalio's module (it would inherit the same pass, and it is
      a naming crime the eye catches); THE INVERSE OF THAT, which is a false
      POSITIVE rather than a false negative — `from temporalio import workflow
      as wf` and then `wf.now()`, where the sanctioned receiver is the literal
      name `workflow` and an alias is not read off the import, so the correct
      deterministic call is reported as a clock (LEX-1 gap 4; rule 18 DOES read
      its aliases off the import and this one does not, which is the asymmetry
      to close first if it is ever hit). The exit is an override with a reason,
      or spelling the import the way every workflow in the tree spells it;
      determinism of third-party code temporalio itself pulls in.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 2 }
    canaries:
      - { fixture: httpx_in_workflow.py, plant_at: apps/example/workflows.py, mode: append }
      - { fixture: orm_in_workflow.py, plant_at: apps/example/workflows.py, mode: append }
      # `hash()` needs no import, so an import-watching rule never saw
      # it — and PYTHONHASHSEED is per-process, so a hash-keyed branch replays
      # down the other leg in a different worker.
      - { fixture: hash_in_workflow.py, plant_at: apps/example/workflows.py, mode: append,
          expect: { contains: PYTHONHASHSEED } }
    negatives:
      - { fixture: timedelta_asyncio.py, plant_at: apps/example/workflows.py, mode: append }
      # The banned method names are also temporalio's own DETERMINISTIC ones,
      # reached through the workflow module: workflow.now/uuid4/time replay from
      # history. Banning them by name would send authors to the real clock.
      - { fixture: sanctioned_workflow_apis.py, plant_at: apps/example/workflows.py,
          mode: append }

  - id: "10"
    name: doors-call-services
    enabled: true
    statement: >
      Every door calls services: api, mcp, consumers, receivers, admin and
      activities never .save()/.delete() a row or .objects.create/update one —
      writes go through services.py, which owns the transaction, the authz and
      the audit row.
    check: door_writes
    doc: { file: docs/product/architecture.md, contains: "every door calls services" }
    valve:
      marker: "<comment> rule-10: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { door_files: 12 }
    does_not_cover: >
      a write hidden behind a helper the door calls (the helper's own file is
      scanned only if it is a door/selector/service file); setattr-and-save
      split across files; management commands (they call services by
      convention; introspect and seed are read/bootstrap paths reviewed by
      hand).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 2 }
    canaries:
      - { fixture: save_in_api.py, plant_at: apps/example/api.py, mode: append }
      - { fixture: create_in_mcp.py, plant_at: apps/example/mcp.py, mode: append }
      # consumers.py was in the scanned set from birth and never probed — the
      # named-but-never-probed door an early probe found, since closed: a
      # write planted into the real consumer module must fire, both shapes.
      # MOVE-TRIGGER 2026-08-24: the plant is the REAL consumer module
      # deliberately (that named-but-never-probed door), and a write in a
      # consumer is never legal, so no feature can absorb it. Move both forms the
      # day `apps/realtime/consumers.py` is renamed or split.
      - { fixture: save_in_consumer.py, plant_at: apps/realtime/consumers.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: the second shape of the same plant — it
      # moves with the one above, for the same reason.
      - { fixture: create_in_consumer.py, plant_at: apps/realtime/consumers.py, mode: append }
    negatives:
      - { fixture: cache_delete.py, plant_at: apps/example/api.py, mode: append }
      # The consumer's one legal database touch — the connect-time read through
      # run_db — is not a write and must stay silent.
      # MOVE-TRIGGER 2026-08-24: the legal read, beside the consumer that
      # performs it. Move it the day the connect-time `run_db` read leaves
      # `apps/realtime/consumers.py`.
      - { fixture: read_in_consumer.py, plant_at: apps/realtime/consumers.py, mode: append }

  - id: "11"
    name: canonical-file-shape
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    statement: >
      Every app keeps the canonical shape — models · services · selectors ·
      schemas · api · mcp · workflows/activities · consumers · events · search ·
      integrations · policies · admin · types · tests. A utils/helpers/logic/
      managers file, or a novel module name not recorded here, is where business
      logic hides.
    check: null
    django_check_ids: [djb.E011]
    floor_proxy: count_apps
    doc: { file: docs/product/architecture.md, contains: "Every app has the canonical shape" }
    valve:
      none: "this rule reports only through the django system-check leg (manage.py check --tag djb), and those findings never pass through apply_overrides, so no comment anywhere suppresses one. The shape is corrected, or the rule's declared scope moves in a diff a reviewer reads"
    scope:
      exempt_apps:
        # core is the foundation, not a domain app: it is ALL mechanisms
        # (bridge, authz, audit, idempotency, observability, …), each earning
        # its own module. The banned names still apply to it.
        - core
      extra_modules:
        # `lifecycle` IS CANONICAL IN EVERY APP (LF-Q; ADR core-13). It
        # is listed once per app rather than added to `CANONICAL_MODULES`
        # because that constant lives in `apps/core/checks.py` and
        # owns `quality/`; the shape is the same either way and the follow-on to
        # promote it is named in the rung's report. WHAT IT IS: an app declares
        # the lifecycle of a table it does NOT own — allauth's two,
        # `django_session`, `django_admin_log` — in its own
        # `lifecycle.py::register(registry)`, discovered exactly as `SCHEDULES`
        # and `INSTALLED_APPS` are. A central `THIRD_PARTY_LIFECYCLES` dict
        # would be one file every app in a parallel wave has to edit, which is
        # the collision this whole template is shaped around avoiding — and it
        # is why this entry exists at all: without it the five-app declaration
        # fan-out would have five builders each adding a novel module name.
        # `core` is exempt from the novel-name half already; it holds the
        # primitive itself (`apps/core/lifecycle.py`).
        # allauth's adapter; the ninja authenticators; the Zitadel management
        # client; the OAuth 2.1 resource server. `zitadel` is a module rather
        # than a section of `services.py` for the reason rule 27 exists: the
        # deployment's identity platform is reached with a credential from
        # exactly one place, and a file is what makes "exactly one place" a
        # thing a check can see — the sibling of `connections/client.py`, a
        # transport, not a decision. `oauth` is a module rather than part of
        # `auth` for the reason `auth`'s own docstring gives about itself: that
        # file is the ninja authenticators and their ORDER, a correctness
        # property (queue V1) — where `oauth` is a protocol role, validating
        # somebody else's token against an external authorization server, with
        # a JWKS cache and a discovery document of its own.
        # `signin` (design I-A C-8, rung A3) is the SIGN-IN CEREMONY: the
        # Session API conversation one person has while standing at a form,
        # and the closed `Step`/`SignInOutcome` vocabulary a page switches on.
        # It is a module rather than a section of `services.py` for the reason
        # rule 27 gives about `zitadel.py` and rule 8 gives about a
        # transaction: a service owns a WRITE inside a transaction, and this
        # holds a multi-call external conversation open across four round
        # trips and writes no row at all. It is not `policies` (which decides
        # what an actor may do, having one) and not `auth` (which is the ninja
        # authenticators and their order). The door that mounts it is rung A5,
        # behind `SIGN_IN_DOOR`, and it is the seam's ONE importer, which
        # `apps/accounts/tests/test_signin.py::
        # test_one_door_reaches_the_seam_and_it_is_the_one_a5_mounted` is the
        # set-equality census for.
        # `views` (design C-13, rung A5) is THE BROWSER DOOR, and it is the
        # fifth door beside `api`, `mcp`, `consumers` and the webhook pair —
        # the only one a PERSON walks through. It is a module for the reason
        # `api.py` is one: a door is a shape the canon already has a name for,
        # and `apps/core/views.py` (the door index and the landing page) is
        # the same name in the foundation. It decides nothing — the CHECK is
        # `signin`, the COMPLETION is allauth's adapter, and this file chooses
        # a frame, a sentence and a status code. There is exactly one callable
        # in it, mounted by one `config/urls.py` line ahead of `allauth.urls`.
        # `qr` (design J2-c, rung A6) is AN ENCODER, and that is the whole
        # of what it is: a payload in, a matrix of light and dark squares
        # out, no I/O, no settings, no state, no model and no decision. It
        # is a module rather than a section of `views.py` for the reason the
        # canon puts a transport in its own file — `zitadel`, `client` — and
        # for one more: it is the only arithmetic in this app, ~250 lines of
        # Galois-field and bit-placement tables out of a published
        # specification, and a door that carried it would be a door nobody
        # can read. It exists at all because design J2-c asks for the
        # symbol to be drawn BY US: a hosted image service would be handed
        # every person's enrolment secret in a query string, and an
        # `<img src=…>` is a fetch on a page whose no-fetch property is what
        # keeps the entrance from failing to load its own styling.
        # **This entry is A6's one edit outside its territory** and is
        # reported as such: the rung's brief commissions the module by name
        # and this is the line that makes it legal, so the alternative was a
        # tree whose `manage.py check` refuses every command.
        accounts: [adapter, auth, lifecycle, oauth, qr, signin, views, zitadel]
        comms: [lifecycle, providers]    # the channel registry + the built-in email transport
        connections: [client, lifecycle, providers] # the httpx factory; provider registry
        events: [lifecycle, receivers]   # the inbound verify-store-hand-off helper
        example: [lifecycle]             # the worked example declares like any other app
        # (F1, ADR files-2). `storage` is THE SEAM: the one module under
        # `apps/` that imports boto3, names a bucket setting, signs a URL or
        # reads an object's bytes. It is a module for exactly the reason rule 27
        # gives about `accounts/zitadel.py` — "exactly one place" has to be
        # something a check can see — and ADR files-2 rules a storage wall over
        # this file by name (Q-32 lands it under the next free id; 32 is taken).
        # It is not a section of `services.py` because a service decides WHAT is
        # stored and this decides HOW bytes are reached: the sibling of
        # `connections/client.py`, a transport, not a decision. The pin that
        # names today's two importers, so the wall's allow-list is a diff rather
        # than a discovery, is `apps/files/tests/test_storage_fence.py`.

        # (F2, ADR files-2). `meters` joins on the same argument the `usage`
        # entry below makes about the module it declares: a meter name is a
        # PUBLISHED CONTRACT — `files.storage.bytes` reaches an invoice line, a
        # dashboard series and a tenant's threshold — and a file is what makes
        # "the one place the vocabulary is decided" a thing a check, and
        # `manage.py introspect`, can see. F1's report named this exact edit as
        # F2's, which is what keeps this list a confirmer rather than a catcher.
        files: [meters, storage]
        # (XP-1). `census` is the DERIVED population an archive covers:
        # concrete registry models carrying a tenant, minus the declared
        # exclusions, each with its reason. It is a module rather than a section
        # of `selectors.py` for the reason rule 27 gives about
        # `accounts/zitadel.py` — a file is what makes "the one place this is
        # decided" a thing a check can see — and because it decides WHAT
        # travels where `selectors.py` decides WHICH ROWS a hat may read: two
        # questions with two answers, and a hand-written list of tables is the
        # exact defect the module exists not to be (the erasure rung's four unlisted
        # tables, in the other direction).
        exports: [census]
        realtime: [bridge, lifecycle, middleware]  # the push bridge; socket auth middleware
        # (U1, ADR usage-1). `meters` is the METER VOCABULARY — the names
        # of the things this deployment counts, `<app>.<noun>.<unit>`, declared
        # by the app that spends the money and discovered here exactly as
        # `events.py` is. It is a module for the same reason `events.py` is one
        # rather than a section of `services.py`: a meter name is a PUBLISHED
        # CONTRACT — an invoice line, a dashboard series and a tenant's
        # threshold all match on the string — so a typo at a call site accrues
        # money under a name no aggregate sums and no threshold matches. A file
        # is what makes "the one place the vocabulary is decided" a thing a
        # check, and `manage.py introspect`, can see. `apps/usage/meters.py`
        # holds both jobs the way `apps/events/events.py` does: the grammar and
        # the registry every other app's declarations live in.
        usage: [meters]
        # (R-a, ADR search-2). TWO modules, and neither is a section of an
        # existing file wearing a new name.

        # `engine` is the module HOUSE RULE 33 FENCES — the rule below names it
        # by path, so the app cannot satisfy rule 33 without it existing. It is
        # the sibling of `accounts/zitadel.py` and `connections/client.py`: a
        # transport holding a credential and a timeout, deciding nothing, and a
        # FILE is what makes "exactly one place reaches the index" a thing a
        # check can see rather than a habit.

        # `registry` is the DECLARATION side of the same seam: what this
        # deployment declares searchable (discovered `apps/<x>/search.py`
        # modules, the `events.py`/`meters.py` pattern) and the DIGEST that
        # materializes it. It is a module for the reason `usage/meters.py` is
        # one — a declaration vocabulary is a published contract, and the digest
        # over it is what the startup reconcile compares an index against
        # (`design-agreements.md`, "Search materializes from its
        # declarations"). Folding it into `types.py` would put discovery and a
        # hash function in the file whose whole job is to be importable by
        # everything, including the fenced module.
        # P7 R-c adds `lifecycle` on this list's own recorded discipline — it
        # is canonical in every app and listed once per app. The declaration it
        # holds is the one population in this tree that no table holds: the
        # Meilisearch documents, purged by `services.delete_tenant_documents`.
        search: [engine, lifecycle, registry]
        workflows: [client, context, lifecycle, worker]  # the Temporal platform pieces
    floors: { apps: 6 }
    does_not_cover: >
      business logic living in the RIGHT file but the wrong layer (a fat model,
      a clever schema validator); subdirectories other than
      migrations/tests/management, which are not walked; whether an extra
      module recorded above still does the job its reason claims.
    # The recorded self-test population (see the header). Rising floor.
    # negatives 1 → 2. `search` was promoted to
    # `CANONICAL_MODULES` (apps/core/checks.py) because the discovery seam
    # requires the filename of EVERY adopting app, and this negative is what
    # keeps the promotion honest: before it, `apps/zzz_canary/search.py` fired
    # djb.E011 and the documented adoption path could not boot.
    selftest_floor: { canaries: 2, negatives: 2 }
    canaries:
      - { fixture: utils_module.py, plant_at: apps/zzz_canary/utils.py, mode: create,
          via: django, expect: { id: djb.E011, contains: utils.py } }
      - { fixture: novel_module.py, plant_at: apps/zzz_canary/wrangler.py, mode: create,
          via: django, expect: { id: djb.E011, contains: wrangler.py } }
    negatives:
      - { fixture: canonical_types.py, plant_at: apps/zzz_canary/types.py, mode: create,
          via: django, expect: { id: djb.E011 } }
      - { fixture: canonical_search.py, plant_at: apps/zzz_canary/search.py, mode: create,
          via: django, expect: { id: djb.E011 } }

  - id: "12"
    name: reads-writes-separate
    enabled: true
    statement: >
      selectors.py never writes; services.py never returns a queryset for
      display — an object or dataclass out of a service, a queryset out of a
      selector.
    check: selector_service_split
    doc: { file: docs/product/architecture.md, contains: "`selectors.py` never writes" }
    valve:
      marker: "<comment> rule-12: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { selector_files: 3, service_files: 5 }
    does_not_cover: >
      a service returning a list() of a queryset it should not be shaping for
      display; lazy querysets returned via an intermediate variable rather than
      a chained return expression; writes a selector performs through a service
      call (legal, and invisible here either way).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: write_in_selector.py, plant_at: apps/example/selectors.py, mode: append }
      - { fixture: queryset_from_service.py, plant_at: apps/example/services.py, mode: append }
    negatives:
      - { fixture: list_from_service.py, plant_at: apps/example/services.py, mode: append }

  - id: "13"
    name: services-decorated-and-authorized
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for. Its AST
        half alone would key soundly, but the rule's verdict is the two halves together and no reader
        should have to know which of them a hit replayed"
    statement: >
      Every public write in services.py is @service (keyword-only, atomic,
      traced, audited); a @service that takes an actor calls
      authz.require(actor, action, obj) or carries # authz: <reason>; a scoped
      model's writes have a policies.py entry (system check); a NEW service in
      a change takes tenant= or says why not (diff layer). And a @service that
      ASKS for a key asks about what it WRITES: every kind it writes — resolved
      through the model registry's authz_kind / authz_kind_of / snake_case —
      is a kind it required, or the write carries # authz-kind: <reason>; and
      every key it requires is one the vocabulary holds, written as a literal
      or a module-level string constant, or the ask carries # authz-key:
      <reason>.
    check: service_shape
    django_check_ids: [djb.E013]
    diff: [service_without_tenant]
    doc: { file: docs/product/architecture.md, contains: "Every function in `services.py` is decorated `@service`" }
    valve:
      marker: "# authz: <reason> · # authz-kind: <reason> · # authz-key: <reason>"
      where: "`# authz:` anywhere inside the flagged function, from its `def` line through its last line (the check reads the whole FunctionDef source segment) — NOT above the decorator and NOT between the decorator and `def`, because neither is in that segment. `# authz-kind:` on the WRITE line clause (iii) flags, or in the contiguous comment block directly above it — per write, because a service that writes two kinds under one key owes a sentence about the second one and not about the first. `# authz-key:` on the ASK line, same block grammar — and it excuses exactly ONE of clause (iv)'s two findings: the key this census cannot READ (an expression that is neither a literal nor a module-level string constant). A key that reads perfectly well and is in no vocabulary has no valve and wants none: the remedy is to declare the key or to name the one that exists, and a sentence explaining why a capability nobody can hold is fine would be one nobody could act on. All three are counted and printed on the rule's status line. The generic `# rule-13: <reason>` override also suppresses, on the flagged line or the comment block between the decorator and `def`. The django half honours none of them"
    scope:
      exemptions:
        - path: apps/accounts/services.py
          function: touch_token
          reason: >
            a liveness timestamp at five-minute resolution on the hottest read
            in the API; @service would add an audit row and a transaction per
            request for a value nobody audits. Documented in its docstring.
      policy_exemptions:
        - model: core.AuditEntry
          reason: written by the @service decorator itself, append-only; there is no user-facing write action to authorize.
        - model: core.Invitation
          reason: >
            written by core services whose guard is the inviting user's own
            membership, checked in-service; a core policies.py is a recorded
            residual (the surveyor's queue), not an accident.
        - model: connections.InboundWebhook
          reason: a receipt log written by the signature-verified receiver as the system; no user write action exists.
        - model: events.Event
          reason: the append-only spine row, written by emit() under the emitting service's own authorization.
        - model: workflows.WorkflowRun
          reason: platform bookkeeping written by the workflow client as the system; users never write it.
        - model: accounts.SsoDomain
          reason: >
            owned child rows of SsoConnection (A9), written only through
            _apply_domains inside services guarded by the sso_connection.*
            policies; a domain claim has no independent write action.
        - model: accounts.SsoIdentity
          reason: >
            written by provision_sso_identity as the system on a verified IdP
            assertion (A9) — the assertion is the credential; no person writes
            these rows.
        - model: files.FileVersion
          reason: >
            an owned child row of StoredFile (architect D2, CASCADE), written
            only inside the services the `file.*` policies already guard —
            `create_file` and `add_version` allocate one under `file.create` and
            `file.replace`, `record_stored` transitions it as the finalize
            activity. The same class as accounts.SsoDomain above: a version has
            no independent write action, because "add a version" IS the replace
            verb on the document and is authorized there. A `fileversion.*`
            predicate would be a second, weaker opinion about a question
            `file.replace` has already answered, and the place two authorizations
            for one act can come to disagree.
        - model: usage.UsageEntry
          reason: >
            the append-only billing ledger (ADR usage-1), and the same
            class as core.AuditEntry and events.Event above: the row is the
            platform's WITNESSED SIDE-EFFECT of an action a door already
            authorized — the completion ran, the file was stored — so there is
            no user-facing write action to authorize and a `usageentry.record`
            predicate would be a permission nobody could ever fail. The ADR
            rules the writes door-less on purpose (a client that could record
            usage could mint its own bill), both services carry rule 42's
            `# door:` valve and rule 13's own `# authz:` valve with that reason,
            and what a person CAN do — read the report — is
            `usage.read_report` in apps/usage/policies.py (renamed from
            `usage.read` by U3, P7 wave 1, per the lead's wording; this line is
            prose about another app's lexicon and nothing derives it, which is
            why it went stale in the first place).
    # P20 P6: the four clause-(i)–(iv) numbers, each a POPULATION rather than a
    # reach kind, measured on `rung/p20-p4` at 9a4473f5 — services_censused 121,
    # written_kinds_resolved 97, literal_keys_seen 89. The three floors below are
    # the ones the permissions lane's criteria set, a little under the measurement
    # so the clauses are bound without being brittle about one service. The two
    # valve counts are seeded at zero and PRINTED whatever they are: a valve
    # nobody counts is an off switch, and a count that only appears when it is
    # non-zero is one nobody sees fall to zero either.
    floors:
      service_files: 5
      functions_scanned: 40
      services_censused: 40
      written_kinds_resolved: 1
      literal_keys_seen: 50
    # THE CLAUSE-(iii) BACKLOG IS EMPTY. It was 17 mismatches in five apps when
    # it was measured on 9a4473f5 (P5's tree, the tree the criteria were written
    # against), and every one of them was a key the Phase-W sweep for that app
    # renames. The last five were `accounts` — `accounts.user.*` writing
    # `user`/`api_token`, and `identity_platform.configure` writing
    # `identity_branding` — and P8 paid them: three went with the rename onto a
    # kind the registry derives, and the two left carry `# authz-kind:`
    # sentences (the erasure's token sweep, and the branding row that IS the
    # deployment's sign-in screen).
    # EVERY CLASS HERE IS NOW AT ZERO, so the first clause-(iii) finding ANY app
    # grows is a violation from the first one — which is what `core` has always
    # said by having no entry at all. The `<app>.key` classes — clause (iv) —
    # have no entry either, for the same reason: every ask on this tree names a
    # key the vocabulary holds.
    ratchets:
      accounts: 0
      connections: 0
      events: 0
      files: 0
      # workflows: 1 -> 0. The backlog was paid in the tree and the number was
      # left behind — headroom, and headroom is not free: a planted canary's
      # finding is absorbed by it, the canary reads as fired-nowhere, and
      # `--selftest` reports it DEAD (exit 2). Lowered to the count the gate
      # printed as its own invitation on main 94bf7c5b.
      workflows: 0
    does_not_cover: >
      a require() guarding the WRONG action, or an over-permissive policy —
      right shape, wrong content, review's irreducible share; public reads in
      services.py that never write (legal); a write reached through a private
      helper (the public caller is judged, the helper is not); platform
      services that take no actor at all — enqueue_dispatch's shape — where the
      policies-entry system check and review carry the risk. AND, for the four
      kind clauses added by P20 P6: a service that asks for NOTHING is outside
      clause (iii) by construction — it is the `# authz:` clause's subject one
      paragraph up, and asking it to justify every write a second time in a
      second comment would put two sentences where the tree has one. That is
      not a small hole: `apps/core/services.py::rename_permission_rows` writes
      `Grant` and `RolePermission` across every tenant with no key and no
      actor at all — a deployment-wide maintenance act reachable only from a
      management command — and clause (iii) is silent about it, by this
      decision, with the `# authz:` sentence already on it carrying the whole
      justification. Also outside: a model defined anywhere but an app's
      `models.py` (or core's `audit.py`/`idempotency.py`); a write through a
      helper in another module; a model bound under an alias (`G = Gadget`);
      a `getattr`-driven write; a key assembled by an f-string or a `.format()`
      (clause (iv) sees it as a non-literal and asks for `# authz-key:`, which
      is a sentence, never a derivation); whether the reason in an
      `# authz-kind:` or `# authz-key:` comment is a GOOD one — the gate counts
      them and prints the totals, and judging them is review's; and whether the
      key a service asks for is the RIGHT key of the right kind, which is the
      first sentence of this paragraph and stays exactly where it was.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 8, negatives: 6 }
    canaries:
      - { fixture: undecorated_write.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: positional_service.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: actor_without_require.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: scoped_no_policy.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E013, contains: CanaryScoped } }
      - fixture: scoped_other_policy.py
        plant_at: apps/zzz_canary/models.py
        mode: append
        via: django
        expect: { id: djb.E013, contains: CanaryLedger }
        extra_files:
          - { fixture: other_policy.py, plant_at: apps/zzz_canary/policies.py, mode: create }
      - { fixture: diff_service_no_tenant.py, plant_at: apps/example/services.py, mode: append,
          via: diff, expect: { contains: canary_no_tenant } }
      # CLAUSE (iii) — the ask and the write name different nouns. Planted into
      # the probe app rather than the worked example because the form needs a
      # MODEL of its own: the kind has to be one nothing else in the tree
      # derives, or the negatives below could be satisfied by a real app's
      # coincidence. `apps.py` rides along because the clause-(i) registry reads
      # `apps/*/models.py` through the same app derivation INSTALLED_APPS uses,
      # and a pure-AST run scaffolds no probe app of its own.
      - fixture: kind_mismatch_service.py
        plant_at: apps/zzz_canary/services.py
        mode: create
        expect: { contains: "asks for no gadget.* key" }
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
          - { fixture: gadget_policies.py, plant_at: apps/zzz_canary/policies.py, mode: create }
      # CLAUSE (iv) — a key nothing declares. `gadget.polish` is not one of the
      # four verbs the kind derives and no ACTION_PROSE names it, so nobody can
      # ever hold it; `require` itself cannot say so, which is the silence this
      # form exists to end.
      - fixture: undeclared_key_service.py
        plant_at: apps/zzz_canary/services.py
        mode: create
        expect: { contains: "which no model derives" }
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
    negatives:
      - { fixture: private_helper_write.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: authz_reason_docstring.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: scoped_with_policy.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E013 },
          extra_files: [ { fixture: good_policy.py, plant_at: apps/zzz_canary/policies.py, mode: create } ] }
      # The ask and the write agree — and, in the same file, a DECLARED verb
      # outside the four that clause (iv) must not call undeclared.
      - fixture: matching_kind_service.py
        plant_at: apps/zzz_canary/services.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
          - { fixture: gadget_policies.py, plant_at: apps/zzz_canary/policies.py, mode: create }
      # One capability, two kinds, `# authz-kind:` on the write the ask does not
      # cover — the valve doing its job, which is a sentence and not a switch.
      - fixture: second_kind_under_authz_kind.py
        plant_at: apps/zzz_canary/services.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
          - { fixture: gadget_policies.py, plant_at: apps/zzz_canary/policies.py, mode: create }
      # Overrule 4's own regression: the key asked for through a module-level
      # string constant. A literals-only reading of clause (ii) would call this
      # unguarded, and `apps/workflows/services.py` with it.
      - fixture: module_constant_key_service.py
        plant_at: apps/zzz_canary/services.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
          - { fixture: gadget_policies.py, plant_at: apps/zzz_canary/policies.py, mode: create }

  - id: "14"
    name: no-http-below-doors
    enabled: true
    statement: >
      Services raise core.exceptions.*; HttpError, Http404, HttpResponse and
      status codes never appear in services.py, selectors.py, models.py or
      policies.py. The one mapper lives in config/api.py.
    check: http_below_doors
    doc: { file: docs/product/architecture.md, contains: "the one mapper lives in `config/api.py`" }
    valve:
      marker: "<comment> rule-14: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { files_scanned: 14 }
    does_not_cover: >
      a numeric status literal with no HTTP name around it; HTTP vocabulary in
      activities.py (the delivery activity legitimately speaks HTTP to other
      people's servers); a domain exception that secretly encodes a status.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: httperror_in_service.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: http404_in_selector.py, plant_at: apps/example/selectors.py, mode: append }
    negatives:
      - { fixture: domain_exception.py, plant_at: apps/example/services.py, mode: append }

  - id: "15"
    name: field-policies
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for. Its AST
        half alone would key soundly, but the rule's verdict is the two halves together and no reader
        should have to know which of them a hit replayed"
    statement: >
      No FloatField on money/quantity/rate names (Decimal 19,4 + currency);
      DateTimeFields end _at, DateFields end _on; on_delete is explicit and
      never DO_NOTHING; no is_deleted booleans. Read off the live field
      registry. AND SECRETS ARE ENCRYPTED AT REST (the secret-at-rest
      clause): a field whose name is secret-shaped — secret, token, password,
      credentials, signing_key, api_key, private_key, access_token,
      refresh_token, client_secret, or any of those as a _suffix — is an
      encrypted field type (core.fields.EncryptedCharField /
      EncryptedJSONField) or is allow-listed here with the reason. A name
      ending _hash is a digest, not a recoverable secret, and is out of the
      population by construction.
    # TWO MECHANISMS ON ONE RULE, deliberately. The field-policy half reads the
    # LIVE field registry through a Django system check (djb.E015) — the
    # stronger witness for questions about what a field IS once Django has
    # built it. The secret-at-rest half is an AST question about the declared
    # TYPE a field was given, which the registry cannot answer as clearly: by
    # the time Django has an EncryptedCharField instance it is a CharField
    # subclass, and "was this declared encrypted" is a question about the
    # source. One rule, because a product reading architecture.md's rule 15
    # should find every field policy in one place.

    # MEASURED BEFORE ENFORCED: quality/b1-enforcement-measurement.md — 2
    # secret-shaped fields on the tree, both already encrypted, 0 plaintext.
    # W6a moved `WebhookEndpoint.secret` off a plain CharField; this clause is
    # what stops the next one landing. One field being wrong while its
    # neighbours are right is what a rule is for: nobody decided it, it was
    # just never noticed.

    # `credentials` is in the name grammar deliberately. Without it,
    # `Connection.credentials` would be silent because the rule never LOOKED,
    # and a negative that passes for the wrong reason is decoration.
    check: secret_at_rest
    django_check_ids: [djb.E015]
    floor_proxy: count_model_classes
    doc: { file: docs/product/architecture.md, contains: "no `FloatField` on money" }
    valve:
      marker: "<comment> rule-15: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding. The django system-check half of this rule honours no comment valve: those findings never pass through apply_overrides"
    scope:
      field_exemptions:
        # Declared on Django's AbstractBaseUser, inherited by the custom User;
        # renaming it would fork the auth machinery for a naming rule.
        - accounts.User.last_login
        # Django's own conventional name for it (AbstractUser uses the same);
        # allauth and admin tooling read it by this name.
        - accounts.User.date_joined
      # The secret-at-rest allow-list — the valve the statement advertises
      # ("or is allow-listed here with the reason"), read by `_exempt` on
      # path + `Class.field`. Its note: it had never been exercised, in
      # either direction, so nothing proved it worked. It is exercised now, by
      # the fixture pair below, and the tree still has ZERO real waivers: this
      # entry names a self-test class, so `secret_waivers` on the shipped tree
      # is 0 and the first genuine waiver would be visible here as the second
      # entry rather than as a habit somebody already started.
      exemptions:
        - path: apps/example/models.py
          function: NegAllowListedVault.signing_key
          reason: >
            the listed half of the B4-3 pair. `quality/negative/15/
            allow_listed_vault_secret.py` plants a plaintext `signing_key` that
            the rule looks straight at, and this entry is the ONLY reason it
            stays silent. Its twin `quality/canary/15/unlisted_vault_secret.py`
            is the identical field on a class this list does not name, and it
            fires. One list entry apart, opposite verdicts — which is what
            makes the valve load-bearing rather than advertised, and what will
            catch it later if the match ever widens from this field to the
            whole path.
    # LEX-1 gap 4: the two secret floors sat AT their measured value (2 and 2).
    # A floor asks "is the check looking at anything"; at measured it is a
    # RATCHET wearing a floor's name, and this file has `ratchets` for that —
    # so a legitimate deletion read as exit 2, enforcement broken. Dropped to
    # measured-1, the convention rules 28/29/30 state out loud.
    floors: { model_classes: 12, model_fields: 60, secret_fields: 1, encrypted_secrets: 1 }
    does_not_cover: >
      a money amount stored in an IntegerField of cents with no currency
      column; a FloatField under a name the money regex does not recognise;
      business logic in save() and missing Meta.constraints — the architect
      reviews the model, this reads its fields; PROTECT-vs-CASCADE judgement on
      an explicit on_delete. For the secret-at-rest clause: a plaintext secret
      under a name the grammar does not know — and the tree has one to point
      at, `accounts.SsoConnection.metadata`, which holds an IdP's client secret
      and is out of the population by NAME (it is encrypted anyway, which is
      the point: the field was right before the rule existed); a secret living
      as one key inside a plain JSONField beside ordinary data; a plaintext
      secret deliberately named `*_hash` to leave the population, which is
      evasion rather than drift and is what review is for; whether the
      ENCRYPTION is sound — key length, rotation, and the fact that an
      encrypted column cannot be filtered on are the field's own docstring's,
      not this check's; and every other place a secret goes — a log line, a
      Temporal workflow argument, a traceback, a fixture — none of which is a
      model field.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 6, negatives: 6 }
    canaries:
      - { fixture: float_money.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E015, contains: CanaryPricey.price } }
      - { fixture: datetime_name.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E015, contains: CanaryTimes.happened } }
      # --- the secret-at-rest clause (AST) ---
      # (1) the exact defect W6a fixed, planted back: a signing secret as a
      # plain CharField.
      - { fixture: plaintext_secret.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "in the clear" } }
      # (2) the same under a suffix name and a TextField, so the clause is
      # neither one name's nor one type's habit.
      - { fixture: plaintext_api_token.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "in the clear" } }
      # (3) `credentials` — the name added to the grammar so the Connection
      # negative below means something. A plaintext one must fire.
      - { fixture: plaintext_credentials.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "in the clear" } }
      # (4) the allow-list's UNLISTED direction (B4-3). Field for field the
      # same as the `allow_listed_vault_secret.py` negative below; only the
      # class name differs, and the class name is what the exemption is keyed
      # on. If this one ever goes silent, the entry above has stopped being
      # about one judged field and become a hole under the whole path.
      - { fixture: unlisted_vault_secret.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "in the clear" } }
    negatives:
      - { fixture: decimal_and_at.py, plant_at: apps/zzz_canary/models.py, mode: append,
          via: django, expect: { id: djb.E015 } }
      # The two real fields, planted in miniature: the encrypted char field
      # (WebhookEndpoint.secret's shape after W6a) and the encrypted JSON field
      # (Connection.credentials' shape). Both are IN the population and silent
      # BECAUSE they are encrypted — not silent because unexamined.
      - { fixture: encrypted_secret.py, plant_at: apps/example/models.py, mode: append }
      - { fixture: encrypted_credentials.py, plant_at: apps/example/models.py, mode: append }
      # A digest. `ApiToken.key_hash` and `Invitation.token_hash` are the tree's
      # two, and both are right as they are: encrypting a hash would protect
      # nothing and would break the unique lookup that authenticates every
      # request.
      - { fixture: hashed_token.py, plant_at: apps/example/models.py, mode: append }
      # A secret-shaped name on a RELATION. It points at a row; it holds
      # nothing. `events.AuditEntry.actor_token` is the tree's one.
      - { fixture: token_foreign_key.py, plant_at: apps/example/models.py, mode: append }
      # The allow-list's LISTED direction (B4-3): a plaintext secret silent
      # because the scope entry above says why. Every other negative here is
      # silent on its own merits — encrypted, digested, a relation. This one is
      # silent ONLY because of a judgement written down in this file, which is
      # the mechanism no fixture had ever turned.
      - { fixture: allow_listed_vault_secret.py, plant_at: apps/example/models.py,
          mode: append }

  - id: "16"
    name: naming-grammar
    enabled: true
    statement: >
      The naming grammar holds, in seven classes. Events are
      <app>.<noun>.<past-verb>, declared as constants in the app's events.py and
      never a literal at a call site (an event emitted in a change is declared
      in the same tree — diff layer). Apps are plural. Models are singular.
      Every public function in a services.py begins with a verb from the
      declared lexicon below. Every public function in a selectors.py is get_ or
      list_. Every schema class ends In / Out / Patch / Filter / Page. Every
      BooleanField starts is_ or has_.
    check: naming_grammar
    diff: [undeclared_event]
    doc: { file: docs/product/architecture.md, contains: "<app>.<noun>.<past-verb>" }
    valve:
      marker: "<comment> rule-16: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      # Singular app names that are deliberate, each with the reason. An app is
      # normally a collection of things, so `orders`; these three are not.
      app_name_exemptions:
        - app: core
          reason: >
            the platform's own package — the floor everything else stands on,
            not a collection of "cores". Renaming it would rename the one
            import path every module in the tree already carries.
        - app: example
          reason: >
            the worked example, and there is exactly one of it. "examples"
            would suggest a menu of them; the whole point is that a builder
            reads THE example end to end.
        - app: realtime
          reason: >
            an adjective naming a transport, not a collection of things. The
            nouns it carries belong to whichever app emitted them.
        - app: usage
          reason: >
            a MASS NOUN, and there is no plural of it that means anything —
            "usages" is a word about senses of a word, not about consumption.
            The app is named for what it measures the way `realtime` above is
            named for how it travels; the collection it holds is `UsageEntry`,
            which IS plural-able and is what the table and the read door are
            named after (`/api/v1/usage/` returns entries). Ratified in ADR
            usage-1's app map and depended on by name by two other ingredient
            apps' `depends_on`, so a rename is not a local decision.
        - app: search
          reason: >
            an ACTIVITY, not a collection — the app is named for a capability
            and it owns no table at all, which is the sharpest form of the same
            case `realtime` makes. "searches" would name a collection of query
            records, which is a thing this design explicitly refuses to keep
            (ADR search-2 rejects search analytics until a compliance or product
            demand names it, and would land it as its own declared population).
            The one door is `/api/v1/search/`, which is what a stranger types,
            and the app map ratified in `architecture.md` names it. A rename is
            not a local decision: the name is in the ADR, the app map, four
            rungs' briefs and the rule-33 fence's own path.
        - app: zzz_canary
          reason: >
            the gate's own probe app, scaffolded and deleted inside the
            self-test. It is never in a tree anybody reads.
      # THE LEXICON. Seeded from the tree as it was measured on 2026-08-20
      # (quality/naming-grammar-measurement.md): every first word already in use
      # on a public service, minus the four that are not verbs — those four are
      # the recorded ratchet below, not silent exemptions. Matching is
      # longest-prefix, so a two-word verb (`dead_letter`) reads as the phrase
      # it is rather than as the adjective it starts with. Growing this list is
      # a visible diff, which is the whole mechanism: nothing stops a product
      # adding `archive`, and nothing lets it add `data` without a reviewer.
      service_verbs:
        - accept
        - add
        - announce
        - apply
        - approve
        - archive
        - authenticate
        # P5 QB-R1, and PRE-DECLARED here rather than discovered in W-C2's diff
        # — the same confirmer pattern the `sync` entry below records. The
        # wave-C lifecycle rung (criteria set: the wave-C/QB cycle plan,
        # "Rung QB-R1", criterion 6) names `cancel` as its verb: a run, an
        # invitation or a scheduled send that is stopped before it completes is
        # cancelled, and `close`/`retire` both already mean something narrower
        # here. Landing the verb one rung EARLY is what keeps this list a
        # confirmer: meets a lexicon that already holds the word,
        # so the rule confirms the plan instead of catching the plan.
        - cancel
        - check
        - close
        # (F2, ADR files-2), and the ADR names it four rungs deep:
        # `confirm_upload` is the second half of the two-phase upload — a client
        # says the bytes are up and the platform starts the run that goes and
        # LOOKS. None of the neighbours says it: `check` is a predicate,
        # `approve` is a person's judgement about content, `accept` takes
        # somebody's offer, and `mark` and `record` both describe writing down a
        # fact we already hold, which is exactly what confirming is not — the
        # whole point is that nothing is known yet. The doors that carry it
        # (F3's `POST /files/{id}/versions/{n}/confirm`, the `files.confirm`
        # tool) are named in the ADR too, so the word is going to appear in
        # three places and this is the one that decides it.
        - confirm
        - create
        - deactivate
        - dead_letter
        - delete
        - disable
        - emit
        - enqueue
        - ensure
        - erase
        - finish
        - grant
        - hash
        - invite
        - issue
        - mark
        - move
        - provision
        - purge
        # (LF-Q), and the OTHER HALF OF A COUPLING rather than a lexicon
        # entry on its own: `apps.core.services.redact_invitations` landed
        # in carrying a counted rule-16 override, because `quality/` is
        # single-writer territory that rung did not own and the alternative was
        # renaming a seam seven downstream rungs already cite. The verb and the
        # override's removal travel in ONE commit — this line and that deletion
        # are the same change, and splitting them would leave either a valve
        # nobody needs or a service the lexicon refuses. WHAT IT MEANS, so a
        # later reader can tell it from its neighbours: `redact` takes a
        # personal identifier OUT of a row that stays. `erase` removes the
        # person; `purge` removes rows on a schedule; `revoke` withdraws a
        # standing offer or a credential. Erasure needs the third thing — the
        # address leaves and the record that an offer was made does not — and
        # none of the other three says it.
        - redact
        - record
        - register
        - rename
        - replay
        - render
        - resume
        - retire
        - revise
        - revoke
        - send
        - signal
        - set
        - start
        # (F2, ADR files-2). `store_bytes` is the document-GENERATION seam:
        # one call an activity makes with bytes the platform rendered itself,
        # which lands them scoped, digested, versioned, audited and metered. The
        # ADR names the function, and P5's export rung and XPr are both
        # dispatched against that name — so this is a lexicon that already holds
        # the word when arrives, per the `cancel` and `sync` entries
        # above. Why no neighbour serves: `create` and `add` name the ROW being
        # made and say nothing about the bytes, which is the half that makes this
        # service dangerous enough to have one name; `record` is the ledger's
        # word for writing down what happened; `render` is the product's job that
        # produces the bytes this one is handed; and `send` moves something to
        # somebody. `store` means: these bytes now live somewhere, at an address,
        # forever.
        - store
        - suppress
        - suspend
        # P0 W2-R2, and PRE-DECLARED in the cycle plan's settled decisions
        # rather than discovered in the diff: `sync_identity_config` makes our
        # row and Zitadel say the same thing about one connection. The plan
        # names it as the cycle's one new verb, which is what turns this list
        # from a catcher into a confirmer.
        - sync
        - touch
        - unsuppress
        - update
    # The measured backlog, per class, on 2026-08-20. Shrink, never grow; a
    # class that reaches zero is committed as zero by a human reading the note.
    # A class absent here is ratcheted at zero — apps and models are already
    # clean and carry NONE, which is why they are not listed.
    ratchets:
      services: 4
      # 9 -> 10 (R-a). ONE addition, and it is the chokepoint:
      # `apps/search/selectors.py::search`. The name is the ADR's own — ADR
      # search-2 specifies `selectors.search(*, tenant, actor, q, kinds, page)`
      # and four later rungs' criteria name it — and it is the one place in this
      # tree where the grammar's own justification ("a caller can guess the name
      # without opening the module") argues AGAINST the prefix: `search` is what
      # a caller guesses, and `get_search` would be a worse name bought with a
      # rule. The rung's other four helpers were NOT bought this way — three
      # moved to `registry.py` or were inlined, and `resolve_visible_org_ids`
      # became `list_visible_org_ids` — so this ratchet moved by exactly one and
      # the reader can see which one.
      selectors: 10
      schemas: 1
      booleans: 1
    floors:
      event_names: 8
      apps_named: 7
      model_names: 15
      service_names: 40
      selector_names: 10
      schema_names: 20
      boolean_fields: 4
    does_not_cover: >
      whether a name that passes is a GOOD name — `create_widget` and
      `create_thing_and_also_email_someone` both begin with a verb in the
      lexicon, and that judgement is review's; whether a verb in the lexicon
      still means what it meant when it was seeded (the list grows by visible
      diff and nothing shrinks it); an "-ed" adjective posing as a past verb in
      an event name; event names built with f-strings at runtime (receivers.py's
      provider names — deliberate, documented there); a boolean predicate
      selector (`is_workforce_email`) — the closed question here is get_/list_,
      the predicate shape is in the ratchet and is an open question for the next
      surveyor, not a silent exemption; names inside functions, in tests, in
      migrations, and every model FIELD name that is not a boolean or a
      date/time (rule 15's half); whether a badly named function should be
      MOVED rather than renamed, which is the architect's call.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 9, negatives: 7 }
    canaries:
      - { fixture: imperative_event.py, plant_at: apps/example/events.py, mode: append }
      - { fixture: two_segment_event.py, plant_at: apps/example/events.py, mode: append }
      - { fixture: diff_undeclared_emit.py, plant_at: apps/example/services.py, mode: append,
          via: diff, expect: { contains: example.widget.zapped } }
      - { fixture: singular_app.py, plant_at: apps/gadget/apps.py, mode: create,
          expect: { contains: "'gadget' is not plural" } }
      - { fixture: plural_model.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "model 'Widgets' is plural" } }
      - { fixture: noun_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "service 'widget_summary'" } }
      - { fixture: bare_selector.py, plant_at: apps/example/selectors.py, mode: append,
          expect: { contains: "selector 'widgets_for'" } }
      - { fixture: unsuffixed_schema.py, plant_at: apps/example/schemas.py, mode: append,
          expect: { contains: "schema 'WidgetEnvelope'" } }
      - { fixture: bare_boolean.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "CanaryFlagged.archived" } }
    negatives:
      - { fixture: compound_past_event.py, plant_at: apps/example/events.py, mode: append }
      - { fixture: plural_app.py, plant_at: apps/gizmos/apps.py, mode: create }
      - { fixture: singular_models.py, plant_at: apps/example/models.py, mode: append }
      - { fixture: verb_services.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: prefixed_selectors.py, plant_at: apps/example/selectors.py, mode: append }
      - { fixture: suffixed_schemas.py, plant_at: apps/example/schemas.py, mode: append }
      - { fixture: prefixed_booleans.py, plant_at: apps/example/models.py, mode: append }

  - id: "17"
    name: door-parity
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    # THE BREAKING-CHANGE ESCAPE IS DECLARED, NOT SNIFFED (closed).
    # It used to be a token scan — `version\s*=\s*["']2|/v2/|api/v2|_v2\b|
    # V2Router` over any changed path ENDING `api.py`, which includes
    # `tests/test_api.py` — and any one of those substrings on any added line
    # disarmed the whole diff layer (rules 3, 5, 13, 16 and 17) for the commit.
    # D4's draft local named `offered_v2` did exactly that, live, and the only
    # instrument that noticed was this rule's own canary dying in the same run.
    # An escape an ordinary identifier can trip is not an escape.

    # THE TWO DECLARED FORMS, and there is no third. Either the MOUNT moves —
    # `config/urls.py`'s `API_PREFIX` names a higher major version at the tip
    # than it did at the ref, which is what a version bump IS here, since
    # `config/urls.py` owns the version segment and an app never writes it — or
    # a door module (or a module under `config/`, never a test module) carries a
    # MARKER LINE, `# api-version: <N>` with N above the version the mount
    # carries. Both are read by AST or by a comment grammar rather than by
    # substring, so a name, a docstring or a test fixture cannot be one.
    statement: >
      A capability on REST is on MCP unless exempted here with the reason — the
      two registries are diffed (introspect's own sources). A removed or
      re-typed field on a published Out schema blocks unless the change DECLARES
      the version move: the mount's `API_PREFIX` rising, or an
      `# api-version: <N>` marker line in a door module (diff layer). A class
      that LEAVES one `schemas.py` and ARRIVES, field for field identical, in
      another one in the same change has moved rather than been deleted, and is
      not a wire change at all.
    check: null
    django_check_ids: [djb.E017]
    floor_proxy: count_routes
    diff: [breaking_out_schema]
    doc: { file: docs/product/architecture.md, contains: "a capability on REST is on MCP" }
    valve:
      marker: "<comment> rule-17: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding. The django system-check half of this rule honours no comment valve: those findings never pass through apply_overrides"
    scope:
      exemptions:
        - app: accounts
          reason: >
            the machine door authenticates WITH a token: minting one over MCP is
            circular (the REST route itself refuses token-authenticated
            callers), and managing tokens is the session door's job. Revocation
            over MCP is the recorded residual. The SSO-config surface (A9:
            sso-connection CRUD, realm discovery) is deliberately not on the
            machine door either — an IdP-credential surface stays behind the
            session door, and realm discovery is the login form's pre-auth
            question, not an agent's.
        - app: connections
          reason: >
            connection management is per-tenant configuration done by a person
            in a browser (OAuth redirects cannot round-trip through a tool
            call), and the inbound webhook receiver is a machine door of its
            own with an HMAC credential.
        # ADR core-16, and the ONE capability-level exemption in this list —
        # `url_name` rather than `app`, because every other core route (sixteen
        # of them) does have its twin and exempting the app would hide that.
        - url_name: "api:invitation-accept"
          reason: >
            Parity puts doors on the membership services and this one capability
            cannot cross. The invitation link mints a membership for the person
            holding it IN A BROWSER: the token names the invitation and the
            session names the person, so there is no field a caller could send
            to say who is accepting. A bearer token accepting on somebody's
            behalf is an impersonation shape rather than a parity gap — and MCP
            accepting as the token's OWN user is a bootstrap circle, because the
            token predates the membership the invitation creates. Dropping the
            REST half too was rejected: accepting an invitation is the persona's
            own step. Trigger to revisit: a headless-signup product.
    # re-pinned at the measurement in the commit that fixed
    # `count_routes`' package blindness — it read 69 where the live registry has
    # 86, because it walked `api.py` by basename and `apps/core/api/routes.py`
    # holds seventeen routes. AT the measurement rather than conservatively, the
    # same judgement rule 41's floors record: a floor below the truth is silent
    # while the surface disappears. Growth is free; a removal is a number a
    # human re-commits.
    floors: { routes: 86 }
    does_not_cover: >
      a tool that exists but answers with a different shape or narrower rows
      than its REST twin — the example app's parity TEST proves behaviour, this
      proves existence; whether an exemption above is still deserved. A MOVE
      SPLIT ACROSS TWO COMMITS is a deletion here and cannot be anything else
      (closed one commit at a time, 2026-08-29): the diff layer sees one
      change, so a class removed in commit A and re-added in commit B reads as a
      removal in A, and the message says so rather than leaving the reader to
      work it out. A move WITHIN one module — a class renamed in place — is a
      removal and an addition to this check and always was; the population is
      keyed by class NAME, so a rename is a wire change and is meant to read as
      one. AND ONLY `apps/*/schemas.py` IS SEARCHED for the arrival: an `Out`
      promoted into `apps/core/schemas.py` is seen, one promoted into a module
      rule 11 does not know about is not, which is the same file-shape
      assumption the rest of this layer makes. SOCKET
      PARITY IS NOT THIS RULE'S AND CANNOT BE (ADR realtime-3): this check
      diffs two REGISTRIES, and the socket door has no
      second registry to diff against — one consumer, one person, one `X-Org`,
      and two different sets of frames depending on which credential the
      handshake carried is invisible to a registry diff. That parity is a
      per-door-pair TEST in the owning app, and the first member of the family
      is `apps/realtime/tests/test_credential_parity.py` (session cookie
      against bearer token, in both its header and query forms, driving the
      real chain to the wire). A real regression is the instance: a token socket kept the
      hat the session stack had resolved for `AnonymousUser` — `None` — so it
      joined zero org groups and heard nothing, while the same person's cookie
      socket heard everything. It failed CLOSED, so nothing leaked and nothing
      errored, and two docstrings claimed the opposite for a cycle. Webhook
      parity is still unowned by anything (the spine pushes the same envelope
      by construction, which is an argument and not a test). AND THE DECLARED
      ESCAPE IS COMMIT-WIDE, not per-app (its residual, stated rather than
      closed): one `# api-version: <N>` marker anywhere in the changed door
      layer disarms the whole diff layer for the whole change, exactly as the
      token scan did. What changed is that it now takes a line somebody wrote on
      purpose rather than a local variable's name — the escape is legible in a
      diff and attributable to whoever typed it, which is what makes review the
      right instrument for "did this change deserve it". Narrowing it to the app
      that declared would need the diff layer to attribute every finding to an
      app, which rule 22's and rule 16's clauses do and rule 17's Out-schema
      clause does not; the trigger is the first commit that legitimately moves
      one app to v2 while another ships an accidental break.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 3 }
    canaries:
      - { fixture: unpaired_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E017, contains: thing-detail } }
      - { fixture: unpaired_verb_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E017, contains: thing-void } }
      - { fixture: diff_breaking_out.py, plant_at: apps/example/schemas.py, mode: create,
          via: diff, expect: { contains: WidgetOut } }
      # The split-move clause's live half: a class that LEAVES one module and ARRIVES in
      # another with a field re-typed. A name-only move test would go silent
      # here — which is why the branch compares the whole field map — and the
      # message names where it went as well as what broke.
      #
      # MOVE-TRIGGER 2026-08-29: the day the probe scaffold carries a TRACKED
      # `schemas.py`. This pair plants into two REAL apps and it cannot do
      # otherwise today: the check reads a git diff, so showing a class LEAVE a
      # module requires a module git already knows, and `apps/zzz_canary` is
      # created by the plant and known to nothing. `mode: create` over
      # `apps/workflows/schemas.py` is what stands in for a deletion, since a
      # plant may create or append and never remove. Recorded by R7's plant
      # census (P15), which is where the omission surfaced — not by the rung
      # that planted them.
      - fixture: diff_moved_out_source.py
        plant_at: apps/workflows/schemas.py
        mode: create
        via: diff
        expect: { contains: "different fields" }
        extra_files:
          - { fixture: diff_moved_out_arrival_retyped.py, plant_at: apps/realtime/schemas.py,
              mode: append }
    negatives:
      - fixture: paired_route.py
        plant_at: apps/zzz_canary/api.py
        mode: append
        via: django
        expect: { id: djb.E017, contains: gizmo-detail }
        extra_files:
          - { fixture: paired_tool.py, plant_at: apps/zzz_canary/mcp.py, mode: create }
      - fixture: diff_breaking_out_with_v2.py
        plant_at: apps/example/schemas.py
        mode: create
        via: diff
        expect: { contains: WidgetOut }
        extra_files:
          - { fixture: v2_router_marker.py, plant_at: apps/example/api.py, mode: append }
      # THE MOVE ITSELF, silent. The same class leaves one module and
      # arrives, field for field, in another in the same change. Firing here
      # would answer the SAFEST change class with "declare a breaking change",
      # which is how a version marker gets learned as a way past the gate.
      #
      # MOVE-TRIGGER 2026-08-29: the same day as its canary twin above — the day
      # the probe scaffold carries a TRACKED `schemas.py` a class can be shown
      # leaving. The pair moves together or the negative stops being the
      # canary's negative.
      - fixture: diff_moved_out_source.py
        plant_at: apps/workflows/schemas.py
        mode: create
        via: diff
        expect: { contains: WorkflowRunOut }
        extra_files:
          - { fixture: diff_moved_out_arrival.py, plant_at: apps/realtime/schemas.py,
              mode: append }

  - id: "18"
    name: deterministic-workflow-ids
    enabled: true
    statement: >
      Workflow ids are deterministic — <tenant>:<app>:<noun>:<key>, built by
      workflow_id() (directly or through the bridge); start_workflow* never
      receives a random or missing id.
    check: workflow_ids
    doc: { file: docs/product/architecture.md, contains: "Workflow ids are deterministic" }
    valve:
      marker: "<comment> rule-18: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # `starter_defs` is the PIN's floor: the two starters in
    # apps/workflows/services.py, the module the live scan excludes because it
    # DEFINES the machinery. An exclusion is a promise about what lives inside
    # it, and a floor of 2 is what stops the promise going quiet — if the pin
    # ever finds no starter to inspect, the exclusion is unwatched and that is
    # exit 2, not a pass.
    floors: { start_callsites: 2, starter_defs: 2 }
    does_not_cover: >
      an id built by workflow_id from a NON-deterministic key (uuid4 passed as
      key=); starts made by third-party schedules; a third starter someone adds
      INSIDE the excluded module — the pin knows the two names, and the
      start_callsites floor is the partial net under that; an id bound to a
      name the check cannot read as either a workflow_id() call or a
      house-shaped constant (a settings lookup, a parameter, a dict entry) is
      refused rather than judged, which is deliberate but is a refusal and not
      an analysis; A STARTER REBOUND BY PLAIN ASSIGNMENT — `begin =
      start_workflow_on_commit` and then `begin(...)` — because the starter set
      is grown from the IMPORT (`as begin`) and from a
      `bridge.get(bridge.START_WORKFLOW)` binding, and a bare name-to-name
      assignment is neither, so the callsite is not scanned at all (LEX-1's gap
      2, the sibling of the alias evasion F4 closed); and the ANY() semantics of
      the name case — a name is judged by whether ANY value ever assigned to it
      in the module is a workflow_id() call or a house-shaped constant, so a
      name bound once to `workflow_id(...)` and once to `uuid4()` passes on the
      strength of the first binding, which is a deliberate refusal to do flow
      analysis and is review's to catch.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 3 }
    canaries:
      - { fixture: random_id_start.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: missing_id_start.py, plant_at: apps/example/services.py, mode: append }
      # F4's cheapest evasion: `as begin_run` on the import, and the rule went
      # silent on the callsite. The alias is read off the import now.
      - { fixture: aliased_random_start.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "a random id makes a retried start a second run" } }
      # THE PIN, planted into the excluded zone itself: `id` regrows a default
      # and every caller who forgets it silently loses idempotency. Exit 1 (a
      # real defect in production code), not exit 2 (a broken mechanism).
      # MOVE-TRIGGER 2026-08-24: planted INTO rule 18's excluded zone on
      # purpose — the starter definitions live in `apps/workflows/services.py` and
      # nowhere else, so the probe app cannot host this form at all. It moves the
      # day the starters move.
      - { fixture: default_id_starter.py, plant_at: apps/workflows/services.py, mode: append,
          expect: { contains: "has a DEFAULT inside rule 18's excluded zone" } }
    negatives:
      - { fixture: bridge_built_id.py, plant_at: apps/example/services.py, mode: append }
      # The same alias used honestly — the rule judges the ID, not the name the
      # caller gave the starter.
      - { fixture: aliased_built_id.py, plant_at: apps/example/services.py, mode: append }
      # A fixed `platform:<app>:<noun>:<key>` id written once as a module
      # constant and used by name (ADR workflows-3). The string is what rule 18
      # judges; binding it to a name changes nothing about it, and refusing it
      # would push authors back to inlining the literal at every callsite.
      - { fixture: platform_constant_id.py, plant_at: apps/example/services.py, mode: append }

  - id: "19"
    name: structured-logging-only
    enabled: true
    statement: >
      Every log line goes through core.log: no print, no bare
      logging.getLogger, no f-string/% in a log call; only core/observability.py
      configures logging.
    check: structured_logging
    doc: { file: docs/product/architecture.md, contains: "no bare `logging.getLogger`" }
    valve:
      marker: "<comment> rule-19: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      exemptions:
        - path: apps/core/service.py
          reason: >
            the @service decorator's event name IS the service's own name —
            f"{action}.called" — the one legitimately dynamic event, bounded to
            the three lines the decorator writes.
    floors: { files_scanned: 90 }
    does_not_cover: >
      PII in an ALLOWED log key (LOG_KEYS content is review's); .format() and
      string-concatenation event names; a logger bound to a name other than
      log/logger; stdout writes from management commands (self.stdout is the
      command contract, not a log).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 1 }
    canaries:
      - { fixture: print_call.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: fstring_log.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: bare_getlogger.py, plant_at: apps/example/selectors.py, mode: append }
    negatives:
      - { fixture: structured_log.py, plant_at: apps/example/services.py, mode: append }

  - id: "20"
    name: declared-append-only
    enabled: true
    # ADR core-6, P0 W1-R2. This rule used to name ONE model — AuditEntry —
    # which is the shape that does not survive a product: a witnessed fact, an
    # accrual and a stage-transition log make the same promise and none of them
    # is called AuditEntry. The population is now the DISCOVERED set of models
    # declaring `append_only = True` (core.models.APPEND_ONLY_ATTR; the live
    # registry answers the same question through core.models.append_only_models).
    # A product adds a member by declaring it on the model, in the same commit,
    # with no edit to this file — and the second canary below is what proves the
    # population is read from the declaration rather than from a name list.

    # THE STATIC TIGHTENING (LF-Q). Until the scan read
    # QUERYSET rewrites only — `AuditEntry.objects.update(...)` — and the
    # instance form was invisible, because the row is read back into a local
    # name and the receiver is `entry` with the model's name nowhere in it. The
    # binding is now walked: `entry.save()` on a name bound to a member's row,
    # and `entry.delete()` on any such name. This is the PAIR of LF1-2's runtime
    # belt (`BaseModel.save`/`.delete`, ADR core-14) and not its replacement —
    # the belt sees every instance whatever its name and needs the line to run;
    # this sees the line without running it and needs the binding to be legible.
    # The asymmetry between `save` and `delete` is the belt's, copied exactly:
    # `save()` refuses only when `_state.adding` is False, because the ONE
    # legitimate write an append-only model ever does is its create.
    statement: >
      Rows of a model that declared `append_only = True` are append-only: a
      service may .create() one and no code path outside the model's own
      declaring module calls .delete(), .update() or .bulk_update() on them,
      anywhere, ever — nor `.save()` on a name bound to a row that was read
      back, nor `.delete()` on such a name, which is the same rewrite one
      indirection along. AuditEntry is the first member. (The enforceable half
      of rule 20; context-binding is the doors' construction.)
    check: append_only_writes
    doc: { file: docs/product/architecture.md, contains: "declared `append_only = True`" }
    valve:
      marker: "<comment> rule-20: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # `bound_names` is LF-Q's addition and it is the tightening's own tripwire:
    # measured 3 on this tree (a queryset in `audit_tail`, a queryset in
    # `example/selectors.py`, and the constructed row in `_append_entry`). A
    # binding walk that stops binding anything takes it to zero and the whole
    # instance half goes silently dark, which reads exactly like a clean tree.
    floors: { files_scanned: 3, append_only_models: 1, bound_names: 3 }
    does_not_cover: >
      raw SQL against an append-only table; an archival job written in the
      model's OWN declaring module (that module is where a member's rows are
      reviewed, which is why it is the one place this rule does not scan — for
      AuditEntry it is apps/core/audit.py, as it always was); a member reached
      through a queryset variable whose name does not mention the model as a
      whole word — made the receiver match word-bounded, and LF-Q's binding
      walk closes the `audit_entries.delete()` half of that gap where the
      binding itself is legible, which leaves the residue below; A BINDING THIS
      CANNOT SEE — a function PARAMETER holding a member's row, a dict or list
      element, a comprehension target, a name that came back from a helper —
      whose `.save()` is invisible here and is exactly what the runtime belt is
      for (ADR core-14, and the two halves are stated as a pair on purpose); a
      model that means to be append-only and never declares it — the
      declaration IS the population, so silence here is silence there; whether
      an append-only table's rows should EXPIRE, which is a different question
      with a different answer and is house rule 31's (`apps.core.lifecycle`);
      the context-binding half of rule 20 — request_id/correlation_id discipline
      is built into the doors and proven by the platform tests, not scanned
      here; ANY FILE OUTSIDE apps/ AND config/ — the scan walks those two trees
      and nothing else (quality/checks.py `append_only_writes`), so a
      `.delete()` on a member's queryset written in scripts/, in deploy/, in a
      migration's RunPython or typed straight into a `manage.py shell` is
      invisible to it. This is NOT the residue the runtime belt covers, and
      that is the whole point of saying it here: the belt is on
      `BaseModel.save`/`.delete`, which a QUERYSET rewrite bypasses by
      construction (the clause above), so the two halves that are stated as a
      pair have a gap where they were supposed to overlap, and a witnessed row
      really was deleted through a green tree from scripts/ during a real
      comms drive. Widening the scan is a separate call; today it
      is declared, not covered.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 4 }
    canaries:
      - { fixture: audit_delete.py, plant_at: apps/example/services.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: a real service module, so the forbidden
      # update is proved where a real one would be written. Move it the day
      # `apps/events/services.py` is split or renamed.
      - { fixture: audit_update.py, plant_at: apps/events/services.py, mode: append }
      # The population is discovered, not listed: a model that declares itself
      # append-only in this same plant is covered by the same run.
      - { fixture: declared_member_delete.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: CanaryLedgerEntry },
          extra_files: [{ fixture: declared_member_model.py, plant_at: apps/example/models.py,
                          mode: append }] }
      # LF-Q's static tightening, and the form nothing static could see before
      # it: the row is READ BACK into a local name, so the receiver is `entry`
      # and the model's name appears nowhere in it. The runtime belt raises
      # `AppendOnlyViolation` on this line the moment it runs; this is the half
      # that does not need it to run.
      - { fixture: bound_instance_save.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "AuditEntry row `entry`" } }
    negatives:
      - { fixture: audit_read.py, plant_at: apps/example/services.py, mode: append }
      # THE ONE WRITE AN APPEND-ONLY MODEL LEGITIMATELY DOES, plus the bystander
      # one indirection along. Two shapes in one fixture because they are the
      # two ways the binding walk could over-fire and both must stay silent: a
      # CONSTRUCTED row saved (`_state.adding` is True — the belt lets it
      # through, and a static half that refused it would accuse the rule's own
      # worked example), and a name bound to `AuditEntryDraft`, which is its
      # bystander moved from the receiver to the binding.
      - { fixture: constructed_instance_save.py, plant_at: apps/example/services.py,
          mode: append }
      # An undeclared model with the same shape of write is NOT this rule's
      # subject — the declaration is the population, and reading a name that
      # merely looks like a ledger would be the name list all over again.
      - { fixture: undeclared_member_delete.py, plant_at: apps/example/services.py, mode: append,
          extra_files: [{ fixture: undeclared_member_model.py, plant_at: apps/example/models.py,
                          mode: append }] }
      # the mirror over-fire, closed rather than declared. `AuditEntryDraft`
      # is a DIFFERENT model that merely begins with a member's name; under a
      # substring match every write to it was a finding with an override as the
      # only exit — the rule accusing a bystander. Word-bounded, it is silent,
      # and the does_not_cover sentence came out in this same diff.
      - { fixture: audit_entry_draft_delete.py, plant_at: apps/example/services.py, mode: append,
          extra_files: [{ fixture: audit_entry_draft_model.py, plant_at: apps/example/models.py,
                          mode: append }] }

  - id: "21"
    name: admin-through-services
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    statement: >
      Every ModelAdmin on a scoped model inherits core.admin.ServiceModelAdmin
      — writes through services, rows filtered to the acting tenant, door=admin
      in the audit row. Read off the live admin registry.
    check: null
    django_check_ids: [djb.E021]
    floor_proxy: count_admin_classes
    doc: { file: docs/product/architecture.md, contains: "a raw `ModelAdmin` on a scoped model is a violation" }
    valve:
      none: "this rule reports only through the django system-check leg (manage.py check --tag djb), and those findings never pass through apply_overrides, so no comment anywhere suppresses one. The shape is corrected, or the rule's declared scope moves in a diff a reviewer reads"
    scope: {}
    floors: { admin_classes: 8 }
    does_not_cover: >
      an admin on an UNSCOPED local model bypassing services (Tenant,
      Membership, ApiToken all inherit ServiceModelAdmin today; nothing forces
      the next one); a ServiceModelAdmin subclass that overrides save_model
      back to obj.save() — inheritance is checked, faithfulness is review's.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: raw_admin.py, plant_at: apps/zzz_canary/admin.py, mode: create,
          via: django, expect: { id: djb.E021, contains: zzz_canary.CanaryScoped } }
      - { fixture: raw_admin_register_call.py, plant_at: apps/zzz_canary/admin.py, mode: append,
          via: django, expect: { id: djb.E021, contains: zzz_canary.CanaryLedger } }
    negatives:
      - { fixture: service_admin.py, plant_at: apps/zzz_canary/admin.py, mode: create,
          via: django, expect: { id: djb.E021 } }

  - id: "22"
    name: expand-contract-migrations
    enabled: true
    statement: >
      Migrations are expand/contract: no non-nullable AddField without a
      default in the same migration; no RunPython without a reverse; no drop
      while the tree still references the name; a model field change ships with
      its migration in the same change (diff layer).
    check: migration_expand_contract
    diff: [model_without_migration]
    doc: { file: docs/product/architecture.md, contains: "no non-nullable column without a default" }
    valve:
      marker: "<comment> rule-22: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { migrations_scanned: 15 }
    does_not_cover: >
      RemoveField reference-tracking (field names like "name" are too common to
      grep for honestly — only DeleteModel is tracked; the drop-timing rule for
      columns is review's); data migrations whose Python is wrong but
      reversible; whether migrations actually run as a release step; a field
      declared somewhere a models.py's AST cannot see it — a class built by a
      factory, a field added by a mixin the diff does not touch — and, in the
      one case where a models.py does not PARSE, the diff leg falls back to the
      old textual match, which reads a docstring as code (a tree that does not
      parse is not a tree this layer can be precise about, and reading it
      strictly is the safe direction).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 3 }
    canaries:
      # DERIVED, like rule 6's negative and for the same class (P7 Q-32b).
      # Rule 22 reads OPERATIONS and never the graph, so a frozen parent here was
      # inert rather than a live defect — but it was frozen at
      # `0005_widget_onboarded_at` and planted under `0009_*` numbers that now
      # sort BEHIND the real leaf, which reads as a fork to anyone opening the
      # directory and would become one the day any graph-aware clause is added to
      # this rule or these fixtures are reused. Deriving costs nothing and takes
      # the trap out; the sweep that found them is in the Q-32b report.
      - { fixture: addfield_no_default.py, plant_at: "apps/example/migrations/{{after:example:canary_addfield}}.py", mode: create }
      - { fixture: runpython_no_reverse.py, plant_at: "apps/example/migrations/{{after:example:canary_runpython}}.py", mode: create }
      - { fixture: migration_bare_override.py, plant_at: "apps/example/migrations/{{after:example:canary_override}}.py", mode: create }
      - { fixture: diff_model_no_migration.py, plant_at: apps/example/models.py, mode: append,
          via: diff, expect: { contains: no migration } }
    negatives:
      - { fixture: addfield_nullable.py, plant_at: "apps/example/migrations/{{after:example:neg_nullable}}.py", mode: create }
      - { fixture: runpython_with_noop.py, plant_at: "apps/example/migrations/{{after:example:neg_runpython}}.py", mode: create }
      # Found in the wild (P0 W1-R1): the conventions here are taught by
      # example and the examples live in docstrings, so the diff leg's textual
      # match read a paragraph as a schema change and demanded a migration for
      # it. The leg now reads the AST — only an assignment in a class body
      # whose value calls models.<Something> is a field — and this shape stays
      # in the corpus forever.
      - { fixture: diff_field_in_docstring.py, plant_at: apps/example/models.py, mode: append,
          via: diff }

  - id: "23"
    name: supply-chain
    enabled: true
    memo:
      "no": "this rule reads pyproject.toml, scripts/check.sh and .secrets.baseline — no scope kind's
        roots reach any of the three and the engine's hard-coded reads name none of them, so the key
        would be blind to all three"
    statement: >
      pip-audit clean, no AGPL/GPL dependency (pip-licenses), no secret in the
      tree (detect-secrets against the committed baseline) — all three are full
      -gate legs in scripts/check.sh; this check carries the high-signal secret
      patterns itself and verifies the legs exist.
    check: supply_chain
    doc: { file: docs/product/architecture.md, contains: "no AGPL/GPL dependency" }
    valve:
      marker: "<comment> rule-23: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { files_scanned: 150 }
    does_not_cover: >
      a vulnerable or copyleft dependency (only the pip-audit / pip-licenses
      LEGS see those, at full-gate time, with the network); secrets that match
      none of the four high-signal patterns — detect-secrets' entropy scan is
      the wider net; secrets in git history rather than the tree.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      - { fixture: aws_key.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: private_key.pem, plant_at: apps/example/canary_key.pem, mode: create }
    negatives:
      - { fixture: dev_fernet_lookalike.py, plant_at: apps/example/services.py, mode: append }

  - id: "24"
    name: org-scoped-reads-chain-visible-to
    enabled: true
    # The hierarchy is ON in this template (architecture.md, "Hierarchy"). A
    # product with no network inside a tenant still pays nothing — every tenant
    # is a depth-one tree and visible_to(root) is the whole table — so there is
    # no opt-out here the way rule 8 has one. A product that removed
    # OrgScopedModel entirely would trip the floor below, which is exit 2 and a
    # conversation, not a silent pass.
    # AMENDED P0 W1-R2, in the same rung-pair that landed G1 (ADR core-3): the
    # read chain now accepts `.governing(org)` as well as `.visible_to(...)`,
    # and the fence on that widening is born in the same diff — `governing()`
    # is legal ONLY on a model that declared `InheritedDownward`, and a call on
    # an unmarked model is a violation here for the same reason it is a
    # TypeError there. Upward CONFIG resolution, never upward visibility.
    # `inherited_downward_models` is deliberately NOT floored: the population is
    # opt-in and zero is a legitimate answer for a product with no inherited
    # configuration. What must never be zero is `org_scoped_models`, below.
    statement: >
      Every read of an OrgScopedModel in a door, service or selector chains
      .visible_to(actor_or_org) after .for_tenant(...) — or .governing(org)
      when the model declared InheritedDownward; a bare tenant-scoped read of
      an org-scoped model is a violation, and a .governing(...) on a model that
      did not declare InheritedDownward is a violation. Membership.role is
      written only by the membership services, so no grant escapes the
      escalation wall; Organization.path and .parent are written only by the
      organization services, so no subtree is detached by hand.
    check: org_scoped_reads
    doc: { file: docs/product/architecture.md, contains: "chains `.visible_to(actor)`" }
    valve:
      marker: "<comment> rule-24: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      membership_role_writers:
        - path: apps/core/services.py
          reason: >
            add_membership and set_role ARE the escalation wall
            (_refuse_escalation): no grant outside the granter's subtree, none
            above their own effective role. Every other module reaches a role
            change through them, which is what makes the wall unavoidable
            rather than customary.
      # THE SAME ACT, ONE COLUMN OVER. `Membership.role` stopped being the only
      # way to change what somebody may do the day the role tables landed: a
      # `Grant` row widens or narrows one person in one branch and a
      # `RolePermission` row is a tenant's own collection, and both are bounded
      # by the same wall the role assignment is (`allow` by what the granter
      # holds, `withhold` by what the target holds). Listed BY FUNCTION rather
      # than by file, because `apps/core/services.py` is also where every other
      # core service lives and "this file may write permission rows" would
      # allow-list the wrong thing.
      permission_row_writers:
        - path: apps/core/services.py
          functions:
            - create_role
            - set_role_collection
            - delete_role
            - create_grant
            - delete_grant
            - rename_permission_rows
          reason: >
            the six that ARE the hand-out rule. `create_role` and
            `set_role_collection` write a tenant's own collection under the
            granter's own ceiling; `delete_role` takes one away; `create_grant`
            and `delete_grant` are the per-person exception and its removal,
            each bounded by what the granter and the target hold; and
            `rename_permission_rows` is the deployment's own maintenance act
            across every tenant at once, reachable only from a management
            command — it moves rows onto a renamed key and hands nobody
            anything new.
      organization_shape_writers:
        - path: apps/core/services.py
          functions: [_create_root_organization, create_organization, apply_organization_move]
          reason: >
            the three functions allowed to decide where a node sits: the root
            at tenant creation, a new child under a locked parent, and the
            re-parent's own write — which takes select_for_update over the
            whole subtree and rewrites it in batches, reached only through the
            move service's workflow. A path edited anywhere else is a subtree
            that silently vanishes from every read in the product.
    # org_scoped_models: 2 — measured 4 on the P0 W1-R2 tree (Recipient,
    # ChannelPreference, Message, Widget), floored under it so the check is
    # bound without being brittle about one model. W1-R3 may only raise it.
    floors: { org_scoped_models: 2, files_scanned: 20 }
    does_not_cover: >
      a .governing(...) whose chain root is a local variable rather than a model
      class — the marker is read off the class, so a queryset handed around and
      resolved elsewhere is outside this, exactly as the visible_to half is;
      whether the org a governing() resolves against is the right one;
      a queryset widened after it crosses a function boundary (the chain is read
      within one expression, so a selector that returns for_tenant(...) and a
      caller that never adds visible_to read as two clean halves); raw SQL,
      .raw() and .extra(); a custom manager or queryset method that forgets to
      scope INSIDE itself (visible_to is seen textually on the chain, not
      semantically); aggregates and counts assembled from a list of ids gathered
      elsewhere; whether the org a read is scoped TO is the right one — a
      visible_to(root) where a branch was meant is right shape, wrong content,
      and stays with review; role writes reached through a private helper in
      another module; and path writes made by a data migration, since migrations
      are not scanned, by design. The permission-row half reads the MODEL NAME
      on the chain root, so a `Grant` row written through a queryset handed in
      from elsewhere, through a related manager (`membership.grants.create(...)`)
      or under an alias is outside it — the same textual limit the visible_to
      half declares above, and the same reason the allow-list is by FUNCTION:
      what makes a hand-out legal is which function is doing it, and nothing an
      AST walk sees can tell whether the wall was paid.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 6, negatives: 5 }
    canaries:
      - { fixture: bare_for_tenant_selector.py, plant_at: apps/example/selectors.py, mode: append,
          expect: { contains: "without .visible_to" } }
      - { fixture: bare_for_tenant_api.py, plant_at: apps/example/api.py, mode: append,
          expect: { contains: "without .visible_to" } }
      # MOVE-TRIGGER 2026-08-24: `events` is the plant because the owners of
      # these writes (`core`'s membership and organization services) are exempt and
      # could not host a canary. Move it to another non-exempt app's `services.py`
      # the day `events` becomes an owner of either write.
      - { fixture: membership_role_write.py, plant_at: apps/events/services.py, mode: append,
          expect: { contains: "escalation wall" } }
      # MOVE-TRIGGER 2026-08-24: the second forbidden write, in the same non-
      # exempt module — it moves with the one above.
      - { fixture: organization_shape_write.py, plant_at: apps/events/services.py, mode: append,
          expect: { contains: "detaches a subtree" } }
      # The fence on G1's widening: the nearest-ancestor read on a model that
      # never declared itself inherited-downwards.
      - { fixture: governing_unmarked.py, plant_at: apps/example/selectors.py, mode: append,
          expect: { contains: "InheritedDownward" } }
      # THE THIRD FORBIDDEN WRITE, one column over from the role: a `Grant` row
      # handed out by a DOOR. Planted into the scaffold rather than a product
      # app because the two writers this rule allow-lists are core's own and a
      # product app has no permission row to write; the door is the shape that
      # matters, because every door in the tree could grow this line.
      - { fixture: grant_write_in_a_door.py, plant_at: apps/zzz_canary/api.py, mode: create,
          expect: { contains: "outside the permission services" } }
    negatives:
      - { fixture: visible_to_chain.py, plant_at: apps/example/selectors.py, mode: append }
      - { fixture: tenant_only_read.py, plant_at: apps/example/selectors.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: the legal read that must stay silent,
      # planted beside the canaries it is the pair to. It moves with them.
      - { fixture: reads_without_writing.py, plant_at: apps/events/services.py, mode: append }
      # The same call on a MARKED model, silent — the pair to the canary above,
      # so the widening is proven legal exactly where it was widened.
      - { fixture: governing_marked.py, plant_at: apps/example/selectors.py, mode: append,
          extra_files: [{ fixture: governing_marked_model.py, plant_at: apps/example/models.py,
                          mode: append }] }
      # The pair to the grant canary: the same write with the generic override
      # and a sentence on it. The allow-list itself is BY FUNCTION and lives in
      # this file, so what this proves is the other road — the one a genuine
      # exception outside core takes, counted in the standing override census.
      - { fixture: permission_row_with_reason.py, plant_at: apps/zzz_canary/services.py,
          mode: create }

  - id: "25"
    name: only-comms-sends
    enabled: true
    statement: >
      No module under apps/ imports a declared SENDER — a module that carries a
      message out of this product — outside the allow-list below, and an
      allow-list entry that pins its modules permits only those.
      comms.send() is the only legal sender in the product: consent, quiet
      hours and suppression are enforced INSIDE it, so a feature that reaches
      for a mail module or a vendor's SMS SDK reaches around all three.
    check: mail_imports
    doc: { file: docs/product/architecture.md, contains: "the only legal sender" }
    valve:
      marker: "<comment> rule-25: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      # THE SENDERS — the population, declared rather than hard-coded (
      # ING-4 T2). The wall was two mail modules while email was the only
      # transport this product had; ADR comms-9 grows it a second and names the
      # third, and its own sentence is that the wall "covers three transports,
      # same rule id". So the next transport is a line here plus its canary, and
      # never an edit to `quality/checks.py`.
      senders:
        - module: django.core.mail
          reason: >
            Django's own mail path. `send_mail`, `EmailMessage`,
            `get_connection` — every one of them puts a message on a wire
            without asking whether this person consented, is asleep, or has
            bounced.
        - module: apps.core.mail
          reason: >
            the platform's own templated mailer. It is a sender in exactly the
            same sense and predates comms, which is what the ratchet below is
            counting down.
        - module: twilio
          reason: >
            the SMS vendor's SDK (ADR comms-9's stack ruling). A `twilio.rest`
            client sends a text with one call and knows nothing about
            `ChannelPreference`, quiet hours or suppression — which is the whole
            of what this rule refuses. The whole package is named rather than
            `twilio.rest`, so the request validator and everything else the
            vendor ships are inside the wall too: a module that has reached for
            the SDK at all is a module about to send.
      # The five places a sender may legitimately appear, each with what it is
      # doing there. Everything else calls `apps.comms.services.send`. An entry
      # with `modules:` is PINNED to those senders; one without permits every
      # sender at that path, which is what these entries have always meant.
      allow:
        - path: apps/comms/
          modules: [django.core.mail, apps.core.mail]
          reason: >
            the app the rule exists to funnel everything into. Its
            `providers.EmailChannel` IS the transport — it hands the rendered
            message to Django's mail path — and it is reached only from
            `activities.deliver_message`, after `send()` has already written
            the row and decided the message may go. Pinned to the mail modules
            since: being the comms app buys the right to carry a message,
            not the right for any file in it to reach for a vendor's SDK.
        - path: apps/comms/providers.py
          modules: [twilio]
          reason: >
            the one module that holds a vendor transport (ADR comms-9: the SDK
            modules are "pinned to `apps/comms/providers*`").
            `TwilioSmsChannel` is the adapter and `verify_sms_webhook` is the
            vendor's own signature check — the two seams this repository holds
            against Twilio, both reached from an activity or from the signed
            receiver, and neither of them a way past `send()`. A second file in
            this app importing the SDK is the finding this pin exists to make.
        - path: apps/core/mail.py
          reason: >
            the platform's own mailer: the templated, workflow-backed send the
            invitation flow uses (`core.services.invite_member`). It predates
            comms and is the standing import the ratchet below names — the
            module itself is allowed to be a mailer; what is ratcheted is its
            one remaining CALLER.
        - path: apps/workflows/activities.py
          reason: >
            the generic `send_email` activity behind `core.mail`. It is the
            edge where that mailer's I/O happens, exactly as
            `comms/activities.py` is for comms' — an activity doing the send
            is the shape both mailers take, and it decides nothing about
            whether the message may go.
        - path: apps/core/tests/
          reason: >
            proof, not product. A test of the mailer has to import the mailer,
            and a test that asserts nothing was sent has to read
            `django.core.mail.outbox`. (Every `tests/` directory is skipped by
            the scanner already; this entry is the judgement written down, so
            the skip is a decision rather than an accident of the walker.)
    # The one standing caller: apps/core/services.py imports `core.mail` for
    # invite_member. NOT rewired this cycle, on purpose (ADR comms-2): the core
    # rung and the comms rung ran in parallel and rewiring it would have been a
    # cross-lane dependency. The follow-on is named — next core-thawing cycle —
    # and until then this number may shrink and never grow.
    ratchets:
      mail_imports: 1
    floors:
      files_scanned: 90
      # 2 -> 5 at: the two mail imports the wall has always counted, plus
      # the three the SMS transport adds in `apps/comms/providers.py` (the mail
      # one it already had, the vendor client, the vendor validator). A rising
      # floor, for the reason the count exists: these go quiet first if the
      # recogniser stops recognising an import, where a violation count falling
      # to zero would read as a pass.
      allowed_mail_modules: 5
    does_not_cover: >
      a hand-rolled smtplib/SMTP session, an ESP's own SDK, an SMS vendor this
      product has not declared, or an HTTP POST to a mail API — none of them
      import a DECLARED sender, and rule 14's HTTP wall and review are what
      stand there. The declaration is the coverage: `twilio` is inside this wall
      because ADR comms-9 made it the reference SMS transport and named it in
      `scope.senders`, and the second product's own vendor is outside it until
      that product adds a line. Also uncovered: a sender reached through
      importlib or getattr at runtime; a helper in a third module that wraps
      send_mail and is imported under another name (the wrapper itself is
      caught, its callers are not); `send_mail` re-exported from somewhere
      else; whether a module ON the allow-list still deserves to be; and
      config/settings' EMAIL_BACKEND strings, which name a backend rather than
      import a sender.
    # The recorded self-test population (see the header). Rising floor.
    # 3 -> 5 canaries and 3 -> 4 negatives at: ADR comms-9's "canaries
    # re-planted per transport", which is one plant for the new sender in a
    # domain app and one for the PIN — an exemption whose scope nothing tests is
    # an exemption that quietly widens.
    selftest_floor: { canaries: 5, negatives: 4 }
    canaries:
      - { fixture: django_mail_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "django.core.mail" } }
      - { fixture: core_mail_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "apps.core.mail" } }
      - { fixture: dotted_mail_import.py, plant_at: apps/example/selectors.py, mode: append,
          expect: { contains: "only legal sender" } }
      # THE SECOND TRANSPORT: the vendor SDK in a domain app's services.
      - { fixture: twilio_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "twilio" } }
      # AND THE PIN ITSELF: the same SDK inside the comms app, in a module that
      # is not `providers.py`. It is the half a path-only allow-list could not
      # say — the scaffold cannot stand in for it, because what is being proved
      # is a fact about THIS app's own exemption and its boundary.
      # MOVE-TRIGGER 2026-08-24: site-bound to ADR comms-9's pin. The day
      # the vendor transports leave `apps/comms/providers.py` — a
      # `providers/twilio.py` package, say — edit the allow entry and this plant
      # follows it to whichever comms module is then NOT the exempt one. It
      # cannot go silent by the app growing a feature: an appended import always
      # runs.
      - { fixture: twilio_in_a_second_comms_module.py, plant_at: apps/comms/services.py,
          mode: append, expect: { contains: "twilio" } }
    negatives:
      # The pinned exemption, silent in the one module the allow-list names —
      # proving it anywhere else would prove something about a file the rule
      # does not talk about (rule 33's `apps/search/selectors.py` precedent).
      # MOVE-TRIGGER 2026-08-24: it moves with the allow entry above, the
      # day the vendor transports leave `apps/comms/providers.py`.
      - { fixture: allowed_twilio_import.py, plant_at: apps/comms/providers.py, mode: append }
      # MOVE-TRIGGER 2026-08-24: the allow-listed mail import, proved in the
      # module rule 25's allow-list actually names. Move it the day
      # `apps/workflows/activities.py` leaves that allow-list — an allow-list entry
      # with no negative behind it is an exemption nobody re-reads.
      - { fixture: allowed_activity_import.py, plant_at: apps/workflows/activities.py,
          mode: append }
      - { fixture: comms_send_call.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: mail_in_prose.py, plant_at: apps/example/services.py, mode: append }

  - id: "26"
    name: services-name-only-reachable-rows
    enabled: true
    memo:
      "no": "CONSERVATIVE, declining pending evidence: the audit that shipped this memo found this
        census reads only paths the walk already names, so a key would probably be sound. It declines
        anyway because a census whose population is derived from several globs is the shape an unnamed
        read hides in, and the memo is a projection of the scan rather than a second opinion about it.
        Lift it with a diff a reviewer reads"
    # ADR core-4 (G3), P0 W1-R2. The hole this closes has no other guard: a
    # service takes `recipient=`, `policy=`, `parent=`; the caller hands over an
    # id; the id resolves to a row in a branch the caller holds no membership
    # over, and the write lands. Tenancy does not catch it — the row IS in the
    # tenant. The policy does not catch it — the policy is about the verb.

    # MEASURED BEFORE ENFORCED: quality/reach-measurement.md, over tree
    # d0514c451f05f334b8c3ea328f99309cd2a4f4a0 (main @ 9326175), which is the
    # tree branched from. 7 services.py files, 69 @service functions,
    # 18 writing an org-scoped row, 15 parameters annotated with an org-scoped
    # model, `may_be_named` called nowhere. Every non-zero count below is a
    # ratchet from that measurement: it may shrink and never grow.

    # W1-R3 (apps/example) was building concurrently and had not merged. Its
    # merge may RAISE the populations and LOWER a ratchet; it may not raise one
    # — the cycle plan's standing constraint (c) is that R3 ships zero rule-26
    # violations and zero `# reach:` overrides, so the numbers here are the
    # numbers after it lands. The floors are read the same way: measured
    # pre-R3, and R3 can only move them up.
    statement: >
      A @service that writes a row of the reach population — an org-scoped row,
      or a row that names its organization through a foreign key (Membership) —
      and takes a parameter annotated with a population model passes that
      parameter through core.authz.may_be_named(actor, ...) — refusing when it
      is False — or carries `# reach: <reason>` on the parameter or on the
      function. A write of a row holding a foreign key TO a population member
      (Grant.membership) is a write on the strength of that member and counts.
      And reach is asked BEFORE capability: a require/allows whose
      object is the parameter, above the may_be_named that clears it, is a
      finding of this rule. The
      annotation IS the declaration: which keyword arguments are foreign-key
      targets is an open set (ADR core-4 rejects generic enforcement inside
      @service for exactly that reason), and an annotation naming a model in
      the tree is the closed half of it. The abstract `OrgScopedModel` base is
      itself one of those annotations: `row: OrgScopedModel` says "any row one
      part of a tenant owns" and is the most honest thing a parameter can
      declare, so it is in the population rather than out of it.
    check: service_reach
    doc:
      file: docs/product/architecture.md
      contains: "A service names nothing the actor could not have reached"
    valve:
      marker: "# reach: <reason>"
      where: "on the parameter's own line (or the contiguous comment block above it) to excuse that one parameter, or on the `def` line or the first decorator line to excuse the whole function"
    scope: {}
    # Findings are classed by APP, so one app's backlog cannot pay for another
    # app's growth, and the per-app numbers in reach-measurement.md and the
    # per-app numbers here are the same numbers. An app with no entry is
    # ratcheted at zero: accounts, connections, core, events and workflows
    # write no org-scoped row from a @service at all, so the first one any of
    # them grows is a violation from the first one.
    ratchets:
      # exports 3 -> 0 and files 3 -> 0. They were the ORDER clause's, found by
      # it at birth and named: `mark_export_running`, `finish_export`,
      # `record_export_failure`, `archive_file`, `store_bytes`, `store_stream`
      # all wrote `require(actor, key, row)` and THEN
      # `if not may_be_named(actor, row): raise NotFound()` — both halves
      # present, the sequence inverted, so a row outside the actor's subtree
      # was answered `forbidden` (an existence oracle) where `not_found` is the
      # honest answer. Those apps' own rungs swapped the two lines in each; the
      # gate has printed "NO violations left" against both numbers since, and
      # a number above its real count is headroom that absorbs a planted
      # canary and reports it DEAD. Zero here means the first rule-26 finding
      # either app grows is a violation from the first one.
      exports: 0
      files: 0
      # comms: 12 -> 0 (coupled to the adoption commit). All twelve rows
      # took the real check rather than a `# reach:` sentence: every one of them
      # already receives its row from a `.visible_to(hat)` read, so the check is
      # free today and is the fence the second caller meets. Zero here means the
      # first rule-26 finding comms grows is a violation from the first one.
      comms: 0
      example: 3
    # Each floor is a little under its measured population, so the check is
    # bound without being brittle about one function: files_scanned 7,
    # writing_services 18, fk_target_kwargs 15, org_scoped_models 4.
    #
    # `org_scoped_annotations` is the base-included population and it
    # is `org_scoped_models` plus exactly one, always: the day the two stop
    # differing by one, the abstract seed has stopped being counted and the
    # blindness this closed has come back. Floored one above its sibling for
    # that reason and no other.
    # MEASURED AFTER THE WIDENING, on main 11b1a765: files_scanned 11,
    # writing_services 45, fk_target_kwargs 32, org_scoped_models 13,
    # org_fk_models 2 (`Membership`, `Event`), org_scoped_annotations 16,
    # reachability_checks 25, reach_order_checked 16, reach_overrides 4.
    #
    # `org_fk_models` is floored at 1 and not at 2 for the reason every floor
    # here is a little under its measurement — but it may never be zero: a
    # population that lost its FK-bearing half is the population `Membership`
    # was invisible in, which is the state this widening exists to end.
    floors:
      files_scanned: 6
      writing_services: 10
      fk_target_kwargs: 10
      org_scoped_models: 2
      org_fk_models: 1
      org_scoped_annotations: 3
    does_not_cover: >
      a target laundered through a local variable — `row = resolve(id)` then a
      write reads as two clean halves, because this rule reads annotations and
      not dataflow, and that is exactly why the valve is a visible comment
      rather than a suppression; an unannotated parameter (out of the
      population by construction — rule 13 is what keeps typed services from
      being a hole anybody finds by accident); a reference reached through
      **kwargs or a dict; whether the REASON in a `# reach:` comment is a good
      one — the gate counts them (`reach_overrides` on this rule's status line)
      and prints the total, and judging them is review's and the surveyor's
      standing lens, not this check's; whether a may_be_named call actually
      REFUSES on False (the call is seen, the branch after it is review's);
      a service whose write happens in a helper in another module; and every
      door and activity, which reach a service and are judged there. THE
      ABSTRACT BASE IS NOW IN THE POPULATION (closed 2026-08-29): a
      parameter annotated `OrgScopedModel` used to be structurally invisible
      here, because the model walk discards its own seed — the honest
      annotation was the one annotation nobody asked about. What is still
      outside: an annotation naming a base a PRODUCT introduced between
      `OrgScopedModel` and its models is in (the walk is transitive), but an
      annotation naming a protocol, a `TypeVar` or `Any` is not, and no
      annotation-reading rule can make it be. AND THE WIDENING'S OWN EDGE: a
      reach through a foreign key of a row that is NOT in the population —
      `delete_grant(grant: Grant)` reaching its node through `grant.membership`
      — is outside, because `Grant` is not a population model and an attribute
      argument clears nothing about the parameter it came from (canary 4's own
      lesson). `test_handing_out.py`'s NotFound case is that one's belt, and it
      is named here rather than discovered. The ORDER clause reads statement
      POSITIONS inside one function body: an order established across a helper
      call, or a `may_be_named` whose result is never raised on, are both
      outside it — the first has no single body to read and the second is
      already declared above.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 8, negatives: 7 }
    canaries:
      # (1) the ordinary shape: a new service takes an org-scoped row and never
      # asks whether the actor could have reached it. Planted into an app that
      # already sits at a ratchet, so this also demonstrates growth past one.
      - { fixture: unreached_kwarg.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "may_be_named" } }
      # (6) THE WIDENING'S OWN FORM: `set_role`'s exact shape. A `Membership`
      # carries an `organization` column and inherits `BaseModel` rather than
      # the scoped base, so it sat outside this population and a service handed
      # one from anywhere could write a role on the strength of it, gate green.
      - { fixture: set_role_shaped_without_reach.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "may_be_named" } }
      # (7) The write one hop away: a `Grant` names its node through the very
      # membership the caller passed, so reading only the direct population
      # would stop one hop short of `create_grant` — the service the widening
      # exists for.
      - { fixture: grant_writer_without_reach.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "may_be_named" } }
      # (8) The order clause: both halves present, the sequence inverted. The hardest shape
      # to see, because everything the rule used to ask for is there.
      - { fixture: reach_after_require.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "BEFORE core.authz.may_be_named" } }
      # (2) the same in a second app, on a different model, so the rule is not
      # one app's habit.
      # MOVE-TRIGGER 2026-08-24: the second app, so the rule is not one app's
      # habit, and `comms` is the app with an org-scoped recipient to name. Move it
      # the day `comms` has no org-scoped FK parameter left for the fixture to
      # annotate.
      - { fixture: unreached_recipient.py, plant_at: apps/comms/services.py, mode: append,
          expect: { contains: "may_be_named" } }
      # (3) the valve with nothing in it. An escape hatch nobody has to justify
      # is an off switch, and the gate says so about its own overrides too.
      - { fixture: bare_reach_comment.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "no reason" } }
      # (4): the reference laundered through an ATTRIBUTE of itself.
      # `may_be_named(actor, widget.parent)` asks about the parent and clears
      # nothing about `widget` — and the old walk-every-Name reading marked
      # `widget` checked, so a service could satisfy rule 26 by asking a
      # question about a different row. Direct Name arguments only; the blind
      # spot came out of does_not_cover in this same diff.
      - { fixture: laundered_attribute_kwarg.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "may_be_named" } }
      # (5) the parameter annotated with the ABSTRACT BASE. Before
      # 2026-08-29 this plant produced nothing at all — `_transitive` discards
      # its seed, so `OrgScopedModel` was not in the population and the most
      # honest annotation a service can write was the one the rule could not
      # see. It fires now, and it is the form that dies if anybody re-narrows
      # the population to concrete models.
      - { fixture: base_annotated_kwarg.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "may_be_named" } }
    negatives:
      - { fixture: checked_kwarg.py, plant_at: apps/example/services.py, mode: append }
      - { fixture: reach_with_reason.py, plant_at: apps/example/services.py, mode: append }
      # A service that writes a TENANT-scoped row, and a parameter annotated
      # with a tenant-scoped model: neither is this rule's subject, and reading
      # them as one would make every service in the product a finding.
      - { fixture: tenant_scoped_service.py, plant_at: apps/example/services.py, mode: append }
      # A read of an org-scoped row with no write anywhere — `approve_widget`'s
      # real shape, found on the tree at measurement time.
      - { fixture: reads_without_writing.py, plant_at: apps/example/services.py, mode: append }
      # The widening's right form: reach, then capability, then the write.
      - { fixture: set_role_shaped_with_reach.py, plant_at: apps/example/services.py,
          mode: append }
      # The same population row, written nowhere — out of scope and must stay.
      - { fixture: membership_read_only.py, plant_at: apps/example/services.py, mode: append }
      # The order canary's pair. Kept because the order clause reads STATEMENT
      # POSITIONS, and a check that read them wrongly would fire here as
      # readily as on the canary — which is the one way anybody finds out.
      - { fixture: reach_before_require.py, plant_at: apps/example/services.py, mode: append }

  - id: "27"
    name: one-door-to-the-identity-platform
    enabled: true
    # ADR ident-2, P0 W2-R2. Identity configuration is written through our
    # audited services and materialised in Zitadel by ONE activity: the row is
    # the intent, Zitadel is the materialisation, and **the console is a window,
    # not a door**.

    # The honest scope, stated before the statement: a check cannot see
    # Zitadel's console, and somebody with an admin login there can change
    # anything. This rule is the half that IS in the tree, and
    # `manage.py zitadel_audit` — a read-only drift report, not a gate leg — is
    # the tripwire for the other half. Saying that out loud is the point of
    # `does_not_cover` below.
    statement: >
      The Zitadel management API is reached through apps/accounts/zitadel.py and
      nowhere else. No module outside it names the ZITADEL_PAT setting (except
      config/settings, where the environment is read), and no module outside the
      allow-list below imports it at all — a management call belongs in an
      activity, where a failure is a Temporal retry, or in a zitadel_* command,
      which is the shell door. A service that made one would put external I/O
      inside a transaction, and a Zitadel hiccup would roll back a legitimate
      row (C2).
    check: zitadel_client
    doc:
      file: docs/product/architecture.md
      contains: "the console is a window, not a door"
    valve:
      marker: "<comment> rule-27: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      # Who may IMPORT the client. Three places, each with what it is doing
      # there. Everything else starts SyncIdentityConfigWorkflow instead.
      allow_import:
        - path: apps/accounts/activities.py
          reason: >
            the edge where the management I/O happens. `apply_identity_config`
            is called by a workflow with a retry policy, so a Zitadel that is
            down is a run that finishes later rather than a request that 500s —
            which is the entire reason this call is not in the service.
        - path: apps/accounts/management/commands/zitadel_seed.py
          reason: >
            the shell door, making the deployment's own project, applications
            and dev user. These objects belong to the installation, not to any
            tenant, so there is no row for them to be the intent of and nothing
            for a workflow to carry.
        - path: apps/accounts/management/commands/zitadel_audit.py
          reason: >
            the read-only drift report. It is the honest half of this ADR: it
            reaches the management API to COMPARE, never to write, and every
            call it makes is a GET or a _search.
        - path: apps/accounts/management/commands/zitadel_first_admin.py
          reason: >
            the shell door, minting the deployment's first identity — once, by
            an operator, with no tenant yet to authorise it. There is no service
            to route it through and no workflow to carry it: nothing of ours is
            written, and the persona a runtime door would authenticate does not
            exist yet, which is the whole problem it exists to solve (ADR
            ident-9). It refuses the moment a Tenant row exists, so the
            product's own invite_member is the only invitation path from the
            first member on.
      # Who may NAME the credential. Two, and they are the two ends of one
      # variable.
      allow_secret:
        - path: config/settings/
          reason: >
            where the environment is read into settings, and where the test
            settings blank it so a suite that somehow reached the client raises
            ZitadelNotConfigured before it opens a socket. Naming a variable to
            read it from the environment is not the leak this guards.
    floors:
      # A little under the measured population on the tree built, so
      # the check is bound without being brittle about one file. Measured
      # 2026-09-07 on the tree that added the first-admin door: files_scanned
      # 252, client_module 1, client_importers 4 (the activity, the seed, the
      # audit, the first-admin command), pat_sites 4.
      files_scanned: 90
      client_module: 1
      client_importers: 3
      pat_sites: 2
    does_not_cover: >
      **Zitadel's own console**, which is the declared blind spot this rule is
      one half of: an admin signed in there can create, change and delete any
      identity configuration, and nothing in this tree can see it —
      `manage.py zitadel_audit` is the runtime tripwire, and
      `manage.py zitadel_reconcile` asks the services to close what that audit
      reports — by hand, as a deploy step, with `--dry-run` and the 0/1/2 exit
      codes shaped for one. What is deliberately not built is a SCHEDULED run
      of the reconciler, and that command's own docstring names the trigger for
      building one (ADR ident-2): a drift found in production that nobody in
      this deployment caused. Also
      uncovered: a hand-rolled httpx call to the management API that imports
      neither this module nor the setting (nothing in the tree does, and review
      is what stands there); the PAT reached under a DIFFERENT env-var name or
      through a constructed string — a literal os.environ["ZITADEL_PAT"] DOES
      fire, because the recogniser matches the constant, not the module path;
      any file outside apps/ and config/ — those two trees are all this check
      walks, so a naming in scripts/ or elsewhere is invisible to it; the
      client reached through importlib or a re-export under another name;
      whether a module ON either allow-list still deserves to be; and whether
      the activity's use is CORRECT — that it is idempotent and that it writes
      back through a service is the rung's criteria and the tests, not this
      check's.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 3 }
    canaries:
      # (1) the shape the rule exists for: a service reaching the management API
      # directly, which is the external call inside a transaction (C2).
      # MOVE-TRIGGER 2026-08-24: rule 27's subject IS `apps/accounts` — the
      # one app allowed near the identity client — so a probe-app plant would not be
      # a canary for this rule at all. It moves the day the Zitadel seam moves out
      # of `apps/accounts`.
      - { fixture: client_in_service.py, plant_at: apps/accounts/services.py, mode: append,
          expect: { contains: "inside a transaction" } }
      # (2) a door doing it, in a second app and through the other import form,
      # so the rule is not one module's habit and not one syntax's.
      - { fixture: client_in_door.py, plant_at: apps/example/api.py, mode: append,
          expect: { contains: "apps.accounts.zitadel" } }
      # (3) the credential itself, named somewhere that is neither the client
      # nor the settings module.
      - { fixture: pat_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "ZITADEL_PAT" } }
    negatives:
      # The activity's legitimate use — allow-listed, and an allow-list that
      # fires is decoration.
      # MOVE-TRIGGER 2026-08-24: the allow-listed importer, proved in the
      # module the allow-list names. It moves with that allow-list entry.
      - { fixture: allowed_activity_import.py, plant_at: apps/accounts/activities.py,
          mode: append }
      # Prose. This repository's own docstrings name ZITADEL_PAT repeatedly, and
      # a check that fired on the word would fire on its own reasons.
      - { fixture: pat_in_prose.py, plant_at: apps/example/services.py, mode: append }
      # A different ZITADEL_* setting, read outside the client. W2-R3 and W2-R4
      # read the ISSUER from settings all over the RP and resource-server paths;
      # the issuer is public — it is in the discovery document — and reading it
      # is not this rule's subject.
      - { fixture: issuer_read.py, plant_at: apps/example/services.py, mode: append }

  - id: "28"
    name: workflows-close-their-runs
    enabled: true
    # ADR workflows-5. MEASURED BEFORE ENFORCED, over tree
    # dfdb0c922be7fbf8ed520a8983f587852e514d78 (main @ b93e318, "Ledger: W1
    # merged") — 9 workflow classes in 5 apps; 7 pass by reaching the seam, 1
    # by declaration, 1 fails.

    # The defect was not subtle: the platform app's own SendEmailWorkflow and
    # MoveOrganizationWorkflow never marked their WorkflowRun finished, so
    # every row they wrote said RUNNING for ever, and EchoWorkflow marked
    # itself COMPLETED before doing anything. W1 fixed all three. This rule is
    # what stops the 15th builder's first workflow from reopening it — the
    # wrong shape costs nothing at write time and only lies later, to a reader
    # with no way to know.

    # THE CLOSED QUESTION had to cover two seams that are BOTH correct:
    # apps/workflows/workflows.py result, slug = await _finish(work)
    # the four domain apps await self._finish(status=, error=)
    # So it asks whether the @workflow.run method REFERENCES a name ending
    # `_finish` (or names the finish activity), not whether it makes one exact
    # call. Asking for `mark_run_finished` by call would miss both — they
    # invoke the activity by name one level down, which house rule 9 requires.
    statement: >
      Every class in an app's discovered WORKFLOWS list closes the visibility
      row its start wrote: its @workflow.run method reaches the app's finish
      seam (a name ending `_finish`, or the mark_run_finished activity), and
      reaches it LAST — or the class declares `owns_no_run = True`, which is
      the schedule-started population that owns no row at all.
    check: workflows_close_runs
    doc:
      file: docs/product/architecture.md
      contains: "declares `owns_no_run = True`"
    valve:
      marker: "<comment> rule-28: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    # SCOPE, decided rather than inherited: the scan reads exactly
    # `apps/<app>/workflows.py` — the module `config.temporal` discovers — and
    # walks no other file, tests/ included. The reason is the rule's own
    # subject: what makes a workflow owe a closing is that a SERVICE started it
    # and wrote a `WorkflowRun` row. A test fixture's workflow (W4 grows a
    # parent/child pair in `apps/workflows/tests/childwork.py`, which has to
    # live in an importable module for the workflow sandbox) is started by the
    # test's own client against a time-skipping environment; no service asked,
    # no row exists, and demanding `owns_no_run = True` on it would be
    # ceremony that teaches the marker means "I am a test" instead of "I own no
    # row". Declared in does_not_cover below, both halves.
    scope: {}
    # W3 measured this population before enforcing it and found exactly one
    # class satisfying neither half — apps/events/workflows.py::
    # PurgeExpiredWorkflow, schedule-started beside a sibling that declared
    # itself — and booked it rather than reaching into another app to make its
    # own new rule green. The PM ruled the one-line marker into B1's scope;
    # B1 landed it, and the ratchet went to ZERO in the same diff that did.
    # Nothing here is a standing backlog any more: the first workflow that
    # forgets its seam is a violation from the first one.
    ratchets:
      workflows: 0
    # A little under the measured 9 classes / 5 modules, so the check is bound
    # without being brittle about one class.
    floors: { workflow_classes: 7, workflow_modules: 4 }
    does_not_cover: >
      WHETHER the seam is reached on every path — the check sees the reference,
      not the control flow, so a `_finish` call inside a branch that never
      executes, or after an early return, reads as satisfied; whether _finish
      marks the RIGHT status (W1's tests prove that from the outside — start
      EchoWorkflow with "" and the row must end failed); whether the seam is
      truly LAST (the statement says it and a reviewer reads it; the scanner
      only knows it is there); whether an `owns_no_run = True` declaration is
      TRUE — it is a declaration, made on the class where a reviewer meets it,
      and W4's reconciler is the runtime instrument that finds the row a false
      one left behind; a class with @workflow.defn that is in no WORKFLOWS list
      (not registered on any worker, so it cannot run, so it owns nothing);
      **any workflow class outside an app's own `workflows.py` — tests/
      included** (see the scope note above: the scan reads the module
      config.temporal discovers and nothing else, so a parent/child fixture
      pair in `apps/<x>/tests/*.py` is out of the population by construction
      and needs no `owns_no_run`; a product that puts a production workflow
      somewhere other than `workflows.py` is out of this rule's sight and is
      rule 11's finding, not this one's); and a workflow whose run row is
      closed by some OTHER workflow or by a service after the fact — legal,
      and invisible here; AND THE SEAM IS NAME-SHAPED, so anything ending
      `_finish` satisfies it — a local flag `should_finish = True`, a parameter,
      an unrelated attribute — which is false satisfaction bought with a
      variable name (LEX-1 gap 4). Canary (2) holds the expensive half of this
      — a `_finish` DEFINED and never called still fires, because the question
      is asked of the run METHOD — and the cheap half is declared rather than
      tightened: demanding a CALL would drop a bare flag and keep
      `should_finish()`, which is a narrower blind spot rather than a closed
      one, and the suffix has to stay loose enough to see the finish ACTIVITY
      named as a string, which is how house rule 9 requires it be invoked.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 3 }
    canaries:
      # (1) the ordinary shape, and the one the platform app itself shipped:
      # does its work, returns, closes nothing.
      - { fixture: unclosed_workflow.py, plant_at: apps/example/workflows.py, mode: append,
          expect: { contains: "never reaches the finish seam" } }
      # (2) the subtle half, and why the question is asked of the run METHOD:
      # the class defines a perfectly good `_finish` and never calls it. A
      # scanner reading the whole class body would take the definition for a
      # reference and pass a workflow whose rows are every bit as stuck.
      - { fixture: finish_defined_never_called.py, plant_at: apps/example/workflows.py,
          mode: append, expect: { contains: "never reaches the finish seam" } }
      # (3) the declaration tested for MEANING, not presence: `owns_no_run =
      # False`. A check that looked for the name would open the valve to
      # anybody who typed the word once.
      - { fixture: false_owns_no_run.py, plant_at: apps/example/workflows.py, mode: append,
          expect: { contains: owns_no_run } }
    negatives:
      # The platform seam: a module-level wrapper taking the work as a
      # callable. It never names the activity at this level.
      - { fixture: wrapper_finish_workflow.py, plant_at: apps/example/workflows.py,
          mode: append }
      # The domain seam: a `_finish` method called on both ways out. Two shapes
      # are live and both are right; a rule that insisted on one would make
      # four apps rewrite a seam that already works.
      - { fixture: method_finish_workflow.py, plant_at: apps/example/workflows.py,
          mode: append }
      # The other real population, declared out loud: schedule-started, owns no
      # row. Refusing this would push the deployment's own housekeeping into
      # writing fake run rows to satisfy a rule.
      - { fixture: declared_owns_no_run.py, plant_at: apps/example/workflows.py, mode: append }

  - id: "29"
    name: bounded-role-assignment
    enabled: true
    # The class-closure question. MEASURED BEFORE ENFORCED, over tree
    # f2fe88d87e2624b54bf14460ffccae62caca4710 (main @ ba88e98) — 7 functions
    # carry a role-shaped parameter; 6 are @services and the 7th is
    # `_refuse_escalation`, which IS the wall. Of the six: 5 bound, 1 exempt
    # with its reason below, 0 violations. That reconciles the engineering
    # lead's decompose-time pre-count of "~7" exactly.

    # fixed the two concrete paths. This is what stops the next one being
    # written — and the defect is the worst kind of quiet: a service takes
    # `role=` from a door, writes it onto a Membership, and an admin who could
    # pass "owner" becomes an owner, with a clean audit row saying they meant
    # to.
    statement: >
      A @service whose signature carries a role-shaped parameter (role,
      default_role, *_role) and whose body puts it into a role position — a
      role= keyword on a call, or an assignment to a .role attribute — calls the
      escalation wall (_refuse_escalation, or _refuse_role_above_the_configurer
      which wraps it) in the same body, or carries `# role-bound: <reason>` on
      the parameter or the function. Nobody grants above themselves, and the
      bound is visible where the grant is.
    check: role_bound_assignment
    doc:
      file: docs/product/architecture.md
      contains: "nobody grants above themselves"
    valve:
      marker: "# role-bound: <reason>"
      where: "on the `def` line, or on any parameter's line, each with its contiguous comment block above"
    # NO EXEMPTIONS, and that is the second draft rather than the first. The
    # first shipped one for `accounts.services.ensure_membership`, which
    # forwards `role` to `add_membership` and shows no wall of its own — and
    # `apps/accounts/tests/test_a9_matrix.py::test_row_22_this_rung_bought_no
    # _new_exemption` failed it, by design: it writes out every accounts-shaped
    # scope entry as a set so that widening one is a conversation rather than a
    # quiet diff. The tripwire was right, and the rule was wrong. A ROLE
    # POSITION IS A MODEL WRITE — a constructor keyword, a queryset write
    # keyword, or an attribute assignment — so a forwarder is judged where the
    # row is actually written, which for `ensure_membership` is
    # `add_membership`, which IS in this population and IS bounded on every
    # path. The bound belongs where the row is; an exemption would have parked
    # the reason in this file, away from the code.
    scope: {}
    # Measured populations: 7 services.py files, 6 role-param services, 5 of
    # them writing a role position (the sixth, `ensure_membership`, forwards to
    # one). Each floor sits a little under its measured value, so the check is
    # bound without being brittle about one function.
    floors: { services_files: 6, role_param_services: 4, role_writing_services: 4 }
    does_not_cover: >
      a role smuggled under another name (level=, kind=, tier=) — the population
      is name-shaped because every role parameter in the tree is annotated
      `str` today, and the named trigger for tightening is the day they become
      `Membership.Role` and the population can be read off the type; a role
      arriving through **kwargs or a dict; A ROLE FORWARDED TO ANOTHER FUNCTION,
      which is judged where the row is written and not here — that is what
      keeps `ensure_membership` out of the population without an exemption, and
      the residual it leaves (a forward to a NON-@service helper that writes the
      row) is held one layer down by rule 13, which requires every write in a
      services.py to be a @service, and by rule 10, which keeps writes out of
      the doors; a bound performed in a helper in another module, which reads
      as absent from here; whether the bound is the
      RIGHT bound — measured at the right organization, refusing in the right
      direction — which is review's and is what the wall's own tests prove; and
      whether the reason in a `# role-bound:` comment is a good one — the gate
      counts them (`role_bound_comments` on this rule's status line, beside
      `role_bound_exemptions`, which is the scope kind and is 0) and prints the
      totals, and judging them is the surveyor's standing lens. IT ALSO
      OVER-FIRES ONE WAY, declared rather than narrowed (LEX-1 gap 4): a role
      position is "a capitalised callee, or a queryset write verb", and
      capitalised is how a model constructor is told from a helper — so
      `RoleGranted(role=role)` or any other capitalised NON-model call taking
      the parameter reads as a row being written and demands a wall it does not
      need. The exit is the `# role-bound:` comment with the reason, which is
      the right shape for a judgement about one callsite; the alternative is
      resolving names to models, which is the type inference this file refuses
      everywhere else.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 3 }
    canaries:
      # (1) the shape the rule exists for: a new service takes a role from a
      # door and writes it onto a membership with nothing between.
      - { fixture: unbounded_role_grant.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "no bound against the actor" } }
      # (2) the same defect through the other role position — an attribute
      # assignment rather than a constructor keyword — so the rule is not one
      # syntax's habit.
      - { fixture: unbounded_role_attribute.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "no bound against the actor" } }
      # (3) the valve with nothing in it. An escape hatch nobody has to justify
      # is an off switch, and the gate says so about its own overrides too.
      - { fixture: bare_role_bound_comment.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "no reason" } }
    negatives:
      # The wall, used. This is `set_role`'s real shape.
      - { fixture: bounded_role_grant.py, plant_at: apps/example/services.py, mode: append }
      # A role-named parameter that never reaches a role position — a read-only
      # lookup. Reading it as a grant would make every such selector a finding.
      - { fixture: role_never_written.py, plant_at: apps/example/services.py, mode: append }
      # The valve with a real reason in it, which is the exemption's shape at a
      # call site.
      - { fixture: role_bound_with_reason.py, plant_at: apps/example/services.py, mode: append }

  - id: "30"
    name: retry-clocks-have-readers
    enabled: true
    # An early HIGH finding, generalised (ADR events-3). MEASURED BEFORE ENFORCED:
    # quality/b1-enforcement-measurement.md — 1 clock field in the tree,
    # `events.Outbox.next_attempt_at`, with W5's relay reader in
    # apps/events/selectors.py. 0 stranded. Before W5 this same measurement
    # would have read 1 clock, 0 readers, 1 stranded — which is the state the
    # review found.

    # `emit()` wrote the column, indexed it over (status, next_attempt_at) and
    # documented it in three modules, and NOTHING in production ever queried
    # it. The column was not broken; it was unread, and unread looks exactly
    # like working.
    statement: >
      A DateTimeField whose name matches the retry-clock grammar
      (next_attempt_at, *_retry_at, retry_after_*) is READ by production code
      outside its own declaring module and outside tests — a filter/exclude
      lookup, an order_by, a values/only, or an F() naming it. A write is not a
      read and a docstring is not a read.
    check: retry_clock_readers
    doc:
      file: docs/product/architecture.md
      contains: "a retry clock that nothing reads"
    valve:
      marker: "<comment> rule-30: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { retry_clocks: 1, clocks_with_readers: 1 }
    does_not_cover: >
      every other field that MEANS "try later" under a name the grammar does
      not know (due_at, scheduled_for, wake_at, visible_after) — the grammar is
      the closed half and a product that invents a fourth spelling is outside
      it; whether the reader is REACHABLE (a filter inside dead code, or inside
      a selector nothing calls, counts as a reader — the rule sees the query,
      not the call graph, and a schedule that exists and never fires is the
      runtime's finding); whether the reader's WINDOW is right (a relay that
      sweeps with the wrong grace leaves the same rows stranded and this cannot
      tell); a clock read only from a management command a human must remember
      to run, which is the state that finding described and which this rule DOES accept —
      the command is production code; the rule's floor is that somebody can
      find the row at all, and "a human runs it" is review's escalation, not
      the scanner's; and READERS ARE MATCHED BY FIELD NAME, not by model — the
      AST cannot tell which model a queryset is over without type inference, so
      two models that spell their clock the same way share each other's
      readers, and the second one is covered by the first one's relay whether
      or not anything sweeps it. Found while writing this rule's own fixtures
      (a canary named `next_attempt_at` was rescued by the real Outbox relay
      and did not fire), which is why every fixture here spells its clock its
      own way.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 3 }
    canaries:
      # (1) the exact shape of the finding: a model grows a retry clock, the
      # writer lands with it, and no reader is ever written.
      - { fixture: unread_retry_clock.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "NOTHING reads" } }
      # (2) the same, under a different spelling in the grammar, so the rule is
      # not one field name's habit.
      - { fixture: unread_retry_at.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "NOTHING reads" } }
      # (3) the near-miss that must still fire: the field is MENTIONED in
      # another module's prose and written there, and neither is a read. This
      # is the whole reason the check is AST and not grep — a grep-shaped rule
      # was green through the entire period the column had no reader.
      - { fixture: mentioned_never_queried.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "NOTHING reads" },
          extra_files: [{ fixture: mentions_the_clock.py, plant_at: apps/example/services.py,
                          mode: append }] }
      # (4) LEX-1: the rule's own pass, worn by the defect. The clock's ONLY
      # reference outside its module is a WRITE — a constructor keyword and a
      # queryset `.update(sweep_retry_at=None)`. The first draft matched a
      # `field=` keyword on ANY call, so closing a clock from a second module
      # SILENCED rule 30; the keyword half is restricted to read verbs now, and
      # this is what says so.
      - { fixture: cleared_by_update.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: "NOTHING reads" },
          extra_files: [{ fixture: clears_the_clock.py, plant_at: apps/example/services.py,
                          mode: append }] }
    negatives:
      # A planted clock WITH a planted reader — a filter and an order_by in a
      # selector, which is `list_stranded_outbox`'s real shape.
      - { fixture: read_retry_clock.py, plant_at: apps/example/models.py, mode: append,
          extra_files: [{ fixture: reads_the_clock.py, plant_at: apps/example/selectors.py,
                          mode: append }] }
      # Canary (4)'s twin, and the other half of LEX-1's proof: the SAME two
      # writes, plus a genuine `filter()` lookup — no order_by, no string
      # argument, so the restricted keyword half is on its own. The fix had to
      # stop a write answering for a clock without stopping a read from doing
      # it, and one fixture each is what holds both halves still.
      - { fixture: written_and_read_clock.py, plant_at: apps/example/models.py, mode: append,
          extra_files: [{ fixture: writes_the_clock.py, plant_at: apps/example/services.py,
                          mode: append },
                        { fixture: reaps_the_clock.py, plant_at: apps/example/selectors.py,
                          mode: append }] }
      # A DateTimeField that is not a retry clock. `_at` names are the house
      # grammar for every timestamp in the product, and reading them all as
      # retry clocks would demand a relay for `created_at`.
      - { fixture: ordinary_timestamp.py, plant_at: apps/example/models.py, mode: append }

  # Rule ids 33 and 34 remain PM-assigned to the P5/P6 rules by landing order
  # (ADR gate-2 d, confirmed at ratification); 31 is TAKEN, below — LF-Q claimed
  # it at landing, the id grab being the PM's discipline (ADO-9); 32 is URL-1's;
  # 35 and 36 are cycle P3 E1's.

  - id: "31"
    name: every-model-declares-how-its-data-dies
    enabled: true
    memo:
      "no": "this rule's check runs a probe subprocess that boots Django (settings=test) and reads the
        registries it assembles; the answer depends on the installed packages as much as on the tree,
        and a blob sha cannot name a third-party model"
    # ADR core-13, (LF-1's primitive) and (LF-Q, this rule). THE
    # FINDING behind the whole block, in one sentence: a schema shaped for a
    # sweeper, with no sweeper, looks exactly like a schema that is finished.
    # `apps.core.idempotency.purge_expired` existed for a whole cycle with
    # nothing calling it; `Outbox.next_attempt_at` was written, indexed
    # and documented in three modules while nothing in production ever queried
    # it (rule 30, ADR events-3). Rule 30 closed the retry-clock spelling of it.
    # This closes the retention spelling, which is the larger half: thirty-two
    # of this tree's thirty-eight concrete tables said NOTHING AT ALL about how
    # their rows end.

    # WHY A DECLARATION AND NOT A DOCUMENT. A retention document is the shape
    # that does not survive a product: written once, read by nobody, and the
    # table added on Thursday is not in it. The declaration lives ON THE MODEL,
    # where the person adding the table is already standing, and the population
    # is DISCOVERED — exactly the move ADR core-6 made for `append_only = True`,
    # generalised to the question that class of bug actually asks. Half the
    # tables in a Django deployment belong to somebody else (allauth's two,
    # `django_session`, `django_admin_log`) and will never grow an attribute, so
    # those are declared by whichever app OWNS THE CONCERN in its own
    # `apps/<x>/lifecycle.py::register(registry)` — discovered, never listed,
    # because a central `THIRD_PARTY_LIFECYCLES` dict would be one file every
    # app in a parallel wave has to edit.

    # TWO CLASSES, TWO REPAIRS. An undeclared model fires in ITS APP'S class and
    # is ratcheted there (the census below). A `purged` declaration whose
    # callable no `ScheduleDeclaration` chain reaches fires in `unreachable` —
    # or in `unresolvable`, when the dotted path names nothing importable — and
    # NEITHER is ratcheted: the tooth is born clean, because the one live member
    # has its whole chain written down and a second one arriving broken is a
    # violation from birth.

    # THE SCHEDULE HALF IS A REGISTRY WALK, NEVER AN AST GUESS.
    # `apps.workflows.client.discovered_schedules` (LC-1's structured registry)
    # hands back `ScheduleDeclaration` VALUES; each one builds its `Schedule` and
    # the action names the workflow. The workflow half is read from the resolved
    # class's OWN source, because `workflow.execute_activity("name", ...)` takes
    # the activity as a string at a call site and there is no runtime edge to
    # follow — that is reading the object the registry handed back, not
    # searching the tree for one.

    # MEASURED BEFORE ENFORCED (quality/lifecycle-measurement.md), at this
    # rung's baseline tree. The ratchet equals the measurement and moves in the
    # same commit as any cleanup, which is what lets the
    # five-app declaration fan-out close five classes in parallel with nobody
    # touching a shared file.
    statement: >
      Every concrete model in the app registry declares how its data dies —
      `purged` naming the callable that sweeps it, `bounded` when the rows die
      with their parent, `unbounded` or `append_only` carrying a reason and a
      dated trigger. Four kinds and no fifth. A model that cannot carry the
      attribute is declared by whichever app owns the concern, in that app's own
      `lifecycle.py`. A `purged` declaration's callable must be REACHED: an
      activity references it, a workflow executes that activity, and a
      `ScheduleDeclaration` in some app's `SCHEDULES` names that workflow. A
      table declared purged with nothing purging it is the poller that was never
      built. The undeclared backlog is measured and ratcheted per app.
    check: declared_lifecycles
    doc:
      file: docs/product/architecture.md
      contains: "every model declares how its data dies"
    valve:
      marker: "<comment> rule-31: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # FOUR FLOORS, at the measurement (quality/lifecycle-measurement.md), and the
    # judgement applies to every one of them: recorded AT the measurement
    # and never below the truth, because a floor set under what is really there
    # is a check that can lose half its subject in silence.
    # `concrete_models` is the population itself. Measured 38. A
    # `get_models()` that stops answering takes this to zero and every other
    # number with it — green because it was watching nothing is exactly what
    # this floor exists for, and it is the first thing to look at when the
    # backlog suddenly shrinks.
    # `declared_lifecycles` is the other side of the same census. Measured 6.
    # It only rises as apps declare; a fall means a declaration was deleted,
    # which is exit 2 and not a quietly larger backlog.
    # `scheduled_workflows` is the tooth's own reach. Measured 3 — the
    # `ScheduleDeclaration`s LC-1's registry hands back, resolved to workflow
    # classes. A registry walk that returns nothing would make every purge
    # unreachable and every purge a violation, which reads as a rule with
    # teeth and is a rule with a broken jaw; this floor is how the two are
    # told apart.
    # `purged_declarations` is the tooth's subject. Measured 1
    # (`core.IdempotencyRecord`). At zero the whole reachability half is
    # asserting nothing about anything.
    floors:
      concrete_models: 38
      declared_lifecycles: 6
      scheduled_workflows: 3
      purged_declarations: 1
    # THE BACKLOG, one class per Django app_label, measured 2026-08-24 at this
    # rung's baseline tree (9e6ee4d) and recorded in
    # quality/lifecycle-measurement.md with the model names. Thirty-two
    # undeclared of thirty-eight concrete. Per app_label and not per rule for
    # the schema discipline's reason: the declaration fan-out is five builders
    # in five apps at once, and a shared number is a shared file. Nothing under
    # `quality/` moves for one to shrink — a rung declares its app's models, the
    # count falls in the tree, and the gate prints that a human may commit the
    # lower number.
    ratchets:
      # account/accounts/socialaccount drained by (ER-1): apps/accounts/
      # lifecycle.py declares allauth's and socialaccount's tables and accounts'
      # own — the gate printed "a human may commit 0" and this is that human's
      # commit (the PM's, -coupled to the merge that landed the declarations).
      account: 0
      accounts: 0
      admin: 1
      auth: 2
      # PAID IN FULL by (CM1), in the commit that declared the six —
      # its coupling. All six are `unbounded`: comms has no cascade for a
      # `bounded` declaration to name (every scoped FK is PROTECT, and the one
      # CASCADE hangs off a row that archives rather than dies), and no
      # `purged` declaration, because the retention ruling a sweeper would
      # implement does not exist yet — that is, and it is the dated trigger
      # `Message` carries verbatim.
      comms: 0
      # DRAINED, 2 -> 0, by (X1) in the commit that declared both of this
      # app's tables — its coupling: the ratchet moves with the tree it
      # measures, never before it and never after, and the gate's own
      # "a human may commit 0" is what this line is. `Connection` is unbounded
      # with a reason (a tenant's configured integration is configuration, not
      # data that ages); `InboundWebhook` is purged, and its activity, workflow
      # and `ScheduleDeclaration` land beside the declaration rather than after
      # it. Kept at an explicit 0 rather than deleted — the same number either
      # way, but the line records that this class was measured and drained,
      # where an absent one only says nobody ever counted.
      connections: 0
      contenttypes: 1
      # events: 4 -> 0 (/E1, coupled to the declaration commit —).
      events: 0
      # example: 3 -> 0 (/EX1, coupled to the declaration commit —).
      # The worked example pays its whole backlog rather than ratcheting it:
      # this is the app a product COPIES, and a template that ships its own
      # reference app in debt teaches the next fifteen models to be born in
      # debt too. `Widget` bounded, `WidgetPolicy` unbounded, `WidgetEntry`
      # append_only; `purged` is absent on purpose and the module docstring
      # says why. Zero means the first undeclared model this app grows is a
      # violation from the first one — which is also what keeps canary (i)
      # above honest, since it plants exactly one over the number.
      example: 0
      # (W1) paid both of these, and they move in the SAME COMMIT as the
      # declarations that paid them: `workflows.WorkflowRun`
      # declares `purged` on the model, and `django_session` is declared by
      # `apps/workflows/lifecycle.py` — the app that owns the sweep, which is
      # the ownership claim this rule's own `does_not_cover` says it cannot
      # check, argued in that module's docstring.
      sessions: 0
      sites: 1
      socialaccount: 0
      workflows: 0
    does_not_cover: >
      WHETHER A PURGE FILTER IS CORRECT. The chain proves a callable is reached,
      never that the rows it deletes are the rows that should go — a
      `filter(expires_at__lt=...)` with the comparison the wrong way round
      passes this rule completely, and what it deletes is the purge's own tests'
      subject. WHETHER A REASON OR A TRIGGER IS A GOOD ONE. The grammar is
      closed in `apps.core.lifecycle` (present, long enough to be a clause, and
      a real calendar date); the judgement is review's, exactly as it is for a
      `# reach:` sentence, and a `reason` reading "because we want it" clears
      every mechanical bar there is. RUNTIME SCHEDULE LIVENESS — the whole of
      it, and this is the boundary most worth reading twice. This rule proves
      the chain is WRITTEN DOWN in the tree being gated: it does not know
      whether the Temporal server holds the schedule, whether the deployment's
      lifetime class creates durable machinery at all (ADR
      platform-lifecycle-1), whether the last tick ran, or whether the worker
      that would answer it is up. Those are LC-2 and LC-3's census, and a green
      rule 31 must never be read as a purge that ran. AN ACTIVITY NAMED AT
      RUNTIME. The workflow-side walk reads the first argument of
      `execute_activity(...)` as a string constant or as an identifier; an
      activity name built from a variable is invisible, and so is a purge
      reached through a callable chain deeper than two hops from the activity's
      own body. UNMANAGED TABLES, VIEWS AND ANYTHING CREATED OUTSIDE DJANGO are
      not in `get_models()` and are not in the population — the primitive's own
      docstring declares the same limit. AND THE THIRD-PARTY HALF IS AN
      OWNERSHIP CLAIM: this rule sees that SOME app declared `django_session`,
      never that the right one did, and `LifecycleRegistry.declare` refusing a
      second opinion is what keeps that from being resolved by import order.
    # The recorded self-test population. Rising floor.
    selftest_floor: { canaries: 3, negatives: 4 }
    canaries:
      # (i) THE RULE'S SUBJECT, and the ratchet refusing to grow with it: a
      # concrete model with no declaration anywhere, planted into an app already
      # at its recorded backlog. One over the number turns the whole class into
      # violations naming the growth.
      - { fixture: an_undeclared_model.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: CanaryUndeclaredLedger } }
      # (ii) THE TOOTH. its shape, planted: a real sweeper, a real declaration
      # naming it, and no `ScheduleDeclaration` chain that reaches it. Two files,
      # because the fact is a RELATION between a declaration and a machine that
      # is missing — and the finding is pathed at the DECLARATION, which is the
      # line whose author owes either a schedule or a truer kind.
      - { fixture: a_purge_no_schedule_reaches.py, plant_at: apps/example/models.py,
          mode: append, expect: { contains: CanaryStrandedPurge },
          extra_files: [{ fixture: the_sweeper_nothing_starts.py,
                          plant_at: apps/example/services.py, mode: append }] }
      # (iii) THE OTHER REPAIR. A dotted path that clears every check the
      # primitive can make at import and names nothing that exists. A separate
      # form because it is a separate fix — a typo or a module that moved, not a
      # machine somebody forgot to declare — and one sentence for both would
      # send the second reader hunting a typo that is not there.
      - { fixture: a_purge_that_names_nothing.py, plant_at: apps/example/models.py,
          mode: append, expect: { contains: CanaryPurgeIntoTheVoid } }
    negatives:
      # ONE DECLARED MODEL PER KIND, and the four are the whole vocabulary.
      # `bounded` carries no reason and no trigger on purpose: a cascade is a
      # mechanism the schema already states, not a decision to defend.
      - { fixture: a_bounded_declaration.py, plant_at: apps/example/models.py, mode: append }
      - { fixture: an_unbounded_declaration.py, plant_at: apps/example/models.py, mode: append }
      # `append_only` declared BOTH ways and coherently — rule 20's
      # `append_only = True` and rule 31's `APPEND_ONLY` lifecycle are separate
      # attributes and `core.AuditEntry` is the live member carrying both.
      - { fixture: an_append_only_declaration.py, plant_at: apps/example/models.py,
          mode: append }
      # THE TOOTH'S POSITIVE DIRECTION, which is the negative worth the most:
      # a `purged` declaration naming `apps.core.idempotency.purge_expired`,
      # whose whole chain IS written down — schedule, workflow, activity,
      # callable. The walk must find it and stay silent, and
      # `core.IdempotencyRecord` proves the same thing on every run of the gate.
      - { fixture: a_purge_a_schedule_reaches.py, plant_at: apps/example/models.py,
          mode: append }

  - id: "32"
    name: resource-first-paths
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for"
    # P5 URL-1, ADR api-2, and the owner's ruling behind it (design-agreements,
    # 2026-08-24): "the first path segment names a resource, never an app". An
    # app label in a path is internal taxonomy on the wire — the URL twin of the
    # sidebar-tag finding rule 41's second iteration closed.

    # WHY A RULE AND NOT A REVIEW. The leak has NO FAILURE MODE. `/api/v1/core/
    # organizations/` answers exactly as well as `/api/v1/organizations/`;
    # nothing 500s, no test goes red, no log line appears, and the whole cost
    # lands on a stranger reading the document months later and having to learn
    # which module of ours serves a thing in order to type it and then ignore
    # it. Four groups drifted into it across five cycles with a code review on
    # every one of them. And the ruling's own sentence is the clock: after the
    # first external consumer, moving a URL is a versioning event, so the
    # tripwire is worth having NOW and worth much less later.

    # MEASURED BEFORE ENFORCED: quality/url-taxonomy-measurement.md, over main
    # @ 492d49e — the tree branched from. 66 mounted paths, 43 of them
    # under an app label, four offending groups (core, comms, events,
    # workflows) plus the one declared coincidence. The ceiling is ZERO and
    # pinned at birth because pays the whole measured backlog rather
    # than ratcheting it: a URL standard that admits a backlog is a standard the
    # next app's routes are born outside.

    # BOTH POPULATIONS ARE CLOSED, which is what makes it a rule at all. The
    # labels come off the APP REGISTRY (every installed `apps.*` config), so an
    # app added tomorrow is in the population with no edit here. The paths come
    # off the LIVE MOUNT, so a route bound any way ninja binds one is seen, and
    # a `PREFIX` and a route path are the same finding rather than two.

    # THE ONE VALVE, and why it is not a hole. A1 names an app as the plural of
    # its aggregate, so a domain app's label legitimately COINCIDES with its best
    # resource name: `apps/connections` serves `/connections/`, and refusing that
    # would be refusing the naming convention that produced it. The valve
    # declares the coincidence, one entry per label with its reason, and
    # everything outside it still refuses — `core`, `comms`, `events` and
    # `workflows` are INFRASTRUCTURE names and never resources, which is the
    # class this rule exists to keep catching.
    statement: >
      No mounted route's first path segment is an installed app label. The
      labels are derived from the app registry and the paths from the live
      mount, so neither side is a hand-list. The one valve is
      `scope.allowed_label_paths` — a label with the reason its app's name is
      also the right resource name — and a label outside it is refused wherever
      it appears, whether it arrived as an api module's `PREFIX` or as the first
      segment of a route path under an empty one.
    check: null
    django_check_ids: [djb.E032]
    floor_proxy: count_mount_surface
    doc:
      file: docs/product/architecture.md
      contains: "the first path segment names a resource, never an app"
    valve:
      none: "this rule reports only through the django system-check leg (manage.py check --tag djb), and those findings never pass through apply_overrides, so no comment anywhere suppresses one. The shape is corrected, or the rule's declared scope moves in a diff a reviewer reads"
    scope:
      # THE DECLARED COINCIDENCES. One entry per app label that is also the
      # right name for the resource it serves. This is not a list of apps
      # allowed to leak: it is a list of names that were never a leak, and each
      # one owes a reason a reviewer can disagree with.
      allowed_label_paths:
        - label: connections
          reason: >
            `apps/connections` is A1's naming convention working — an app named
            as the plural of its aggregate — so its label IS the resource a
            caller wants: a third-party connection, listed at
            `/api/v1/connections/`. Renaming the path would make the URL worse
            in order to satisfy a rule about URLs. The infrastructure labels
            (core, comms, events, workflows) are not in this class and never
            will be: nobody calling this API has a concept called `core`.
        - label: exports
          reason: >
            The second member of the same class, and it arrived the same way
            (XP-1). `apps/exports` is A1's convention working — an app
            named as the plural of its aggregate — and `an export` is a noun a
            caller already has: they asked for one, they poll it, they download
            it. `/api/v1/exports/` is the URL a stranger would guess, and the
            ratified app map names it. There is no better resource name to move
            to: `archives` would be this app's internal word for the artifact
            rather than the caller's word for the request, and `data-exports`
            would be the same noun with a qualifier nothing distinguishes it
            from.
        - label: files
          reason: >
            The fourth member, and it arrives the way `connections` and `exports`
            did (F3, ADR files-2). `apps/files` is A1's convention working —
            an app named as the plural of its aggregate — and `a file` is a noun
            every caller already has: they put one in, they replace it, they fetch
            it back. `/api/v1/files/` is the URL a stranger would guess, and the
            ratified app map names it. The alternatives are worse in the ways this
            rule cares about: `documents` is this app's own word for what a file
            is ABOUT rather than the caller's word for the thing they uploaded,
            and it would then disagree with the `files:read`/`files:write` scope
            keys (RUL-1-ratified, frozen the day the door shipped) and with the
            `files.file.stored` event grammar, both of which are wire vocabulary
            that does not get renamed. `objects` names the storage layer's word,
            which is exactly the internal taxonomy this rule refuses.
        - label: usage
          reason: >
            The third member, and it arrives by a different door than the other
            two (U2, ADR usage-1). `apps/usage` is NOT A1's
            plural-of-its-aggregate convention — it is house rule 16's recorded
            MASS-NOUN exception, because "usages" is a word about senses of a
            word and not about consumption. What makes the coincidence
            legitimate is the same test the other two pass: `usage` is the word
            a caller already has for what `/api/v1/usage/` answers with, and it
            is what a stranger would guess. The alternatives are worse in the
            ways this rule cares about — `usage-entries` names the ledger's rows,
            which is the internal shape rather than what the route returns (a
            report over a window, never a list of entries); `consumption` is a
            synonym nobody would guess, and it would then disagree with the
            `usage:read` scope key, the `usage.<noun>.<unit>` meter grammar and
            the `usage.threshold.crossed` event name, every one of which is
            frozen wire vocabulary. `usage` is also the ratified family key
            (RUL-1), so moving the path would leave one section's URL and its
            token spelled two different ways.
        - label: search
          reason: >
            The third member, and the clearest of the three (R-a, ADR
            search-2). `apps/search` is named for a CAPABILITY rather than an
            aggregate — it owns no table at all — and `search` is the word every
            caller already has for it: `/api/v1/search/?q=` is what a stranger
            types without reading anything. There is no better resource name to
            move to, because the alternatives are all worse in the same
            direction: `queries` names our internal noun, `find` is a verb where
            every other path is a noun, and a per-resource split
            (`/widgets/search/`) is the shape ADR search-2 explicitly rejected —
            one door serves every registered kind, so a new kind must add no
            URL. This is the valve doing exactly what it was written for: a name
            that was never a leak.
    floors:
      mounted_routers: 6
      app_labels: 6
    does_not_cover: >
      WHETHER A RESOURCE NAME IS GOOD, and it cannot: the census answers a
      closed question — is this segment an app label — and says nothing about
      whether `delivery-policies` beats `policies`, whether a plural is the
      right plural, or whether two resources should have been one. That is
      review's and the owner's, and ADR api-2's three renames were made by
      judgement, not by this check. CROSS-APP FIRST-SEGMENT UNIQUENESS is not
      checked either: ninja refuses only an exact duplicate path, so two apps
      could each mount routes under one segment and this rule would stay
      silent. The map is collision-free today (the one near-miss,
      `/widgets/policies/` beside `/delivery-policies/`, is a sub-path and not a
      first segment) and the trigger to widen is the first app that wants a
      segment another app already serves. THE TRAILING-SLASH HALF of the ruling
      is not here: "every collection path ends with a slash" is a census over
      the exported document and it lives as a test
      (`apps/core/tests/test_resource_first_urls.py`), because the five routes
      that broke it were fixed in the same rung and a second gate clause for a
      closed backlog is a rule with nothing to catch. Promote it if a sixth
      appears. PLAIN DJANGO VIEWS are invisible: the walk is over ninja's bound
      operations, so `/healthz`, `/readyz`, the allauth flow and the door index
      are outside it — the same gap rule 41 declares and holds. PROSE THAT
      DEEP-LINKS AN OLD PATH — a docstring, a refusal message, a guide — is not
      reachable from the mount at all; URL-1 swept the api modules and
      `docs/` by grep and recorded what it found, and a stale path in a
      docstring will not fail this rule. AND THE VALVE IS TAKEN AT ITS WORD: a
      reason nobody agrees with still passes, because the gate cannot read a
      reason. What it can do is print the list, which it does.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 1 }
    canaries:
      # THE FORM THAT WAS LIVE ON FOUR APPS UNTIL THIS RUNG, planted on the
      # probe app: an api module that names itself in the URL. It is a plant and
      # not a live violation precisely because the four sites are fixed and the
      # shape is kept forever.
      - { fixture: prefix_names_an_app.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E032, contains: "'events' is an installed app label" } }
      # THE SECOND WAY IN, and the one this fix makes newly
      # reachable: a flattened module where the leak is in a ROUTE PATH and
      # there is no `PREFIX` to read. A check that watched only `PREFIX` would
      # be silent here. Planted on a real product api module, so the walk is
      # shown not to be looking at one blessed file.
      - { fixture: flat_route_names_an_app.py, plant_at: apps/example/api.py, mode: append,
          via: django, expect: { id: djb.E032, contains: "'workflows' is an installed app label" } }
    negatives:
      # THE VALVE, exercised rather than asserted: the probe app mounts under a
      # label that IS a legitimate resource name, and the census stays silent.
      # Firing here would mean the only way to keep `connections` at
      # `/connections/` is to be in violation of a rule about URLs.
      - { fixture: prefix_through_the_valve.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django }

  - id: "33"
    name: one-door-to-the-search-index
    enabled: true
    # ADR search-2, (R-a). Rule 27's shape, pointed at a different external
    # system and for a sharper reason.

    # Zitadel's fence is about a CREDENTIAL and a transaction boundary. This one
    # is about a WALL. An external index that does not carry the tenant walls is
    # a probing oracle: type a word, learn whether somebody else's row contains
    # it. The walls are injected by exactly one function
    # (`apps/search/selectors.py::search`), which resolves the tenant and the
    # acting hat's visible organization ids in Postgres, per request, and hands
    # the engine ids it did not choose. That sentence is only true while there
    # is exactly one way to reach the engine.

    # WHY A RULE AND NOT A REVIEW, in one sentence: a second Meili client has no
    # failure mode. It answers, quickly, with more results than the caller was
    # entitled to, and nothing 500s, no test goes red and no log line appears.
    # The only tell is a customer noticing a competitor's record in their
    # picker, which is the tell you cannot afford.

    # THE HONEST SCOPE, stated before the statement: this check walks `apps/`
    # and `config/` and reads Python. It cannot see a raw HTTP call to the Meili
    # URL, it cannot see the Meilisearch server's own state, and it says both in
    # `does_not_cover` below rather than leaving a reader to assume otherwise.

    # MEASURED BEFORE ENFORCED: quality/search-fence-measurement.md, over this
    # rung's tree. 213 files scanned, 1 engine module, 2 legal importers, 2
    # credential sites, 2 client imports, ZERO violations — the ceiling is zero
    # and pinned at birth, because the fence arrives with the app it fences and
    # there is no backlog to ratchet.
    statement: >
      Meilisearch is reached through apps/search/engine.py and nowhere else. No
      module under apps/ outside it imports the meilisearch client or names
      MEILI_URL or MEILI_MASTER_KEY (config/settings excepted, where the
      environment is read), and no module outside the allow-list below imports
      apps.search.engine at all — reads go through the one chokepoint that
      injects the scope filter, and the writes R-b lands will go through the
      services of the same app. A second client is a second query path with no
      walls on it.
    check: meili_client
    doc:
      file: docs/product/architecture.md
      contains: "one door to the search index"
    valve:
      marker: "<comment> rule-33: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      # Who may IMPORT the engine. Each entry is a place where reaching the
      # engine is the job, and everything else goes through the chokepoint.

      # EVERY ENTRY NAMES A FILE THAT EXISTS (— the gate's own
      # `_scope_paths` consistency assertion, general to every rule). Two
      # entries here used to be forward-looking, and their absence was
      # invisible: `apps/search/services.py` (the WRITE half — `index_event`,
      # `delete_documents`, `delete_tenant_documents`, `reindex`, which the
      # indexer activity and the backstop command call rather than the engine,
      # house rule 10's shape: a door that could write documents could mint
      # search results) and `apps/search/management/` (`manage.py
      # search_reindex`, the manual backstop — no longer how indexes get built
      # since the digest reconcile landed, exactly as `zitadel_seed` stopped
      # being how identity configuration gets applied, but kept for the rebuild
      # somebody wants to force). R-b and R-c ADD THEM BACK, each in the rung
      # that writes the file, with the reason above — which is what makes this
      # list a diff a reviewer reads rather than a discovery.
      allow_import:
        - path: apps/search/selectors.py
          reason: >
            THE CHOKEPOINT — the whole reason the fence exists. It resolves
            `ScopeFilter(tenant_id, visible_org_ids)` in one Postgres query and
            hands the engine resolved ids, so the engine never sees the actor,
            the hat or a materialized path. This is the module the allow-list is
            protecting, not an exception to it.
        - path: apps/search/activities.py
          reason: >
            The STARTUP RECONCILE (the owner's ruling of 2026-08-24, "Search
            materializes from its declarations"). It compares each kind's stored
            declaration digest against the declaration and rebuilds where they
            differ, which is index administration rather than a query: there is
            no tenant, no actor and no scope to inject, and the work belongs in
            an activity because a Meilisearch that is down at boot must become a
            Temporal retry rather than a worker that came up with no index. This
            entry postdates ADR search-2's own list, which was written before
            the reconcile was ruled.
        - path: apps/search/services.py
          reason: >
            The WRITE half of the chokepoint, re-added by R-c in the rung that
            writes the file (the entry was removed at Track A's merge because
            the file did not exist — ). `delete_tenant_documents` is the
            erasure interlock: a tenant's documents leave every kind's index at
            the moment of erasure rather than at the hourly reconcile that
            would eventually rebuild them away. It reaches the engine because
            the index is its own source of truth about what it still holds —
            the rows it would otherwise be read from are gone by then — and
            house rule 10's shape puts that write behind a service rather than
            a door, because a client that could write or delete documents could
            mint search results.
        - path: apps/search/tests/
          reason: >
            The tests, which have to reach the real engine to prove any of this
            against the real container — a fence proved only against a double is
            a fence proved against the thing that cannot fail.
      # Who may NAME the address and the credential. One tree, and it is the one
      # place the environment is supposed to be read.
      allow_secret:
        - path: config/settings/
          reason: >
            Where the environment is read into settings. Naming a variable in
            order to read it out of the environment is not the leak this guards,
            and a rule that refused it would leave the engine with no legal way
            to be configured. `engine.py` itself is not on this list because it
            is not an exception — it is the module the rule funnels everything
            into, and the check counts its sites rather than exempting them.
    floors:
      # A little under the measured population, so the check is bound without
      # being brittle about one file: files_scanned 213, engine_module 1,
      # engine_importers 2, secret_sites 2, client_imports 2.
      files_scanned: 180
      engine_module: 1
      engine_importers: 2
      secret_sites: 2
      client_imports: 1
    does_not_cover: >
      A RAW HTTP CALL TO THE MEILI URL — an `httpx.post("http://.../indexes/...")`
      that imports neither the client nor either setting is invisible here, and
      it is the closed grammar's other side: review's, and the census's. THE
      MEILISEARCH SERVER'S OWN STATE is the declared blind spot this rule is one
      half of: the console and the HTTP API can change any index setting and
      nothing in this tree can see it. The answer is not a check but a design —
      **the console is a window, not a door**: index settings are code
      (`registry.index_settings` decides them, `engine.py` applies them) and the
      declaration-digest reconcile re-applies them whenever the digest moves, so
      a hand-edited setting is overwritten at the next boot that notices. Also
      uncovered: the credential reached under a DIFFERENT environment variable
      name or through a constructed string (a literal `os.environ["MEILI_URL"]`
      DOES fire, because the recogniser matches the constant, not the module
      path); any file outside `apps/` and `config/`, so a naming in `scripts/`,
      `deploy/` or `compose.yaml` is invisible to it — `.env.example` names both
      variables today and always will; the engine reached through `importlib` or
      re-exported under another name; whether a module ON the allow-list still
      deserves to be — its sibling, whether the module still EXISTS, IS covered
      now (the gate's `_scope_paths` assertion, general to every rule's
      scope, is exit 2 on a path that does not resolve); and whether the
      chokepoint's injection is CORRECT — that
      the filter is `tenant_id = t AND org_id IN [resolved]` and that `q` never
      reaches it is the rung's criteria and the probes (R-e), not this check's.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 4 }
    canaries:
      # (1) the shape the rule exists for: a domain app holding its own client,
      # which is a query path with no filter injected anywhere on it.
      - { fixture: meili_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "probing oracle" } }
      # (2) the credential named somewhere that is neither the engine nor the
      # settings tree — the other half of the fence, and the half a review is
      # least likely to catch because it looks like configuration.
      - { fixture: meili_key_in_service.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "MEILI_MASTER_KEY" } }
      # (3) the SECOND CLAUSE: the engine imported directly, by a DOOR, in a
      # second app and through the other import form — so the rule is not one
      # module's habit and not one syntax's.
      - { fixture: engine_in_door.py, plant_at: apps/example/api.py, mode: append,
          expect: { contains: "apps.search.engine" } }
    negatives:
      # The chokepoint's own legitimate import, proved in the module the
      # allow-list names. An allow-list that fires is decoration.
      # MOVE-TRIGGER 2026-08-24: planted into a REAL product app because
      # rule 33's allow-list names `apps/search/selectors.py` by path — the
      # chokepoint IS the subject, and an allow-listed import proved in the
      # probe app would be proving something about a module this rule does not
      # talk about. It moves the day the chokepoint moves out of that file.
      - { fixture: allowed_selector_import.py, plant_at: apps/search/selectors.py,
          mode: append }
      # Prose. This repository's own docstrings name both variables repeatedly —
      # they have to, to explain the fence — and a check that fired on the word
      # would fire on its own reasons.
      - { fixture: meili_key_in_prose.py, plant_at: apps/example/services.py, mode: append }
      # A DIFFERENT MEILI_* variable, read outside the fence. `MEILI_ENV` is
      # neither an address nor a credential; the sibling of rule 27 staying
      # silent on the Zitadel ISSUER.
      - { fixture: meili_env_read.py, plant_at: apps/example/services.py, mode: append }
      # The excepted reader, planted in the tree the exception names.
      - { fixture: settings_reads_the_environment.py, plant_at: config/settings/base.py,
          mode: append }

  - id: "35"
    name: hot-path-plan-shapes
    enabled: true
    memo:
      "no": "this rule EXPLAINs every probed registry entry against a live Postgres through a probe
        subprocess, so its answer belongs to the planner and to the rows the probe seeded — neither of
        them a byte on this tree"
    # ADR gate-2 (b), built from M1–M4's measurements as corrected by F1a/F1d
    # and fixed by F1b/F1c/F1f. The registry below is the plan's ratified
    # location for the dotted hot-path list; the counts live in
    # quality/budgets.yaml `hot_path_query_counts` (rule 5 holds that seam).

    # THE FORM THREE RUNGS CONVERGED ON: pin the PLAN SHAPE, never a plan's
    # text, and an index NAME only where a fix's report authorizes naming it
    # (F1b's two audit indexes; the only-ordered-path cases). The default
    # clause is `index_served` — no Seq Scan of the entry's subject table AND
    # its scan carries an Index Cond — which is the executable form of the
    # no-Seq-Scan predicate M4 recommends ("held at 100% of hats in 100% of
    # worlds") plus M3-F3's position test (Index Cond is a lookup; Filter
    # alone is a walk). Clauses are conditional on the measured truth: an
    # entry whose measured plan legitimately answers several ways carries NO
    # clause and says why (M1-A: the root/flat hat rightly skips the path
    # index, and F1d proved the paginated page does so off-root too — an
    # unconditional demand would be WRONG and would trip a flat product's
    # only hat).

    # ANALYZE BEFORE EXPLAIN, always: the probe ANALYZEs its world before any
    # plan is read, following the seeder's precedent (perf/seed.py::seed_scale
    # → analyze_world, F1d closing M2 FINDING F; the assertion form is
    # perf/measure_realtime.py::require_analyzed) — a plan read against stale
    # statistics measures the loader, not the tree. M3's old model for this,
    # measure_identity's `_analyze`, was deleted by F1d (LEX-1).

    # THE SUBJECT COLUMN. `index_served`
    # asked only that the scan node carry *an* `Index Cond`. On a tenant-scoped
    # read the `for_tenant` leg always supplies one, so the clause was satisfied
    # by tenancy no matter what became of the predicate the entry exists to
    # guard: re-spelling the subtree read as `Q(path__iexact=…) |
    # Q(path__istartswith=…)` demoted the path predicate to a `Filter`, returned
    # identical rows, kept the count at 1 — and the gate stayed green. An entry
    # may therefore declare `lookup_columns: {<table>: [<column>, …]}` beside
    # `index_served`, and the probe then asserts TWO things about that column:
    # (a) it is named in an `Index Cond:` (or a bitmap `Recheck Cond:`) on or
    # under that table's scan node — the lookup edge; and
    # (b) it is not named in a `Filter:` on that node — the walk edge, whose
    # message says the predicate fell out of the index condition. A node
    # whose `Recheck Cond:` names the column is exempt from (b): a bitmap
    # heap scan restates its `BitmapOr` qual as a `Filter` by
    # construction (see does_not_cover).
    # An entry with no `lookup_columns` keeps the weaker semantics and is
    # COUNTED as `index_served_untyped`, ratcheted in quality/budgets.yaml
    # (`hot_path_lookup_columns`) so the blind spot may shrink and never grow.

    # THE PROBE WORLD IS NO LONGER MINIMAL, and (a) is why: with three
    # organizations in the tenant, reading all three and filtering IS the
    # cheaper plan, so the narrowing this rule pins was not the planner's own
    # choice and could not honestly be asserted. `quality/hotpaths.py` seeds
    # sibling organizations until the probed hat is 0.5% of its tenant — an
    # order of magnitude below the share at which the harness asserts the same
    # narrowing (perf/measure_realtime.py::PREFIX_INDEX_SHARE_CEILING) and far
    # below every measured flip. That module's header carries the measurement.
    statement: >
      Every probed hot path stays index-served at gate scale: under SET
      enable_seqscan = off, against an ANALYZEd probe world, the statements the
      real read issues (the paginator's page and COUNT separately — F1a, each
      row rendered through the door's own Out schema) keep the plan shape their
      registry entry pins — index_served (no Seq Scan of the subject table, its
      scan is a lookup rather than a walk, and where the entry declares
      lookup_columns the DECLARED column's own predicate is the lookup and has
      not fallen into a Filter), no_seq_scan_on, or a named index where a
      measurement authorized the name — and their statement count stays at the
      recorded gate-scale number the harness certified flat. Every declared
      lookup column reports the world it was asserted in: the subject table's
      row count and the predicate's share, printed per column, with the
      declarations sitting on a table too small for the planner to have had a
      choice counted as lookup_columns_unproven and ratcheted — an assertion
      whose world cannot falsify it is declared, not quietly green.
    check: hot_path_sargability
    doc: { file: docs/product/architecture.md, contains: "the gate asserts sargability" }
    valve:
      marker: "<comment> rule-35: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    registry:
      # `pin: probe` entries are executed by quality/hotpath_probe.py against
      # the real dotted path; `pin: harness` entries are certified by perf/
      # and RECORDED (re-proven at the harness's re-triggers); `pin: tests`
      # entries point at the apps-tests pin that executes them at gate scale.
      - path: apps.example.selectors.list_widgets
        pin: probe
        clauses: { index_served: [example_widget] }
        # RE-PINNED BY CORE-11 (ADR core-11). This entry carried
        # `clauses: {}` with a comment saying the page "legitimately rides the
        # ordering index" tenant-blind — and after the composite landed, that
        # sentence described a world that no longer exists. The bare
        # `created_at` index is gone from every model in the tree; the page now
        # rides `widget_recency`, whose leading column IS the tenant.

        # `tenant_id` is the RIGHT declared column here and not the weak one.
        # Rule 35's own doctrine warns that `tenant_id` is usually the
        # throwaway declaration, because the `for_tenant` leg supplies an Index
        # Cond on it whatever else the query does. On THIS entry the tenant leg
        # is the subject: the whole defect was a page whose `tenant_id`
        # predicate had been demoted to a Filter over a deployment-wide
        # timeline, examining 102,300 foreign rows to return 50 (F1a). Pre-
        # composite this pin is RED; post-composite it is the Index Cond.
        lookup_columns: { example_widget: [tenant_id] }
        # WHAT MAKES IT FALSIFIABLE . The probe world gained a FOREIGN
        # TENANT whose widgets are created last and are therefore the most
        # recent rows in `example_widget` — precisely what the blind index
        # would have walked first. The planner genuinely had the blind option
        # and 520 rows to prefer it over; see the argument in
        # quality/hotpaths.py, and the per-column row count and share this
        # probe prints on every run.

        # THE COUNT KEEPS NO CLAUSE (M1-B): the off-root COUNT's hash join is
        # legitimate and ADR core-12 is unresolved. The COUNT statement scans
        # the same table through the same tenant predicate, so the clause above
        # is honest on it too; nothing here asserts anything about
        # `core_organization`, whose Seq Scan on the root hat's COUNT is right.
        # The per-statement plan truth still lives in
        # perf/measure_hierarchy.py::PLAN_EXPECTATIONS.
      - path: apps.core.middleware.resolve_org
        pin: probe
        clauses: { index_served: [core_membership] }
        # The hat read starts from the PERSON: `user_id` is what reaches the
        # membership rows, whose plan carries
        # `Index Cond: (user_id = … AND tenant_id = …)`. Declared as `user_id`
        # rather than as the pair because `tenant_id` alone is the weak
        # declaration this form exists to stop accepting (the `for_tenant` leg
        # supplies it on every scoped read whatever the rest of the query does).
        lookup_columns: { core_membership: [user_id] }
        # The probe also runs the REFUSED hat and holds its count equal to the
        # granted hat's (a cheaper refusal is a timing oracle — M3). Do NOT
        # name the slug lookup's index: M3-F3 measured the name flipping on
        # statistics while the shape (a lookup) is the invariant. And the
        # subject is core_membership ONLY — the joined organization row is a
        # lookup-table join (select_related), and the probe measured the
        # planner rightly merge-joining it over three rows; the joined side is
        # M2's assert_no_seq_scan_on lesson, not this entry's subject.
      - path: apps.core.middleware.resolve_tenant
        pin: probe
        clauses: { index_served: [core_membership] }
        # Same column, the other door into the same table: the default
        # membership is found by `user_id` and `is_default` rides beside it as
        # a Filter, which is the legitimate shape (M4 FINDING 1) and is why the
        # belt reads the DECLARED column and not "any Filter".
        lookup_columns: { core_membership: [user_id] }
        # The SAME measured shape as `resolve_org` above, deliberately: it is
        # the same table read through the same index,
        # `membership_unique_user_per_organization`, whose leading column is
        # the one declared here. There is no separate EXPLAIN for this read.
      - path: apps.core.models.ScopedQuerySet.governing
        pin: probe
        # THE PATH LIES ABOUT THIS ENTRY'S WORLD, so the world is declared.
        # `governing` is core's, but the only model on this tree that
        # declares `InheritedDownward` — the marker `governing()` refuses to run
        # without — is the worked example's `WidgetPolicy`, which is what
        # quality/hotpaths.py::probe_governing reads. A deployment without the
        # example cannot execute this entry however core its path reads, and a
        # floor derived off the path alone would expect one probe more than the
        # world can supply. The trigger to delete this line: the first
        # `InheritedDownward` model outside the worked example.
        needs_app: example
        clauses: {}
        # NO plan clause, deliberately: FINDING M1-C — the same one-query read
        # legitimately answers two ways on either side of a planner cost
        # crossover, and the direction is benign (it improves as the tree
        # grows). Pinning either shape would ratchet the planner.
      - path: apps.core.audit.AuditEntry.objects.for_tenant
        pin: probe
        clauses: { index_served: [core_auditentry], index_in_plan: [auditentry_tenant_created] }
        # `tenant_id` is the whole of this read's narrowing — its plan carries
        # `Index Cond: (tenant_id = …)` on auditentry_tenant_created — and
        # `created_at` is deliberately left to `index_in_plan`: the ordering
        # half is the index NAME's business and not a predicate anything looks
        # up by. This is the one entry where the tenant column IS the subject
        # rather than the ambient leg.
        lookup_columns: { core_auditentry: [tenant_id] }
        # Before the fix this read discarded 255,000 rows for a 50-row page
        # (`Filter: (tenant_id = …)`, not an Index Cond); removing the
        # competing created_at index made auditentry_tenant_created the only
        # ordered path in, which is what authorizes naming it here. The
        # post-fix plan is unproven at gate scale — this entry is one of the
        # ones the probe reports as `lookup_columns_unproven`
        # (core_auditentry has no rows at gate scale) — and that debt is
        # counted in quality/budgets.yaml's ratchet, not claimed proven here.
      - path: apps.core.audit.AuditEntry.objects.for_platform
        pin: probe
        clauses: { no_seq_scan_on: [core_auditentry], index_in_plan: [auditentry_platform_created] }
        # index_in_plan, not index_served: the partial index absorbs its
        # predicate (tenant_id IS NULL), so the good plan carries no Index
        # Cond at all — the name IS the shape.
      - path: apps.events.selectors.list_stranded_outbox
        pin: probe
        clauses: { index_served: [events_outbox] }
        # `next_attempt_at`, NOT `status` — declared from the plan the gate can
        # actually see. At 20,000 pending rows the plan carries
        # `Index Cond: (status = 'pending' AND next_attempt_at < …)` on
        # outbox_status_next_attempt, so both halves are the lookup at harness
        # scale; at gate scale the same sentence that keeps the index NAME at
        # the harness tier applies to the `status` half — "the probe measured
        # the planner rightly taking the single-column clock index over a
        # handful of rows", which leaves `status` as a Filter beside a clock
        # Index Cond. Declaring `status` would make this entry red on a clean
        # tree; declaring the clock predicate pins the half that IS the lookup
        # in both worlds, and it is the half the canary moves into Python.
        lookup_columns: { events_outbox: [next_attempt_at] }
        # Rule 30's reader. The ceiling F1c added is pinned beside the count:
        # a count of 1 over an unbounded set is what FINDING C was. The index
        # NAME (`outbox_status_next_attempt`, M2: "pin the index, not just the
        # count") is held at the HARNESS tier — perf/measure_ledgers.py asserts
        # it at 20k pending in every world — because at gate scale the probe
        # measured the planner rightly taking the single-column clock index
        # over a handful of rows; the gate holds index-served, the harness
        # holds the name (perf-1's division of labor).
        constants:
          "apps/events/activities.py::RECONCILE_BATCH": 500
          "apps/events/workflows.py::RECONCILE_MAX_BATCHES": 20
      - path: apps.events.selectors.endpoints_for
        pin: probe
        clauses: { no_seq_scan_on: [events_webhookendpoint] }
        # M2 proposed NO index for this read (the wants() allow-list filter is
        # Python by design), and the probe measured the planner rightly
        # walking the ordering index over an empty table — so the clause is
        # the weak no-Seq-Scan floor, and the count does the work.
      - path: apps.accounts.services.authenticate_token
        pin: probe
        clauses: { no_seq_scan_on: [accounts_apitoken] }
        # The cold path (2 statements: the key_hash lookup + the throttled
        # touch). The warm number (1) is N6's fix and is held by the harness;
        # the probe rolls back, so it measures cold every run. The key_hash
        # index NAME is held at the harness tier (M3's EXPLAIN at 500 and
        # 1,000 tokens): at gate scale the probe measured the planner rightly
        # preferring the ordering walk over one row — .first()'s LIMIT 1
        # against a single token is the tie M1-A describes one table over.
      # HOLD CLOSED by SEC-R2 (2026-08-22). F1e landed migration 0015 —
      # `organization_tenant_prefix`, `(tenant_id, path varchar_pattern_ops)`
      # — and its re-measure says form (b) MUST NOT be taken. The entry stays
      # at form (a): index_served, no index name. That is now the pinned
      # answer rather than a placeholder waiting for one.

      # F1e's two hard constraints, both against naming an index here:

      # 1. THREE indexes can narrow this read and the planner MIXES them
      # within one plan — `organization_tenant_prefix` on one leg of the
      # selector's OR and `organization_path_prefix` on the other, at the
      # leaf and spine-tip hats. A single name is wrong at those hats even
      # where a path index is unquestionably serving the read;
      # `perf/measure_realtime.py::narrows_by_a_path_index` is the shape
      # that survives, and it is the MODULE's assertion, scoped to hats at
      # or below 5% of their tenant. It is deliberately not a gate clause.
      # 2. NO PLAN PIN MAY SIT AT A MID-SELECTIVITY HAT AT ALL. F1e measured
      # the S wide hat (16%) flipping on ten pages of index bloat — 18
      # pages takes the composite, 28 pages does not, on identical rows and
      # identical statistics, with eight consecutive ANALYZEs and a
      # SET STATISTICS 1000 moving neither verdict. A REINDEX, a bulk load
      # or a vacuum moves that pin, which makes it a measurement of the
      # physical table rather than of the code.

      # What DID survive F1e is the clause that is here: **no Seq Scan at any
      # hat in any world, before F1e or after** — M4's recommendation (b), the
      # one property that has never moved. `index_served` adds M3-F3's
      # position test on top of it (the scan is a lookup, not a walk), which
      # the root and wide hats satisfy through the tenant leg even where they
      # narrow by no path index at all.

      # WHAT SEC-R2 COULD NOT SAY, AND P3 F2 ADDS. Everything above is about
      # the index NAME, and it still holds: no name is pinned here. The COLUMN
      # is a different question and the same evidence answers it — "a plan that
      # narrows by any of the three is a narrowed plan", and what makes it a
      # narrowed plan is that the PATH predicate is the index condition rather
      # than a filter over the tenant's rows. That is exactly what
      # `perf/measure_realtime.py::narrows_by_a_path_index` reads ("it is the
      # `Index Cond` that is read, not the index name"), and `lookup_columns`
      # is that same test at the gate tier. This entry's plant is what made it
      # necessary: it kept the count, the rows and the tenant Index Cond, and
      # only the path predicate's POSITION moved.

      # AND WHAT THE BELT DOES NOT DO HERE (f)). `column_findings` has two
      # edges: (a) the column is in an `Index Cond`/`Recheck Cond`, and (b) it
      # is not demoted into a `Filter:`. For THIS entry's clean plan, (b) is
      # structurally inert and will stay inert: the good plan is a bitmap heap
      # scan whose `Recheck Cond` names `path`, and a node that rechecks the
      # column is exempt from the belt by construction (a bitmap restates its
      # `BitmapOr` qual as a `Filter:` — refusing that would refuse the very
      # plan (a) is asking for). The measured shape confirms it: the probe reads
      # `Recheck Cond:`, `Index Cond:` AND `Filter:` on `core_organization` for
      # this path on a clean tree. So only edge (a) is load-bearing here — which
      # is fine, because (a) IS the edge the plant moved. Declared
      # rather than left as a surprise for the next reader of a green line.
      - path: apps.realtime.selectors.list_subtree_org_ids
        pin: probe
        clauses: { index_served: [core_organization] }
        lookup_columns: { core_organization: [path] }
        # The one declaration the gate's own world PROVES (b)):
        # `core_organization` carries 403 rows at gate scale and the predicate
        # reaches ~1 of them, so the narrowing is the planner's own choice
        # rather than a consequence of `enable_seqscan = off`.
      - path: apps.realtime.bridge.push_event
        pin: probe
        clauses: {}
        # The zero-query pin, executed: a push reads NOTHING, and this is the
        # one number whose regression turns every emit into an N+1 across
        # every connected socket (M4 §8). The count (0) does the enforcing.
      # -- harness-certified entries: counts recorded and certified by perf/,
      # re-proven at its re-triggers, not re-executed by the gate.
      - path: apps.events.services.enqueue_dispatch
        pin: harness
      - path: apps.events.services.record_delivery_attempt
        pin: harness
      - path: apps.events.services.close_outbox
        pin: harness
      - path: apps.workflows.activities.stranded_runs
        pin: harness
        # Per-tenant 1; the TOTAL is linear in tenants by design (house rule
        # 8's honest price) — pin the per-tenant number or the rule fights
        # rule 8.
      - path: apps.realtime.consumers.TenantEventsConsumer.connect
        pin: harness
        # 1 subtree read per connection, measured by CALL COUNT on the seam
        # (the read runs on a worker thread a query capture cannot see) — the
        # harness pins it the same way; the gate records it.
      - path: apps.accounts.oauth.authenticate_bearer
        pin: harness
      # -- the door tier: the full middleware stack, measured at 100k rows.
      - path: "apps.example.api.list_widgets#session"
        pin: tests
        pin_test: apps/example/tests/test_api.py
      - path: "apps.example.api.list_widgets#x-org"
        pin: harness
        # 9 = 8 + the named hat's revalidation read. M3 recommends an
        # apps-tests pin; none exists yet — booking it is the PM's.
      - path: "apps.example.api.list_widgets#token-cold"
        pin: harness
      - path: "apps.example.api.list_widgets#token-warm"
        pin: harness
    # `lookup_columns_declared` is floored at the measured population (6
    # declarations over 6 index_served tables): a declaration that quietly
    # disappears is the rule going back to sleep, and that is exit 2 rather
    # than a pass. Its companion, `index_served_untyped`, is floored at nothing
    # — it may fall to zero and should — and is held from ABOVE by the ratchet
    # in quality/budgets.yaml (`hot_path_lookup_columns`), which is the shape a
    # declared blind spot needs: it may shrink, never grow.
    # WHAT EACH FLOOR COUNTS. Six of the twenty-one registry entries
    # below are the worked example's, and `apps/example` declares
    # `optional = True` — so every number here is a fact about a world a
    # product may legally not have. Pinning them to the measured tree makes a
    # deployment without the example read as a broken gate; lowering them for
    # everybody would be a slack the rising-floor grammar refuses. The basis is
    # declared instead, and quality/worlds.py derives the expectation per run
    # from the apps this deployment actually holds.
    #
    # `hot_paths` is `declared_members` and therefore does NOT move: it is
    # `len(registry)`, counted off this file before any probe runs, and a
    # deployment that omits the worked example still has twenty-one rows here.
    # Declaring it is not ceremony — a basis that lowered it would have hidden a
    # registry silently losing six entries behind an absent app.
    #
    # Two of the six are `opaque`, said plainly rather than fudged.
    # `explained_statements` counts EXPLAINed statements, which is a property of
    # what each probe executed and not of the registry; `lookup_columns_proven`
    # counts the declarations whose probe world was big enough for the planner
    # to have had a choice, which is a property of the probe database. Neither
    # can be derived by counting registry members, and a basis that pretended
    # otherwise would produce a wrong number silently. The consequence is
    # recorded in the blind-spot list: the FULL gate under `DJB_DISABLED_APPS`
    # is not asserted here, only the self-test.
    registry_floors:
      hot_paths: declared_members
      probed_paths: probed_members
      explained_statements: opaque
      lookup_columns_declared: lookup_column_members
      lookup_columns_proven: opaque
      lookup_world_reported: lookup_column_members
    floors:
      hot_paths: 21
      probed_paths: 11
      # 14, the measured number, not the 12 this shipped with (e)). A
      # floor two below reality is two statements that could stop being
      # EXPLAINed with nothing saying so — the same slack the rest of the
      # rising-floor grammar refuses everywhere else.
      explained_statements: 14
      # RE-COMMITTED AT THE MEASUREMENT (2026-08-29).
      # Recorded 5 against a measured 6, and `lookup_world_reported` recorded 5
      # against a measured 6 beside it — the gate printed both numbers on every
      # run and neither said anything, which is exactly the slack the
      # rising-floor grammar refuses everywhere else. The sixth declaration is
      # real (`core_organization.path`, the subtree read); the floor now says
      # so. Proof pasted in the rung report.
      lookup_columns_declared: 6
      # The world half (b)). At least one declaration has to be proven in
      # a world the planner had a choice in, or the whole subject-column form is
      # an assertion about `enable_seqscan = off`. Two are proven today —
      # `example_widget.tenant_id` (520 rows) and `core_organization.path`
      # (404) — and this is that number; its companion
      # `lookup_columns_unproven` is held from ABOVE by the ratchet in
      # quality/budgets.yaml and may only shrink.
      #
      # NOT LOWERED BY AN ABSENT APP, and that is the honest consequence rather
      # than a surprise: the basis is `opaque` (no registry count can derive
      # "the planner had a choice"), and one of the two proven columns is the
      # worked example's. In a `DJB_DISABLED_APPS=example` world this floor
      # reports UNBOUND — alongside `explained_statements`, which is the same
      # opaque-basis shape pinned the same way at 14 and already reports UNBOUND
      # in that world on the tree before this change. The rule's blind-spot list
      # below already records that the FULL gate under `DJB_DISABLED_APPS` is
      # not asserted; this floor sits inside that declaration and does not
      # widen it.
      lookup_columns_proven: 2
      lookup_world_reported: 6
    does_not_cover: >
      ADR gate-2's two declared blind spots, verbatim: planner choice at
      scale; queries not in the registry. The first is declared with measured
      instances, not hypotheses: FINDING M1-C (governing()'s plan flips at a cost crossover
      between 1,253 and 2,293 orgs, one query either way) and M4 FINDING 1
      (the same 201-org hat loses the prefix index at 16% of its tenant and
      keeps it at 8.8% — selectivity, not shape); the harness is the other
      half of the division of labor and re-proves choice-at-volume at its
      re-triggers. The second: the registry is a closed list, and an
      unregistered hot path is unguarded until someone registers it
      (docs/product/scale-envelope.md says how to add an entry). Planner
      choice at GATE scale is the same blind spot from the other side, and
      the probe measured its own instances while being built: where competing
      indexes tie over a handful of rows (a LIMIT 1 against one token; a
      lookup-table join merge-joined over three rows; the clock index taken
      over the composite on an empty outbox), the entry holds the weaker
      clause and the index NAME is the harness's to hold. Also: rows
      examined per statement at volume (its tenant-blind recency shape is
      query-count-flat and plan-simple; booked, not fixed); the M3-F3
      operational half (a restore or bulk import sits unanalyzed and nothing
      in the tree notices — deployment's, not the gate's); write-path plan
      shapes (every probed read is a read); and dynamic SQL a probe cannot
      reach. On the subject-column form specifically, four declared holes:
      an `index_served` entry with NO `lookup_columns` keeps the
      any-Index-Cond semantics — the population is listed by the
      `index_served_untyped` ratchet rather than left silent; a predicate that
      moved from an Index Cond to a JOIN condition (Hash Cond / Merge Cond) is
      neither an Index Cond nor a Filter and is not seen; a bitmap heap scan
      restates its BitmapOr qual as a `Filter:` beside its `Recheck Cond:`, so
      the belt treats a `Recheck Cond:` naming the column as the lookup and
      does not read that repetition as a demotion — a bitmap that rechecks
      everything is a walk wearing a lookup's name (M3-F3's shape from the
      other side); and a column declared WEAKLY — the `for_tenant` leg's
      `tenant_id` on a read whose real subject is another column — is legal
      and proves nothing, which is why every declaration above states plainly
      which column was measured and why.
      AND THE WORLD THE COLUMN FORM RESTS ON, the honest admission:
      four of the five declarations sit on probe tables of nought or two rows,
      where `enable_seqscan = off` FORCES the index rather than the planner
      choosing it — so for those four the assertion is true by construction and
      says nothing about the predicate. They are not silently green: the probe
      emits every declaration's subject-table row count and the predicate's
      share on every run, counts the ones under `LOOKUP_PROOF_MIN_ROWS` as
      `lookup_columns_unproven`, and that number is ratcheted in
      quality/budgets.yaml so it may shrink and never grow. The evidence for
      those four lives with the harness, at scale; the floor
      `lookup_columns_proven` holds that at least one declaration is proven in
      a world the planner had a choice in (`core_organization` today). What the
      row count and the share still do NOT say is whether the gate-scale flip
      generalises: the probe measures its own 403-row world and nothing else,
      and planner choice at volume stays the harness's. On the negative corpus:
      a negative may declare the
      `plan_shape` it exempts, and a planted fixture whose plans do not contain
      that shape is refused — which closes the vacuous-negative class here, but
      only for negatives that DECLARE a shape and only for shapes visible on an
      EXPLAIN's scan nodes.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 2 }
    canaries:
      # The builder's innocent filter: the trail's tenant read re-spelt
      # case-normalised — unsargable, so the scan stops being a lookup.
      # MOVE-TRIGGER 2026-08-24: rule 35's population is the DECLARED hot-
      # path registry — dotted paths into real modules — so a probe-app plant would
      # be a plan for a path nothing declares. This fixture follows its registry
      # entry: the day the audit read is re-homed, it moves.
      - { fixture: unsargable_audit_read.py, plant_at: apps/core/audit.py, mode: append,
          expect: { contains: "not index-served" } }
      # The pinned index abandoned: the relay's candidate read re-spelt so
      # outbox_status_next_attempt cannot serve it.
      # MOVE-TRIGGER 2026-08-24: registry-bound like the one above; it moves
      # the day the outbox candidate read is re-homed.
      - { fixture: unsargable_outbox_read.py, plant_at: apps/events/selectors.py, mode: append,
          expect: { contains: "index" } }
      # THE MUST-NOT-HAVE-FIRED-YESTERDAY CANARY: on the tree before this
      # fix, this plant fired nothing at all — the
      # count stayed 1, the rows stayed identical, the `for_tenant` leg's
      # Index Cond stayed put, and only the path predicate's position moved.
      # The expectation is one literal rather than two because the gate's
      # `expect` takes one `contains`: "not index-served on `path`" carries
      # both halves the criteria name (the column and the verdict) and is
      # strictly stronger than either alone.
      # MOVE-TRIGGER 2026-08-24: registry-bound like the two above; it moves
      # the day the subtree read is re-homed.
      - { fixture: unnarrowed_subtree_read.py, plant_at: apps/realtime/selectors.py, mode: append,
          expect: { contains: "not index-served on `path`" } }
      # THE WORLD ITSELF (b)): the sizing paragraph in quality/hotpaths.py
      # is an argument, and this is the plant that makes it falsifiable. It
      # takes the probe world back to the measured RED edge (3 fillers) and
      # prunes the cached database to match, because the number alone would
      # change nothing on a warm `_hp`. Rule 35 must go red for it: the one
      # PROVEN declaration loses the world that made it an assertion, so
      # `lookup_columns_unproven` goes past its ratchet. Self-healing — the next
      # ordinary run recreates the same 397 rows from the same derivation.
      - { fixture: probe_world_too_small.py, plant_at: quality/hotpaths.py, mode: append,
          expect: { contains: "lost the world" } }
    negatives:
      # An extra per-row Filter riding an index-served scan is NOT a violation
      # (M4 FINDING 1's legitimate shape: Filter beside an Index Cond).
      # `plan_shape` is the fixture's own self-test (c)): when the marker
      # is in the plant target the fixture is planted, and the plans must then
      # CONTAIN the shape it claims to exempt. The first version of this
      # fixture did not — the planner folded its predicate away, no `Filter:`
      # was ever produced, and its silence proved nothing.
      # MOVE-TRIGGER 2026-08-24: registry-bound — the exempt shape has to be
      # planted where a plan can be taken for it. It moves with the audit read's
      # registry entry.
      - fixture: filtered_audit_read.py
        plant_at: apps/core/audit.py
        mode: append
        plan_shape:
          marker: "n107-plan-shape-marker: filter-on-an-undeclared-column"
          path: apps.core.audit.AuditEntry.objects.for_tenant
          table: core_auditentry
          contains: "Filter:"
      # A join to a lookup table is a planner doing its job, not a finding
      # (M2's assert_no_seq_scan_on lesson: name the subject table only).
      # MOVE-TRIGGER 2026-08-24: registry-bound; it moves with the endpoints
      # read's registry entry.
      - fixture: joined_endpoints_read.py
        plant_at: apps/events/selectors.py
        mode: append
        plan_shape:
          marker: "n107-plan-shape-marker: join-to-a-lookup-table"
          path: apps.events.selectors.endpoints_for
          table: core_tenant
          contains: "Scan"

  - id: "36"
    name: socket-fan-out-discipline
    enabled: true
    # ADR gate-2 (c), from M4 §8's enumeration: the whole subject is ONE
    # decision point (apps/realtime/bridge.py::group_for) and the group_send
    # call sites under apps/ (two today: push_event, kick_user). Small enough
    # to be an exact-shape rule rather than a heuristic — one of the few rules
    # whose whole subject is two call sites and one function.
    statement: >
      An org-scoped PAYLOAD is never pushed to a bare tenant group, and a tenant
      that goes dark hangs up. Every group_send under apps/ either takes its
      group from group_for's decision (the one place the choice is made), or
      carries a KICK_TYPE message — an instruction to hang up, never a payload —
      to user_group (one person's sockets) or to tenant_group (every socket in a
      tenant that has been suspended or closed). A group_send whose group is a
      direct tenant_group(...) call and whose message carries an organization
      (an "organization_id" key, or a serialised envelope) is the org-blind
      push the socket probe found, priced by M4 at 495 wrong-branch frames per 500
      sockets. And every @service that assigns a non-ACTIVE Tenant.Status calls
      close_tenant_sockets_on_commit in the same body: a darkened tenant is
      refused at the next HANDSHAKE and nowhere else, so the sockets already open
      go on hearing while the REST door answers 403 to the same credential.
    check: socket_group_discipline
    doc: { file: docs/product/architecture.md, contains: "never pushed to a bare tenant group" }
    valve:
      marker: "<comment> rule-36: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # `status_writers` is DERIVED — every `@service` assigning `Tenant.Status.X`
    # for an X that is not ACTIVE — and measured 2 on this tree (`suspend_tenant`,
    # `close_tenant`). Floored at 2 for §I's reason: a recogniser that stops
    # seeing the two services this class exists for must trip a floor rather than
    # report a clean nothing, and a product that removes one of them is making a
    # diff a reviewer reads.
    floors: { group_send_sites: 2, decision_points: 1, status_writers: 2 }
    does_not_cover: >
      dynamic group-name construction that launders the tenant group through a
      variable or an f-string (the rule-26-style laundering escape, declared —
      the rule sees push call sites, not data flow); a payload whose
      org-scoping is invisible in the AST (no "organization_id" key, no
      .model_dump, no .organization_id read); pushes issued from outside apps/
      (none exist; the bridge is the one sender); and whether group_for's own
      decision is RIGHT — that is RT2's tests' and the census's
      (perf/measure_realtime.py §4), not a static scan's. THE STATUS-WRITER
      CLASS adds four of its own. A STATUS WRITTEN ANY OTHER WAY is unseen:
      `Tenant.objects.filter(...).update(status=...)`, a status built from a
      variable or an f-string, a `setattr`, and a data MIGRATION — a queryset
      update is the shape that darkens many tenants at once and it is exactly
      the one this cannot see, so a bulk suspension is a road the tests own
      (`test_authorization_kick.py`) and not a shape. A KICK REGISTERED IN A
      CALLEE rather than in the service's own body reads as absent here, which
      is the fail-closed direction and the reason the seam is a one-line call.
      WHETHER THE KICK ARRIVES is `close_sockets`' declared blind spot inherited
      whole: the registration is `robust=True`, so a channel layer that raises
      leaves the write standing and the socket open, logged on
      `core.socket.kick_failed` (one person's sockets) or
      `core.tenant_socket.kick_failed` (a darkened tenant's) and not closed —
      two names because the status-writer class this was widened for hangs up
      on a whole tenant through a second seam, and a blind spot that names one
      of them reads as covering both. AND WHICH REASON A WRITER PASSES
      is not read — `KICK_TENANT_SUSPENDED` against `KICK_TENANT_CLOSED` is the
      reason census's (`test_the_kick_reasons_are_constants_and_distinct`).
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 4 }
    canaries:
      # M4's proposed canary shape, verbatim: a bare-tenant-group push whose
      # message names organization_id.
      # MOVE-TRIGGER 2026-08-24: rule 36's subject is THE fan-out seam, and
      # there is exactly one of it; a scaffold copy would itself be the finding the
      # rule exists to make. All four of this rule's plants move the day the seam
      # leaves `apps/realtime/bridge.py`.
      - { fixture: org_payload_to_tenant_group.py, plant_at: apps/realtime/bridge.py, mode: append,
          expect: { contains: "bare tenant group" } }
      # The same leak through the envelope: the serialised EventMessage
      # (which carries organization_id) pushed tenant-wide.
      # MOVE-TRIGGER 2026-08-24: seam-bound like the one above; it moves with
      # it.
      - { fixture: model_dump_to_tenant_group.py, plant_at: apps/realtime/bridge.py, mode: append,
          expect: { contains: "bare tenant group" } }
      # R4's F2, as the THIRD operator service: a tenant put beyond use with
      # nothing registered to hang up on the sockets already open.
      # MOVE-TRIGGER 2026-09-16: `apps/core/services.py` is the plant because
      # the two services this class exists for are there and nowhere else; it
      # moves the day a second app learns to darken a tenant.
      - { fixture: a_darkened_tenant_that_hangs_up_on_nobody.py, plant_at: apps/core/services.py,
          mode: append, expect: { contains: "close_tenant_sockets_on_commit" } }
    negatives:
      # The real push shape: the group is group_for's answer. Must stay
      # silent (M4 §8's first proposed negative).
      # MOVE-TRIGGER 2026-08-24: seam-bound; it moves with the canaries
      # above.
      - { fixture: push_via_group_for.py, plant_at: apps/realtime/bridge.py, mode: append }
      # The kick: user_group, KICK_TYPE, no payload. Must stay silent (M4
      # §8's second proposed negative).
      # MOVE-TRIGGER 2026-08-24: seam-bound; it moves with the canaries
      # above.
      - { fixture: kick_to_user_group.py, plant_at: apps/realtime/bridge.py, mode: append }
      # The TENANT kick, which is what the statement was widened for in R4-F3:
      # a `KICK_TYPE` frame on the bare tenant group is the one message that
      # legitimately reaches every socket in a tenant, and a rule that refused
      # it would refuse the fix for its own sibling finding.
      # MOVE-TRIGGER 2026-08-24: seam-bound; it moves with the canaries above.
      - { fixture: kick_to_tenant_group.py, plant_at: apps/realtime/bridge.py, mode: append }
      # The status-writer class's demanded shape, and its widening beside it: a
      # tenant darkened WITH the kick registered, and a tenant reinstated with
      # none — because a widening kicks nobody, one level up from
      # `kick_if_reads_narrowed`'s own asymmetry.
      # MOVE-TRIGGER 2026-09-16: `apps/core/services.py`, like the canary above.
      - { fixture: a_darkened_tenant_that_hangs_up.py, plant_at: apps/core/services.py,
          mode: append }

  - id: "37"
    name: no-tenant-blind-recency-index
    enabled: true
    memo:
      "no": "CONSERVATIVE, declining pending evidence: the audit that shipped this memo found this
        census reads only paths the walk already names, so a key would probably be sound. It declines
        anyway because a census whose population is derived from several globs is the shape an unnamed
        read hides in, and the memo is a projection of the scan rather than a second opinion about it.
        Lift it with a diff a reviewer reads"
    # ADR core-11 (; the T0-pain review's worst COMPOUNDING item, because
    # every model any product ever adds inherited the disease from the abstract
    # base). BaseModel shipped created_at db_index=True behind
    # ordering=["-created_at"]; every concrete model inherited a tenant-blind
    # index while every supported read is tenant-scoped, so a paginated page
    # walked other tenants' index entries and discarded them one at a time
    # (102,300 foreign rows per page at a mid-size tenant's scale; 255,000 on
    # AuditEntry). The fix is the (tenant, -created_at) composite in
    # TenantScopedModel's abstract Meta — and Django does not merge Meta.indexes
    # down an inheritance chain, so any concrete model that declares its own
    # `indexes` silently drops the inherited composite. This rule is the
    # tripwire over that hole AND over the next hand-written blind index.
    # MEASURED BEFORE ENFORCED: quality/perf-hierarchy-measurement.md (F1a),
    # quality/perf-ledgers-measurement.md (F1b, FINDING B), re-pinned by the
    # rung that built this rule. The population is DISCOVERED off the model
    # walk rules 8/24/38 use — misses.md cycle-0 #8. It is not a hand list, and
    # the proof is that exports.Export landed between this rule's design and
    # its build and was in scope with no edit to this file.
    statement: >
      No scoped model orders the whole deployment by time. Three edges over one
      discovered population (every concrete TenantScopedModel under apps/):
      (1) COVERAGE — a scoped model whose effective default ordering leads on
      created_at carries an index whose first two columns are (tenant,
      created_at) in either direction, read off the model's effective
      Meta.indexes, so Django's Meta.indexes shadowing hole cannot silently
      drop the inherited composite; (2) NO BLIND INDEX — no scoped model
      declares a Meta.Index whose LEADING column is a DateTimeField/DateField,
      unless the index carries a `condition` that excludes tenant rows (the
      AuditEntry platform-partial shape, ADR core-8) or a rules.yaml exemption
      with the reason; (3) NO BLIND FIELD INDEX — no scoped model's
      DateTimeField/DateField carries db_index=True, the original disease's
      exact spelling, unless a rules.yaml exemption names the cross-tenant
      reader that wants it. The rule reads declarations, never plans.
    check: tenant_blind_index_census
    doc:
      file: docs/product/architecture.md
      contains: "no scoped model orders the whole deployment by time"
    valve:
      marker: "<comment> rule-37: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    # DERIVED, never typed — the model walk. The exemptions below are the only
    # hand-written thing here, and each is a judgement with its reason.
    scope:
      exemptions:
        # THE ONE EXEMPTION, and a delta the plan predates: it enumerated
        # per-route ?ordering= columns as out of scope but did not notice that
        # `occurred_at` also carries the field flag, which IS edge 3's subject.
        # It is exempt rather than dropped because it has a PROVEN CROSS-TENANT
        # READER, which is rule 30's discipline pointing the other way:
        # `events.selectors.outbox_to_replay` filters `event__occurred_at__gte`
        # and orders by it across every tenant at once, deliberately — replaying
        # after an outage is a deployment-level act and narrowing it per
        # customer would mean running it once per customer. The tenant-scoped
        # reads of the same column ride `event_tenant_occurred`. Removing this
        # index would be an unmeasured change to a recovery path, which CORE-11
        # was not licensed to make.
        - path: apps/events/models.py
          function: Event.occurred_at
          reason: >
            the deployment-wide replay read (events.selectors.outbox_to_replay,
            `manage.py replay_events`) filters and orders by occurred_at across
            tenants by design; the tenant-scoped reads ride
            event_tenant_occurred. Rule 30 in the other direction — this index
            has a named production reader.
    floors:
      # The census must have seen the world it claims to judge (the model's shape).
      # Live at build: 21 scoped, 19 recency-ordered, 19 composites.
      scoped_models_censused: 20
      recency_ordered_models: 18
      composites_found: 18
    does_not_cover: >
      PLAN CHOICE — this rule reads declarations and never EXPLAIN; whether the
      planner actually picks the composite is rule 35's and the perf harness's
      (PLAN_EXPECTATIONS pins it per statement). PER-ROUTE ?ordering= COLUMNS —
      a list ordered by an allow-listed column (started_at, occurred_at,
      delivered_at) is not the model's default ordering and is not censused
      here; a tenant-blind walk on one of those is found by rule 35's registry
      or a measurement rung, and WorkflowRun's -started_at door is the recorded
      open observation. THE NARROW HAT — no index fixes the subtree read while
      recency ordering stands (ADR core-12; eqjoinsel); the bound is declared
      in the scale envelope, not here. EXPRESSION INDEXES —
      models.Index(expressions=...) has no leading fields list; counted and
      printed as expression_indexes_unseen, judged by review. INDEXES CREATED
      OUTSIDE DJANGO (RunSQL, DBA hands) are invisible to the model walk.
      INDEX NAME COLLISIONS across apps sharing a class name under
      %(class)s_recency — Postgres refuses the duplicate loudly at migrate,
      and nothing sees it before. A MODEL WHOSE Meta CHAIN THIS CANNOT RESOLVE
      — the walk follows `class Meta(X.Meta)` by name, so a Meta built by a
      metaclass or assigned dynamically reads as declaring nothing. WHETHER an
      exemption reason is a GOOD one — counted and printed; review's and the
      surveyor's.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 4 }
    canaries:
      # (1) THE SHADOWING HOLE — the exact defect class this rule was born
      # from: a scoped model with the inherited recency ordering that declares
      # its own indexes list and thereby drops the composite. Nothing about
      # this model LOOKS unindexed, which is why review does not catch it.
      - { fixture: shadowed_recency_model.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: CanaryShadowedLedger } }
      # (2) THE NEXT TENANT-BLIND INDEX, hand-written: a scoped model declaring
      # models.Index(fields=["-created_at"]) — leading time column, no
      # condition. It carries the composite too, so ONLY edge 2 can fire and
      # the canary cannot pass on edge 1's back.
      - { fixture: blind_recency_index.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: CanaryBlindIndex } }
      # (3) THE ORIGINAL SPELLING: a scoped model's DateTimeField(db_index=True).
      # It carries the composite too, for the same reason as (2).
      - { fixture: blind_field_index.py, plant_at: apps/example/models.py, mode: append,
          expect: { contains: CanaryBlindField } }
    negatives:
      # (1) The default path: a scoped model with no own indexes — it inherits
      # the abstract composite and is silent. A rule that fired here would be a
      # tax on adding a model.
      - { fixture: inheriting_scoped_model.py, plant_at: apps/example/models.py, mode: append }
      # (2) The Organization/SsoDomain shape: its own non-recency ordering, out
      # of edge 1's population entirely, with its own tenant-leading index.
      - { fixture: own_ordering_model.py, plant_at: apps/example/models.py, mode: append }
      # (3) The AuditEntry shape: a leading -created_at index whose condition is
      # tenant__isnull=True. A platform-population index, not a blind one —
      # silent BECAUSE of the condition, which is the mechanism edge 2 turns on.
      - { fixture: platform_partial_index.py, plant_at: apps/example/models.py, mode: append }
      # (4) The boundary: a BaseModel-only model (no tenant FK) with a recency
      # index and its named-reader comment — out of the population entirely.
      # Per-model decision territory (ADR core-11's BaseModel-only table), and
      # the proof that this rule does not reach past scoped rows.
      - { fixture: unscoped_recency_model.py, plant_at: apps/example/models.py, mode: append }

  - id: "38"
    name: org-scoped-out-declares-the-narrowing-key
    enabled: true
    # P3 SEC-1's MED-2, second half; built by SEC-R2. 37 is reserved for ADR
    # core-11's census rule and 31–34 are PM-assigned (ADR gate-2 d), so this
    # takes 38.

    # WHY A SECOND RULE AND NOT A WIDER 36. Rule 36 is an AST rule over push
    # call sites. There is exactly one such site and it is generic — `group_for`
    # can only ever read `event.organization_id` — so rule 36 structurally
    # cannot see a payload that never carried the key. The leak it misses is one
    # seam earlier: `events.services._subject_organization` derives the fan-out's
    # narrowing from the subject's own `Out` schema and from nothing else, so an
    # org-scoped model whose `Out` omits `organization_id` emits an event no
    # branch owns, and `bridge.group_for` reads no-branch as TENANT-WIDE. The
    # runtime half now fails closed (an `organization_id` that does not resolve
    # is refused, not stamped NULL); this is the half that keeps the key on the
    # shape in the first place, checkable off the model registry.

    # THE POPULATION IS DERIVED, NEVER TYPED. `OrgScopedModel` subclasses come
    # off the same transitive AST walk rules 8 and 24 use, located to the app
    # whose `models.py` declares them, and paired with the `*Out` classes in that
    # app's `schemas.py` by the house naming convention: the stem is the model
    # name, or a CamelCase-word-boundary SUFFIX of it (`PreferenceOut` reports
    # `ChannelPreference`). A hand-list here would be the misses ledger's
    # hand-list-goes-stale class, and the second canary is the proof: a brand new
    # org-scoped model is in scope with no edit to this file.
    statement: >
      Every `Out` schema of an `OrgScopedModel` declares `organization_id`. The
      socket fan-out narrows on that key and on nothing else — the payload is
      the subject's own read shape — so a shape that omits it produces an event
      no branch owns, which the bridge delivers to every socket in the tenant.
      The population is derived from the model registry and paired with each
      app's `schemas.py` by the naming convention; a schema that inherits the
      field from a sibling `Out` in the same module has declared it.
    check: org_scoped_out_schemas
    doc:
      file: docs/product/architecture.md
      contains: "every Out schema of an OrgScopedModel declares"
    valve:
      marker: "<comment> rule-38: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    floors: { org_scoped_models: 6, out_schemas_paired: 6 }
    does_not_cover: >
      A payload built by hand rather than from the `Out` schema — the rule reads
      schemas, not emit call sites, and `{"id": ..., "name": ...}` composed at a
      call site is invisible to it (the runtime half is what stands behind that
      case: an unresolvable `organization_id` is refused, but an ABSENT one on a
      hand-built payload still reads as org-less). A schema that declares the
      field and a service that then overwrites it — precedence at the merge is
      what SEC-R2 fixed in `apps/example/services.py::_publish` by putting the
      schema last, and nothing checks the next one. `Out` classes outside an
      app's `schemas.py` (rule 11 puts them there; a schema declared in `api.py`
      or in a `schemas/` package is unseen). A schema whose stem pairs with no
      org-scoped model by the naming convention — a read shape called something
      the convention cannot connect to its rows is unguarded, and so is an
      org-scoped model that has NO `Out` at all, where the rule covers nothing
      and says nothing (the floors are what would notice the pairing collapsing
      wholesale, not one model slipping out of it). A cross-app `Out` — the
      pairing is within one app, because a global one would marry `MessageOut`
      to any app's `Message`. And whether the field is POPULATED: the rule reads
      the declaration, and a `None` default on a shape whose model has a
      non-nullable FK is a lie only a runtime can catch.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 2, negatives: 3 }
    canaries:
      # The ordinary miss: a second read shape for an existing org-scoped model,
      # written without the narrowing key.
      - { fixture: out_without_the_narrowing_key.py, plant_at: apps/example/schemas.py, mode: append,
          expect: { contains: "does not declare `organization_id`" } }
      # The population half: a BRAND NEW org-scoped model and its Out, with no
      # edit to this file. If the population were a hand-list this would pass.
      - { fixture: new_org_scoped_model_out.py, plant_at: apps/example/schemas.py, mode: append,
          expect: { contains: "Sprocket" },
          extra_files: [ { fixture: new_org_scoped_model.py, plant_at: apps/example/models.py, mode: append } ] }
    negatives:
      # The right shape. A rule that fired here would be a tax on adding a schema.
      - { fixture: out_that_declares_the_key.py, plant_at: apps/example/schemas.py, mode: append }
      # An `In` for the same model, with no organization_id — where its ABSENCE
      # is the enforcement (a door may not name the branch it writes into).
      - { fixture: write_shape_without_the_key.py, plant_at: apps/example/schemas.py, mode: append }
      # An `Out` that pairs with no org-scoped model: no row, no branch, nothing
      # to declare. `WidgetStatsOut` is the standing instance.
      - { fixture: out_of_a_model_that_is_not_org_scoped.py, plant_at: apps/example/schemas.py, mode: append }

  - id: "40"
    name: headers-read-by-their-declared-name
    enabled: true
    # P4 N100b, born beside N100a's fail-open. 37 is reserved for ADR core-11's
    # census rule and 39 is reserved; this takes 40.

    # WHY A RULE AND NOT A CODE REVIEW. N100a's defect was not a wrong header —
    # it was a SECOND one. `apps/core/idempotency.py` read `"X-Tenant"` as a
    # literal while `core.middleware` read `TENANT_HEADER`, and the two agreed,
    # so nothing was wrong until somebody renamed one of them. The failure mode
    # of a header nobody reads is not an error: `.get(name, "")` returns the
    # default, `""` survives `.strip().lower()`, and the request is answered as
    # though the caller had asked for nothing. There is no exception, no log
    # line and no wrong status code — which is why a human reading the diff
    # cannot be the instrument.

    # THREE POPULATIONS, ONE CONTRACT ("the spelling lives in one place"):

    # A. INBOUND READS. `request.headers.get/[]`, `request.META[HTTP_*]`, and
    # the ASGI `scope["headers"]` walk — the socket and MCP doors have no
    # `request`, which is exactly where a second spelling hides. A helper
    # whose header NAME is a parameter is not a read; its CALLERS are, and
    # the rule reads the argument they pass.
    # B. DECLARATIONS. Module-level `HEADER` / `*_HEADER` assigned a string
    # literal, anywhere under `apps/` or `config/`. Derived by the same
    # walk as the reads, so a constant added in a new app is in the
    # population with no edit here — a hand-list would be the misses
    # ledger's stale-list class.
    # C. `Remedy(label, "<kind>:<name>")`. A `header:` destination names some
    # declaration's VALUE (a refusal pointing at a header the server does
    # not read is advice that cannot change the answer), and every kind is
    # one the `Remedy` docstring in apps/core/exceptions.py enumerates.
    # **The kind set is read off that docstring, never re-typed here**:
    # ADR core-5 put the template's five tokens in the one place that
    # explains what a destination is, and a sixth kind added beside them
    # is seen by this rule with no edit to quality/.

    # AND THE CENSUS (N100b-3). `CORS_ALLOW_HEADERS` is derived from population
    # A ∩ B — every declaration an HTTP door reads, lowercased. It cannot be an
    # import in either direction (settings are read before the app registry is
    # ready and `core.middleware` imports models), so S1 typed `x-org` by hand
    # in and this is what keeps the two spellings in step from now on. The
    # socket and MCP doors are deliberately NOT in the census population: a
    # websocket handshake is not preflighted and `/mcp` is not under
    # `CORS_URLS_REGEX`.
    statement: >
      Every inbound header read names a declared constant. A read whose header
      name is a string or byte literal — in `request.headers`, in
      `request.META`, or in the `scope["headers"]` walk the socket and MCP
      doors use — is a second spelling of a name that already exists, and a
      second spelling fails OPEN: the read finds nothing and the request is
      answered as though the caller had named nothing. The declarations are
      module-level `HEADER`/`*_HEADER` string constants, derived by the same
      walk. A `Remedy`'s `header:` destination names some declaration's value,
      and every destination's kind is one the `Remedy` docstring enumerates.
      And `CORS_ALLOW_HEADERS` is a census of the headers the HTTP doors read,
      lowercased — never a copy of them.
    check: header_contracts
    doc:
      file: docs/product/architecture.md
      contains: "A header is read by its declared name"
    valve:
      marker: "<comment> rule-40: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope:
      # THE READ SIDE, and this list is only ever about the read side.

      # Standard HTTP vocabulary, not this product's contract: defined by RFC
      # 9110, spelled the same by every server on the internet, and there is no
      # decision to record because there is no alternative spelling to drift
      # to. Both entries are reads of SOMEBODY ELSE'S response —
      # `connections/client.py` asking an upstream how long to wait,
      # `idempotency.py` asking what a stored answer was — and the receiver is
      # what tells them apart: `response.headers` is a contract this repository
      # did not write and cannot rename. A constant here would declare a name we
      # do not own.

      # THE WRITE SIDE ASKS A DIFFERENT QUESTION, and the old sentence here
      # conflated the two (a carried note, since corrected): it said
      # of `Retry-After` that "no `*_HEADER` constant declares it and none
      # should", which was already false in the tree — HDR-A declared
      # `RETRY_AFTER_HEADER` in `apps/core/api/docs.py` and had to, because the
      # documentation has to NAME the header it documents and a name typed in
      # two places is the exact defect this rule exists to close. So: our own
      # response headers ARE declared, beside the writer that stamps them, and
      # population B sees those declarations like any other. That is not an
      # exception to this rule; it is this rule working. HDR-A's own AST
      # assertion (`apps/core/tests/test_response_headers.py`, HDR-A-3) is the
      # second belt — every `ResponseHeader.name` is an imported constant and
      # never a literal, checked at the source rather than by eye.

      # The two halves can hold one name at once, and `Retry-After` does: it is
      # standard vocabulary when we READ an upstream's, and a declared constant
      # when we WRITE our own. An entry on this list exempts a READ; it says
      # nothing about whether something declares the name for its own writes.

      # `Allow` IS NOT ON THIS LIST, AND THE CURRENT SHAPE STANDS.
      # `Allow` is standard vocabulary by RFC 9110 §10.2.1, so the
      # question was fair: should it sit beside `Retry-After` and let
      # `config/api.py`'s `ALLOW_HEADER` become optional? No — and the reason is
      # the discriminator this list already runs on, the RECEIVER. `Retry-After`
      # is read off SOMEBODY ELSE'S response (`connections/client.py` asking an
      # upstream how long to wait); a name we did not write and cannot rename.
      # `Allow` is read off ninja's OWN answer and then WRITTEN back onto the
      # refusal that replaces it (`_method_refusal`), so this repository owns
      # both spellings of it and a second one would be exactly the fail-open
      # N100a was — the module both reads and writes it, which is the one
      # configuration where one spelling is not a style preference.

      # AND THE ALTERNATIVE IS NOT MERELY UNNECESSARY, IT IS INCOHERENT. This
      # list exempts population A, and `refused[ALLOW_HEADER]` is not IN
      # population A — its receiver is an `HttpResponseNotAllowed`, not a
      # request — so listing `Allow` would change nothing about any read. What it
      # WOULD change is population C: `header:` destinations are cleared by
      # `name in values or name in allowed_literals`, so an entry here would
      # bless `Remedy("See which methods this path answers", "header:Allow")`
      # with no declaration behind it at all — which is to say it would license
      # deleting `ALLOW_HEADER` and leave the refusal pointing at a header name
      # nothing in the tree spells. REJECTED, recorded: `Allow` on this list plus
      # an optional `ALLOW_HEADER`. Kept: `Allow` off the list, `ALLOW_HEADER`
      # required by population C as it already is, no floor moved.
      standard_http_headers:
        - Retry-After
        - Content-Type
    # NO BACKLOG. Every class is ratcheted at zero — the ordinary case, where
    # the first finding is a violation. `scope` carried five for one cycle:
    # four helper-call literals in `config/mcp.py` (`b"authorization"`,
    # `b"x-request-id"`, `b"x-correlation-id"`, `b"mcp-session-id"`) and one in
    # `apps/realtime/middleware.py` (`"authorization"`), which N100b found and
    # could not fix inside its territory. N100c paid all five: the three that
    # already had a constant now name it, `AUTHORIZATION_HEADER` moved to its
    # one home in `core/middleware.py` (`accounts` and `idempotency` import it
    # downward instead of re-declaring it), and `mcp-session-id` got a
    # declaration of its own beside the mount that reads it. The line is gone
    # rather than set to 0 because a ratchet of zero and no ratchet are the
    # same thing to the engine, and the shorter one cannot be misread as a
    # budget. A sixth literal now refuses.
    # TWO OF THESE SIX ARE PINNED AT THE MEASUREMENT and four are conservative,
    # which is a judgement rather than an oversight (QB-R2, 2026-08-24).
    # `header_declarations` is population B itself — if a declaration is deleted
    # the rule has lost the thing it validates reads against, and that must be
    # exit 2 rather than a smaller number nobody reads (measured 23).
    # `remedy_kinds` is a closed published contract read off one docstring, so
    # at-measured is what it means (measured 6; added `route:` to the five).
    # The other four count SITES — reads, remedies, destinations, census
    # entries — and a product legitimately has fewer of those than this template
    # does; pinning them at this tree's numbers would make the floor a claim
    # about somebody else's app.
    floors:
      header_reads: 8
      header_declarations: 23
      remedy_destinations: 8
      header_remedies: 4
      remedy_kinds: 6
      cors_census_headers: 4
    does_not_cover: >
      A header name threaded through TWO functions: the rule reads a helper's
      call argument, so `_header(scope, "authorization")` fires, and
      `_header(scope, header_name)` inside a second helper does not — the name
      is a parameter there and following it further would be data flow, not a
      walk. Counted as `header_reads_unresolved` rather than left silent.
      OUTBOUND header dictionaries — `events/activities.py`'s traceparent,
      `connections/client.py`'s Authorization and correlation headers: the
      sending side's contract is the RECEIVER's constant and a later rung may
      unify them (trigger: the second outbound signer). THIRD-PARTY RESPONSE
      READS — `connections/client.py`'s `Retry-After`, `idempotency.py`'s
      `Content-Type`: the receiver's NAME is what tells them apart
      (`response.headers` is somebody else's contract), and they are standard
      HTTP vocabulary besides. THE QUERY-PARAMETER FALLBACKS are covered by the
      seam rather than by this rule: `?tenant=` / `?org=` at
      `core/asgi_middleware.py` and `?tenant=` / `?org=` / `?token=` at
      `realtime/middleware.py` are string literals that exist because a
      browser's WebSocket constructor cannot set a request header, and both
      files hand them to the SAME `resolve_tenant`/`resolve_org` the HTTP door
      calls — one function, so a fallback cannot resolve a hat the header
      route could not. The re-deriver is this rule's own scope print: the
      helper population shows up as `header_reads`, and a fourth ASGI door
      appearing there is the trigger to widen. TEMPORAL's `djb-*` headers are
      declarations and are read off a plain dict, not a request, so they are in
      population B and not in A — which is also why they are correctly absent
      from the CORS census. THE CENSUS reads `config/settings/base.py` by AST
      and not `django.conf.settings`: a per-environment override of
      `CORS_ALLOW_HEADERS` in another settings module would be unseen (there is
      none today, and adding one is the trigger). It also says nothing about
      `CORS_EXPOSE_HEADERS`, nor about headers a third-party middleware needs —
      django-cors-headers ships the standard ones. A CONSTANT DECLARED TWICE
      with two values passes: the rule resolves a read to the declaration in
      its own module or the one it imported from, and beyond that it checks
      that a read NAMES a declaration, not that declarations are unique. There
      are two such pairs today and both are deliberate (`TENANT_HEADER` /
      `ORG_HEADER` are `X-Tenant`/`X-Org` at the HTTP door and
      `djb-tenant-id`/`djb-org-id` in Temporal's propagation;
      `CORRELATION_HEADER` and `CORRELATION_ID_HEADER` are two names for
      `X-Correlation-Id`) — the trigger to widen is the first pair that is NOT
      deliberate. And on the remedies: the rule validates that a `header:`
      destination EXISTS, never that it is the RIGHT remedy for that refusal —
      label aptness is review's (E9). STAMPING WITHOUT DECLARING is unseen, and
      it is the write side's own blind spot (the same carried note, declared
      here): population A is INBOUND reads, so a middleware that writes
      a response header from a literal — `response["X-Whatever"] = ...` — names
      no constant and nothing here notices. What holds the write side instead is
      that the documentation is DERIVED from the declarations
      (`declared_response_headers()`), so an undeclared stamp is a header the
      document does not mention, plus HDR-A's AST assertion that every
      `ResponseHeader.name` is an imported constant. Neither of those refuses
      the stamp itself. The belt on the one pair that matters — the hat headers
      a browser has to be allowed to send — is the CORS census above, which is
      derived from population A ∩ B and would notice `X-Org` leaving it. The
      trigger to widen population A to outbound writes is the same one the
      outbound-header note above carries, and it has now been pulled once: rule
      43 is the second signer's refusal, and it walks outbound header DICTS for
      exactly the signature names.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 5, negatives: 5 }
    canaries:
      # (i) The shape verbatim: a literal at a VALUE-default site. This is
      # the form that was live in `idempotency.py` until, and the
      # reason a canary is a PLANT and not a live violation — the site is
      # fixed, the shape is kept forever.
      - { fixture: header_literal_at_a_value_default.py, plant_at: apps/example/api.py, mode: append,
          expect: { contains: "'X-Tenant' as a literal" } }
      # (ii) The socket door's twin, in bytes, where there is no `request` to
      # hang the read off — planted next to the consumers that read the hat.
      # MOVE-TRIGGER 2026-08-24: rule 40 reads header spellings at the doors
      # that really read them; a probe-app plant would prove the check against a
      # door nothing routes to. It moves the day the socket door stops reading the
      # hat in `apps/realtime/consumers.py`.
      - { fixture: scope_loop_byte_literal.py, plant_at: apps/realtime/consumers.py, mode: append,
          expect: { contains: "x-org" } }
      # (iii) A refusal pointing at a header nobody reads.
      # MOVE-TRIGGER 2026-08-24: registry-bound — a remedy is only a remedy
      # inside `core.exceptions`' refusal registry. It moves the day the registry
      # does.
      - { fixture: remedy_names_a_typod_header.py, plant_at: apps/core/exceptions.py, mode: append,
          expect: { contains: "header:X-Tenent" } }
      # (iv) A destination in a kind the Remedy docstring does not enumerate.
      # MOVE-TRIGGER 2026-08-24: registry-bound like the one above; it moves
      # with it.
      - { fixture: remedy_with_an_undeclared_kind.py, plant_at: apps/core/exceptions.py, mode: append,
          expect: { contains: "url" } }
      # (v) The census: replanted. The list loses `x-org` and nothing else
      # in the tree changes — no error, no test, no log line.
      - { fixture: cors_list_loses_the_hat.py, plant_at: config/settings/base.py, mode: append,
          expect: { contains: "x-org" } }
    negatives:
      # The middleware's own reads: the constant, with a value default. The
      # rule fires on the SPELLING and never on the default.
      # MOVE-TRIGGER 2026-08-24: the legal read at the door that really makes
      # it. It moves the day `apps/core/middleware.py` stops resolving the tenant.
      - { fixture: reads_through_the_constants.py, plant_at: apps/core/middleware.py, mode: append }
      # The bearer door's two reads, as `ApiTokenAuth` writes them.
      # MOVE-TRIGGER 2026-08-24: the bearer door's legal reads, beside the
      # door. It moves the day `ApiTokenAuth` leaves `apps/accounts/auth.py`.
      - { fixture: bearer_door_reads_the_constants.py, plant_at: apps/accounts/auth.py, mode: append }
      # The remedies the tree already ships, in three declared kinds.
      # MOVE-TRIGGER 2026-08-24: registry-bound; it moves with the refusal
      # registry.
      - { fixture: remedies_that_name_declared_headers.py, plant_at: apps/core/exceptions.py, mode: append }
      # Somebody else's response. The receiver's name is the discriminator.
      # MOVE-TRIGGER 2026-08-24: somebody else's response header, read
      # through the one client factory. It moves the day the factory leaves
      # `apps/connections/client.py`.
      - { fixture: third_party_response_header_read.py, plant_at: apps/connections/client.py, mode: append }
      # The seam: a scope loop comparing against its own parameter, and a
      # caller passing the constant. This is the shape the rule wants.
      # MOVE-TRIGGER 2026-08-24: the scope-loop seam, beside the middleware
      # that owns it. It moves the day the ASGI header seam does.
      - { fixture: scope_loop_reads_its_parameter.py, plant_at: apps/core/asgi_middleware.py, mode: append }

  - id: "41"
    name: the-openapi-document-is-the-contract
    enabled: true
    memo:
      "no": "this rule reports through the Django system-check leg (manage.py check --tag djb), which
        boots the app registry and the URL configuration; those registries are a population assembled at
        import time out of the installed environment, not a file set a blob sha can stand for. Its AST
        half alone would key soundly, but the rule's verdict is the two halves together and no reader
        should have to know which of them a hit replayed"
    # P5 WA-1, ADR api-1. The owner read staging's Swagger and ruled the API
    # documentation standard a T0 prerequisite (queue.md): fifty-one
    # routes whose summary was a prettified function name, eleven with no
    # description at all, no documented header, no enumerated refusal, no
    # example on any of fifty-seven schemas, and no overview. Five cycles of
    # code review had read every one of those routes.

    # WHY A RULE AND NOT A REVIEW. That is the finding: review is what missed
    # it, twice a cycle, for five cycles. Documentation decays silently — a
    # route added without prose answers exactly as well as one with it, so
    # nothing fails, nobody is paged, and the cost lands on somebody who is not
    # in the room. A census is what holds.

    # MEASURED BEFORE ENFORCED: quality/contract-standard-measurement.md, over
    # main @ 66d3bb6 (tree db2fbbe4ff82b6ff7c0cfa72aa08ec2247cb5937), the tree
    # branched from. The ceiling is ZERO and pinned at birth, because
    # fixes the whole measured backlog rather than ratcheting it: the
    # 51 routes ARE the finding, and a standard that admits a backlog is a
    # standard the next wave's routes get born outside.

    # EVERYTHING IT REQUIRES IS DERIVED. `apps/core/api/docs.py` builds the
    # prose from each route's own docstring, the refusals from
    # `core.exceptions.REFUSALS`, the headers from the constants rule 40 already
    # governs, and the examples from the schemas themselves; `config/api.py`
    # applies them to every bound operation. So a route added in any app carries
    # the whole standard with it, and what is left for this rule to catch is the
    # handful of things a builder can actually get wrong.

    # SECOND ITERATION, 2026-08-24 (the owner's Stripe-shaped ruling in
    # design-agreements.md). The mechanism was right and the OUTPUT was not: the
    # navigation sidebar was a column of sentences, some carrying literal `**`,
    # because `summary` was the docstring's opening sentence. Four elements
    # landed, all derived: a nav-safe TITLE distinct from the sentence; declared
    # field examples; the overview split into linked guides; and human display
    # names on tags. Three of them are gated here. The overview split is not —
    # it is one string with headings in it, and "are these good guides" is
    # review's question; it is named in `does_not_cover`.

    # AND its CLAUSE, ruled 2026-08-23 and folded in here: the contract half
    # is written for a stranger with an API key, so the four MECHANICAL TELLS of
    # maintainer archaeology are a finding. Taste is not gateable and shapes are.
    statement: >
      The OpenAPI document is the contract, complete. Every route carries a
      TITLE and a description derived from the SAME docstring its MCP twin
      renders — the FIRST LINE is the title (a short phrase, no Markdown, no
      full stop, at most `title_max_length` characters), everything below it and
      above a `---` line is the description, and a hand-written
      summary=/description= is a second copy. No contract half publishes the
      mechanical tells of maintainer archaeology — a queue-row reference, an
      underscore-prefixed identifier, `@service`, `manage.py`. Every operation
      carries EXACTLY ONE tag, and that tag is both DESCRIBED and NAMED by the
      owning app's `TAGS` declaration. Every route enumerates the refusal codes
      it can answer with,
      and every enumerated code is one `core.exceptions` registers — the fact
      and the remedies are the registry's own text, never written per route.
      Every component schema carries an example, and the count of fields with no
      DECLARED example is a ratchet that may shrink and never grow.
      AND THE DOCUMENT'S OWN TOP-LEVEL KEYS ARE A DECLARED CENSUS, held by SET
      EQUALITY in both directions: a key the document carries that
      `openapi_top_level_keys` does not declare is a contract element nobody
      decided, and a key declared there that the document no longer carries is a
      reason describing something that is not published.
      X-Tenant/X-Org/Idempotency-Key/Idempotent-Replayed are documented on the
      operations that read them.
      AND THE BLOCK IS TRUE OF THE CODE BENEATH IT: a route that narrows
      with `@refuses(...)` names every code something it calls directly can
      raise, and publishes none that nothing it reaches can. An UNNARROWED route
      publishes the door-shape superset and is judged only where that superset
      cannot reach — a code the derivation can never produce is a code the
      document does not mention at all.
      AND A PROMISE OF A PERMISSION CHECK HAS A PERMISSION CHECK UNDER IT
      : a contract half that names the authorization seam's own refusal
      beside a word for a privileged role — "you are not an owner or an
      administrator of the tenant" — is a route where `core.authz.require(...)`
      is reached from the route body in one step, or where the function that
      would ask carries rule 13's `# authz: <reason>` valve saying why it
      does not.
    # TWO MECHANISMS ON ONE RULE, which is the born-together shape rather than
    # an accident: `djb.E041` reads the LIVE document (the registries are the
    # stronger witness for what is published), and `refusal_block_census` walks
    # the SOURCE (what is published against what the code can raise — a question
    # the document cannot answer about itself). is rule 41's own declared
    # gap, so it closes here rather than as a rule 44; a rule and its blind spot
    # are born together, and a blind spot closed elsewhere is a second rule
    # about one subject that will drift from the first.
    check: refusal_block_census
    django_check_ids: [djb.E041, djb.E042]
    floor_proxy: count_contract_surface
    doc:
      file: docs/product/architecture.md
      contains: "the OpenAPI document is the contract, complete"
    valve:
      marker: "<comment> rule-41: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding. The django system-check half of this rule honours no comment valve: those findings never pass through apply_overrides"
    scope:
      # The hard cap on a title, in characters, stated here as well as in
      # `apps/core/api/docs.py::TITLE_MAX_LENGTH` and ADR api-1 — three places
      # that agree by review, because the number is a judgement and a reader
      # should meet it wherever they are standing. Sixty: the longest title in
      # the tree is in the high thirties, and every SENTENCE that stood in for a
      # title before was longer than sixty.
      title_max_length: 60
      # THE RATCHET. Measured on 2026-08-24 with its declarations in place:
      # 84 schema fields declare a realistic example and 281 do not. Those 281
      # are shape-grade — always correct, never informative — and reducing them
      # is somebody's afternoon, not a blocker. What is closed today is the
      # thing that mattered: a NEW undeclared field pushes the count past this
      # number and fails the gate on the day it lands. Shrink it, never raise
      # it; raising it is a diff a reviewer reads.

      # 265 -> 266, (XP-1), and this is a RAISE — the direction this
      # number is not supposed to move — so it owes the diff a reviewer reads.
      # THE ONE FIELD IS STRUCTURALLY UNDECLARABLE. Every other new field in
      # that rung declares its example; the extra one is `PagedExportOut.items`,
      # which nobody can declare from anywhere. ninja builds a paginated
      # response as `type(f"Paged{X}", (paginator.Output), {"__annotations__":
      # {"items": List[X]}})`, and a pydantic subclass that RE-ANNOTATES a field
      # gets a fresh `FieldInfo` — so an example declared on
      # `core.schemas.ListPage.items` is dropped, and there is no third place to
      # put one. The tree already carries 17 of these, one per paginated list
      # route, and the ratchet was pinned AT measured, so the arithmetic was:
      # any new list door in any app is refused by this number until a human
      # moves it. That is the ratchet doing something it was not written to do.
      # THE REAL FIX IS ONE LINE ELSEWHERE, and it is named here rather than
      # taken, because it is not this rule's file: `core.api.docs._is_shape`
      # treats a `$ref` and an `anyOf` of `$ref`s as a shape and does not treat
      # `{"type": "array", "items": {"$ref": ...}}` as one — so an array OF a
      # component is counted as a scalar field whose example is a value. Widen
      # it and all 17 leave the census at once, the count falls to ~249, and
      # this number is re-pinned at the new measurement with headroom for the
      # next list door. Until then: 266.

      # **THE ONE LINE WAS TAKEN.** `_is_shape` now reads the
      # array road, and the paragraph above is left standing because it is the
      # argument that was executed rather than a stale note. What it predicted
      # and what happened: it said ~249 off 17 fields; the tree had grown to 21
      # `Paged<X>.items` plus 4 other arrays of `$ref`, and `declared` fell by 3
      # as well — three array-of-`$ref` fields that HAD hand-written examples
      # are now counted at the component they point at, once, which is the whole
      # point of the shape test. Measured with `apps.core.api.docs.example_census`
      # over the live document: declared 268 -> 265, undeclared 258 -> 233.
      # Re-pinned AT the measurement and not above it: this rule has been burned
      # once by a ratchet with headroom in it, and the structural entries that
      # justified headroom are exactly the ones that just left.

      # 266 -> 268, (F3, ADR files-2), and it is the SAME RAISE for the SAME
      # STRUCTURAL REASON the paragraph above already booked. F3 opened the files
      # doors: two paginated lists (`GET /files/`, `GET /files/{id}/versions/`),
      # so ninja built `PagedStoredFileOut` and `PagedFileVersionOut`, and each
      # one's `items` is the field nobody can declare from anywhere — a pydantic
      # subclass that re-annotates a field gets a fresh `FieldInfo`, so an example
      # on `core.schemas.ListPage.items` is dropped. Measured, not assumed: the
      # rung took `declared` from 176 to 220 and `undeclared` from 266 to 268, so
      # ALL 44 of F3's own declarable fields declare an example and the two that
      # do not are exactly `PagedStoredFileOut.items` and
      # `PagedFileVersionOut.items`.

      # **THIS NUMBER IS A SUM AND WAVE 1 HAS THREE DOOR RUNGS.** F3, T3 and U3
      # each add list doors in parallel and each meets this ratchet. A merge that
      # takes one side's 268 has silently discarded the others' — the arithmetic
      # is 266 + (each rung's own structurally-undeclarable count), and the PM
      # re-measures at merge rather than picking a number. The real fix is still
      # the one line in `core.api.docs._is_shape` the paragraph above names, and
      # it is still not a door rung's file.
      undeclared_example_fields: 233  # ratcheted down 258 -> 233: `_is_shape` learned the array-of-$ref road, so 21 ninja-synthesised `Paged<X>.items` plus 4 other component arrays left the backlog for the components they point at; measured with apps.core.api.docs.example_census over the live document
      # THE DOCUMENT'S OWN TOP LEVEL — the census `djb.E042` holds by SET
      # EQUALITY, in both directions (`apps.core.checks.top_level_key_faults`).
      # Every entry is a key a client meets before it reads a route, and the
      # reason is the thing that was missing: an undeclared key is something the
      # mount grew that nobody decided, and a declared key that has vanished is
      # a reason still sitting here describing something the document no longer
      # publishes.
      openapi_top_level_keys:
        - key: "openapi"
          reason: >
            the specification version the rest of the document is written in;
            ninja pins it at 3.1.0 and every generated client branches on it
            before it parses anything else.
        - key: "info"
          reason: >
            title, version and the overview a stranger with an API key reads
            first — `description` here is `docs.overview()`, the guides half of
            ADR api-1, and the one place in the document that is prose rather
            than derivation.
        - key: "paths"
          reason: >
            the operations. Everything else in rule 41 is about what is INSIDE
            this key; it is declared here so that the day it goes missing the
            failure says "the document has no paths" rather than "every route
            lost its docstring".
        - key: "components"
          reason: >
            the schemas, plus the one refusal shape `docs.refusal_component()`
            adds. The example census and the `$ref` graph both live in here.
        - key: "servers"
          reason: >
            WHERE THIS API IS, and it ships EMPTY on purpose — this is a
            template, it has no deploy URL, and an invented one is worse than
            silence because a client would try it. The judgement is recorded
            rather than shipped silently: a product that clones this and DOES
            have a URL should fail here until it says so, which an unwatched
            key could never make it do. `apps/core/tests/test_contract_docs.py`
            asserts the empty value beside this reason.
        - key: "tags"
          reason: >
            the tag descriptions and display names each app declared in its own
            `TAGS`, collected by discovery and stamped on in
            `config.api.ContractAPI.get_openapi_schema`. It is the navigation a
            person reads, and rule 41's tag clause judges its contents.
    # THE FLOORS ARE PINNED AT THE MEASUREMENT, and that is a departure from
    # the conservative "is the check watching anything" floors everywhere else
    # in this file — recorded here because it is a judgement, not an oversight
    # ((a), P5 QB-R1, 2026-08-24; quality/contract-standard-measurement.md,
    # the 2026-08-24 QB-R1 section). The finding was that `count_contract_surface`
    # counted `api.py` by basename and so could not see `apps/core/api/routes.py`
    # at all: core's `TAGS` went 1 -> 2 in TAG-1 and the counter read 8 both
    # times. Widening the walk to `api_modules()` fixes the blindness; it does
    # NOT by itself make the floor notice a contraction, because a floor five
    # below the truth is silent while half the surface disappears. So these four
    # are the measured numbers — documented_routes 86, contract_docstrings 86,
    # tag_declarations 10, twin_tools 69 — and a route, a docstring, a tag or a
    # tool REMOVED is exit 2 until a human commits the lower number in a diff
    # somebody reads. Growth is free: a floor is a minimum.
    floors:
      # Re-pinned at measured 2026-08-25, the same discipline QB-R1 set
      # for them: 86/86/69 were QB-R1's measurement and the tree has since grown
      # a route, its docstring and its twin. A floor left below the truth is
      # silent while the surface it watches contracts back to it.
      documented_routes: 87
      contract_docstrings: 87
      # Re-pinned at measured 2026-08-25 (SCOPE-1): the three-way scope
      # split grew core's `TAGS` from one entry to three, and a floor left at 10
      # against a measured 12 is silent while two of them go again.
      tag_declarations: 12
      twin_tools: 70
      # its clause, and only two of its four counts are floored.
      # `shape_codes` is the door-shape vocabulary read off `derived_refusals`
      # itself — at measured, because the day that list shrinks the clause
      # quietly starts judging unnarrowed routes it has no business judging.
      # `narrowed_routes` at 1 is what keeps the exact half BOUND: with no
      # `@refuses(...)` anywhere in the tree, the direction that compares an
      # exact block against its raise sites would be watching nothing and
      # reading as clean. `censused_routes` and `refusal_classes` are printed
      # and not floored — `documented_routes` already floors the route
      # population, and a product legitimately ships fewer refusal classes than
      # this template declares.
      shape_codes: 10
      # Both re-pinned at measured 2026-08-25 . `shape_codes` was 9 at
      # birth and `derived_refusals` has grown a tenth; `narrowed_routes` was
      # pinned at 1 to keep the exact half bound and the tree now carries three
      # `@refuses(...)` blocks. A floor five below the truth is silent while
      # half of what it watches disappears.
      narrowed_routes: 3
      # its clause, and its two counts are floored for the same reason
      # `narrowed_routes` is: each one, at zero, is the clause watching nothing
      # and reading as clean. `privileged_role_words` is what
      # `Membership.is_privileged` names — owner and admin — and a tell built
      # from an empty set matches no prose at all. `role_promising_routes` is
      # the population the clause judges, measured on this tree with the two
      # false promises corrected: 39 routes tell a caller they need a role and
      # all 39 ask for one. Growth is free; a fall means prose stopped
      # promising, which is either a correction somebody made on purpose or the
      # clause going quiet, and both want a diff a human reads.
      privileged_role_words: 2
      role_promising_routes: 39
    does_not_cover: >
      PROSE QUALITY, and it cannot: the rule sees that a docstring exists, that
      both doors render the same one, and that its title and contract half carry
      none of four mechanical SHAPES — never whether any of it is worth reading.
      The plain-language bar (design-agreements.md, 2026-08-23) is mostly taste:
      "the house list shape" and "the machine door" pass every check here and
      fail the bar, and a title that is short, plain and meaningless passes too.
      That is review's, and FT-1's docs-as-the-only-guide drive is the one live
      probe — one persona, one run, and it is what found the four accounts leak
      sites, a false sentence about bearer tokens on the invitation-accept route
      and two routes each claiming to be the only credential-free one. A TITLE
      is checked for shape and never for aptness. THE GUIDES half of the
      2026-08-24 ruling is not gated at all: the overview is one string with
      headings in it, "is this a guide or is it reference" is a judgement, and
      the only mechanical part — that the landmarks survive a rewrite — is a
      test (`test_the_document_opens_with_the_overview`) rather than a rule.
      EXAMPLE quality likewise, in two halves: an undeclared field's example is
      synthesised from the schema's own types, so it is always SHAPED right and
      is never informative (`"channel": "text" # (synthesised, never judged; format-aware since H2b)`); and a DECLARED example is
      counted, never judged — nothing here can tell a realistic value from a
      plausible-looking one, and nothing here would notice a real customer's
      name or a live key in an example, which is why `core.schemas.example`
      says so in prose and review is what holds it. Rule 23's secret scan is
      the ONE mechanical guard that reaches an example at all, and it reaches
      it sideways — it caught a realistic 64-character digest here on
      2026-08-24 because it could not tell one from a leaked key, which is a
      finding this rule would never have made and is recorded beside the seam. The ratchet also cannot see
      a field that WAS declared and had its example deleted, if another field
      was declared in the same diff: the number is a total, not a per-schema
      pin. A TAG NOBODY CARRIES is not caught: the one-tag clause refuses a
      second tag on an operation and nothing here refuses a `TAGS` entry left
      behind after its last route moved, which renders as an empty heading
      somebody clicks. It is the other half of the owner's 2026-08-24 finding
      and the reason `accounts`' umbrella tag was DELETED rather than orphaned;
      closing it needs a canary that cannot share a fixture with the
      display-name one (both would rebind the probe app's `TAGS`), so it is
      named here rather than half-built. THE REFUSAL
      ENUMERATION IS A SUPERSET where a route did not narrow it: it is derived
      from the DOOR's shape — a body can be invalid, a path parameter can miss,
      a write can conflict — and not from the service's raise sites, which are
      an open set. `@refuses(...)` is the narrowing valve and this rule checks
      its codes against the registry, not its aptness. WHETHER A DOCUMENTED CODE
      CAN ACTUALLY BE RAISED THERE was nobody's check until QB-R2; it is
      now `refusal_block_census`, and what that clause CANNOT see is three
      things, narrowed from the old sentence: RESOLUTION DEPTH — one level, the
      route body plus the functions it calls by a name this tree can resolve, so
      a code raised two calls down is invisible in both directions (an
      underclaim it will not report, and an overclaim it may report wrongly);
      the ratchet and review bound that, and the `unresolved` count prints the
      part of the tree it could not read. CONDITIONAL REACHABILITY — a raise
      inside a branch nothing can enter is a raise as far as this walk is
      concerned, and a raise behind a feature flag nobody turns on counts too;
      "can this line run" is not a question an AST asks. DYNAMIC DISPATCH — a
      callee pulled out of a registry, reached through `getattr`, or bound at
      runtime is unreadable by construction, and a route that has one has its
      OVERCLAIM direction suppressed on purpose: treating "I could not read the
      callee" as "the callee cannot raise that" would manufacture findings out
      of a declared blind spot and teach somebody to delete a `@refuses` that
      was telling the truth. Also unseen: a `raise HttpError(400, ...)` names no
      registered code and is skipped (rule 14's subject), and `unauthenticated`
      is raised by the auth backend rather than by anything a route calls, so it
      is outside both directions. AND ITS CLAUSE HAS THREE BLIND SPOTS OF ITS
      OWN, all the same shape: it reads a SENTENCE and a CALL and cannot read
      the intent between them. WORDING THE TELL DOES NOT MATCH — the tell is the
      authorization seam's own refusal code standing in one bullet or paragraph
      beside a word for a privileged role, both derived (`core.authz.require`'s
      raise site; the choices `Membership.is_privileged` names), so a promise
      made in other words — "only the person who created this may", "the
      tenant's billing contact" — is invisible here. AND SINCE ADR core-25 THAT
      WORD LIST IS CLOSED WHILE THE ROLES ARE OPEN. `Membership.Role` is
      deprecated v2.1 → removed v3.0 and is no longer the `role` column's
      `choices` (`apps/core/models.py:522-535`, `:554-567`): a role key is one
      of three layers now — the platform's `owner`, a key any app declares in
      its `roles.py` (`apps/core/roles.py`; `core.authz.role_declarations`,
      `apps/core/authz.py:952`), or the `key` of a `core.Role` row one tenant
      owns — and only the first is knowable at import. `_privileged_role_words`
      therefore still derives exactly `{"owner", "admin"}`, and a contract half
      promising a DECLARED role — "only an auditor", "a billing manager" —
      carries no tell this clause can see, however many such roles a deployment
      writes into `roles.py`. What "privileged" MEANS moved with it:
      `core.authz.allows` no longer consults `is_privileged`, authority is
      `core.authz.holds(actor, "<kind>.<verb>", at=...)`
      (`apps/core/models.py:595-608`, `apps/core/authz.py:1327`), and that
      property now survives partly BECAUSE this rule reads it — so its removal
      at v3.0 empties the derivation rather than moving it. The
      `privileged_role_words: 2` floor is the whole of the guard there, and it
      is arithmetic: it notices the set emptying, never the set failing to grow
      with the roles the deployment actually promises in prose. That residual is not one
      to live with, which is why the DRIVE is its belt:
      `test_a_plain_member_meets_what_every_published_read_promises` in
      `apps/core/tests/test_contract_docs.py` drives every GET the document
      publishes as a member holding a real membership and compares the wire to
      the prose, in words nothing has to recognise. THE `# authz:` VALVE IS
      TAKEN AT ITS WORD — and the population it stands alone behind is ONE
      route now, not three. `add_membership` and `set_role` ask the seam
      themselves since ADR core-25 — `require(actor, "membership.create",
      where)` at `apps/core/services.py:1412` and `require(actor,
      "membership.update", membership.organization)` at `:1507` — with the
      escalation wall standing BEHIND that ask rather than in place of it. What
      is left on the valve alone is `set_flag`, which delegates to
      `update_tenant_settings` and says so on the line
      (`apps/core/services.py:2493-2498`). The gap is unchanged and one member
      wide: a valve whose reason was "no
      check needed here" would satisfy this clause exactly as that one does.
      Rule 13 already accepts that sentence; second-guessing it here would be
      two rules disagreeing about one grammar. THE OPPOSITE ERROR IS NOT
      CHECKED AT ALL — a route that DOES ask a role and never says so publishes
      the door-shape superset, which names the code and explains nothing, and
      nothing here requires the explanation. PLAIN DJANGO
      VIEWS are invisible: the census walks ninja operations, so `/healthz`,
      `/readyz`, the allauth flow and the door index are outside it — that gap
      is its (rule 3's third clause, wave C) and is named here so it has a
      holder. THE SOCKET AND WEBHOOK DOORS have no document to be complete, and
      a tool with NO REST twin (`ping`) is described by its own words with
      nothing to compare against — whether it SHOULD have a twin is rule 17's.
      And the divider is a convention, not a wall: a workshop half that
      contains something a caller needed is a mistake this rule will happily
      keep out of the document.
      THE TOP-LEVEL CENSUS IS A SET AND NOT A SHAPE. It watches which keys the
      document carries and reads not one byte of what is inside any of them: a
      `servers` list that grew a wrong URL, an `info.version` that stopped
      moving, a `paths` that lost half its operations are all invisible here and
      all belong to other clauses (the route floors above hold the last of
      those). Its reasons are prose a reviewer agrees or disagrees with, never
      anything a check can verify — the `servers` entry says the emptiness is
      deliberate, and nothing mechanical could tell that from an accident, which
      is exactly why the reason had to be written down. And it sees THIS
      PROCESS's document: a key added under a settings flag that is off here is
      absent from the census and from the key list at once, the same
      deployment-shaped blindness rule 3's third clause records.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 13, negatives: 8 }
    canaries:
      # (1) The ordinary miss, and the one the measurement found eleven of: a
      # route born with no docstring at all.
      - { fixture: undocumented_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: doodad-detail } }
      # (2) A well-documented route in a group nobody named. The tag is what a
      # reader meets before they meet a single route.
      - { fixture: undescribed_tag_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: zzz-undescribed } }
      # (3) THE ONE-DOCSTRING RULE, planted from the machine door's side: one
      # capability, two texts. Prose drifts long before behaviour does, and rule
      # 17 cannot see this because both doors exist.
      - { fixture: drifting_twin_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: get_doohickey },
          extra_files: [ { fixture: drifting_twin_tool.py, plant_at: apps/zzz_canary/mcp.py, mode: create } ] }
      # (4) A refusal code the registry does not hold — the document teaching a
      # client to branch on something the wire never speaks.
      - { fixture: unregistered_refusal_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: no_such_refusal } }
      # (5) THE OWNER'S SCREENSHOT, as a fixture (2026-08-24): the first
      # line is a sentence with `**` in it, so the navigation shows those two
      # characters in a column that is supposed to be scannable names.
      - { fixture: sentence_title_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: "carries Markdown" } }
      # (6) MAINTAINER ARCHAEOLOGY above the divider — the shape the owner read
      # on `POST /tokens/` (2026-08-23). Four tells in one contract half;
      # the check names the first it meets, which is the queue-row reference.
      - { fixture: archaeology_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: "queue-row reference" } }
      # (7) A tag with prose and no NAME. The 2026-08-23 clause is satisfied and
      # silent; what a reader meets in the navigation is still a URL slug.
      - { fixture: unnamed_tag_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: "has no display name" } }
      # (8) THE RATCHET, proven from above: a new schema whose fields declare no
      # example pushes the census past the recorded number. This is the clause
      # that makes "new schemas must declare" a fact rather than an intention.
      # THE PLANT PATH LIES ABOUT THIS FORM'S WORLD. It plants into the
      # probe app, but what it proves is that the DECLARED-EXAMPLE CENSUS goes
      # past its ceiling — and that ceiling
      # (`scope.undeclared_example_fields`, read in apps/core/checks.py) counts
      # fields over the mounted document, which the worked example's schemas
      # fill a share of. Disable `apps/example` and the census starts below the
      # ceiling, this plant no longer pushes it past, and the canary dies
      # NAMING NOTHING — one of the fifteen dead forms the residence backlog
      # above was raised for. Its
      # world is the example's, so it says so and is not planted without it.
      # The ceiling itself is the same class of world-dependent number as rule
      # 35's floors, one layer out of this file's territory (it is read in
      # apps/core/checks.py, not in quality/); recorded, not smuggled.
      - { fixture: undeclared_example_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, needs_app: example,
          expect: { id: djb.E041, contains: "example census" } }
      # (9) ONE OPERATION, TWO SECTIONS — the owner's second review finding
      # (2026-08-24). A renderer lists an operation under every tag it carries,
      # so a second tag is the same operation printed twice in the navigation.
      - { fixture: two_tagged_route.py, plant_at: apps/zzz_canary/api.py, mode: append,
          via: django, expect: { id: djb.E041, contains: "carries 2 tags" } }
      # (10), THE OVERCLAIM: a narrowed block publishing a registered code
      # nothing it reaches can raise. `via: ast` — this half walks the source,
      # not the document, and the two mechanisms are deliberately independent:
      # a canary here proves the clause without depending on the live registry
      # being importable.
      - fixture: refusal_overclaim_route.py
        plant_at: apps/zzz_canary/api.py
        mode: create
        expect: { contains: page_token_missing }
        extra_files:
          - { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (11), THE UNDERCLAIM: a narrowed block missing a code its DIRECT
      # callee raises. Two files, because an underclaim is a relation between a
      # decorator and a raise site one level down and a one-file fixture could
      # not express it.
      - fixture: refusal_underclaim_route.py
        plant_at: apps/zzz_canary/api.py
        mode: create
        expect: { contains: conflict }
        extra_files:
          - { fixture: refusal_underclaim_service.py, plant_at: apps/zzz_canary/services.py,
              mode: create }
          - { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (12), THE UNBACKED PROMISE: its finding replanted. The prose
      # tells a caller that a 403 here means they are not an owner or an
      # administrator; the route takes no actor, calls no service and answers
      # 200 for any member. Every other mechanism on this rule is satisfied and
      # silent, which is exactly how the sentence survived five cycles of review
      # on five routes.
      - fixture: role_promise_route.py
        plant_at: apps/zzz_canary/api.py
        mode: create
        expect: { contains: list_doohickeys_route }
        extra_files:
          - { fixture: probe_app_config.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (13), THE DOCUMENT ITSELF: a top-level key nobody
      # declared. Everything above is about what is INSIDE `paths` and
      # `components`; the document's own top level — which specification version
      # it speaks, who it is, WHERE IT CAN BE REACHED — was governed by nothing,
