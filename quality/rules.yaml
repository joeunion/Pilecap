  - id: "57"
    name: one-writer-of-the-identity-join
    enabled: true
    statement: >
      Which Zitadel subject signs in as which of our people is written by
      apps.accounts.services.record_zitadel_identity and cleared by
      unlink_zitadel_identity, and nowhere else: no module outside
      apps/accounts/services.py assigns .zitadel_sub or passes zitadel_sub= to
      update(/create(/get_or_create(/update_or_create(, and no module outside
      apps/accounts/adapter.py calls sociallogin.connect(. Reads are out of the
      population by construction. A second writer is how a join between two
      identity systems comes to disagree with itself — and the disagreement is
      an account takeover with an extra step.
    check: identity_join_writers
    doc:
      file: docs/product/architecture.md
      contains: "keyed on the subject, not the address"
    valve:
      marker: "# rule-57: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it — the engine's generic override, counted and printed in the standing override census. No rule-specific marker, for rule 56's reason: a second writer of the identity join is not a thing a local comment should normalise, and the legitimate way to add one is a path in this rule's allow-list with its reason"
    scope:
      allow_column:
        - path: apps/accounts/services.py
          reason: >
            the writer and the unlinker, both `@service`, both audited, both
            refusing before they write — `record_zitadel_identity` refuses a
            differing standing subject and `unlink_zitadel_identity` is the
            audited road back.
      allow_connect:
        - path: apps/accounts/adapter.py
          reason: >
            allauth's own link, called AFTER the writer has said yes. The ORDER
