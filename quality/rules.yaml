  - id: "58"
    name: socket-join-discipline
    enabled: true
    # R4's F1, the one HIGH of that review. `apps/realtime/consumers.py` says
    # "nobody names their own group" and it was a CONVENTION FOR ONE CONSUMER.
    # A planted `apps/example/consumers.py` doing
    # `group_add(f"tenant.{query['tenant']}")` + `accept()`, mounted bare in
    # `websocket_urlpatterns`, is discovered by `config/asgi.py:39-49` exactly as
    # the real one is, accepted with NO credential, and hears that tenant's
    # events. The gate let it through: rule 36 reads `group_send` sites — the
    # PUSH side — and nothing read the JOIN side at all, while rule 46 asks only
    # for a `DOOR_PAIR` marker and says so in its own capitals ("THE MARKER
    # PROVES EXISTENCE, NEVER STRENGTH"). So a second consumer's whole gate
    # answer was one line in a test file.
    #
    # TWO CLASSES, because the plant is two independent defects and closing
    # either alone still leaves a door open. `join` without `mount` is an
    # anonymous subscriber to real branches; `mount` without `join` is somebody
    # else's tenant read with a valid credential.
    statement: >
      Nobody names their own group, and nobody mounts an open socket. Every
      group_add under apps/ takes its group from one of the bridge's three
      derived builders — tenant_group, org_group, user_group — directly, or
      through a name the same scope bound to one (a list of them, a comprehension
      over them, the loop variable that walks it). And every entry in a
      module-level websocket_urlpatterns wraps its application in token_auth(...)
      and names a consumer that extends TenantEventsConsumer, which is where the
      three refusals live — no principal, no tenant, no self-named group. A group
      name built at the join is a subscription to whatever the expression
      evaluates to, and config/asgi.py mounts a bare pattern exactly as it mounts
      the real one.
    check: socket_join_discipline
    doc: { file: docs/product/architecture.md, contains: "nobody names their own group" }
    valve:
      marker: "<comment> rule-58: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # DERIVED, never typed: the population is every `group_add` call and every
    # `websocket_urlpatterns` entry the AST finds under `apps/`. Measured on this
    # tree: group_add_sites 2, consumer_patterns 1 — the one consumer's user-group
    # join and its loop over the tenant and org groups, and its one mounted
    # pattern. The floors are 1 and 1 rather than 2 and 1 for §I's reason: a
    # recogniser that stops seeing its own subject must trip a floor rather than
    # report a clean nothing, and the second `group_add` is R4-F4's ordering fix,
    # which a later refactor is free to fold back into one loop.
    floors: { group_add_sites: 1, consumer_patterns: 1 }
    does_not_cover: >
      A LAUNDERED NAME. The rule reads three bindings — a builder call, a name
      this scope bound to one, and a collection or comprehension of them — and
      anything else is a finding. That is the fail-closed reading and it is
      deliberate; what it cannot see is a derived name that leaves the scope: a
      helper in another module returning `tenant_group(x)`, a name bound in an
      enclosing function and read in a nested one, a group name arriving as a
      parameter. Each of those is a finding here, so the blind spot is FRICTION
      rather than a hole — the valve is where such a site says why. A LATE JOIN.
      The rule sees that a join is derived, never WHEN it happens: a consumer
      that joins its user group after its reads satisfies this rule completely
      and is R4-F4's defect, which is a population-derived TEST
      (`test_the_user_group_is_joined_before_any_read`) and not a shape. AN
      OVERRIDING SUBCLASS. A class that extends `TenantEventsConsumer` and
      overrides `connect` to skip every refusal answers the mount class and is
      exactly as open as the plant; subclassing is a claim about inheritance, not
      about behaviour, and whether the override is honest is review's. CONSUMERS
      MOUNTED ELSEWHERE. The population is `websocket_urlpatterns` at module
      level, which is what `config/asgi.py` discovers; a consumer reached by any
      other road is not mounted by this template and is not seen here. AND THE
      WRAPPER IS READ BY NAME: a `token_auth` that stopped authenticating would
      satisfy this rule, which is `apps/realtime/tests/test_consumers.py`'s
      subject and not a static scan's.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 2 }
    canaries:
      # (1) R4'S PLANT, WHOLE — the fifteenth app's consumer, in the fifteenth
      # app. One file, two findings, one per class, which is what makes the two
      # classes' independence demonstrable rather than asserted.
      # MOVE-TRIGGER 2026-09-16: `apps/example` is the plant because the fact
      # being demonstrated is a SECOND app growing a socket door, and the app
      # that already has one cannot demonstrate it. Move it the day `example`
      # grows a real `consumers.py`, to whichever app is then door-less.
      - { fixture: the_fifteenth_apps_open_consumer.py, plant_at: apps/example/consumers.py,
          mode: create, expect: { contains: "names its own group" } }
      # (2) THE JOIN HALF ALONE, in the app the seam lives in — a correctly
      # mounted consumer whose handler subscribes to a name it built itself.
      # MOVE-TRIGGER 2026-09-16: seam-bound. It moves the day the consumer
      # leaves `apps/realtime/consumers.py`.
      - { fixture: a_group_name_built_at_the_join.py, plant_at: apps/realtime/consumers.py,
          mode: append, expect: { contains: "names its own group" } }
      # (3) THE MOUNT HALF ALONE — authenticated, and written BESIDE the base
      # rather than under it. This is the shape a careful stranger produces, and
      # it is the one a credential check alone would wave through.
      # MOVE-TRIGGER 2026-09-16: seam-bound, like (2).
      - { fixture: a_mounted_consumer_beside_the_base.py, plant_at: apps/realtime/consumers.py,
          mode: append, expect: { contains: "TenantEventsConsumer" } }
    negatives:
      # THE DEMANDED SHAPE, whole: the base subclassed, the pattern wrapped,
      # every group from a builder, through the two-hop laundering the real
      # consumer does (a list, then a loop over it). A rule that could not be
      # satisfied by the form it demands is a rule nobody can land.
      - { fixture: the_demanded_shape.py, plant_at: apps/example/consumers.py, mode: create }
      # The valve with its sentence, on the flagged line's own comment block.
      # MOVE-TRIGGER 2026-09-16: seam-bound like this rule's other appended
      # forms — `apps/realtime/consumers.py` is the one consumer this template
      # has, and a valve proved anywhere else would be proved against a door
      # nothing mounts. It moves the day the consumer leaves that module.
      - { fixture: a_valved_join.py, plant_at: apps/realtime/consumers.py, mode: append }

  - id: "59"
    name: org-scoped-events-carry-their-branch
    enabled: true
    # R4's F4 and F5, one statement because they are the two ends of one seam.
    # `events.services._subject_organization` reads only the payload's TOP-LEVEL
    # `organization_id`; absent means NULL, and `bridge.group_for` reads NULL as
    # TENANT-WIDE. Rule 38 certifies that an org-scoped model's `Out` DECLARES
    # the key; nothing certified that an emit site PASSES one, and rule 36's own
    # `does_not_cover` names that gap in as many words.
    #
    # THE LIVE INSTANCE: `usage.threshold.crossed` (`apps/usage/services.py:153`)
    # sends a `ThresholdCrossingOut` whose top level had no key and whose nested
    # `crossed_by` is an org-scoped `UsageEntryOut` — so a rival administrator at
    # branch B received a ledger row that `GET /usage/` under hat B never lists.
    #
    # THE OTHER END (F5): a noun mapped to `None` while the app declares a model
    # of that name. `consumers._may_read` answers True for a `None` kind
    # whatever branch the frame carries, so a real row's event declared org-less
    # bypasses the read set for every connection in the tenant — and the
    # `ImproperlyConfigured` text `kind_of_event` raises OFFERS that road while
    # the noun census accepts any `None`.
    statement: >
      An org-scoped event carries its branch, and an org-less kind names none.
      Every emit(name=<const>, payload=<expr>) site under apps/ whose noun
      resolves to an OrgScopedModel kind passes a payload that provably carries
      organization_id — a dict display naming the key, an expression mentioning
      a rule-38-certified Out schema, a name the scope bound to either, or a
      module-local helper whose returns are one of those. And a noun an app maps
      to None in EVENT_KINDS while that app declares a model whose authorization
      kind IS that noun is a violation: a None kind is delivered to every
      connection in the tenant regardless of the branch on the frame.
    check: org_scoped_events_carry_their_branch
    doc: { file: docs/product/architecture.md, contains: "an org-scoped event carries its branch" }
    valve:
      marker: "<comment> rule-59: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it (never further away, and never across a non-comment line); a reason under 12 characters becomes its own finding"
    scope: {}
    # DERIVED, never typed. `org_scoped_kinds` is the transitive OrgScopedModel
    # closure crossed with `model_kinds` — the same two walks rules 24, 38 and 55
    # already share, so a model that gains a branch joins this population on the
    # run it joins theirs. Measured: org_scoped_kinds 12, emit_sites 16,
    # none_mappings 1. The floors sit below the measurements for §I's reason — a
    # recogniser that stops seeing its own subject must trip a floor rather than
    # report a clean nothing — and `none_mappings` is floored at 1 because the
    # one declared None (`search.engine`) is the form the F5 class is about: if
    # nothing in the tree maps a noun to None, this rule's second class is
    # watching nothing.
    floors: { org_scoped_kinds: 6, emit_sites: 10, none_mappings: 1 }
    does_not_cover: >
      A NAME THIS WALK CANNOT RESOLVE. `emit(name=name, ...)` — a parameter, an
      f-string, a lookup in a table (`STATUS_EVENTS[slug]`) — is out of the
      population entirely, because the noun is what decides whether the question
      applies and a guessed noun is a guessed answer, and it is COUNTED:
      `unresolvable_emit_sites` on the status line, eight when this was written
      (`connections.services._emit`, `core.services`' and `example.services`'
      `name=name`, `exports`' one, and `comms`' two conditionals and two table
      lookups) — derived every run and never typed here, because a count is not
      a list and a typed count rots: this sentence said four while the tree
      carried eight. Each of them is somebody else's control flow; the runtime
      belt in `emit()` is what covers them, which is why the rule and the belt
      ship together. A PAYLOAD ASSEMBLED ACROSS MODULES: the walk follows a name
      the enclosing scope bound and ONE hop into a module-local helper's
      returns, and stops. A body built in a second module, or behind a
      conditional the walk cannot evaluate, reads as absent — the fail-closed
      direction, and the valve is where such a site says why. THE VALUE, NEVER
      THE KEY: a payload carrying `organization_id` set to the wrong branch, or
      to the actor's hat rather than the row's, satisfies this completely and is
      ADR realtime-2a's argument plus `_subject_organization`'s own refusal, not
      a shape. A NESTED KEY IS NOT A TOP-LEVEL ONE and the rule deliberately
      cannot tell a certified `Out` used as a FIELD from one used as the body —
      `ThresholdCrossingOut` mentioning `UsageEntryOut` would satisfy the walk,
      which is why `usage.threshold.crossed` is fixed by giving the OUTER schema
      the key (F2.4) rather than by a deeper scan. AND THE SECOND CLASS READS
      DECLARATIONS: a noun with no model of that name is silent here whether or
      not a row is really behind it, which is `kind_of_event`'s refusal and the
      noun census's job.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 3, negatives: 2 }
    canaries:
      # (1) THE LIVE INSTANCE'S CLASS, in the app it was found in — an org-scoped
      # noun announced with a hand-built body that omits the key.
      # MOVE-TRIGGER 2026-09-16: `apps/usage` is the plant because the finding
      # was there; move it the day `usage` stops emitting an org-scoped event.
      - { fixture: a_hand_dict_with_no_branch.py, plant_at: apps/usage/services.py,
          mode: append, expect: { contains: "organization_id" } }
      # (2) THE LAUNDERING, one hop away. The walk follows a module-local
      # helper's returns because thirteen honest emit sites build their body in
      # one; this is the form that proves it does not fail OPEN when it gets
      # there.
      - { fixture: a_body_laundered_through_a_helper.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "organization_id" } }
      # (3) F5's class: a real row declared org-less.
      - { fixture: a_real_row_declared_org_less.py, plant_at: apps/example/events.py,
          mode: append, expect: { contains: "mapped to None" } }
    negatives:
      # The demanded shape: the row's own rule-38-certified `Out`.
      - { fixture: the_demanded_shape.py, plant_at: apps/example/services.py, mode: append }
      # The helper hop, honest — the `comms._payload(message)` shape, which is
      # what thirteen emit sites on this tree really write.
      # MOVE-TRIGGER 2026-09-16: `apps/usage/services.py` for the canary's own
      # reason — it is the app the finding was in, and the negative has to sit
      # beside the canary it is the control for. It moves the day `usage`
      # stops emitting an org-scoped event.
      - { fixture: a_certified_body_through_a_helper.py, plant_at: apps/usage/services.py,
          mode: append }

# THE PEER-FORK MIGRATION PATH (rules 51-53, the redemption item for the
# living-workaround finding of the FEEDBACK-2 survey). That finding recorded
# the fact this instrument retires: "the engine
# cannot declare a non-Python rule or external runner; the peer's [the sibling
# product's]
# parallel rules.mjs runner is the living workaround" — a whole SECOND
# enforcement engine, hand-built, because this one could not yet speak a
# second language. This repo has no read access to that runner's source (it
# lives in the sibling's own tree), so the mapping below is drawn from what
# THIS cycle's own evidence base already recorded about its shape — the C1
# lead consult and the ASK-2 practice row — never from inspecting their code
# directly; treat rule NAMES as the peer's own if their tree still uses them,
# and the SHAPE as the thing actually being retired.
#
#   rule 51 (js-ingredient-boundary) <- the peer's "screens-import-only-from-
#     components" — C1's own words for where this lands ("rule 7 -> declared
#     import contracts -- WHERE THE PEER'S screens-import-only-from-components
#     LANDS. It is A2/A3/rule 7 in JS, an existing form, no new grammar").
#   rule 52 (js-no-barrel) <- the peer's own "barrel files BANNED (the
#     INSTALLED_APPS of JS)" convention, already adopted there by hand (C1);
#     this instrument is that same law made canaried and first-class rather
#     than a habit somebody has to remember to review for.
#   rule 53 (js-token-has-a-consumer) <- the reader-less-declaration class,
#     of which "tokens are its second population" — whatever hand-compensation
#     the peer built for the first population (a Python-side sentence; the
#     retired base.py:1096 ensure_csrf_cookie instance is THIS template's own
#     first population, not theirs) generalises to the same census here.
#
# WHAT THEY DELETE ON A TEMPLATE PULL: their own rules.mjs entries implementing
# these three shapes, and whatever hand-review step stood in for a fourth
# (rule 50, the credential scan, if their fork carries one) — replaced by
# these four rows running through the identical check-v1 protocol their own
# runner design already proved out (C1: "the design law, learned from the
# peer's fork: the external runner is a measuring instrument, never a judge" —
# check-v1 IS that law, generalised). What does NOT retire on pull: the
# peer's own PRODUCT-SPECIFIC screens and the taste decisions inside them —
# this instrument enforces the CONTRACT their rules.mjs already enforced, not
# their design. A rule 51-53 finding on their tree at pull time is a real
# defect these rules found that theirs did not (or a shape their tree
