      - fixture: policies_key_declared.py
        plant_at: apps/zzz_canary/policies.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (b) The same DEFAULT_ROLES shape naming a role core DOES declare.
      - fixture: default_role_declared.py
        plant_at: apps/zzz_canary/policies.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (c) The question asked of the DATA instead. This one is load-bearing in
      # a way the others are not: it is the form clause (c)'s own red tells
      # people to write, so a rule that flagged it would be telling people to
      # write something it also refuses.
      - fixture: holds_instead_of_rank.py
        plant_at: apps/zzz_canary/policies.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (d) The read that asks, for the kind it returns.
      - fixture: selector_with_require.py
        plant_at: apps/zzz_canary/selectors.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (d) The machine read, with its sentence — the valve doing its job.
      - fixture: selector_read_open.py
        plant_at: apps/zzz_canary/selectors.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (d) THE VALVE ON A READ THE ANNOTATION PUTS OUTSIDE THE POPULATION —
      # silent, and COUNTED. The finding population is annotation-bound; the
      # valve population is every public `get_`/`list_` by name, and the two
      # `apps/usage` reads that live in the difference were valved and uncounted
      # until PR5. This is the control for the silence; the count itself is the
      # status line's `read_open_valves`, which the run prints every time.
      - fixture: valve_on_a_non_model_return.py
        plant_at: apps/zzz_canary/selectors.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (a) AN OWNED CHILD WHOSE `authz_kind_of` IS A MODULE CONSTANT. The
      # registry skips a child on ANY value of the attribute; this half asked
      # for an `ast.Constant` string, so the constant form — the ordinary way
      # to bind a foreign-key name once — was censused as a model with a kind
      # of its own and collided with its own parent. A finding no deployment
      # has. The literal spelling was silent under the narrow condition too,
      # which is why only the constant could show the gap.
      - fixture: owned_child_via_constant.py
        plant_at: apps/zzz_canary/models.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (a) THE ABSTRACT BASE'S OWN `authz_kind_of = None` — the shape
      # `apps/core/models.py` ships. Silent because the census filters
      # `abstract` before it reads a declaration, and that filter is
      # load-bearing with nothing else watching it: the canary above requires
      # the concrete form to FIRE, and this requires the abstract form not to.
      - fixture: abstract_base_declares_the_default.py
        plant_at: apps/zzz_canary/models.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
      # (e) THE OWNED CHILD'S READ, ASKING FOR THE AGGREGATE'S KIND — the right
      # form, and the one that makes the resolution observable instead of
      # internal. The child's own derived name differs from its parent's kind
      # on purpose, so a reader that resolves the module constant the way the
      # runtime does and a reader that reads only a literal give different
      # answers; the second reports this correct selector as asking for the
      # wrong kind, which is a valve invited onto code that needs none.
      - fixture: selector_reads_owned_child_via_constant.py
        plant_at: apps/zzz_canary/selectors.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: owned_child_constant_models.py, plant_at: apps/zzz_canary/models.py, mode: create }


  - id: "55"
    name: tenant-wide-kinds-ask-at-the-root
    enabled: true
    statement: >
      A permission whose KIND names no node is asked at a node the caller
      resolved, never at the acting hat by default. For require(actor,
      "<kind>.<verb>", ...) / allows(...) with a literal key — or a
      module-level string constant, rule 13 clause (ii)'s shape — whose kind's
      model carries no organization foreign key and is not Organization itself,
      the third argument is a node the caller resolved: a root_organization(...)
      call, a Name bound to one in the enclosing function, a Name bound to a
      parameter annotated Organization, or an expression ending in
      .organization — or the line carries # hat-scoped: <reason>. A tenant-wide
      kind asked with no node, or with the row itself, resolves at the caller's
      HAT, where a branch administrator holds `*`.
    check: tenant_wide_kinds_ask_at_the_root
    doc: { file: docs/product/architecture.md, contains: "asked at a node the caller resolved" }
    valve:
      marker: "# hat-scoped: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it — the same grammar `# reach:` and `# authz-kind:` are read with. A bare one is its own finding (rule 26's device), and every honoured one is counted and printed as `hat_scoped_overrides` on this rule's status line, so the population of sites that decided the hat IS the right node is readable rather than inferred"
    # DERIVED, never typed: the kind -> model map is `model_kinds` (rule 13
    # clause (i)'s own derivation) and "does this row name a node" is
    # `org_scoped_model_names` plus the class body's own `organization =
    # models.ForeignKey(` — rule 24's derivation. One derivation, three rules,
    # so a model that gains a node leaves this population on the same run it
    # enters rule 24's. There is nothing for a person to keep in step.
    scope: {}
    # THE FIRST SWEEP'S MEASUREMENT, 2026-09-14 — HISTORY, and deliberately not
    # a census: tenant_wide_kinds 20, sites_seen 32, files_scanned 95,
    # hat_scoped_overrides 1 (`sso_identity.provision`, then at
    # `apps/accounts/services.py:1868`, whose reason named the system-only
    # caller). All four move without this file changing, so TODAY's are the
    # ENGINE's to print and never this comment's: the rule's own status line
    # carries every one of them on every run, and `python -m quality.gate
    # --explain 55` prints the rule. The numbers above are kept only because the
    # floors below were argued against them.
    # `tenant_wide_kinds` is floored at 6 because the surface review named six by
    # hand — `sso_connection`, `tenant`, `role`, `user`, `api_token`,
    # `identity_branding` — and the derivation finds fourteen more; a
    # derivation that fell below the hand list has stopped deriving.
    # `sites_seen` is floored at 8 for the reason §I gives: a recogniser that
    # stops seeing its own subject must trip a floor rather than report a clean
    # nothing, and eight is the five SSO sites plus `update_tenant_settings`
    # plus two of the role sites.
    floors:
      files_scanned: 60
      tenant_wide_kinds: 6
      sites_seen: 8
    # THE BACKLOG AT BIRTH, per app, measured on main 11b1a765 — nineteen sites
    # that resolve at the hat today. `accounts` was ONE and not five because
    # R1-F1 had already moved the five SSO sites onto
    # `root_organization(tenant=...)`; what was left there was `user.unlink`,
    # whose predicate `themselves_or_administers_the_whole_tenant` measures the
    # root INSIDE itself — the rule cannot see into a predicate
    # (`does_not_cover`), so the honest repair was a `# hat-scoped:` sentence at
    # that call site, and it was the sweep's to write because this lane's
    # territory is `quality/`. **The `accounts` sweep (P8) wrote it, and two
    # more beside it**: the rename gave `user.erase` and `user.deactivate` a
    # kind the registry derives, so the same predicate's other two call sites
    # entered this population on the same run and leave it under the same
    # sentence. The class is 0.
    # `comms` was the founding eight — the templates, the policies and the
    # suppression surge — and W55-comms took it to 0 by passing
    # `root_organization(tenant=...)` at every one of them.
    # `connections` (the five connection sites) went to 0 the same way, with
    # the inbound receiver under a `# hat-scoped:` sentence because only the
    # system reaches it. What is left is `core` (the three role reads and the
    # grants list — a `list_` asks at the acting hat BY DESIGN since Phase R,
    # which is the one place this rule and §C6 pull against each other and the
    # reason those four are a ratchet rather than a red); `events` (the
    # delivery replay) already reads 0.
    ratchets:
      accounts: 0  # P8: the three `user.*` sites, one predicate, one sentence
      comms: 0  # W55-comms: the eight tenant-wide writes ask at the root
      connections: 0  # W55-connections: the writes pass the root; the receiver's valve says system-only
      core: 4
      events: 0
    does_not_cover: >
      A NODE LAUNDERED THROUGH A LOCAL. The rule reads two bindings —
      `root_organization(...)` and a parameter annotated `Organization` — and a
      Name bound to anything else is a finding. That is the fail-closed reading
      and it is deliberate: the alternative is a walk that guesses, and a guess
      here is a branch administrator with the tenant's identity provider.
      WHETHER THE REASON IN A `# hat-scoped:` IS A GOOD ONE is review's; the
      gate counts them and prints every one. A KEY BUILT BY F-STRING OR READ
      FROM A VARIABLE is rule 13 clause (iv)'s, with `# authz-key:` as its
      valve. THE CODE HALF: a predicate that itself measures the root —
      `administers_the_whole_tenant`, `themselves_or_administers_the_whole_tenant`
      — makes its call site honest in a way this rule cannot see, which is
      exactly why the valve exists and why `user.unlink` sits in the ratchet
      rather than being quietly excused. `holds(actor, key, at=...)` is OUT by
      signature — its node is explicit — and a `holds` with `at=None` on a
      tenant-wide kind is the one shape a follow-up may add. DOORS THAT BUILD
      THEIR OWN ACTOR and never call `require` are rule 13's `# authz:` census.
      AND THE TENSION, NAMED: since Phase R a `list_` asks at the ACTING HAT by
      design (`apps/core/selectors.py`'s own docstring says so — a list has no
      row to hide), so a list over a tenant-wide kind is a finding of this rule
      and a correct line of that one. The four `core` sites are in the ratchet
      for that reason and not because they are wrong today; the question of
      which node a tenant-wide LIST belongs at is the read sweeps', and this
      rule's number is what will make somebody answer it.
    # The recorded self-test population (see the header). Rising floor.
    selftest_floor: { canaries: 4, negatives: 6 }
    canaries:
      # (1) THE DEFECT ITSELF, in the app it happened in. The tenant's identity
      # provider authorized at the ROW, which reads as the most careful line on
      # the page and resolves at the caller's hat.
      # MOVE-TRIGGER 2026-09-16: `apps/accounts` is the plant because the
      # subject IS its SSO surface — the five sites this rule exists for are
      # there and nowhere else. Move it the day another app grows a
      # tenant-wide kind with a row-shaped `require` of its own.
      - { fixture: sso_update_at_the_row.py, plant_at: apps/accounts/services.py, mode: append,
          expect: { contains: "sso_connection.update" } }
      # (2) THE LOW EDGE: the same defect with no third argument at all, in a
      # second app, so the rule is not one module's habit.
      - { fixture: tenant_update_with_no_node.py, plant_at: apps/example/services.py,
          mode: append, expect: { contains: "tenant.update" } }
      # (3) `allows` rather than `require` — a door that BRANCHES on the answer
      # has the identical hole, and reading only the raising name would have
      # left every such door outside the rule.
      - { fixture: role_at_the_hat.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "role.update" } }
      # (4) The valve with nothing in it.
      - { fixture: bare_hat_scoped.py, plant_at: apps/example/services.py, mode: append,
          expect: { contains: "no reason" } }
    negatives:
      # The node resolved in the call itself — the form the rule is pushing to.
      - { fixture: update_tenant_settings.py, plant_at: apps/example/services.py, mode: append }
      # The node resolved one line earlier and bound. Most real sites need the
      # root twice, so reading only the inline call would refuse the shape the
      # rule is asking for.
      - { fixture: root_binding.py, plant_at: apps/example/services.py, mode: append }
      # A kind whose node lives one hop away, named by `.organization` — P4's
      # own shape at `create_grant`.
      - { fixture: grant_at_the_memberships_node.py, plant_at: apps/example/services.py,
          mode: append }
      # An organization IS a node: asked with the row, the question is already
      # at the node. Out of the population by construction.
      - { fixture: organization_is_its_own_node.py, plant_at: apps/example/services.py,
          mode: append }
      # A model that names its organization by COLUMN is out of the population,
      # and this is the form that starts firing the day somebody drops it.
      - { fixture: membership_kind_is_out.py, plant_at: apps/example/services.py, mode: append }
      # The valve with its sentence — the form the one live site already wears.
      - { fixture: hat_scoped_with_reason.py, plant_at: apps/example/services.py, mode: append }


  - id: "56"
    name: one-router-for-home-realm
    enabled: true
    statement: >
      Home-realm discovery is one question with one answer.
      SsoDomain.objects.for_domain( is called from apps/accounts/selectors.py
      (realm_for_email, sso_enforced_for) and nowhere else;
      SsoDomain.objects.claim( from apps/accounts/services.py (_apply_domains)
      and the shell door that resolves an operator's --domain, and nowhere
      else; and no module outside those filters SsoDomain by domain= at all. A
      second caller is a second router that can disagree with the first about
      whose person an address is — which is one person sent to one identity
      provider and provisioned into another tenant.
    check: home_realm_router
    doc:
      file: docs/product/architecture.md
      contains: "a domain claim routes nothing until verified"
    valve:
      marker: "# rule-56: <reason>"
      where: "on the flagged line itself, or in the contiguous comment block directly above it — the engine's generic override, counted in the standing override census and printed there. There is no rule-specific marker on purpose: a SECOND router is not a thing a local comment should be able to normalise, and the legitimate way to add one is a path in this rule's own allow-list, with its reason, in a diff somebody reads"
    scope:
      allow_router:
        - path: apps/accounts/selectors.py
          reason: >
            the two pre-auth readers rule 8 exempts by name — `realm_for_email`
            and `sso_enforced_for`. `get_connection_for_email` reaches the
            router THROUGH `realm_for_email` and is not a second read, by the
            selector's own sentence.
        - path: apps/accounts/models.py
          reason: >
            the definition. A manager method has to live somewhere, and the
            module it lives in is the one place a call-shaped rule would
            otherwise report as a router.
      allow_claim:
        - path: apps/accounts/services.py
          reason: >
            `_apply_domains` asks "who already claims this" so the refusal can
            say it in words before the unique constraint says it in a stack
            trace.
        - path: apps/accounts/management/commands/verify_sso_domain.py
          reason: >
            the shell door resolving the operator's `--domain` to the claim it
            is about to verify — the one act that turns a reservation into a
            route.
