      # explaining they had not written one. Live shape: `list_thresholds` in
      # `apps/usage/selectors.py` carries exactly this sentence about a read
      # outside the population, and it was counted as a valve the day the
      # census started reading every public `get_`/`list_` by name.
      - fixture: prose_mentions_the_valve_marker.py
        plant_at: apps/zzz_canary/selectors.py
        mode: create
        expect: { contains: "asks no gadget.read" }
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
    negatives:
      # (a) A declared verb OUTSIDE the four, on a kind that exists — the
      # ordinary case, and the one that must never be a finding.
      - fixture: conforming_declared_verb.py
        plant_at: apps/zzz_canary/policies.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (a) PROSE OVERRIDING A DERIVED KEY'S SENTENCE — not a declaration at
