      - fixture: derived_key_sentence_override.py
        plant_at: apps/zzz_canary/policies.py
        mode: create
        extra_files:
          - { fixture: probe_apps.py, plant_at: apps/zzz_canary/apps.py, mode: create }
          - { fixture: gadget_models.py, plant_at: apps/zzz_canary/models.py, mode: create }
      # (a) THE SAME PREDICATE WITH ITS KEY DECLARED. The control for the
      # canary above: the two differ by the `ACTION_PROSE` line and by nothing
